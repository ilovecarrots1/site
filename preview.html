n class=\"block\" style=\"margin-bottom:18px\">\n        \u003cdiv class=\"block-head\" style=\"margin-bottom:8px\">\n          \u003cdiv class=\"row\" style=\"gap:7px\">\n            \u003cspan class=\"chip chip-${tone}\">${esc(SEVERITY[sev].label)}\u003c/span>\n            \u003cspan class=\"tiny dim\">${list.length} finding${list.length === 1 ? \"\" : \"s\"}\u003c/span>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"stack\" style=\"gap:8px\">\n          ${list\n            .map(\n              (f) => `\u003cdiv class=\"card tight\" style=\"border-left:2.5px solid var(--${sev === \"critical\" ? \"critical\" : sev === \"major\" ? \"bad\" : sev === \"moderate\" ? \"warn\" : \"line\"});border-radius:0 12px 12px 0\">\n                \u003cdiv class=\"row between\" style=\"align-items:flex-start;gap:8px;margin-bottom:4px\">\n                  \u003cstrong style=\"font-size:13.5px;line-height:1.35\">${esc(f.title)}\u003c/strong>\n                  ${f.source === \"class\" ? `\u003cspan class=\"tag nowrap\" title=\"Derived from class flags, not a documented pair\">class rule\u003c/span>` : \"\"}\n                \u003c/div>\n                \u003cdiv class=\"tiny dim\" style=\"margin-bottom:6px;font-family:var(--mono)\">${esc(f.a)} × ${esc(f.b)}\u003c/div>\n                \u003cp class=\"small muted\" style=\"line-height:1.55;margin-bottom:6px\">${esc(f.mechanism)}\u003c/p>\n                \u003cdiv class=\"row top\" style=\"gap:6px\">\n                  \u003cspan style=\"color:var(--accent);flex:none;margin-top:2px\">${icon(\"info\", 13)}\u003c/span>\n                  \u003cp class=\"tiny\" style=\"color:#c3b9ff;line-height:1.5\">${esc(f.advice)}\u003c/p>\n                \u003c/div>\n              \u003c/div>`\n            )\n            .join(\"\")}\n        \u003c/div>\n      \u003c/section>`;","/app/views/taper.js":"/* Taper planner — a stepwise reduction schedule derived from elimination half-life.\n *\n * The maths is deliberately boring and honest:\n *   · after a dose change the plasma level moves toward the new steady state\n *     with a half-life of t½, so ~5 × t½ is where it actually arrives;\n *   · a 10% step keeps the *drop* smaller than what the nervous system adapts\n *     to between steps — that is why hyperbolic tapers work better than\n *     straight-line ones;\n *   · the plan never pretends to know your tablets: every dose is rounded to a\n *     granule you can actually measure (whole tablet, half, quarter, eighth).\n */\n\nimport { esc, icon, store, fmt, toast, uid, copyText, awardXP, emptyState } from \"__ND__/app/core.js\";\nimport { COMPOUNDS, getCompound } from \"__ND__/app/data/compounds.js\";\nimport { pageHead, callout, statTile, classColor } from \"__ND__/app/views/ui.js\";\n\n/* ------------------------------------------------------------------ */\n/* Which compounds actually need a taper                               */\n/* ------------------------------------------------------------------ */\n\nconst DEPENDENCE_FLAGS = [\"dependence-risk\", \"addictive\", \"withdrawal-severe\", \"gabaergic\", \"gaba-modulator\", \"opioid\", \"serotonergic\", \"sedative\"];\n\nconst COMMON_TAPERS = [\"alprazolam\", \"diazepam\", \"zolpidem\", \"sertraline\", \"venlafaxine\", \"pregabalin\", \"phenibut\", \"tramadol\"];\n\nconst TAPERABLE = COMPOUNDS.filter(\n  (c) => Number(c.pk?.halfLife) > 0 && (c.flags || []).some((f) => DEPENDENCE_FLAGS.includes(f))\n).sort((a, b) => a.name.localeCompare(b.name));\n\nconst OTHERS = COMPOUNDS.filter((c) => Number(c.pk?.halfLife) > 0 && !TAPERABLE.includes(c)).sort((a, b) => a.name.localeCompare(b.name));\n\n/* ------------------------------------------------------------------ */\n/* State                                                               */\n/* ------------------------------------------------------------------ */\n\nconst TARGETS = [50, 25, 12.5, 5];\n\nconst state = {\n  id: \"alprazolam\",\n  dose: 1,\n  freq: 1,\n  unit: \"mg\",\n  stepPct: 10,\n  holdDays: 14,\n  finalPct: 12.5,\n};\n\nlet appliedQuery = \"\";\n\n/** Adopt a compound's unit, typical dose and dosing frequency. */\nfunction useCompound(c) {\n  if (!c) return;\n  state.id = c.id;\n  const first = (c.doses || [])[0];\n  state.unit = (first && first.unit) || \"mg\";\n  state.dose = defaultDose(c);\n  state.freq = 1;\n}\n\n/* ------------------------------------------------------------------ */\n/* Dose maths                                                          */\n/* ------------------------------------------------------------------ */\n\n/** Smallest dose change a person can realistically measure at this dose. */\nfunction granuleFor(dose) {\n  if (dose >= 100) return 5;\n  if (dose >= 20) return 1;\n  if (dose >= 5) return 0.5;\n  if (dose >= 1) return 0.25;\n  return 0.125;\n}\n\nfunction roundTo(value, step) {\n  return Number((Math.round(value / step) * step).toFixed(3));\n}\n\nfunction doseText(value, unit) {\n  const n = Number(Number(value).toFixed(3));\n  return `${n} ${unit}`;\n}\n\nfunction defaultDose(c) {\n  const d = (c?.doses || [])[0];\n  if (!d) return 1;\n  const lo = Number(d.low) || Number(d.high) || 1;\n  const hi = Number(d.high) || lo;\n  return roundTo(lo + (hi - lo) / 2, granuleFor(hi));\n}\n\n/**\n * Build the reduction ladder.\n * @returns {{steps:Array, totalDays:number, finalDose:number, floor:number, overshoot:boolean}}\n */\nexport function buildPlan({ startDose, freq, stepPct, holdDays, finalPct, halfLife }) {\n  if (!(Number(startDose) > 0)) return { steps: [], totalDays: 0, finalDose: 0, floor: 0 };\n  const floor = Number(((startDose * finalPct) / 100).toFixed(4));\n  const steps = [];\n  let current = startDose;\n  let guard = 0;\n\n  while (current > floor + 1e-9 && guard++ \u003c 80) {\n    const g = granuleFor(current);\n    let next = roundTo(current * (1 - stepPct / 100), g);\n    if (next >= current) next = roundTo(current - g, g); // guarantee forward progress\n    if (next \u003c 0) next = 0;\n\n    steps.push({\n      n: steps.length + 1,\n      dose: next,\n      prev: current,\n      drop: Number((current - next).toFixed(3)),\n      dropPct: Number((((current - next) / current) * 100).toFixed(1)),\n      perDose: Number((next / Math.max(1, freq)).toFixed(3)),\n      settleHours: Number.isFinite(halfLife) && halfLife > 0 ? halfLife * 5 : null,\n    });\n\n    current = next;\n    if (next \u003c= 0) break;\n  }\n\n  return {\n    steps,\n    totalDays: steps.length * holdDays,\n    finalDose: steps.length ? steps[steps.length - 1].dose : startDose,\n    floor,\n  };\n}\n\n/* ------------------------------------------------------------------ */\n/* View fragments                                                      */\n/* ------------------------------------------------------------------ */\n\nfunction planText(c, plan, cfg) {\n  const lines = [];\n  lines.push(`Taper plan — ${c.name}${Number(c.pk?.halfLife) > 0 ? ` (t½ ${fmt.duration(Number(c.pk.halfLife))})` : \"\"}`);\n  lines.push(\n    `Start ${doseText(cfg.dose, cfg.unit)} per day (${cfg.freq}×/day) → target ${doseText(plan.finalDose, cfg.unit)}, −${cfg.stepPct}% every ${cfg.holdDays} days`\n  );\n  lines.push(\"\");\n  let day = 1;\n  for (const s of plan.steps) {\n    const last = day + cfg.holdDays - 1;\n    lines.push(\n      `Step ${s.n} · days ${day}–${last} · ${doseText(s.dose, cfg.unit)}/day (${doseText(s.perDose, cfg.unit)} ${cfg.freq === 1 ? \"once\" : `${cfg.freq}×`} daily) · −${s.dropPct}%`\n    );\n    day = last + 1;\n  }\n  lines.push(\"\");\n  lines.push(`Total: ${plan.totalDays} days (${(plan.totalDays / 7).toFixed(1)} weeks)`);\n  lines.push(\"Generated with NeuroDifference. Educational estimate — not medical advice.\");\n  return lines.join(\"\\n\");\n}\n\nfunction rowsHtml(c, plan, cfg) {\n  if (!plan.steps.length) {\n    return `\u003cdiv class=\"card\">${emptyState(\n      \"check\",\n      \"Nothing to taper\",\n      \"The starting dose is already at or below your target. Lower the target, raise the start dose, or pick another compound.\",\n      \"\"\n    )}\u003c/div>`;\n  }\n\n  const rows = plan.steps\n    .map((s) => {\n      const width = Math.max(2, Math.round((s.dose / Math.max(cfg.dose, 1e-9)) * 100));\n      const settle = s.settleHours ? fmt.duration(s.settleHours) : \"—\";\n      return `\u003cli class=\"taper-row\">\n        \u003cspan class=\"taper-n\" aria-hidden=\"true\">${s.n}\u003c/span>\n        \u003cdiv class=\"taper-body\">\n          \u003cdiv class=\"row between\" style=\"gap:8px\">\n            \u003cb class=\"mono\" style=\"font-size:13.5px\">${esc(doseText(s.dose, cfg.unit))}\u003cspan class=\"dim\" style=\"font-weight:400\"> / day\u003c/span>\u003c/b>\n            \u003cspan class=\"tiny dim\">−${esc(String(s.dropPct))}%\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"meter\" style=\"margin:6px 0 5px\">\u003ci style=\"width:${width}%\">\u003c/i>\u003c/div>\n          \u003cdiv class=\"tiny dim\">\n            ${cfg.freq > 1 ? `${esc(doseText(s.perDose, cfg.unit))} × ${cfg.freq}/day` : \"once daily\"}\n            · level settles in ~${esc(settle)}\n          \u003c/div>\n        \u003c/div>\n      \u003c/li>`;\n    })\n    .join(\"\");\n\n  const stopNote =\n    plan.finalDose > 0\n      ? `\u003cli class=\"taper-row taper-stop\">\n          \u003cspan class=\"taper-n\" aria-hidden=\"true\">${icon(\"flag\", 13)}\u003c/span>\n          \u003cdiv class=\"taper-body\">\n            \u003cb style=\"font-size:13px\">Step off from ${esc(doseText(plan.finalDose, cfg.unit))}\u003c/b>\n            \u003cdiv class=\"tiny dim\" style=\"margin-top:3px\">The rest clears over ~${esc(fmt.duration(5 * (Number(c.pk?.halfLife) || 0) || 24))}. Expect a few uneven nights — that is the last of the drug leaving, not a relapse.\u003c/div>\n          \u003c/div>\n        \u003c/li>`\n      : \"\";\n\n  return `\u003col class=\"taper-plan\">${rows}${stopNote}\u003c/ol>`;\n}\n\nfunction summaryHtml(c, plan, cfg) {\n  const hl = Number(c.pk?.halfLife) || 0;\n  const weeks = plan.totalDays / 7;\n  return `\u003cdiv class=\"grid grid-2 grid-4\" style=\"gap:10px\">\n    ${statTile({ label: \"Steps\", value: String(plan.steps.length), sub: `−${cfg.stepPct}% each`, iconName: \"list\" })}\n    ${statTile({\n      label: \"Duration\",\n      value: plan.totalDays >= 14 ? `${fmt.num(weeks, 1)} w` : `${plan.totalDays} d`,\n      sub: `${plan.totalDays} days total`,\n      iconName: \"clock\",\n    })}\n    ${statTile({\n      label: \"Final dose\",\n      value: doseText(plan.finalDose, cfg.unit),\n      sub: `${Math.round((plan.finalDose / Math.max(cfg.dose, 1e-9)) * 100)}% of start`,\n      iconName: \"target\",\n    })}\n    ${statTile({\n      label: \"Half-life\",\n      value: hl > 0 ? fmt.duration(hl) : \"—\",\n      sub: hl > 0 ? `steady state in ~${fmt.duration(hl * 5)}` : \"no PK data\",\n      iconName: \"activity\",\n    })}\n  \u003c/div>`;\n}\n\nfunction warningsHtml(c, cfg) {\n  const out = [];\n  const hl = Number(c.pk?.halfLife) || 0;\n  const flags = new Set(c.flags || []);\n\n  if (cfg.stepPct > 25) {\n    out.push(\n      callout(\n        \"warn\",\n        `${cfg.stepPct}% per step is steep`,\n        \"Above ~10% the drop usually outruns adaptation. For benzodiazepines, alcohol-like sedatives and antidepressants, 5–10% steps are the tolerated range.\"\n      )\n    );\n  }\n  if (flags.has(\"withdrawal-severe\") || flags.has(\"gabaergic\") || flags.has(\"dependence-risk\")) {\n    out.push(\n      callout(\n        \"danger\",\n        \"Do not do this alone\",\n        `${c.name} withdrawal can include rebound anxiety, insomnia and — with sedatives — seizures. A prescriber should own the schedule; abrupt stops are more dangerous than the drug.`\n      )\n    );\n  }\n  if (flags.has(\"serotonergic\")) {\n    out.push(\n      callout(\n        \"info\",\n        \"Antidepressant discontinuation\",\n        \"Expect dizziness, 'brain zaps', irritability and flu-like aches if steps are too big. A 10% step every 4 weeks is the slow end; some people need the last milligrams removed in liquid or by bead counting.\"\n      )\n    );\n  }\n  if (hl > 0 && cfg.holdDays \u003c hl * 4) {\n    out.push(\n      callout(\n        \"warn\",\n        \"The next step comes before the level settles\",\n        `With a ${fmt.duration(hl)} half-life the new steady state needs about ${fmt.duration(hl * 5)}. Holding only ${cfg.holdDays} days stacks withdrawal on top of withdrawal.`\n      )\n    );\n  }\n  if (!flags.has(\"dependence-risk\") && !flags.has(\"addictive\") && !flags.has(\"withdrawal-severe\") && !flags.has(\"serotonergic\")) {\n    out.push(\n      callout(\n        \"ok\",\n        \"No dependence signal in this database\",\n        \"There is no pharmacological reason to taper this compound slowly. Stopping is usually fine — check the warning list in the monograph first.\"\n      )\n    );\n  }\n  return out.join(\"\");\n}\n\n/** Single entry point so the view and its buttons always agree on the plan. */\nfunction planFor(c, cfg) {\n  return buildPlan({\n    startDose: Number(cfg.dose) || 0,\n    freq: Math.max(1, Number(cfg.freq) || 1),\n    stepPct: Number(cfg.stepPct) || 10,\n    holdDays: Math.max(1, Number(cfg.holdDays) || 14),\n    finalPct: Number(cfg.finalPct) || 12.5,\n    halfLife: Number(c?.pk?.halfLife) || 0,\n  });\n}\n\nfunction planHtml(c, cfg) {\n  const plan = planFor(c, cfg);\n  return `\u003cdiv class=\"stack\" style=\"gap:14px\">\n    ${summaryHtml(c, plan, cfg)}\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"card-head\">\n        \u003ch3>Reduction ladder\u003c/h3>\n        \u003cspan class=\"spacer\">\u003c/span>\n        \u003cspan class=\"row\" style=\"gap:6px\">\n          \u003cbutton class=\"btn ghost sm\" data-act=\"copy\">${icon(\"copy\", 13)} Copy\u003c/button>\n          \u003cbutton class=\"btn soft sm\" data-act=\"save\">${icon(\"pin\", 13)} Save\u003c/button>\n        \u003c/span>\n      \u003c/div>\n      \u003cp class=\"small muted\" style=\"margin-bottom:12px\">\n        Each step holds ${cfg.holdDays} days before the next drop. Doses are rounded to something you can actually measure.\n      \u003c/p>\n      ${rowsHtml(c, plan, cfg)}\n    \u003c/div>\n    \u003cdiv class=\"stack\" style=\"gap:10px\">${warningsHtml(c, cfg)}\u003c/div>\n  \u003c/div>`;\n}\n\n/* ------------------------------------------------------------------ */\n/* View                                                                */\n/* ------------------------------------------------------------------ */\n\nfunction compoundOptions() {\n  const selected = (c) => (c.id === state.id ? \"selected\" : \"\");\n  return `\u003coptgroup label=\"Commonly tapered\">\n    ${TAPERABLE.map((c) => `\u003coption value=\"${esc(c.id)}\" ${selected(c)}>${esc(c.name)} — t½ ${esc(fmt.duration(Number(c.pk.halfLife)))}\u003c/option>`).join(\"\")}\n  \u003c/optgroup>\n  \u003coptgroup label=\"Everything else\">\n    ${OTHERS.map((c) => `\u003coption value=\"${esc(c.id)}\" ${selected(c)}>${esc(c.name)} — t½ ${esc(fmt.duration(Number(c.pk.halfLife)))}\u003c/option>`).join(\"\")}\n  \u003c/optgroup>`;\n}\n\nexport const taper = {\n  render(ctx) {\n    const wanted = String(ctx.query.compound || \"\").toLowerCase();\n    if (wanted && wanted !== appliedQuery) {\n      appliedQuery = wanted;\n      const next = getCompound(wanted);\n      if (next && Number(next.pk?.halfLife) > 0) useCompound(next);\n    }\n\n    const c = getCompound(state.id) || TAPERABLE[0] || COMPOUNDS[0];\n\n    const cfg = {\n      dose: state.dose,\n      freq: state.freq,\n      unit: state.unit,\n      stepPct: state.stepPct,\n      holdDays: state.holdDays,\n      finalPct: state.finalPct,\n    };\n\n    return `${pageHead(\n      \"Taper planner\",\n      \"Turn a half-life into a schedule: how fast to step down, how long each step holds, and when the level actually settles.\",\n      `\u003ca class=\"btn ghost sm\" href=\"#/lab\">${icon(\"flask\", 14)} Dose lab\u003c/a>`\n    )}\n\n    \u003cdiv class=\"split split-mobile-first\">\n      \u003cdiv class=\"stack\" style=\"gap:14px\">\n        \u003cdiv id=\"taper-out\" aria-live=\"polite\">${planHtml(c, cfg)}\u003c/div>\n\n        \u003cdiv class=\"card tight\">\n          \u003cdiv class=\"stack-3\">\n            \u003cb style=\"font-size:13px\">Why hyperbolic\u003c/b>\n            \u003cp class=\"tiny muted\" style=\"line-height:1.6\">\n              The same 1 mg is a 50% cut at 2 mg and a 5% cut at 20 mg. Fixed-percent steps therefore remove more drug early and\n              smaller amounts later, which is what receptor adaptation can follow. Time between steps is set by the half-life:\n              about five of them and the plasma level has finished moving.\n            \u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"card tight\">\n          \u003cp class=\"tiny dim\" style=\"line-height:1.6\">\n            Educational model. It knows the half-life and the arithmetic — not your kidneys, your dose form or your history.\n            Anyone on benzodiazepines, opioids, antipsychotics or antidepressants should taper with a prescriber.\n          \u003c/p>\n        \u003c/div>\n      \u003c/div>\n\n      \u003caside class=\"sticky-side\">\n        \u003cdiv class=\"card\">\n          \u003cdiv class=\"card-head\">\u003ch3>Inputs\u003c/h3>\u003c/div>\n          \u003cdiv class=\"stack\" style=\"gap:12px\">\n            \u003clabel class=\"field\">Compound\n              \u003cselect class=\"select\" id=\"tp-c\">${compoundOptions()}\u003c/select>\n            \u003c/label>\n\n            \u003cdiv class=\"grid grid-2\" style=\"gap:10px\">\n              \u003clabel class=\"field\">Daily dose (${esc(state.unit)})\n                \u003cinput class=\"input\" id=\"tp-dose\" type=\"number\" inputmode=\"decimal\" min=\"0.01\" max=\"20000\" step=\"any\" value=\"${state.dose}\">\n              \u003c/label>\n              \u003clabel class=\"field\">Doses per day\n                \u003cinput class=\"input\" id=\"tp-freq\" type=\"number\" inputmode=\"numeric\" min=\"1\" max=\"4\" step=\"1\" value=\"${state.freq}\">\n              \u003c/label>\n              \u003clabel class=\"field\">Step size (%)\n                \u003cinput class=\"input\" id=\"tp-step\" type=\"number\" inputmode=\"numeric\" min=\"1\" max=\"50\" step=\"1\" value=\"${state.stepPct}\">\n              \u003c/label>\n              \u003clabel class=\"field\">Hold (days)\n                \u003cinput class=\"input\" id=\"tp-hold\" type=\"number\" inputmode=\"numeric\" min=\"1\" max=\"120\" step=\"1\" value=\"${state.holdDays}\">\n              \u003c/label>\n            \u003c/div>\n\n            \u003cdiv class=\"field\">Stop at (% of start)\n              \u003cdiv class=\"row wrap\" style=\"gap:6px;margin-top:2px\">\n                ${TARGETS.map(\n                  (t) => `\u003cbutton class=\"chip chip-btn ${state.finalPct === t ? \"on\" : \"\"}\" data-target=\"${t}\">${t}%\u003c/button>`","/app/views/compare.js":"/* Compare — put two or three compounds next to each other on the facts that matter.\n *\n * One DOM, two layouts: a matrix on desktop (label column + one column per\n * compound) and stacked attribute blocks on a phone, where every value is\n * prefixed with the compound it belongs to.\n */\n\nimport { esc, icon, fmt, copyText, evidenceChip } from \"__ND__/app/core.js\";\nimport { COMPOUNDS, getCompound } from \"__ND__/app/data/compounds.js\";\nimport { pageHead, classColor, backLink, callout } from \"__ND__/app/views/ui.js\";\n\nconst MAX = 3;\n\nconst PRESETS = [\n  [\"caffeine\", \"modafinil\"],\n  [\"alprazolam\", \"diazepam\"],\n  [\"sertraline\", \"fluoxetine\"],\n  [\"melatonin\", \"ramelteon\"],\n  [\"methylphenidate\", \"lisdexamfetamine\"],\n];\n\nconst state = { ids: [\"alprazolam\", \"diazepam\"] };\n\nlet appliedQuery = \"\";\n\nfunction clean(list) {\n  const seen = new Set();\n  const out = [];\n  for (const id of list) {\n    const c = getCompound(id);\n    if (!c || seen.has(c.id)) continue;\n    seen.add(c.id);\n    out.push(c.id);\n    if (out.length >= MAX) break;\n  }\n  return out;\n}\n\nfunction pickers(list) {\n  // only sugar — the data lives in `state`\n  return list.map((id) => getCompound(id)).filter(Boolean);\n}\n\n/* ------------------------------------------------------------------ */\n/* Rows                                                               */\n/* ------------------------------------------------------------------ */\n\nconst hl = (c) => (Number(c.pk?.halfLife) > 0 ? fmt.duration(Number(c.pk.halfLife)) : \"—\");\nconst val = (n) => (Number(n) > 0 ? fmt.duration(Number(n)) : \"—\");\n\nconst ROWS = [\n  {\n    label: \"Class\",\n    get: (c) => `\u003cspan class=\"chip\" style=\"border-color:var(--line);color:var(--text-2)\">\u003cspan class=\"dot\" style=\"background:${classColor(c.cls)}\">\u003c/span>${esc(c.cls)}\u003c/span>\n      ${c.subcls ? `\u003cdiv class=\"tiny dim\" style=\"margin-top:5px\">${esc(c.subcls)}\u003c/div>` : \"\"}`,\n  },\n  { label: \"Status\", get: (c) => `\u003cspan class=\"small\">${esc(c.status || \"—\")}\u003c/span>` },\n  { label: \"Evidence\", get: (c) => evidenceChip(c.evidence) },\n  { label: \"Half-life\", mono: true, get: (c) => hl(c) },\n  {\n    label: \"Peak / onset\",\n    mono: true,\n    get: (c) => `${val(c.pk?.tmax)} \u003cspan class=\"dim\">peak\u003c/span> · ${val(c.pk?.onset)} \u003cspan class=\"dim\">onset\u003c/span>`,\n  },\n  { label: \"Duration\", mono: true, get: (c) => val(c.pk?.duration) },\n  { label: \"Metabolism\", get: (c) => `\u003cspan class=\"small muted\">${esc(c.pk?.metabolism || \"—\")}\u003c/span>` },\n  {\n    label: \"Clearance route\",\n    get: (c) => `\u003cspan class=\"small muted\">${esc(c.pk?.excretion || \"—\")}\u003c/span>`,\n  },\n  {\n    label: \"Typical dose\",\n    get: (c) => {\n      const doses = (c.doses || []).filter((d) => d && d.low);\n      if (!doses.length) return \"—\";\n      return doses\n        .slice(0, 2)\n        .map((d) => `\u003cdiv class=\"small mono\">${esc(`${d.low}–${d.high} ${d.unit}`)} \u003cspan class=\"dim\">${esc(d.route)}\u003c/span>\u003c/div>`)\n        .join(\"\");\n    },\n  },\n  {\n    label: \"Mechanism\",\n    get: (c) => {\n      const moa = (c.moa || []).slice(0, 3);\n      if (!moa.length) return \"—\";\n      return `\u003cul class=\"cmp-list\">${moa.map((m) => `\u003cli>${esc(m)}\u003c/li>`).join(\"\")}\u003c/ul>`;\n    },\n  },\n  {\n    label: \"Targets\",\n    get: (c) => {\n      const t = (c.targets || []).slice(0, 4);\n      if (!t.length) return \"—\";\n      return `\u003cdiv class=\"stack-3\">${t\n        .map(\n          (x) =>\n            `\u003cdiv class=\"small\">\u003cspan class=\"mono\" style=\"font-size:11.5px\">${esc(x.name)}\u003c/span> \u003cspan class=\"dim\">${esc(x.action)}\u003c/span>\u003c/div>`\n        )\n        .join(\"\")}\u003c/div>`;\n    },\n  },\n  {\n    label: \"Upside\",\n    get: (c) => {\n      const good = (c.effects?.good || []).slice(0, 3);\n      if (!good.length) return \"—\";\n      return `\u003cul class=\"cmp-list good\">${good.map((g) => `\u003cli>${esc(g)}\u003c/li>`).join(\"\")}\u003c/ul>`;\n    },\n  },\n  {\n    label: \"Downside\",\n    get: (c) => {\n      const bad = (c.effects?.bad || []).slice(0, 3);\n      if (!bad.length) return \"—\";\n      return `\u003cul class=\"cmp-list bad\">${bad.map((b) => `\u003cli>${esc(b)}\u003c/li>`).join(\"\")}\u003c/ul>`;\n    },\n  },\n  {\n    label: \"Flags\",\n    get: (c) => {\n      const flags = (c.flags || []).slice(0, 6);\n      if (!flags.length) return \"—\";\n      return `\u003cdiv class=\"row wrap\" style=\"gap:4px\">${flags.map((f) => `\u003cspan class=\"tag\">#${esc(f)}\u003c/span>`).join(\"\")}\u003c/div>`;\n    },\n  },\n  { label: \"Summary\", wide: true, get: (c) => `\u003cspan class=\"small muted\">${esc(c.summary || \"—\")}\u003c/span>` },\n];\n\nfunction headHtml(list) {\n  return `\u003cdiv class=\"cmp-row cmp-head\">\n    \u003cdiv class=\"cmp-label\">\u003c/div>\n    ${list\n      .map(\n        (c) => `\u003cdiv class=\"cmp-cell\">\n          \u003ca href=\"#/compounds/${esc(c.id)}\" style=\"font-weight:650;color:var(--text)\">${esc(c.name)}\u003c/a>\n          \u003cdiv class=\"tiny dim\" style=\"margin-top:2px\">${esc((c.aliases || [])[0] || c.cls)}\u003c/div>\n        \u003c/div>`\n      )\n      .join(\"\")}\n  \u003c/div>`;\n}\n\nfunction rowsHtml(list) {\n  return ROWS.map((row) => {\n    if (row.wide) {\n      return `\u003cdiv class=\"cmp-row cmp-wide\">\n        \u003cdiv class=\"cmp-label\">${esc(row.label)}\u003c/div>\n        \u003cdiv class=\"cmp-cell stack\" style=\"gap:8px\">${list\n          .map((c) => `\u003cdiv>\u003cspan class=\"cmp-who\">${esc(c.name)}\u003c/span>${row.get(c)}\u003c/div>`)\n          .join(\"\")}\u003c/div>\n      \u003c/div>`;\n    }\n    return `\u003cdiv class=\"cmp-row\">\n      \u003cdiv class=\"cmp-label\">${esc(row.label)}\u003c/div>\n      ${list\n        .map(\n          (c) =>\n            `\u003cdiv class=\"cmp-cell ${row.mono ? \"mono\" : \"\"}\">\u003cspan class=\"cmp-who\">${esc(c.name)}\u003c/span>${row.get(c)}\u003c/div>`\n        )\n        .join(\"\")}\n    \u003c/div>`;\n  }).join(\"\");\n}\n\nfunction compareUrl(ids) {\n  const base = `${location.origin}${location.pathname}`;\n  return `${base}#/compare?ids=${ids.join(\",\")}`;\n}\n\n/* ------------------------------------------------------------------ */\n/* View                                                               */\n/* ------------------------------------------------------------------ */\n\nexport const compare = {\n  render(ctx) {\n    const fromQuery = String(ctx.query.ids || \"\").toLowerCase();\n    if (fromQuery && fromQuery !== appliedQuery) {\n      appliedQuery = fromQuery;\n      const next = clean(fromQuery.split(\",\"));\n      if (next.length >= 2) state.ids = next;\n    }\n\n    const list = pickers(state.ids);\n\n    return `${pageHead(\n      \"Compare\",\n      \"The same set of facts, side by side — kinetics, mechanism, dose and the parts that bite.\",\n      `\u003cbutton class=\"btn ghost sm\" data-act=\"link\">${icon(\"link\", 14)} Copy link\u003c/button>`\n    )}\n\n    ${backLink(\"#/compounds\", \"Compounds\")}\n\n    \u003cdiv class=\"card\" style=\"margin-bottom:14px\">\n      \u003cdiv class=\"stack\" style=\"gap:10px\">\n        ${list\n          .map(\n            (c, i) => `\u003cdiv class=\"row\" style=\"gap:8px\">\n              \u003cselect class=\"select\" data-slot=\"${i}\" style=\"flex:1;min-width:0\">\n                ${COMPOUNDS.map((x) => `\u003coption value=\"${esc(x.id)}\" ${x.id === c.id ? \"selected\" : \"\"}>${esc(x.name)}\u003c/option>`).join(\"\")}\n              \u003c/select>\n              \u003ca class=\"icon-btn\" href=\"#/compounds/${esc(c.id)}\" aria-label=\"Open monograph\" style=\"flex:none\">${icon(\"file\", 16)}\u003c/a>\n              ${\n                list.length > 2\n                  ? `\u003cbutton class=\"icon-btn\" data-remove=\"${i}\" aria-label=\"Remove ${esc(c.name)}\" style=\"flex:none\">${icon(\"x\", 16)}\u003c/button>`\n                  : \"\"\n              }\n            \u003c/div>`\n          )\n          .join(\"\")}\n        ${\n          list.length \u003c MAX\n            ? `\u003cbutton class=\"btn ghost sm block\" data-act=\"add\">${icon(\"plus\", 14)} Add a third compound\u003c/button>`\n            : \"\"\n        }\n        \u003cdiv class=\"row wrap\" style=\"gap:6px;padding-top:2px\">\n          ${PRESETS.filter((p) => p.every((id) => getCompound(id)))\n            .map((p) => {\n              const a = getCompound(p[0]);\n              const b = getCompound(p[1]);\n              return `\u003cbutton class=\"chip chip-btn\" data-preset=\"${esc(p.join(\",\"))}\">${esc(a.name)} × ${esc(b.name)}\u003c/button>`;\n            })\n            .join(\"\")}\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    ${\n      list.length \u003c 2\n        ? callout(\"info\", \"Pick two compounds\", \"Choose a second compound above — the table fills in as soon as there are two.\")\n        : `\u003cdiv class=\"cmp\" style=\"--cmp-n:${list.length}\">${headHtml(list)}${rowsHtml(list)}\u003c/div>`\n    }\n\n    \u003cdiv style=\"margin-top:14px\">\n      ${callout(\n        \"info\",\n        \"Read across, not down\",\n        \"Half-life decides how long a dose lasts and how long a taper takes; onset and peak decide whether it feels like something at all. Two drugs with the same class can differ on every row.\"\n      )}\n    \u003c/div>`;\n  },\n\n  mount(root, ctx) {\n    function syncUrl() {\n      const base = `#/compare?ids=${state.ids.join(\",\")}`;\n      try {\n        history.replaceState(null, \"\", `${location.pathname}${location.search}${base}`);\n      } catch (err) {\n        /* replaceState can throw in sandboxed frames — the view still works */\n      }\n    }\n\n    function rerender() {\n      syncUrl();\n      ctx.rerender?.();\n    }\n\n    root.querySelectorAll(\"[data-slot]\").forEach((sel) => {\n      sel.addEventListener(\"change\", (ev) => {\n        const i = Number(sel.dataset.slot);\n        const id = ev.target.value;\n        // if the compound is already in another slot, swap instead of duplicating\n        const dup = state.ids.indexOf(id);\n        if (dup !== -1 && dup !== i) {\n          const tmp = state.ids[i];\n          state.ids[i] = id;\n          state.ids[dup] = tmp;\n        } else {\n          state.ids[i] = id;\n        }\n        rerender();\n      });\n    });\n\n    root.addEventListener(\"click\", (ev) => {\n      const remove = ev.target.closest(\"[data-remove]\");\n      if (remove) {\n        state.ids.splice(Number(remove.dataset.remove), 1);\n        rerender();\n        return;\n      }\n\n      const preset = ev.target.closest(\"[data-preset]\");\n      if (preset) {\n        state.ids = clean(preset.dataset.preset.split(\",\"));\n        rerender();\n        return;\n      }\n\n      const act = ev.target.closest(\"[data-act]\")?.dataset.act;\n      if (act === \"add\") {\n        const spare = COMPOUNDS.find((c) => !state.ids.includes(c.id));\n        if (spare) state.ids.push(spare.id);\n        rerender();\n        return;\n      }\n      if (act === \"link\") {\n        copyText(compareUrl(state.ids), \"Comparison link copied\");\n        return;\n      }\n    });\n  },\n};\n\nexport default compare;","/app/views/learn.js":"/* Learn: courses, lessons, quizzes, flashcards */\n\nimport { esc, icon, md, store, toast, awardXP, touchStreak, levelFor, emptyState, fmt } from \"__ND__/app/core.js\";\nimport { COURSES, LESSON_INDEX, TOTAL_LESSONS, FLASHCARDS, systemCardCount } from \"__ND__/app/data/learn.js\";\nimport { SYSTEM_BY_ID } from \"__ND__/app/data/neuro.js\";\nimport { deckStats, dueCards, gradeCard, GRADES, cardState, nextIntervalPreview } from \"__ND__/app/srs.js\";\nimport { pageHead, backLink, callout, metric, statTile } from \"__ND__/app/views/ui.js\";\n\nfunction lessonDone(id) {\n  return !!store.data.lessons?.[id]?.completed;\n}\n\nfunction courseProgress(course) {\n  const done = course.lessons.filter((l) => lessonDone(l.id)).length;\n  return { done, total: course.lessons.length, pct: done / course.lessons.length };\n}\n\n/* ------------------------------------------------------------------ */\n/* Course index                                                        */\n/* ------------------------------------------------------------------ */\n\nexport const index = {\n  render() {\n    const s = store.data;\n    const done = Object.values(s.lessons || {}).filter((l) => l.completed).length;\n    const lvl = levelFor(s.profile.xp || 0);\n    const cards = deckStats(FLASHCARDS);\n    const accuracy = s.profile.quizzes ? Math.round((s.profile.correct / s.profile.quizzes) * 100) : 0;\n\n    return `\n    ${pageHead(\n      \"Learn\",\n      \"Five short courses that build the model most people skip: membrane physics → monoamines → inhibition → kinetics → evidence.\",\n      `\u003ca class=\"btn primary sm\" href=\"#/cards\">${icon(\"layers\", 15)} Flashcards${cards.due ? ` (${cards.due})` : \"\"}\u003c/a>`\n    )}\n\n    \u003cdiv class=\"grid grid-4\" style=\"gap:10px;margin-bottom:22px\">\n      ${statTile({ label: \"Lessons\", value: `${done}/${TOTAL_LESSONS}`, sub: \"completed\", iconName: \"book\" })}\n      ${statTile({ label: \"Level\", value: lvl.level, sub: `${s.profile.xp || 0} XP total`, iconName: \"sparkles\" })}\n      ${statTile({ label: \"Accuracy\", value: `${accuracy}%`, sub: `${s.profile.quizzes || 0} questions`, iconName: \"target\" })}\n      ${statTile({ label: \"Cards due\", value: cards.due, sub: `${cards.mature} mature`, iconName: \"layers\" })}\n    \u003c/div>\n\n    \u003cdiv class=\"block-head\">\u003cdiv>\u003ch2>Courses\u003c/h2>\u003cp class=\"block-sub\">Work in order — later lessons assume the earlier vocab\u003c/p>\u003c/div>\u003c/div>\n    \u003cdiv class=\"grid\" style=\"gap:12px\">\n      ${COURSES.map((course, i) => {\n        const p = courseProgress(course);\n        const next = course.lessons.find((l) => !lessonDone(l.id)) || course.lessons[0];\n        return `\u003cdiv class=\"card\">\n          \u003cdiv class=\"row between\" style=\"align-items:flex-start;gap:12px;margin-bottom:9px\">\n            \u003cdiv style=\"min-width:0;flex:1\">\n              \u003cdiv class=\"row\" style=\"gap:6px;margin-bottom:5px\">\n                \u003cspan class=\"chip chip-accent\">${esc(course.level)}\u003c/span>\n                \u003cspan class=\"chip\">${p.total} lessons · ${course.minutes} min\u003c/span>\n                ${p.done === p.total ? `\u003cspan class=\"chip chip-good\">${icon(\"check\", 11)} complete\u003c/span>` : \"\"}\n              \u003c/div>\n              \u003ch3 style=\"font-size:17px\">${i + 1}. ${esc(course.title)}\u003c/h3>\n              \u003cp class=\"small dim\" style=\"margin-top:4px;line-height:1.55;max-width:62ch\">${esc(course.blurb)}\u003c/p>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv style=\"margin:11px 0 12px\">${metric(\"Progress\", `${p.done} / ${p.total} lessons`, p.pct)}\u003c/div>\n\n          \u003cdiv class=\"list\" style=\"margin:0 calc(-1 * var(--pad)) calc(-1 * var(--pad))\">\n            ${course.lessons\n              .map((l, j) => {\n                const ok = lessonDone(l.id);\n                return `\u003ca class=\"list-row\" href=\"#/learn/${esc(course.id)}/${esc(l.id)}\">\n                  \u003cspan style=\"width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-family:var(--mono);flex:none;${ok ? \"background:rgba(63,185,80,.15);color:var(--good)\" : \"background:var(--bg-3);color:var(--text-3)\"}\">${ok ? icon(\"check\", 11) : j + 1}\u003c/span>\n                  \u003cdiv class=\"grow\">\u003cdiv class=\"title\">${esc(l.title)}\u003c/div>\u003cdiv class=\"sub\">${l.minutes} min · ${(l.quiz || []).length} questions · +${l.xp} XP\u003c/div>\u003c/div>\n                  ${icon(\"chevronRight\", 15)}\n                \u003c/a>`;\n              })\n              .join(\"\")}\n          \u003c/div>\n\n          \u003ca class=\"btn ${p.done === p.total ? \"ghost\" : \"soft\"} sm\" href=\"#/learn/${esc(course.id)}/${esc(next.id)}\" style=\"margin-top:12px\">\n            ${p.done === p.total ? \"Review\" : p.done ? \"Continue\" : \"Start\"} ${icon(\"arrowRight\", 14)}\n          \u003c/a>\n        \u003c/div>`;\n      }).join(\"\")}\n    \u003c/div>`;\n  },\n};\n\n/* ------------------------------------------------------------------ */\n/* Course page                                                         */\n/* ------------------------------------------------------------------ */\n\nexport const course = {\n  render(ctx) {\n    const c = COURSES.find((x) => x.id === ctx.params.courseId);\n    if (!c) {\n      return `\u003cdiv class=\"card\">${emptyState(\"book\", \"Course not found\", \"That course does not exist.\", `\u003ca class=\"btn ghost sm\" href=\"#/learn\">${icon(\"arrowLeft\", 14)} All courses\u003c/a>`)}\u003c/div>`;\n    }\n    const p = courseProgress(c);\n    return `\n    ${backLink(\"#/learn\", \"Learn\")}\n    \u003cheader class=\"page-head\" style=\"margin-top:14px\">\n      \u003cdiv class=\"eyebrow\" style=\"margin-bottom:5px\">${esc(c.level)} · ${p.total} lessons\u003c/div>\n      \u003ch1>${esc(c.title)}\u003c/h1>\n      \u003cp>${esc(c.blurb)}\u003c/p>\n    \u003c/header>\n\n    \u003cdiv style=\"max-width:420px;margin-bottom:18px\">${metric(\"Course progress\", `${p.done} / ${p.total}`, p.pct)}\u003c/div>\n\n    \u003cdiv class=\"grid\" style=\"gap:9px\">\n      ${c.lessons\n        .map((l, i) => {\n          const rec = store.data.lessons?.[l.id];\n          const ok = !!rec?.completed;\n          return `\u003ca class=\"card hoverable\" href=\"#/learn/${esc(c.id)}/${esc(l.id)}\" style=\"text-decoration:none;color:inherit;padding:14px\">\n            \u003cdiv class=\"row between\" style=\"align-items:flex-start;gap:10px\">\n              \u003cdiv class=\"row top\" style=\"gap:11px;min-width:0\">\n                \u003cspan style=\"width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-family:var(--mono);flex:none;${ok ? \"background:rgba(63,185,80,.15);color:var(--good);border:1px solid rgba(63,185,80,.3)\" : \"background:var(--bg-3);color:var(--text-2);border:1px solid var(--line)\"}\">${ok ? icon(\"check\", 13) : i + 1}\u003c/span>\n                \u003cdiv style=\"min-width:0\">\n                  \u003cdiv style=\"font-size:14.5px;font-weight:620\">${esc(l.title)}\u003c/div>\n                  \u003cdiv class=\"tiny dim\" style=\"margin-top:2px\">${l.minutes} min · ${(l.quiz || []).length} questions · +${l.xp} XP${rec?.score != null ? ` · scored ${rec.score}/${rec.total ?? (l.quiz || []).length}` : \"\"}\u003c/div>\n                \u003c/div>\n              \u003c/div>\n              ${icon(\"chevronRight\", 16)}\n            \u003c/div>\n          \u003c/a>`;\n        })\n        .join(\"\")}\n    \u003c/div>`;\n  },\n};\n\n/* ------------------------------------------------------------------ */\n/* Lesson                                                              */\n/* ------------------------------------------------------------------ */\n\nexport const lesson = {\n  render(ctx) {\n    const found = LESSON_INDEX.get(ctx.params.lessonId);\n    const c = COURSES.find((x) => x.id === ctx.params.courseId);\n    if (!found || !c) {\n      return `\u003cdiv class=\"card\">${emptyState(\"book\", \"Lesson not found\", \"That lesson does not exist.\", `\u003ca class=\"btn ghost sm\" href=\"#/learn\">${icon(\"arrowLeft\", 14)} Back to Learn\u003c/a>`)}\u003c/div>`;\n    }\n    const l = found.lesson || found;\n    const idx = c.lessons.findIndex((x) => x.id === l.id);\n    if (idx \u003c 0) {\n      return `\u003cdiv class=\"card\">${emptyState(\n        \"book\",\n        \"Lesson not in this course\",\n        \"That lesson exists, but not inside \" + esc(c.title) + \".\",\n        `\u003ca class=\"btn ghost sm\" href=\"#/learn/${esc(c.id)}\">${icon(\"arrowLeft\", 14)} Open ${esc(c.title)}\u003c/a>`\n      )}\u003c/div>`;\n    }\n    const prev = c.lessons[idx - 1];\n    const next = c.lessons[idx + 1];\n    const done = lessonDone(l.id);\n\n    return `\n    \u003cdiv class=\"row\" style=\"margin-bottom:12px\">\n      ${backLink(`#/learn/${esc(c.id)}`, c.title)}\n      \u003cspan class=\"spacer\">\u003c/span>\n      \u003cspan class=\"chip\">${l.minutes} min\u003c/span>\n      ${done ? `\u003cspan class=\"chip chip-good\">${icon(\"check\", 11)} done\u003c/span>` : \"\"}\n    \u003c/div>\n\n    \u003cdiv class=\"split\">\n      \u003carticle>\n        \u003cheader style=\"margin-bottom:16px\">\n          \u003cdiv class=\"eyebrow\" style=\"margin-bottom:5px\">Lesson ${idx + 1} of ${c.lessons.length}\u003c/div>\n          \u003ch1 style=\"font-size:25px;letter-spacing:-.03em;line-height:1.2\">${esc(l.title)}\u003c/h1>\n        \u003c/header>\n\n        \u003cdiv class=\"md\" id=\"lesson-body\">${md(l.content)}\u003c/div>\n\n        ${(l.quiz || []).length ? `\n        \u003csection class=\"card\" id=\"quiz-card\" style=\"margin-top:22px\">\n          \u003cdiv class=\"card-head\">\n            \u003ch3 style=\"font-size:14px\">${icon(\"target\", 14)} Check yourself\u003c/h3>\n            \u003cspan class=\"spacer\">\u003c/span>\n            \u003cspan class=\"tiny mono dim\" id=\"quiz-score\">0 / ${l.quiz.length}\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"quiz\" id=\"quiz\">\u003c/div>\n        \u003c/section>` : \"\"}\n\n        \u003cdiv class=\"row wrap\" style=\"gap:8px;margin-top:18px\" id=\"lesson-actions\">\n          ${prev ? `\u003ca class=\"btn ghost sm\" href=\"#/learn/${esc(c.id)}/${esc(prev.id)}\">${icon(\"arrowLeft\", 14)} Previous\u003c/a>` : \"\"}\n          \u003cspan class=\"spacer\">\u003c/span>\n          \u003cbutton class=\"btn ${done ? \"ghost\" : \"primary\"} sm\" data-act=\"complete\">${icon(done ? \"check\" : \"flag\", 14)} ${done ? \"Completed\" : \"Mark complete\"}\u003c/button>\n          ${next ? `\u003ca class=\"btn soft sm\" href=\"#/learn/${esc(c.id)}/${esc(next.id)}\">Next ${icon(\"arrowRight\", 14)}\u003c/a>` : `\u003ca class=\"btn soft sm\" href=\"#/cards\">Flashcards ${icon(\"arrowRight\", 14)}\u003c/a>`}\n        \u003c/div>\n      \u003c/article>\n\n      \u003caside class=\"col sticky-side\" style=\"gap:12px\">\n        \u003cdiv class=\"card\">\n          \u003cdiv class=\"eyebrow\" style=\"margin-bottom:7px\">In this course\u003c/div>\n          \u003cdiv class=\"stack\" style=\"gap:2px\">\n            ${c.lessons\n              .map(\n                (x, i) => `\u003ca class=\"row\" href=\"#/learn/${esc(c.id)}/${esc(x.id)}\" style=\"gap:8px;padding:6px 8px;border-radius:8px;text-decoration:none;color:inherit;${x.id === l.id ? \"background:var(--accent-soft);color:var(--accent)\" : \"\"}\">\n                  \u003cspan class=\"tiny mono\" style=\"width:14px;opacity:.7\">${i + 1}\u003c/span>\n                  \u003cspan style=\"font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">${esc(x.title)}\u003c/span>\n                  ${lessonDone(x.id) ? `\u003cspan style=\"color:var(--good)\">${icon(\"check\", 11)}\u003c/span>` : \"\"}\n                \u003c/a>`\n              )\n              .join(\"\")}\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv>${callout(\"info\", \"Read to explain\", \"If you cannot re-explain a section in your own words, you have read it but not learned it. Try the questions first, then re-read.\")}\u003c/div>\n      \u003c/aside>\n    \u003c/div>`;\n  },\n\n  mount(root, ctx) {\n    const found = LESSON_INDEX.get(ctx.params.lessonId);\n    if (!found) return;\n    const l = found.lesson || found;\n    const quizEl = root.querySelector(\"#quiz\");\n    const scoreEl = root.querySelector(\"#quiz-score\");\n    const storedAnswers = store.data.lessons?.[l.id]?.answers || {};\n    const answers = new Map(Object.entries(storedAnswers).map(([k, v]) => [Number(k), v]));\n\n    const scored = () => Array.from(answers.values()).filter((v) => v.correct).length;\n\n    const renderQuiz = () => {\n      if (!quizEl) return;\n      quizEl.innerHTML = (l.quiz || [])\n        .map((q, qi) => {\n          const ans = answers.get(qi);\n          return `\u003cdiv class=\"stack\" style=\"gap:7px\" data-q=\"${qi}\">\n            \u003cdiv class=\"quiz-q\">\u003cspan class=\"dim mono tiny\">${qi + 1}.\u003c/span> ${esc(q.question)}\u003c/div>\n            ${q.options\n              .map((opt, oi) => {\n                const state = ans ? (oi === q.correctIndex ? \"correct\" : ans.choice === oi ? \"wrong\" : \"dimmed\") : \"\";\n                return `\u003cbutton class=\"opt ${state}\" data-qi=\"${qi}\" data-oi=\"${oi}\" ${ans ? \"disabled\" : \"\"}>\n                  \u003cspan class=\"key\">${String.fromCharCode(65 + oi)}\u003c/span>\n                  \u003cspan style=\"flex:1\">${esc(opt)}\u003c/span>\n                  ${ans && oi === q.correctIndex ? `\u003cspan style=\"color:var(--good)\">${icon(\"check\", 14)}\u003c/span>` : \"\"}\n                  ${ans && ans.choice === oi && oi !== q.correctIndex ? `\u003cspan style=\"color:var(--critical)\">${icon(\"x\", 14)}\u003c/span>` : \"\"}\n                \u003c/button>`;\n              })\n              .join(\"\")}\n            ${ans ? `\u003cdiv class=\"explain\">${esc(q.explanation || \"\")}\u003c/div>` : \"\"}\n          \u003c/div>`;\n        })\n        .join(\"\");\n      if (scoreEl) scoreEl.textContent = `${scored()} / ${(l.quiz || []).length}`;\n    };\n\n    renderQuiz();\n\n    quizEl?.addEventListener(\"click\", (ev) => {\n      const btn = ev.target.closest(\"[data-qi]\");\n      if (!btn) return;\n      const qi = Number(btn.dataset.qi);\n      const oi = Number(btn.dataset.oi);\n      if (answers.has(qi)) return;\n      const q = l.quiz[qi];\n      const correct = oi === q.correctIndex;\n      const isNew = !answers.has(qi);\n      answers.set(qi, { choice: oi, correct });\n      store.update((s) => {\n        if (!s.lessons) s.lessons = {};\n        const rec = s.lessons[l.id] || { completed: false, at: null, score: 0 };\n        rec.answers = Object.assign({}, rec.answers, { [qi]: { choice: oi, correct } });\n        s.lessons[l.id] = rec;\n        if (!Array.isArray(s.history)) s.history = [];\n        // Only the first answer to a question counts towards accuracy and XP.\n        if (isNew) {\n          s.profile.quizzes = (s.profile.quizzes || 0) + 1;\n          if (correct) s.profile.correct = (s.profile.correct || 0) + 1;\n        }\n      });\n      if (isNew && correct) awardXP(4);\n      renderQuiz();\n      const answeredAll = answers.size === l.quiz.length;\n      if (answeredAll && scored() === l.quiz.length) toast(\"Clean sweep — every question right\", \"success\");\n    });\n\n    root.querySelector('[data-act=\"complete\"]')?.addEventListener(\"click\", () => {\n      const already = lessonDone(l.id);\n      const prevScore = store.data.lessons?.[l.id]?.score ?? 0;\n      // Never let a fresh mount with an empty answer map wipe a recorded score.\n      const score = answers.size ? scored() : prevScore;\n      store.update((s) => {\n        if (!s.lessons) s.lessons = {};\n        if (!Array.isArray(s.history)) s.history = [];\n        const rec = s.lessons[l.id] || {};\n        s.lessons[l.id] = Object.assign({}, rec, {\n          completed: true,\n          at: new Date().toISOString(),\n          score,\n          total: (l.quiz || []).length,\n        });\n        if (!already) s.history.unshift({ id: `h-${Date.now()}`, kind: \"lesson\", label: l.title, at: new Date().toISOString() });\n        s.history = s.history.slice(0, 60);\n      });\n      if (!already) {\n        awardXP(l.xp || 30);\n        touchStreak();\n        toast(`Lesson complete · +${l.xp} XP`, \"success\");\n      } else {\n        toast(\"Already completed — progress saved\", \"info\");\n      }\n      ctx.rerender();\n    });\n  },\n};\n\n/* ------------------------------------------------------------------ */\n/* Flashcards                                                          */\n/* ------------------------------------------------------------------ */\n\nconst DECK_META = {\n  pharmacokinetics: { name: \"Pharmacokinetics\", color: \"#f2b23e\" },\n  pharmacodynamics: { name: \"Pharmacodynamics\", color: \"#6fb3ff\" },\n  interactions: { name: \"Interactions\", color: \"#f85149\" },\n  withdrawal: { name: \"Withdrawal\", color: \"#d29922\" },\n  evidence: { name: \"Evidence\", color: \"#3fb950\" },\n};\n\nfunction deckMeta(id) {\n  const sys = SYSTEM_BY_ID.get(id);\n  if (sys) return { name: sys.name, color: sys.color, abbr: sys.abbr };\n  return { ...(DECK_META[id] || { name: id, color: \"var(--accent)\" }), abbr: \"\" };\n}\n\nconst session = { queue: [], idx: 0, flipped: false, reviewed: 0, started: false, filter: \"\" };\n\nfunction startSession(filter = \"\") {\n  const deck = filter ? FLASHCARDS.filter((c) => c.system === filter) : FLASHCARDS;\n  const due = dueCards(deck);\n  session.queue = (due.length ? due : deck.map((card) => ({ card, st: cardState(card.id) }))).map((x) => x.card);\n  session.idx = 0;\n  session.flipped = false;\n  session.reviewed = 0;\n  session.started = true;\n  session.filter = filter;\n}\n\nfunction cardFaceHtml(card, flipped) {\n  const m = deckMeta(card.system);\n  return `\u003cdiv class=\"flashcard ${flipped ? \"flipped\" : \"\"}\" id=\"fc\" role=\"button\" tabindex=\"0\" aria-label=\"Flashcard — tap to flip\">\n    \u003cdiv class=\"fc-inner\">\n      \u003cdiv class=\"fc-face\">\n        \u003cdiv class=\"row\" style=\"justify-content:center;gap:6px\">\n          \u003cspan class=\"chip\" style=\"--dot:${m.color}\">\u003cspan class=\"dot\" style=\"background:${m.color}\">\u003c/span>${esc(m.abbr || m.name)}\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"fc-q\">${esc(card.front)}\u003c/div>\n        \u003cdiv class=\"fc-hint\">Tap to reveal\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"fc-face fc-back\">\n        \u003cdiv class=\"fc-a\">${esc(card.back)}\u003c/div>\n        \u003cdiv class=\"fc-hint\">Tap to flip back\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>`;\n}\n\nfunction sessionBody() {\n  if (!session.started) startSession(session.filter);\n  const { queue, idx } = session;\n\n  if (!queue.length) {\n    return `\u003cdiv class=\"card\">${emptyState(\"layers\", \"Nothing due\", \"Every card in this deck is scheduled for later. Come back tomorrow, or study ahead.\", `\u003cbutton class=\"btn ghost sm\" data-act=\"start\">${icon(\"refresh\", 14)} Study ahead\u003c/button>`)}\u003c/div>`;\n  }\n  if (idx >= queue.length) {\n    return `\u003cdiv class=\"card center\" style=\"padding:26px\">\n      \u003cdiv class=\"empty-ic\" style=\"margin:0 auto 10px;background:rgba(63,185,80,.12);border-color:rgba(63,185,80,.3);color:var(--good)\">${icon(\"check\", 24)}\u003c/div>\n      \u003ch3 style=\"font-size:17px;margin-bottom:5px\">Session complete\u003c/h3>\n      \u003cp class=\"small dim\" style=\"margin-bottom:14px\">${session.reviewed} card${session.reviewed === 1 ? \"\" : \"s\"} reviewed. The scheduler moved each one to its next due date.\u003c/p>\n      \u003cdiv class=\"row\" style=\"gap:8px;justify-content:center\">\n        \u003cbutton class=\"btn primary sm\" data-act=\"start\">${icon(\"refresh\", 14)} Study again\u003c/button>\n        \u003ca class=\"btn ghost sm\" href=\"#/learn\">Back to Learn\u003c/a>\n      \u003c/div>\n    \u003c/div>`;\n  }\n\n  const card = queue[idx];\n  const st = cardState(card.id);\n  return `\n  \u003cdiv class=\"row between\" style=\"margin-bottom:9px\">\n    \u003cspan class=\"tiny mono dim\">${idx + 1} / ${queue.length}\u003c/span>\n    \u003cspan class=\"tiny dim\">${st.seen ? `seen ${st.reps}× · ease ${st.ease}` : \"new card\"}\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"meter\" style=\"margin-bottom:14px\">\u003ci style=\"width:${Math.round((idx / queue.length) * 100)}%\">\u003c/i>\u003c/div>\n  ${cardFaceHtml(card, session.flipped)}\n  \u003cdiv id=\"fc-grades\" style=\"margin-top:12px\">\n    ${\n      session.flipped\n        ? `\u003cdiv class=\"grid grid-4\" style=\"gap:6px\">\n            ${GRADES.map((g) => `\u003cbutton class=\"btn ${g.cls === \"danger\" ? \"danger\" : g.cls === \"soft\" ? \"soft\" : g.cls === \"primary\" ? \"primary\" : \"ghost\"} sm\" data-grade=\"${g.key}\" style=\"flex-direction:column;gap:1px;height:auto;padding:8px 4px\">\n              \u003cspan>${esc(g.label)}\u003c/span>\u003cspan class=\"tiny\" style=\"opacity:.7;font-weight:400\">${esc(nextIntervalPreview(g.key, card.id))}\u003c/span>\n            \u003c/button>`).join(\"\")}\n          \u003c/div>`\n        : `\u003cdiv class=\"row\" style=\"gap:8px\">\n            \u003cbutton class=\"btn soft sm\" data-act=\"flip\" style=\"flex:1\">${icon(\"eye\", 14)} Reveal answer\u003c/button>\n            \u003cbutton class=\"btn ghost sm\" data-act=\"skip\">Skip\u003c/button>\n          \u003c/div>`\n    }\n  \u003c/div>`;\n}\n\nexport const cards = {","/app/views/evidence.js":"/* Evidence: research topics, hierarchy of evidence, saved shelf */\n\nimport { esc, icon, store, copyText, evidenceChip, emptyState } from \"__ND__/app/core.js\";\nimport { COMPOUND_BY_ID, getCompound, pubmedUrl } from \"__ND__/app/data/compounds.js\";\nimport { pageHead, callout, compoundCard } from \"__ND__/app/views/ui.js\";\n\nconst TOPICS = [\n  {\n    id: \"modafinil-healthy\",\n    title: \"Modafinil in healthy adults\",\n    question: \"Does it actually improve cognition, or only wakefulness?\",\n    query: \"modafinil cognitive enhancement healthy volunteers randomized\",\n    lean: \"moderate\",\n    compounds: [\"modafinil\", \"armodafinil\"],\n    note: \"Effects concentrate on attention and vigilance under sleep deprivation. Well-rested adults show small, inconsistent gains — and publication bias inflates the positive ones.\",\n  },\n  {\n    id: \"creatine-brain\",\n    title: \"Creatine and the brain\",\n    question: \"Beyond muscle: does it help cognition or mood?\",\n    query: \"creatine supplementation cognition brain randomized controlled trial\",\n    lean: \"limited\",\n    compounds: [\"creatine\"],\n    note: \"Signal is strongest for short-term memory and reasoning under stress, sleep loss or vegetarian diets. Brain creatine uptake is slow — studies run weeks, not days.\",\n  },\n  {\n    id: \"omega3-depression\",\n    title: \"Omega-3 in depression\",\n    question: \"Adjunct, monotherapy, or marketing?\",\n    query: \"omega-3 fatty acids depression adjunct randomized trial EPA DHA\",\n    lean: \"moderate\",\n    compounds: [\"omega-3\"],\n    note: \"Adjunct signal is modest and EPA-dominant formulas look better than DHA-heavy ones. Effect sizes shrink as trial quality rises — a familiar pattern.\",\n  },\n  {\n    id: \"psilocybin-trd\",\n    title: \"Psilocybin for treatment-resistant depression\",\n    question: \"Breakthrough therapy or over-hyped single-site result?\",\n    query: \"psilocybin treatment-resistant depression randomized controlled trial\",\n    lean: \"limited\",\n    compounds: [\"psilocybin\"],\n    note: \"Short-term effects look large in open-label work; blinded trials are much harder than they sound because the experience is unmistakable. Durability beyond a few months is unproven.\",\n  },\n  {\n    id: \"ssri-severity\",\n    title: \"SSRIs and baseline severity\",\n    question: \"Do antidepressants only beat placebo in severe depression?\",\n    query: \"SSRI efficacy baseline severity depression meta-analysis Fournier\",\n    lean: \"moderate\",\n    compounds: [\"sertraline\", \"fluoxetine\", \"escitalopram\"],\n    note: \"The severity argument rests on a few influential meta-analyses; later re-analyses with individual patient data find benefit across the range, smaller at the mild end.\",\n  },\n  {\n    id: \"stimulant-tolerance\",\n    title: \"Stimulant tolerance and sensitisation\",\n    question: \"Why does the same dose stop working?\",\n    query: \"methylphenidate tolerance sensitization dopamine human\",\n    lean: \"limited\",\n    compounds: [\"methylphenidate\", \"lisdexamfetamine\", \"dextroamphetamine\"],\n    note: \"Therapeutic-dose tolerance is less dramatic than folklore suggests; sleep debt, tolerance to side effects and changing expectations explain more than receptor downregulation.\",\n  },\n  {\n    id: \"lions-mane\",\n    title: \"Lion's mane and nerve growth factor\",\n    question: \"Human cognition or petri-dish promise?\",\n    query: \"Hericium erinaceus cognition mild cognitive impairment randomized\",\n    lean: \"preclinical\",\n    compounds: [\"lions-mane\"],\n    note: \"The NGF story comes from cell and animal work. Human trials are small, short and few — one positive crossover study is not a foundation.\",\n  },\n  {\n    id: \"bacopa-memory\",\n    title: \"Bacopa monnieri and memory\",\n    question: \"Does the 12-week trial hold up?\",\n    query: \"Bacopa monnieri memory healthy adults randomized controlled trial\",\n    lean: \"limited\",\n    compounds: [\"bacopa\"],\n    note: \"Consistent small effects on delayed recall, but the trials are small, heterogeneous and mostly from a narrow set of research groups. GI side effects are common.\",\n  },\n  {\n    id: \"magnesium-threonate\",\n    title: \"Magnesium L-threonate\",\n    question: \"The one magnesium that reaches the brain?\",\n    query: \"magnesium L-threonate cognition brain randomized\",\n    lean: \"preclinical\",\n    compounds: [\"magnesium-l-threonate\"],\n    note: \"Brain-uptake claims are animal data. Human cognitive trials are tiny and industry-linked. In deficiency, any magnesium salt helps — that is a different claim.\",\n  },\n  {\n    id: \"ashwagandha-thyroid\",\n    title: \"Ashwagandha, cortisol and thyroid\",\n    question: \"Adaptogen or endocrine interference?\",\n    query: \"Withania somnifera cortisol thyroid randomized trial safety\",\n    lean: \"limited\",\n    compounds: [\"ashwagandha\"],\n    note: \"Cortisol reductions are small and short-lived. Case reports of thyroid hormone elevation and liver injury mean this is not a free supplement for everyone.\",\n  },\n  {\n    id: \"melatonin-timing\",\n    title: \"Melatonin: dose and timing\",\n    question: \"Why 0.3 mg might beat 5 mg\",\n    query: \"melatonin dose timing circadian phase shift low dose\",\n    lean: \"moderate\",\n    compounds: [\"melatonin\"],\n    note: \"Physiological doses (0.3–0.5 mg) phase-shift circadian rhythm; larger doses mostly add sedation and spillover. Timing relative to sleep matters more than the number on the label.\",\n  },\n  {\n    id: \"ketamine-depression\",\n    title: \"Ketamine for depression\",\n    question: \"Rapid relief — and then what?\",\n    query: \"ketamine esketamine depression rapid antidepressant randomized maintenance\",\n    lean: \"moderate\",\n    compounds: [\"ketamine\"],\n    note: \"The acute effect is real and fast; durability requires maintenance and the dissociation is not the mechanism. Blinding is a persistent problem in the literature.\",\n  },\n  {\n    id: \"nootropic-overview\",\n    title: \"The nootropic literature problem\",\n    question: \"Why is the evidence so soft?\",\n    query: \"nootropic cognitive enhancement supplement quality bias systematic review\",\n    lean: \"strong\",\n    compounds: [\"piracetam\", \"aniracetam\", \"phenylpiracetam\", \"noopept\"],\n    note: \"Small samples, non-blinded designs, multiple outcomes and selective reporting. The absence of harm data is the most reliable finding in the whole field.\",\n  },\n  {\n    id: \"interaction-data\",\n    title: \"How interaction data is generated\",\n    question: \"Where do “known interactions” actually come from?\",\n    query: \"drug-drug interaction evidence case reports pharmacovigilance limitations\",\n    lean: \"strong\",\n    compounds: [\"sertraline\", \"tramadol\", \"phenelzine\"],\n    note: \"Most interaction knowledge is case reports and mechanistic extrapolation, not trials. That is why absence from a database is weak evidence of safety.\",\n  },\n];\n\nconst HIERARCHY = [\n  { tier: \"Systematic reviews & meta-analyses\", weight: 100, note: \"Best when protocols are pre-registered and heterogeneity is addressed. Can still inherit bias from the trials inside.\", tone: \"good\" },\n  { tier: \"Randomised controlled trials\", weight: 78, note: \"The core of causal claims. Size, blinding, and whether the outcome was pre-specified decide everything.\", tone: \"good\" },\n  { tier: \"Controlled crossover trials\", weight: 62, note: \"Efficient for acute cognitive effects, but carry-over and practice effects are common traps.\", tone: \"\" },\n  { tier: \"Prospective cohort studies\", weight: 46, note: \"Good for harm signals and long horizons; cannot establish causation on their own.\", tone: \"\" },\n  { tier: \"Case-control & case series\", weight: 30, note: \"Where most drug-interaction knowledge lives. Signals, not proof.\", tone: \"warn\" },\n  { tier: \"Animal & mechanistic work\", weight: 18, note: \"Plausibility, not efficacy. Most “promising” compounds die here.\", tone: \"warn\" },\n  { tier: \"Anecdote & forum reports\", weight: 6, note: \"Useful as a hypothesis generator, worthless as evidence. Also the base of most supplement marketing.\", tone: \"bad\" },\n];\n\nconst EVIDENCE_LADDER = [\n  [\"strong\", \"Multiple RCTs or meta-analyses with consistent, clinically meaningful effects.\"],\n  [\"moderate\", \"At least one good RCT, or consistent smaller trials with some inconsistency.\"],\n  [\"limited\", \"Small or few trials, mixed results, or a single research group.\"],\n  [\"preclinical\", \"Animal or in-vitro data only — or human data that does not measure the claimed outcome.\"],\n  [\"anecdotal\", \"Documented only through reports. Included for completeness, not as support.\"],\n];\n\nconst state = { tab: \"topics\", q: \"\" };\n\nfunction topicsHtml() {\n  const q = state.q.toLowerCase();\n  const list = q ? TOPICS.filter((t) => `${t.title} ${t.question} ${t.note} ${t.query}`.toLowerCase().includes(q)) : TOPICS;\n  if (!list.length) return `\u003cdiv class=\"card\">${emptyState(\"search\", \"No topic matches\", \"Try “depression”, “creatine”, “melatonin”…\")}\u003c/div>`;\n  return `\u003cdiv class=\"grid grid-2\" style=\"gap:10px\">\n    ${list\n      .map(\n        (t) => `\u003carticle class=\"card\">\n          \u003cdiv class=\"row between\" style=\"align-items:flex-start;gap:8px;margin-bottom:6px\">\n            \u003ch3 style=\"font-size:14.5px;line-height:1.3\">${esc(t.title)}\u003c/h3>\n            \u003cspan class=\"chip chip-${t.lean === \"strong\" ? \"good\" : t.lean === \"moderate\" ? \"ok\" : t.lean === \"limited\" ? \"warn\" : \"bad\"} nowrap\">${esc(t.lean)}\u003c/span>\n          \u003c/div>\n          \u003cp class=\"small\" style=\"color:var(--accent);font-style:italic;margin-bottom:7px;line-height:1.45\">${esc(t.question)}\u003c/p>\n          \u003cp class=\"tiny dim\" style=\"line-height:1.6;margin-bottom:10px\">${esc(t.note)}\u003c/p>\n          \u003cdiv class=\"row wrap\" style=\"gap:5px;margin-bottom:10px\">\n            ${t.compounds.map((id) => (COMPOUND_BY_ID.get(id) ? `\u003ca class=\"chip chip-btn\" href=\"#/compounds/${esc(id)}\">${esc(COMPOUND_BY_ID.get(id).name)}\u003c/a>` : \"\")).join(\"\")}\n          \u003c/div>\n          \u003cdiv class=\"row wrap\" style=\"gap:7px\">\n            \u003ca class=\"btn ghost sm\" href=\"${pubmedUrl(t.query)}\" target=\"_blank\" rel=\"noopener noreferrer\">${icon(\"external\", 13)} PubMed\u003c/a>\n            \u003cbutton class=\"btn ghost sm\" data-copy=\"${esc(t.query)}\">${icon(\"copy\", 13)} Query\u003c/button>\n          \u003c/div>\n        \u003c/article>`\n      )\n      .join(\"\")}\n  \u003c/div>`;\n}\n\nfunction ladderHtml() {\n  return `\u003cdiv class=\"stack\" style=\"gap:14px\">\n    ${callout(\"info\", \"Read evidence, not verdicts\", \"Every compound in this app carries a grade. The grade is a shorthand for the quality of human data behind the claim — not for how strongly people believe it.\")}\n\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"card-head\">\u003ch3 style=\"font-size:14px\">Hierarchy of evidence\u003c/h3>\u003c/div>\n      \u003cdiv class=\"stack\" style=\"gap:10px\">\n        ${HIERARCHY.map(\n          (h) => `\u003cdiv>\n            \u003cdiv class=\"row between\" style=\"gap:8px;margin-bottom:3px\">\n              \u003cspan style=\"font-size:12.5px;font-weight:600\">${esc(h.tier)}\u003c/span>\n              \u003cspan class=\"mono tiny dim\">${h.weight}\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"meter ${h.tone}\">\u003ci style=\"width:${h.weight}%\">\u003c/i>\u003c/div>\n            \u003cp class=\"tiny dim\" style=\"margin-top:4px;line-height:1.5\">${esc(h.note)}\u003c/p>\n          \u003c/div>`\n        ).join(\"\")}\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"card-head\">\u003ch3 style=\"font-size:14px\">What each grade means\u003c/h3>\u003c/div>\n      \u003cdiv class=\"list\" style=\"margin:0 -14px\">\n        ${EVIDENCE_LADDER.map(\n          ([key, note]) => `\u003cdiv class=\"list-row\" style=\"align-items:flex-start\">\n            \u003cdiv style=\"flex:none;padding-top:2px\">${evidenceChip(key)}\u003c/div>\n            \u003cp class=\"tiny muted\" style=\"line-height:1.55;margin:0\">${esc(note)}\u003c/p>\n          \u003c/div>`\n        ).join(\"\")}\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card tight\">\n      \u003cdiv class=\"eyebrow\" style=\"margin-bottom:7px\">Five questions that kill most claims\u003c/div>\n      \u003col class=\"md-list\" style=\"margin:0;padding-left:20px;font-size:13px;line-height:1.7\">\n        \u003cli>Was it randomised, and did the blinding actually hold?\u003c/li>\n        \u003cli>Was the outcome pre-registered, or chosen after the data arrived?\u003c/li>\n        \u003cli>How large was the effect, and how large was the sample?\u003c/li>\n        \u003cli>Who funded it — and does the funder sell the thing being tested?\u003c/li>\n        \u003cli>Does the measured outcome mean anything in real life?\u003c/li>\n      \u003c/ol>\n    \u003c/div>\n  \u003c/div>`;\n}\n\nfunction savedHtml() {\n  const saved = (store.data.saved || []).map((id) => getCompound(id)).filter(Boolean);\n  if (!saved.length) {\n    return `\u003cdiv class=\"card\">${emptyState(\"star\", \"Nothing saved yet\", \"Tap the star on any compound page to keep it here.\", `\u003ca class=\"btn soft sm\" href=\"#/compounds\">${icon(\"search\", 14)} Browse compounds\u003c/a>`)}\u003c/div>`;\n  }\n  return `\u003cdiv class=\"grid grid-auto\" style=\"gap:10px\">${saved.map(compoundCard).join(\"\")}\u003c/div>`;\n}\n\nexport const evidence = {\n  render() {\n    const savedCount = (store.data.saved || []).map((id) => getCompound(id)).filter(Boolean).length;\n    const tab = state.tab === \"ladder\" || state.tab === \"saved\" ? state.tab : \"topics\";\n    const bodyHtml =\n      tab === \"ladder\"\n        ? ladderHtml()\n        : tab === \"saved\"\n          ? savedHtml()\n          : `\u003cdiv style=\"margin-bottom:12px\" class=\"search-input\">\n        ${icon(\"search\", 16)}\n        \u003cinput class=\"input\" id=\"ev-q\" type=\"search\" placeholder=\"Filter topics…\" value=\"${esc(state.q)}\">\n      \u003c/div>\n      \u003cdiv id=\"ev-topics\">${topicsHtml()}\u003c/div>`;\n    return `\n    ${pageHead(\n      \"Evidence\",\n      \"Curated research questions with the honest version of each answer — plus the rules for reading a trial yourself.\",\n      \"\"\n    )}\n\n    \u003cdiv class=\"tabs\" id=\"ev-tabs\">\n      \u003cbutton class=\"${tab === \"topics\" ? \"on\" : \"\"}\" data-tab=\"topics\">Topics\u003c/button>\n      \u003cbutton class=\"${tab === \"ladder\" ? \"on\" : \"\"}\" data-tab=\"ladder\">Reading evidence\u003c/button>\n      \u003cbutton class=\"${tab === \"saved\" ? \"on\" : \"\"}\" data-tab=\"saved\">Saved${savedCount ? ` (${savedCount})` : \"\"}\u003c/button>\n    \u003c/div>\n\n    \u003cdiv id=\"ev-body\">${bodyHtml}\u003c/div>`;\n  },\n\n  mount(root) {\n    const body = root.querySelector(\"#ev-body\");\n    if (!body) return;\n\n    const paintTab = (tab) => {\n      state.tab = tab;\n      root.querySelectorAll(\"#ev-tabs [data-tab]\").forEach((b) => b.classList.toggle(\"on\", b.dataset.tab === tab));\n      if (tab === \"topics\") {\n        body.innerHTML = `\u003cdiv style=\"margin-bottom:12px\" class=\"search-input\">${icon(\"search\", 16)}\n          \u003cinput class=\"input\" id=\"ev-q\" type=\"search\" placeholder=\"Filter topics…\" value=\"${esc(state.q)}\">\n        \u003c/div>\u003cdiv id=\"ev-topics\">${topicsHtml()}\u003c/div>`;\n        bindSearch();\n      } else if (tab === \"ladder\") {\n        body.innerHTML = ladderHtml();\n      } else {\n        body.innerHTML = savedHtml();\n      }\n    };\n\n    const bindSearch = () => {\n      const q = body.querySelector(\"#ev-q\");\n      q?.addEventListener(\"input\", () => {\n        state.q = q.value;\n        const t = body.querySelector(\"#ev-topics\");\n        if (t) t.innerHTML = topicsHtml();\n      });\n    };\n\n    root.querySelector(\"#ev-tabs\")?.addEventListener(\"click\", (ev) => {\n      const btn = ev.target.closest(\"[data-tab]\");\n      if (btn) paintTab(btn.dataset.tab);\n    });\n\n    bindSearch();\n\n    body.addEventListener(\"click\", (ev) => {\n      const copyBtn = ev.target.closest(\"[data-copy]\");\n      if (copyBtn) copyText(copyBtn.dataset.copy, \"Search query copied\");\n    });\n  },\n};\n\nexport const saved = evidence;","/app/views/ask.js":"/* Ask: local retrieval assistant over the whole database (no network) */\n\nimport { esc, icon, fmt } from \"__ND__/app/core.js\";\nimport { COMPOUNDS, COMPOUND_BY_ID, getCompound, resolveCompound, searchCompounds, pubmedUrl } from \"__ND__/app/data/compounds.js\";\nimport { SYSTEMS, SYSTEM_BY_ID } from \"__ND__/app/data/neuro.js\";\nimport { COURSES, LESSONS_ALL } from \"__ND__/app/data/learn.js\";\nimport { checkInteractions } from \"__ND__/app/data/interactions.js\";\nimport { pageHead, callout, classColor } from \"__ND__/app/views/ui.js\";\n\n/* ------------------------------------------------------------------ */\n/* Retrieval                                                           */\n/* ------------------------------------------------------------------ */\n\nconst STOP = new Set([\"the\", \"a\", \"an\", \"of\", \"and\", \"or\", \"is\", \"are\", \"does\", \"do\", \"what\", \"how\", \"why\", \"to\", \"in\", \"on\", \"for\", \"with\", \"it\", \"its\", \"can\", \"i\", \"my\", \"me\", \"you\", \"vs\", \"versus\", \"between\", \"difference\", \"long\", \"much\", \"should\", \"take\"]);\n\nfunction tokens(q) {\n  return String(q || \"\")\n    .toLowerCase()\n    .replace(/[^a-z0-9\\s+-]/g, \" \")\n    .split(/\\s+/)\n    .filter((t) => t.length > 2 && !STOP.has(t));\n}\n\nfunction findSystems(q) {\n  const text = String(q).toLowerCase();\n  return SYSTEMS.filter((s) => text.includes(s.name.toLowerCase().replace(\" \", \"\")) || text.includes(s.name.toLowerCase()) || new RegExp(`\\\\b${s.abbr.toLowerCase()}\\\\b`, \"i\").test(text) || (s.matchFlags || []).some((f) => text.includes(f.replace(/-/g, \" \"))));\n}\n\nfunction findCompoundsIn(q) {\n  const text = String(q || \"\").toLowerCase();\n  const hits = new Set();\n  for (const c of COMPOUNDS) {\n    const names = [c.name, ...(c.aliases || [])].filter(Boolean).map((n) => n.toLowerCase());\n    if (names.some((n) => n.length > 2 && text.includes(n))) hits.add(c.id);\n  }\n  if (!hits.size) {\n    for (const c of searchCompounds(q).slice(0, 3)) hits.add(c.id);\n  }\n  return Array.from(hits).map((id) => COMPOUND_BY_ID.get(id)).filter(Boolean);\n}\n\nfunction findLessons(q) {\n  const ts = tokens(q);\n  if (!ts.length) return [];\n  return LESSONS_ALL.map((entry) => {\n    const hay = `${entry.lesson.title} ${entry.course.title} ${entry.lesson.content}`.toLowerCase();\n    let score = 0;\n    for (const t of ts) {\n      if (entry.lesson.title.toLowerCase().includes(t)) score += 4;\n      if (hay.includes(t)) score += 1;\n    }\n    return { ...entry, score };\n  })\n    .filter((x) => x.score >= 2)\n    .sort((a, b) => b.score - a.score)\n    .slice(0, 3);\n}\n\n/* ------------------------------------------------------------------ */\n/* Answer composition                                                  */\n/* ------------------------------------------------------------------ */\n\nfunction compoundBlock(c) {\n  return `\u003cdiv class=\"stack\" style=\"gap:7px\">\n    \u003cdiv class=\"row wrap\" style=\"gap:6px\">\n      \u003ca class=\"chip chip-btn\" href=\"#/compounds/${esc(c.id)}\" style=\"--dot:${classColor(c.cls)}\">\u003cspan class=\"dot\" style=\"background:${classColor(c.cls)}\">\u003c/span>${esc(c.name)}\u003c/a>\n      \u003cspan class=\"chip\">${esc(c.cls)}\u003c/span>\n      \u003cspan class=\"chip\">${esc(c.evidence)} evidence\u003c/span>\n    \u003c/div>\n    \u003cp class=\"small\" style=\"line-height:1.6;color:var(--text-2)\">${esc(c.summary)}\u003c/p>\n    ${(c.moa || []).length ? `\u003cdiv class=\"tiny dim\" style=\"line-height:1.6\">\u003cstrong class=\"muted\">Mechanism:\u003c/strong> ${(c.moa || []).map(esc).join(\" · \")}\u003c/div>` : \"\"}\n    \u003cdiv class=\"row wrap tiny\" style=\"gap:6px 14px\">\n      ${c.pk.halfLife ? `\u003cspan class=\"tiny dim\">t½ \u003cspan class=\"mono\" style=\"color:var(--text-2)\">${fmt.duration(c.pk.halfLife)}\u003c/span>\u003c/span>` : \"\"}\n      ${c.pk.onset ? `\u003cspan class=\"tiny dim\">onset \u003cspan class=\"mono\" style=\"color:var(--text-2)\">${fmt.duration(c.pk.onset)}\u003c/span>\u003c/span>` : \"\"}\n      ${(c.doses || [])[0] ? `\u003cspan class=\"tiny dim\">usual ${esc(c.doses[0].low)}${c.doses[0].high !== c.doses[0].low ? `–${esc(c.doses[0].high)}` : \"\"} ${esc(c.doses[0].unit || \"mg\")}\u003c/span>` : \"\"}\n    \u003c/div>\n    ${(c.warnings || []).length ? `\u003cdiv class=\"tiny\" style=\"color:#ffb9a3;line-height:1.55\">\u003cstrong>Watch:\u003c/strong> ${esc(c.warnings[0])}\u003c/div>` : \"\"}\n    \u003ca class=\"btn ghost xs\" href=\"#/compounds/${esc(c.id)}\" style=\"align-self:flex-start\">Open entry ${icon(\"arrowRight\", 12)}\u003c/a>\n  \u003c/div>`;\n}\n\nfunction compareBlocks(list) {\n  const [a, b] = list;\n  const rows = [\n    [\"Class\", esc(a.cls) + (a.subcls ? ` · ${esc(a.subcls)}` : \"\"), esc(b.cls) + (b.subcls ? ` · ${esc(b.subcls)}` : \"\")],\n    [\"Evidence\", evidenceCell(a), evidenceCell(b)],\n    [\"Mechanism\", (a.moa || []).slice(0, 2).map(esc).join(\"; \") || \"—\", (b.moa || []).slice(0, 2).map(esc).join(\"; \") || \"—\"],\n    [\"Half-life\", a.pk.halfLife ? fmt.duration(a.pk.halfLife) : \"—\", b.pk.halfLife ? fmt.duration(b.pk.halfLife) : \"—\"],\n    [\"Onset\", a.pk.onset ? fmt.duration(a.pk.onset) : \"—\", b.pk.onset ? fmt.duration(b.pk.onset) : \"—\"],\n    [\"Typical dose\", doseText(a), doseText(b)],\n    [\"Main risk\", esc((a.warnings || [])[0] || (a.effects.bad || [])[0] || \"—\"), esc((b.warnings || [])[0] || (b.effects.bad || [])[0] || \"—\")],\n  ];\n  return `\u003cdiv class=\"card tight\" style=\"overflow-x:auto;padding:0\">\n    \u003ctable style=\"width:100%;border-collapse:collapse;font-size:12.5px\">\n      \u003cthead>\u003ctr>\n        \u003cth style=\"text-align:left;padding:9px 11px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);border-bottom:1px solid var(--line)\">\u003c/th>\n        \u003cth style=\"text-align:left;padding:9px 11px;font-size:12.5px;border-bottom:1px solid var(--line)\">${esc(a.name)}\u003c/th>\n        \u003cth style=\"text-align:left;padding:9px 11px;font-size:12.5px;border-bottom:1px solid var(--line)\">${esc(b.name)}\u003c/th>\n      \u003c/tr>\u003c/thead>\n      \u003ctbody>\n        ${rows\n          .map(\n            ([label, x, y]) => `\u003ctr>\n              \u003ctd style=\"padding:8px 11px;color:var(--text-3);font-size:11.5px;border-bottom:1px solid var(--line-soft);white-space:nowrap\">${label}\u003c/td>\n              \u003ctd style=\"padding:8px 11px;border-bottom:1px solid var(--line-soft);vertical-align:top\">${x}\u003c/td>\n              \u003ctd style=\"padding:8px 11px;border-bottom:1px solid var(--line-soft);vertical-align:top\">${y}\u003c/td>\n            \u003c/tr>`\n          )\n          .join(\"\")}\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n  \u003cdiv class=\"row wrap\" style=\"gap:6px;margin-top:9px\">\n    \u003ca class=\"btn ghost xs\" href=\"#/compounds/${esc(a.id)}\">${esc(a.name)} entry\u003c/a>\n    \u003ca class=\"btn ghost xs\" href=\"#/compounds/${esc(b.id)}\">${esc(b.name)} entry\u003c/a>\n    \u003ca class=\"btn ghost xs\" href=\"#/lab/interactions?add=${esc(a.id)}\">Check ${esc(a.name)} interactions\u003c/a>\n  \u003c/div>`;\n}\n\nfunction doseText(c) {\n  const d = (c.doses || [])[0];\n  if (!d) return \"—\";\n  return `${esc(d.low)}${d.high && d.high !== d.low ? `–${esc(d.high)}` : \"\"} ${esc(d.unit || \"mg\")} ${d.route ? esc(d.route) : \"\"}`;\n}\n\nfunction evidenceCell(c) {\n  return `\u003cspan class=\"chip chip-${c.evidence === \"strong\" ? \"good\" : c.evidence === \"moderate\" ? \"ok\" : c.evidence === \"limited\" ? \"warn\" : \"bad\"}\">${esc(c.evidence)}\u003c/span>`;\n}\n\nfunction systemBlock(s) {\n  return `\u003cdiv class=\"stack\" style=\"gap:7px\">\n    \u003cdiv class=\"row\" style=\"gap:7px\">\u003cspan class=\"dot\" style=\"width:8px;height:8px;border-radius:50%;background:${s.color}\">\u003c/span>\n    \u003cstrong style=\"font-size:14px\">${esc(s.name)}\u003c/strong>\u003cspan class=\"tag\">${esc(s.abbr)}\u003c/span>\u003c/div>\n    \u003cp class=\"small\" style=\"line-height:1.6;color:var(--text-2)\">${esc(s.summary)}\u003c/p>\n    \u003cdiv class=\"tiny dim\" style=\"line-height:1.6\">\u003cstrong class=\"muted\">Receptors:\u003c/strong> ${s.receptors.map((r) => esc(r.name)).join(\", \")}\u003c/div>\n    \u003cdiv class=\"tiny dim\" style=\"line-height:1.6\">\u003cstrong class=\"muted\">Drugs that act here:\u003c/strong> ${(s.interventions || [])\n      .map((p) => `${esc(p.point)} → ${esc(p.target)}`)\n      .slice(0, 4)\n      .join(\" · \")}\u003c/div>\n    \u003ca class=\"btn ghost xs\" href=\"#/brain/${esc(s.id)}\" style=\"align-self:flex-start\">Open pathway ${icon(\"arrowRight\", 12)}\u003c/a>\n  \u003c/div>`;\n}\n\nfunction lessonsBlock(list) {\n  if (!list.length) return \"\";\n  return `\u003cdiv class=\"stack\" style=\"gap:5px\">\n    ${list\n      .map(\n        (x) => `\u003ca class=\"row between\" href=\"#/learn/${esc(x.course.id)}/${esc(x.lesson.id)}\" style=\"padding:8px 10px;border-radius:9px;background:var(--bg-2);border:1px solid var(--line);color:inherit;text-decoration:none\">\n          \u003cspan style=\"font-size:12.5px;font-weight:550\">${esc(x.lesson.title)}\u003c/span>\n          \u003cspan class=\"tiny dim\">${esc(x.course.title)}\u003c/span>\n        \u003c/a>`\n      )\n      .join(\"\")}\n  \u003c/div>`;\n}\n\n/** Does the question actually ask for a comparison? */\nfunction wantsComparison(text) {\n  return /\\b(vs\\.?|versus|compare|comparison|compared|difference|differences|better|worse|instead of)\\b/i.test(text);\n}\n\n/** Build an answer for a free-text question. */\nexport function answer(q) {\n  const text = String(q || \"\").trim();\n  if (!text) return `\u003cp class=\"small muted\">Ask about a compound, a transmitter system, an interaction, or a lesson topic.\u003c/p>`;\n\n  const found = findCompoundsIn(text);\n  const systems = findSystems(text);\n  const lessons = findLessons(text);\n  const parts = [];\n\n  if (found.length >= 2 && !wantsComparison(text)) {\n    // A broad query can match several summaries; lead with the best single entry.\n    parts.push(compoundBlock(found[0]));\n    parts.push(\n      `\u003cdiv class=\"tiny dim\" style=\"margin-top:8px\">Also matched: ${found\n        .slice(1, 4)\n        .map((c) => `\u003ca href=\"#/compounds/${esc(c.id)}\">${esc(c.name)}\u003c/a>`)\n        .join(\", \")} — \u003ca href=\"#/compounds?q=${encodeURIComponent(found[0].name)}\">browse\u003c/a>\u003c/div>`\n    );\n  } else if (found.length >= 2) {\n    parts.push(`\u003cp class=\"small muted\" style=\"margin-bottom:9px\">Comparing \u003cstrong style=\"color:var(--text)\">${esc(found[0].name)
