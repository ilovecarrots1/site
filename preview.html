}\u003c/strong> with \u003cstrong style=\"color:var(--text)\">${esc(found[1].name)}\u003c/strong>:\u003c/p>`);\n    parts.push(compareBlocks(found));\n    const inter = checkInteractions(found.slice(0, 2));\n    if (inter.length) {\n      parts.push(`\u003cdiv class=\"tiny\" style=\"color:#ffb9a3;line-height:1.55;margin-top:9px\">\u003cstrong>Stacking them:\u003c/strong> ${esc(inter[0].title)} — ${esc(inter[0].mechanism)}\u003c/div>`);\n    }\n    const extra = found.slice(2);\n    if (extra.length) parts.push(`\u003cdiv class=\"tiny dim\" style=\"margin-top:8px\">Also matched: ${extra.map((c) => `\u003ca href=\"#/compounds/${esc(c.id)}\">${esc(c.name)}\u003c/a>`).join(\", \")}\u003c/div>`);\n  } else if (found.length === 1) {\n    const c = found[0];\n    parts.push(compoundBlock(c));\n    if (/\\b(interact|combine|mix|stack|safe with)\\b/i.test(text)) {\n      const stack = (store.data.stack || []).map((id) => getCompound(id)).filter(Boolean);\n      const inter = checkInteractions([c, ...stack]);\n      if (inter.length) {\n        parts.push(\n          `\u003cdiv class=\"stack\" style=\"gap:6px;margin-top:9px\">${inter\n            .slice(0, 3)\n            .map((f) => `\u003cdiv class=\"tiny\" style=\"line-height:1.55\">\u003cstrong>${esc(f.title)}\u003c/strong> — ${esc(f.mechanism)}\u003c/div>`)\n            .join(\"\")}\u003c/div>`\n        );\n      }\n      parts.push(`\u003cp class=\"tiny dim\" style=\"margin-top:9px\">Check it against your whole stack: \u003ca href=\"#/lab/interactions?add=${esc(c.id)}\">open the interaction checker\u003c/a>.\u003c/p>`);\n    }\n    if (/half.?life|how long|duration|last/i.test(text) && c.pk.halfLife) {\n      parts.push(\n        `\u003cdiv class=\"tiny dim\" style=\"line-height:1.6;margin-top:8px\">\u003cstrong class=\"muted\">Timing:\u003c/strong> half-life ${fmt.duration(c.pk.halfLife)} → effectively cleared in ~${fmt.duration(Number(c.pk.halfLife) * 5)}; steady state after ~${fmt.duration(Number(c.pk.halfLife) * 5)} of regular dosing. \u003ca href=\"#/lab?compound=${esc(c.id)}\">Plot it in the lab\u003c/a>.\u003c/div>`\n      );\n    }\n  }\n\n  if (systems.length) {\n    parts.push(`${found.length ? `\u003cdiv class=\"divider\">\u003c/div>` : \"\"}${systemBlock(systems[0])}`);\n  }\n\n  if (!found.length && !systems.length) {\n    parts.push(`\u003cp class=\"small muted\">Nothing in the index directly matches “${esc(text)}”. Try a compound name, a system (dopamine, GABA, orexin), or a phrase like “how long does caffeine last”.\u003c/p>`);\n  }\n\n  if (lessons.length) {\n    parts.push(`\u003cdiv class=\"divider\">\u003c/div>\u003cdiv class=\"eyebrow\" style=\"margin-bottom:6px\">Related lessons\u003c/div>${lessonsBlock(lessons)}`);\n  }\n\n  return parts.join(\"\");\n}\n\nconst SUGGESTIONS = [\n  \"modafinil vs armodafinil\",\n  \"how long does caffeine last\",\n  \"what does serotonin do\",\n  \"SSRI and MAOI together\",\n  \"ketamine mechanism\",\n  \"is ashwagandha safe with thyroid meds\",\n  \"dopamine vs noradrenaline\",\n];\n\nconst chat = { messages: [] };\n\nfunction messagesHtml() {\n  if (!chat.messages.length) {\n    return `\u003cdiv class=\"card\" style=\"text-align:center;padding:26px 18px\">\n      \u003cdiv class=\"empty-ic\" style=\"margin:0 auto 10px\">${icon(\"sparkles\", 22)}\u003c/div>\n      \u003ch3 style=\"font-size:16px;margin-bottom:5px\">Ask the index\u003c/h3>\n      \u003cp class=\"small dim\" style=\"max-width:44ch;margin:0 auto 4px\">Every answer is assembled from the local database — compounds, kinetics, pathways and lessons. No model, no internet, no invention.\u003c/p>\n    \u003c/div>`;\n  }\n  return chat.messages\n    .map(\n      (m) => `\u003cdiv class=\"card\" style=\"${m.role === \"user\" ? \"background:var(--accent-soft);border-color:var(--accent-line)\" : \"\"};padding:13px\">\n        \u003cdiv class=\"row\" style=\"gap:6px;margin-bottom:${m.role === \"user\" ? \"0\" : \"9px\"}\">\n          \u003cspan class=\"tiny\" style=\"color:${m.role === \"user\" ? \"var(--accent)\" : \"var(--text-3)\"};font-weight:650;text-transform:uppercase;letter-spacing:.06em\">${m.role === \"user\" ? \"You\" : \"Index\"}\u003c/span>\n        \u003c/div>\n        ${m.role === \"user\" ? `\u003cp style=\"font-size:14px;line-height:1.5\">${esc(m.text)}\u003c/p>` : m.html}\n      \u003c/div>`\n    )\n    .join(\"\");\n}\n\nexport const ask = {\n  render() {\n    return `\n    ${pageHead(\"Ask\", \"A retrieval engine over everything in the app — mechanisms, kinetics, interactions, lessons. Honest by construction: if it is not in the data, it says so.\", \"\")}\n\n    \u003cdiv class=\"split\">\n      \u003cdiv>\n        \u003cdiv class=\"stack\" id=\"chat-log\" style=\"gap:10px\">${messagesHtml()}\u003c/div>\n\n        \u003cform id=\"ask-form\" style=\"margin-top:14px;display:flex;gap:8px;align-items:flex-end\">\n          \u003cdiv class=\"search-input\" style=\"flex:1\">\n            ${icon(\"search\", 16)}\n            \u003cinput class=\"input\" id=\"ask-q\" placeholder=\"e.g. how long does modafinil last?\" autocomplete=\"off\" enterkeyhint=\"send\">\n          \u003c/div>\n          \u003cbutton class=\"btn primary\" type=\"submit\" aria-label=\"Ask\" style=\"flex:none\">${icon(\"send\", 16)}\u003c/button>\n        \u003c/form>\n\n        \u003cdiv class=\"row wrap\" style=\"gap:5px;margin-top:10px\" id=\"ask-suggest\">\n          ${SUGGESTIONS.map((s) => `\u003cbutton class=\"chip chip-btn\" data-suggest=\"${esc(s)}\">${esc(s)}\u003c/button>`).join(\"\")}\n        \u003c/div>\n      \u003c/div>\n\n      \u003caside class=\"col sticky-side\" style=\"gap:12px\">\n        \u003cdiv class=\"card\">\n          \u003cdiv class=\"eyebrow\" style=\"margin-bottom:7px\">What it can answer\u003c/div>\n          \u003cul class=\"md-list\" style=\"margin:0;padding-left:17px;font-size:12.5px;line-height:1.6;color:var(--text-2)\">\n            \u003cli>Compound mechanisms, kinetics, doses and risks\u003c/li>\n            \u003cli>Head-to-head comparisons of two entries\u003c/li>\n            \u003cli>What a transmitter system does and how drugs touch it\u003c/li>\n            \u003cli>Which lesson covers a concept\u003c/li>\n            \u003cli>Whether two things are known to interact\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n        \u003cdiv class=\"card tight\">\n          \u003cdiv class=\"eyebrow\" style=\"margin-bottom:6px\">What it cannot do\u003c/div>\n          \u003cp class=\"tiny dim\" style=\"line-height:1.6\">It does not diagnose, dose for you, or invent pharmacology that is not in the database. No LLM sits behind this — it is a deterministic index, so a wrong answer is a data bug you can see.\u003c/p>\n        \u003c/div>\n        \u003cdiv>${callout(\"warn\", \"Answers are summaries\", \"Every claim here compresses a literature you have not read. Follow the source links before acting on anything.\")}\u003c/div>\n      \u003c/aside>\n    \u003c/div>`;\n  },\n\n  mount(root) {\n    const log = root.querySelector(\"#chat-log\");\n    const form = root.querySelector(\"#ask-form\");\n    const input = root.querySelector(\"#ask-q\");\n\n    const paint = () => {\n      log.innerHTML = messagesHtml();\n      log.lastElementChild?.scrollIntoView({ block: \"nearest\", behavior: \"smooth\" });\n    };\n\n    const send = (text) => {\n      const q = String(text || \"\").trim();\n      if (!q) return;\n      chat.messages.push({ role: \"user\", text: q });\n      chat.messages.push({ role: \"bot\", html: answer(q) });\n      if (chat.messages.length > 24) chat.messages = chat.messages.slice(-24);\n      input.value = \"\";\n      paint();\n    };\n\n    form?.addEventListener(\"submit\", (ev) => {\n      ev.preventDefault();\n      send(input.value);\n    });\n\n    root.querySelector(\"#ask-suggest\")?.addEventListener(\"click\", (ev) => {\n      const b = ev.target.closest(\"[data-suggest]\");\n      if (b) send(b.dataset.suggest);\n    });\n  },\n};","/app/views/notes.js":"/* Notebook: private notes attached to compounds, tags and questions */\n\nimport { esc, icon, store, toast, uid, fmt, emptyState } from \"__ND__/app/core.js\";\nimport { COMPOUND_BY_ID, getCompound, resolveCompound, searchCompounds } from \"__ND__/app/data/compounds.js\";\nimport { pageHead, callout, classColor } from \"__ND__/app/views/ui.js\";\n\nconst state = { q: \"\", tag: \"\" };\n\nfunction notes() {\n  return (store.data.notes || []).slice().sort((a, b) => String(b.updatedAt || b.at || \"\").localeCompare(String(a.updatedAt || a.at || \"\")));\n}\n\nfunction allTags() {\n  return Array.from(new Set(notes().flatMap((n) => n.tags || []))).sort();\n}\n\nfunction filtered() {\n  let list = notes();\n  if (state.tag) list = list.filter((n) => (n.tags || []).includes(state.tag));\n  const q = state.q.trim().toLowerCase();\n  if (q) list = list.filter((n) => `${n.title} ${n.body} ${(n.tags || []).join(\" \")}`.toLowerCase().includes(q));\n  return list;\n}\n\nfunction noteCard(n) {\n  const c = n.compoundId ? COMPOUND_BY_ID.get(n.compoundId) : null;\n  const when = n.updatedAt || n.at;\n  return `\u003carticle class=\"card\" data-note=\"${esc(n.id)}\">\n    \u003cdiv class=\"row between\" style=\"align-items:flex-start;gap:8px;margin-bottom:5px\">\n      \u003ch3 style=\"font-size:14.5px;line-height:1.3\">${esc(n.title || \"Untitled\")}\u003c/h3>\n      \u003cdiv class=\"row\" style=\"gap:2px;flex:none\">\n        \u003cbutton class=\"icon-btn\" data-edit=\"${esc(n.id)}\" aria-label=\"Edit note\" style=\"width:32px;height:32px\">${icon(\"edit\", 15)}\u003c/button>\n        \u003cbutton class=\"icon-btn\" data-del=\"${esc(n.id)}\" aria-label=\"Delete note\" style=\"width:32px;height:32px\">${icon(\"trash\", 15)}\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    ${n.body ? `\u003cp class=\"small muted\" style=\"line-height:1.55;white-space:pre-wrap;max-height:9.5em;overflow:hidden\">${esc(n.body)}\u003c/p>` : \"\"}\n    \u003cdiv class=\"row wrap\" style=\"gap:5px;margin-top:9px\">\n      ${c ? `\u003ca class=\"chip chip-btn\" href=\"#/compounds/${esc(c.id)}\">\u003cspan class=\"dot\" style=\"background:${classColor(c.cls)}\">\u003c/span>${esc(c.name)}\u003c/a>` : \"\"}\n      ${(n.tags || []).map((t) => `\u003cbutton class=\"chip chip-btn\" data-tagjump=\"${esc(t)}\">#${esc(t)}\u003c/button>`).join(\"\")}\n      ${when ? `\u003cspan class=\"tag\" style=\"margin-left:auto\">${esc(fmt.relTime(when))}\u003c/span>` : \"\"}\n    \u003c/div>\n  \u003c/article>`;\n}\n\nfunction listHtml() {\n  const list = filtered();\n  if (!list.length) {\n    const empty = notes().length\n      ? emptyState(\"search\", \"No notes match\", \"Try a different search or clear the tag filter.\", `\u003cbutton class=\"btn ghost sm\" data-act=\"clear-filter\">${icon(\"refresh\", 14)} Clear filters\u003c/button>`)\n      : emptyState(\"edit\", \"No notes yet\", \"Write down the mechanism you keep forgetting, a question for your doctor, or a paper you want to re-read.\", `\u003cbutton class=\"btn soft sm\" data-act=\"new\">${icon(\"plus\", 14)} New note\u003c/button>`);\n    return `\u003cdiv class=\"card\">${empty}\u003c/div>`;\n  }\n  return `\u003cdiv class=\"grid grid-2\" style=\"gap:10px\">${list.map(noteCard).join(\"\")}\u003c/div>`;\n}\n\nfunction sheetHtml(note) {\n  const n = note || { id: \"\", title: \"\", body: \"\", tags: [], compoundId: \"\" };\n  return `\u003cdiv class=\"sheet-host\" id=\"note-sheet\">\n    \u003cdiv class=\"sheet-scrim\" data-close=\"1\">\u003c/div>\n    \u003cdiv class=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Note editor\">\n      \u003cdiv class=\"sheet-head\">\n        \u003ch3>${n.id ? \"Edit note\" : \"New note\"}\u003c/h3>\n        \u003cspan class=\"spacer\">\u003c/span>\n        \u003cbutton class=\"icon-btn\" data-close=\"1\" aria-label=\"Close\">${icon(\"x\", 18)}\u003c/button>\n      \u003c/div>\n      \u003cform id=\"note-form\" class=\"stack\" style=\"gap:12px\">\n        \u003cinput type=\"hidden\" name=\"id\" value=\"${esc(n.id)}\">\n        \u003clabel class=\"field\">Title\n          \u003cinput class=\"input\" name=\"title\" value=\"${esc(n.title)}\" placeholder=\"e.g. Why SSRIs take weeks\" required maxlength=\"120\">\n        \u003c/label>\n        \u003clabel class=\"field\">Note\n          \u003ctextarea class=\"textarea\" name=\"body\" placeholder=\"Write it in your own words — that is the part that sticks.\">${esc(n.body)}\u003c/textarea>\n        \u003c/label>\n        \u003clabel class=\"field\">Attach to compound (optional)\n          \u003cinput class=\"input\" name=\"compound\" list=\"note-compounds\" value=\"${esc(n.compoundId ? COMPOUND_BY_ID.get(n.compoundId)?.name || \"\" : \"\")}\" placeholder=\"Start typing a name…\">\n        \u003c/label>\n        \u003cdatalist id=\"note-compounds\">\n          ${searchCompounds(\"\").slice(0, 80).map((c) => `\u003coption value=\"${esc(c.name)}\">\u003c/option>`).join(\"\")}\n        \u003c/datalist>\n        \u003clabel class=\"field\">Tags (comma separated)\n          \u003cinput class=\"input\" name=\"tags\" value=\"${esc((n.tags || []).join(\", \"))}\" placeholder=\"mechanism, question, taper\">\n        \u003c/label>\n        \u003cdiv class=\"row\" style=\"gap:8px;margin-top:2px\">\n          \u003cbutton class=\"btn ghost\" type=\"button\" data-close=\"1\">Cancel\u003c/button>\n          \u003cbutton class=\"btn primary\" type=\"submit\" style=\"flex:1\">${icon(\"check\", 15)} Save note\u003c/button>\n        \u003c/div>\n      \u003c/form>\n    \u003c/div>\n  \u003c/div>`;\n}\n\nfunction openSheet(note, rerender) {\n  document.querySelectorAll(\"#note-sheet\").forEach((el) => el.remove());\n  document.body.insertAdjacentHTML(\"beforeend\", sheetHtml(note));\n  const host = document.querySelector(\"#note-sheet\");\n  const form = host.querySelector(\"#note-form\");\n  const opener = document.activeElement;\n  document.documentElement.classList.add(\"layer-open\");\n  const close = () => {\n    host.remove();\n    document.documentElement.classList.remove(\"layer-open\");\n    if (opener && document.contains(opener)) {\n      try {\n        opener.focus({ preventScroll: true });\n      } catch (err) {\n        /* ignore */\n      }\n    }\n  };\n  host.querySelectorAll(\"[data-close]\").forEach((b) => b.addEventListener(\"click\", (ev) => {\n    ev.preventDefault();\n    if (ev.target.closest(\"button[type=\\\"submit\\\"]\")) return;\n    close();\n  }));\n  form.querySelector('[name=\"title\"]').focus();\n\n  form.addEventListener(\"submit\", (ev) => {\n    ev.preventDefault();\n    const fd = new FormData(form);\n    const title = String(fd.get(\"title\") || \"\").trim();\n    if (!title) return;\n    const body = String(fd.get(\"body\") || \"\").trim();\n    const tags = String(fd.get(\"tags\") || \"\")\n      .split(\",\")\n      .map((t) => t.trim().toLowerCase().replace(/^#/, \"\"))\n      .filter(Boolean);\n    const comp = resolveCompound(String(fd.get(\"compound\") || \"\").trim());\n    const id = String(fd.get(\"id\") || \"\");\n\n    store.update((s) => {\n      if (!s.notes) s.notes = [];\n      if (id) {\n        const ex = s.notes.find((x) => x.id === id);\n        if (ex) {\n          ex.title = title;\n          ex.body = body;\n          ex.tags = tags;\n          ex.compoundId = comp ? comp.id : \"\";\n          ex.updatedAt = new Date().toISOString();\n        }\n      } else {\n        s.notes.unshift({\n          id: uid(\"n\"),\n          title,\n          body,\n          tags,\n          compoundId: comp ? comp.id : \"\",\n          at: new Date().toISOString(),\n          updatedAt: new Date().toISOString(),\n        });\n      }\n    });\n    host.remove();\n    document.documentElement.classList.remove(\"layer-open\");\n    toast(id ? \"Note updated\" : \"Note saved\", \"success\");\n    rerender();\n  });\n}\n\nexport const notesView = {\n  render() {\n    const total = notes().length;\n    const tags = allTags();\n    // A filter can outlive the note that carried the tag.\n    if (state.tag && !tags.includes(state.tag)) state.tag = \"\";\n    return `\n    ${pageHead(\n      \"Notebook\",\n      \"Private notes tied to compounds. Stored on this device only — nothing leaves your browser.\",\n      `\u003cbutton class=\"btn primary sm\" data-act=\"new\">${icon(\"plus\", 15)} New note\u003c/button>`\n    )}\n\n    \u003cdiv class=\"row wrap\" style=\"gap:8px;margin-bottom:12px\">\n      \u003cdiv class=\"search-input\" style=\"flex:1;min-width:200px\">\n        ${icon(\"search\", 16)}\n        \u003cinput class=\"input\" id=\"note-q\" type=\"search\" placeholder=\"Search notes…\" value=\"${esc(state.q)}\">\n      \u003c/div>\n      \u003cspan class=\"tiny dim\">${total} note${total === 1 ? \"\" : \"s\"}\u003c/span>\n    \u003c/div>\n\n    ${\n      tags.length\n        ? `\u003cdiv class=\"row wrap\" style=\"gap:5px;margin-bottom:14px\" id=\"note-tags\">\n            \u003cbutton class=\"chip chip-btn ${!state.tag ? \"on\" : \"\"}\" data-tag=\"\">All\u003c/button>\n            ${tags.map((t) => `\u003cbutton class=\"chip chip-btn ${state.tag === t ? \"on\" : \"\"}\" data-tag=\"${esc(t)}\">#${esc(t)}\u003c/button>`).join(\"\")}\n          \u003c/div>`\n        : \"\"\n    }\n\n    \u003cdiv id=\"note-list\">${listHtml()}\u003c/div>\n\n    ${total ? `\u003cdiv style=\"margin-top:22px\">${callout(\"info\", \"Export your notes\", \"Settings → Data → Export writes the whole state, notes included, to a JSON file you can keep.\")}\u003c/div>` : \"\"}`;\n  },\n\n  mount(root, ctx) {\n    const list = root.querySelector(\"#note-list\");\n    const q = root.querySelector(\"#note-q\");\n\n    const repaint = () => {\n      list.innerHTML = listHtml();\n      const tagBar = root.querySelector(\"#note-tags\");\n      if (tagBar) {\n        tagBar.innerHTML = `\u003cbutton class=\"chip chip-btn ${!state.tag ? \"on\" : \"\"}\" data-tag=\"\">All\u003c/button>${allTags()\n          .map((t) => `\u003cbutton class=\"chip chip-btn ${state.tag === t ? \"on\" : \"\"}\" data-tag=\"${esc(t)}\">#${esc(t)}\u003c/button>`)\n          .join(\"\")}`;\n      }\n    };\n\n    q?.addEventListener(\"input\", () => {\n      state.q = q.value;\n      repaint();\n    });\n\n    root.addEventListener(\"click\", (ev) => {\n      if (ev.target.closest('[data-act=\"new\"]')) {\n        openSheet(null, repaint);\n        return;\n      }\n      if (ev.target.closest('[data-act=\"clear-filter\"]')) {\n        state.q = \"\";\n        state.tag = \"\";\n        if (q) q.value = \"\";\n        repaint();\n        return;\n      }\n      const tag = ev.target.closest(\"[data-tag]\");\n      if (tag) {\n        state.tag = tag.dataset.tag;\n        repaint();\n        return;\n      }\n      const jump = ev.target.closest(\"[data-tagjump]\");\n      if (jump) {\n        state.tag = jump.dataset.tagjump;\n        repaint();\n        return;\n      }\n      const edit = ev.target.closest(\"[data-edit]\");\n      if (edit) {\n        const n = (store.data.notes || []).find((x) => x.id === edit.dataset.edit);\n        if (n) openSheet(n, repaint);\n        return;\n      }\n      const del = ev.target.closest(\"[data-del]\");\n      if (del) {\n        const n = (store.data.notes || []).find((x) => x.id === del.dataset.del);\n        if (!n) return;\n        if (!confirm(`Delete “${n.title || \"Untitled\"}”?`)) return;\n        store.update((s) => {\n          s.notes = s.notes.filter((x) => x.id !== n.id);\n        });\n        toast(\"Note deleted\", \"info\");\n        repaint();\n        ctx.refreshCounts?.();\n      }\n    });\n  },\n};","/app/views/settings.js":"/* Settings: appearance, study preferences, data ownership, about */\n\nimport { esc, icon, store, toast, fmt, clamp, copyText, levelFor } from \"__ND__/app/core.js\";\nimport { COMPOUNDS, getCompound, COMPOUND_BY_ID } from \"__ND__/app/data/compounds.js\";\nimport { SYSTEMS } from \"__ND__/app/data/neuro.js\";\nimport { TOTAL_LESSONS, FLASHCARDS } from \"__ND__/app/data/learn.js\";\nimport { PAIR_RULES, FLAG_RULES } from \"__ND__/app/data/interactions.js\";\nimport { deckStats } from \"__ND__/app/srs.js\";\nimport { pageHead, callout } from \"__ND__/app/views/ui.js\";\n\nconst ACCENTS = [\n  [\"violet\", \"Violet\", \"#8b7bff\"],\n  [\"amber\", \"Amber\", \"#f2b23e\"],\n  [\"teal\", \"Teal\", \"#2dd4bf\"],\n  [\"rose\", \"Rose\", \"#fb7185\"],\n  [\"green\", \"Green\", \"#4ade80\"],\n  [\"blue\", \"Blue\", \"#60a5fa\"],\n];\n\nconst DENSITIES = [\n  [\"comfortable\", \"Comfortable\"],\n  [\"compact\", \"Compact\"],\n];\n\nexport function applyAppearance() {\n  const s = store.data.settings || {};\n  const rootEl = document.documentElement;\n  rootEl.setAttribute(\"data-accent\", s.accent || \"violet\");\n  rootEl.setAttribute(\"data-density\", s.density || \"comfortable\");\n  rootEl.setAttribute(\"data-motion\", s.motion === false ? \"off\" : \"on\");\n  const scale = clamp(Number(s.scale) || 100, 85, 120);\n  rootEl.style.setProperty(\"--scale\", scale / 100);\n}\n\nfunction settingRow({ title, sub, control }) {\n  return `\u003cdiv class=\"list-row\" style=\"align-items:flex-start;gap:12px;padding:13px 0\">\n    \u003cdiv style=\"flex:1;min-width:0\">\n      \u003cdiv class=\"title\" style=\"font-size:13.5px\">${title}\u003c/div>\n      ${sub ? `\u003cdiv class=\"sub\" style=\"margin-top:2px;line-height:1.5\">${sub}\u003c/div>` : \"\"}\n    \u003c/div>\n    \u003cdiv style=\"flex:none;display:flex;align-items:center\">${control}\u003c/div>\n  \u003c/div>`;\n}\n\nfunction stackHtml() {\n  const stack = (store.data.stack || []).map((id) => getCompound(id)).filter(Boolean);\n  if (!stack.length) return `\u003cp class=\"tiny dim\">Your stack is empty. Add compounds from any entry page to track what you actually take.\u003c/p>`;\n  return `\u003cdiv class=\"row wrap\" style=\"gap:5px\">\n    ${stack\n      .map(\n        (c) => `\u003cspan class=\"chip\">\u003cspan class=\"dot\" style=\"background:var(--accent)\">\u003c/span>${esc(c.name)}\n          \u003cbutton class=\"x\" data-unstack=\"${esc(c.id)}\" aria-label=\"Remove ${esc(c.name)}\" style=\"margin-left:3px;opacity:.6\">${icon(\"x\", 11)}\u003c/button>\n        \u003c/span>`\n      )\n      .join(\"\")}\n    \u003ca class=\"btn ghost xs\" href=\"#/lab/interactions\">${icon(\"shield\", 12)} Check interactions\u003c/a>\n  \u003c/div>`;\n}\n\nexport const settings = {\n  render() {\n    const s = store.data;\n    const st = s.settings || {};\n    const lvl = levelFor(s.profile.xp || 0);\n    const cards = deckStats(FLASHCARDS);\n    const lessonsDone = Object.values(s.lessons || {}).filter((l) => l.completed).length;\n    const saved = (s.saved || []).length;\n    const stack = (s.stack || []).length;\n\n    return `\n    ${pageHead(\"Settings\", \"Everything is stored locally in this browser. No account, no sync, no tracking.\", \"\")}\n\n    \u003cdiv class=\"split\">\n      \u003cdiv class=\"col\" style=\"gap:16px\">\n\n        \u003csection class=\"card\">\n          \u003cdiv class=\"card-head\">\u003ch3>Appearance\u003c/h3>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"tag\">applies instantly\u003c/span>\u003c/div>\n          \u003cdiv class=\"block\">\n            \u003cdiv class=\"eyebrow\" style=\"margin-bottom:7px\">Accent\u003c/div>\n            \u003cdiv class=\"row wrap\" style=\"gap:7px\" id=\"set-accent\">\n              ${ACCENTS.map(\n                ([key, label, hex]) => `\u003cbutton class=\"chip chip-btn ${st.accent === key ? \"on\" : \"\"}\" data-accent=\"${key}\">\n                  \u003cspan class=\"dot\" style=\"background:${hex}\">\u003c/span>${label}\n                \u003c/button>`\n              ).join(\"\")}\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"block\">\n            \u003cdiv class=\"eyebrow\" style=\"margin-bottom:7px\">Density\u003c/div>\n            \u003cdiv class=\"btn-group\" id=\"set-density\">\n              ${DENSITIES.map(([key, label]) => `\u003cbutton class=\"chip chip-btn ${st.density === key ? \"on\" : \"\"}\" data-density=\"${key}\">${label}\u003c/button>`).join(\"\")}\n            \u003c/div>\n          \u003c/div>\n          ${settingRow({\n            title: \"Motion\",\n            sub: \"Pulse animations on the brain map and hover transitions. Turn off to save battery.\",\n            control: `\u003clabel class=\"switch\">\u003cinput type=\"checkbox\" id=\"set-motion\" ${st.motion !== false ? \"checked\" : \"\"}>\u003cspan>\u003c/span>\u003c/label>`,\n          })}\n          ${settingRow({\n            title: \"Text size\",\n            sub: \"Scales every view. Useful at 110–115% on small phones.\",\n            control: `\u003cdiv class=\"row\" style=\"gap:8px\">\u003cinput class=\"range\" type=\"range\" min=\"85\" max=\"120\" step=\"5\" value=\"${clamp(Number(st.scale) || 100, 85, 120)}\" id=\"set-scale\" style=\"width:110px\">\u003cspan class=\"tiny mono\" id=\"set-scale-val\" style=\"width:38px;text-align:right\">${clamp(Number(st.scale) || 100, 85, 120)}%\u003c/span>\u003c/div>`,\n          })}\n        \u003c/section>\n\n        \u003csection class=\"card\">\n          \u003cdiv class=\"card-head\">\u003ch3>Study\u003c/h3>\u003c/div>\n          ${settingRow({\n            title: \"Evidence filter\",\n            sub: \"Hide compounds whose evidence grade is below the threshold you pick. Applies to the compound list.\",\n            control: `\u003cselect class=\"select\" id=\"set-evidence\" style=\"width:auto\">\n              ${[\n                [\"all\", \"Show all\"],\n                [\"anecdotal\", \"Anecdotal and up\"],\n                [\"preclinical\", \"Preclinical and up\"],\n                [\"limited\", \"Limited and up\"],\n                [\"moderate\", \"Moderate and up\"],\n                [\"strong\", \"Strong only\"],\n              ]\n                .map(([v, l]) => `\u003coption value=\"${v}\" ${st.evidence === v ? \"selected\" : \"\"}>${l}\u003c/option>`)\n                .join(\"\")}\n            \u003c/select>`,\n          })}\n          ${settingRow({\n            title: \"Caffeine half-life\",\n            sub: \"CYP1A2 activity varies roughly 2–9 h between people. Changes the default caffeine curve in the lab.\",\n            control: `\u003cdiv class=\"row\" style=\"gap:8px\">\u003cinput class=\"range\" type=\"range\" min=\"2\" max=\"9\" step=\"0.5\" value=\"${Number(st.caffeineHalfLife) || 5}\" id=\"set-caf\" style=\"width:110px\">\u003cspan class=\"tiny mono\" id=\"set-caf-val\" style=\"width:34px;text-align:right\">${Number(st.caffeineHalfLife) || 5}h\u003c/span>\u003c/div>`,\n          })}\n        \u003c/section>\n\n        \u003csection class=\"card\">\n          \u003cdiv class=\"card-head\">\u003ch3>Your stack\u003c/h3>\u003cspan class=\"spacer\">\u003c/span>\u003ca class=\"tiny\" href=\"#/compounds\">Add compounds\u003c/a>\u003c/div>\n          \u003cdiv class=\"block\">${stackHtml()}\u003c/div>\n        \u003c/section>\n\n        \u003csection class=\"card\">\n          \u003cdiv class=\"card-head\">\u003ch3>Data\u003c/h3>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"tag\">local only\u003c/span>\u003c/div>\n          \u003cdiv class=\"block stack\" style=\"gap:10px\">\n            \u003cdiv class=\"row wrap\" style=\"gap:8px\">\n              \u003cbutton class=\"btn soft sm\" id=\"set-export\">${icon(\"download\", 14)} Export backup\u003c/button>\n              \u003cbutton class=\"btn ghost sm\" id=\"set-import\">${icon(\"upload\", 14)} Import\u003c/button>\n              \u003cbutton class=\"btn ghost sm\" id=\"set-copy\">${icon(\"copy\", 14)} Copy JSON\u003c/button>\n            \u003c/div>\n            \u003cinput type=\"file\" id=\"set-file\" accept=\"application/json,.json\" hidden>\n            \u003cdiv>\n              \u003cbutton class=\"btn danger sm\" id=\"set-reset\">${icon(\"trash\", 14)} Reset everything\u003c/button>\n              \u003cp class=\"tiny dim\" style=\"margin-top:6px;line-height:1.5\">Deletes XP, streak, lesson progress, flashcards schedule, stack, notes and saved items. Cannot be undone.\u003c/p>\n            \u003c/div>\n          \u003c/div>\n        \u003c/section>\n\n        \u003csection class=\"card\">\n          \u003cdiv class=\"card-head\">\u003ch3>About\u003c/h3>\u003c/div>\n          \u003cdiv class=\"block stack\" style=\"gap:8px\">\n            \u003cp class=\"small muted\" style=\"line-height:1.6\">NeuroDifference is a personal study tool: an evidence-graded compound encyclopedia, a transmitter atlas, a pharmacokinetic sandbox and a spaced-repetition course set. It is not a medical device.\u003c/p>\n            ${callout(\"danger\", \"Not medical advice\", \"Nothing here is a recommendation to take, combine, taper or stop any substance. Dosages are reference figures from the literature, not prescriptions. Talk to a clinician who knows your history.\")}\n            \u003cdiv class=\"row wrap\" style=\"gap:5px;margin-top:2px\">\n              \u003cspan class=\"chip\">v2.1.0\u003c/span>\n              \u003cspan class=\"chip\">${COMPOUNDS.length} compounds\u003c/span>\n              \u003cspan class=\"chip\">${SYSTEMS.length} systems\u003c/span>\n              \u003cspan class=\"chip\">${TOTAL_LESSONS} lessons\u003c/span>\n              \u003cspan class=\"chip\">${FLASHCARDS.length} cards\u003c/span>\n              \u003cspan class=\"chip\">${PAIR_RULES.length + FLAG_RULES.length} interaction rules\u003c/span>\n            \u003c/div>\n          \u003c/div>\n        \u003c/section>\n      \u003c/div>\n\n      \u003caside class=\"col sticky-side\" style=\"gap:12px\">\n        \u003cdiv class=\"card\">\n          \u003cdiv class=\"eyebrow\" style=\"margin-bottom:8px\">Your progress\u003c/div>\n          \u003cdiv class=\"row between\" style=\"margin-bottom:6px\">\n            \u003cspan style=\"font-size:13px;font-weight:600\">Level ${lvl.level}\u003c/span>\n            \u003cspan class=\"tiny mono dim\">${s.profile.xp || 0} XP\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"meter\" style=\"margin-bottom:10px\">\u003ci style=\"width:${Math.round((lvl.into / (lvl.need || 1)) * 100)}%\">\u003c/i>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan>Streak\u003c/span>\u003cspan>${s.profile.streak || 0} day${(s.profile.streak || 0) === 1 ? \"\" : \"s\"}\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan>Lessons done\u003c/span>\u003cspan>${lessonsDone} / ${TOTAL_LESSONS}\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan>Quiz accuracy\u003c/span>\u003cspan>${s.profile.quizzes ? Math.round((s.profile.correct / s.profile.quizzes) * 100) : 0}%\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan>Cards due\u003c/span>\u003cspan>${cards.due}\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan>Saved\u003c/span>\u003cspan>${saved}\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan>In stack\u003c/span>\u003cspan>${stack}\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan>Notes\u003c/span>\u003cspan>${(s.notes || []).length}\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"card tight\">\n          \u003cdiv class=\"eyebrow\" style=\"margin-bottom:7px\">Shortcuts\u003c/div>\n          \u003cdiv class=\"stack\" style=\"gap:6px\">\n            ${[\n              [\"Search\", \"Ctrl / ⌘ + K\"],\n              [\"Home\", \"G then H\"],\n              [\"Compounds\", \"G then C\"],\n              [\"Brain map\", \"G then B\"],\n              [\"Lab\", \"G then L\"],\n              [\"Ask\", \"G then A\"],\n            ]\n              .map(\n                ([label, key]) => `\u003cdiv class=\"row between\">\u003cspan class=\"tiny muted\">${label}\u003c/span>\u003ckbd class=\"tiny mono\" style=\"padding:1px 5px;border:1px solid var(--line);border-radius:5px;background:var(--bg-2)\">${key}\u003c/kbd>\u003c/div>`\n              )\n              .join(\"\")}\n          \u003c/div>\n        \u003c/div>\n      \u003c/aside>\n    \u003c/div>`;\n  },\n\n  mount(root, ctx) {\n    const rerender = () => ctx.rerender();\n    const bump = () => {\n      applyAppearance();\n      window.dispatchEvent(new CustomEvent(\"nd:appearance\"));\n    };\n\n    root.querySelector(\"#set-accent\")?.addEventListener(\"click\", (ev) => {\n      const b = ev.target.closest(\"[data-accent]\");\n      if (!b) return;\n      store.set(\"settings.accent\", b.dataset.accent);\n      bump();\n      root.querySelectorAll(\"#set-accent [data-accent]\").forEach((el) => el.classList.toggle(\"on\", el === b));\n    });\n\n    root.querySelector(\"#set-density\")?.addEventListener(\"click\", (ev) => {\n      const b = ev.target.closest(\"[data-density]\");\n      if (!b) return;\n      store.set(\"settings.density\", b.dataset.density);\n      bump();\n      root.querySelectorAll(\"#set-density [data-density]\").forEach((el) => el.classList.toggle(\"on\", el === b));\n    });\n\n    root.querySelector(\"#set-motion\")?.addEventListener(\"change\", (ev) => {\n      store.set(\"settings.motion\", ev.target.checked);\n      bump();\n    });\n\n    const scale = root.querySelector(\"#set-scale\");\n    scale?.addEventListener(\"input\", () => {\n      const v = clamp(Number(scale.value) || 100, 85, 120);\n      const out = root.querySelector(\"#set-scale-val\");\n      if (out) out.textContent = `${v}%`;\n      store.set(\"settings.scale\", v);\n      bump();\n    });\n\n    root.querySelector(\"#set-evidence\")?.addEventListener(\"change\", (ev) => {\n      store.set(\"settings.evidence\", ev.target.value);\n      toast(\"Evidence filter updated\", \"info\");\n    });\n\n    const caf = root.querySelector(\"#set-caf\");\n    caf?.addEventListener(\"input\", () => {\n      const v = Number(caf.value) || 5;\n      const out = root.querySelector(\"#set-caf-val\");\n      if (out) out.textContent = `${v}h`;\n      store.set(\"settings.caffeineHalfLife\", v);\n    });\n\n    root.querySelector(\"#set-export\")?.addEventListener(\"click\", () => {\n      const blob = new Blob([store.export()], { type: \"application/json\" });\n      const url = URL.createObjectURL(blob);\n      const a = document.createElement(\"a\");\n      a.href = url;\n      a.download = `neurodifference-${new Date().toISOString().slice(0, 10)}.json`;\n      document.body.appendChild(a);\n      a.click();\n      a.remove();\n      setTimeout(() => URL.revokeObjectURL(url), 2000);\n      toast(\"Backup downloaded\", \"success\");\n    });\n\n    root.querySelector(\"#set-copy\")?.addEventListener(\"click\", () => copyText(store.export(), \"State JSON copied\"));\n\n    const file = root.querySelector(\"#set-file\");\n    root.querySelector(\"#set-import\")?.addEventListener(\"click\", () => file?.click());\n    file?.addEventListener(\"change\", async () => {\n      const f = file.files?.[0];\n      if (!f) return;\n      try {\n        const text = await f.text();\n        if (!confirm(\"Replace all current data with this backup?\")) return;\n        store.import(text);\n        applyAppearance();\n        window.dispatchEvent(new CustomEvent(\"nd:appearance\"));\n        toast(\"Backup restored\", \"success\");\n        rerender();\n      } catch (err) {\n        toast(`Import failed: ${err.message}`, \"danger\");\n      } finally {\n        // Always clear, or picking the same file again fires no change event.\n        file.value = \"\";\n      }\n    });\n\n    root.querySelector(\"#set-reset\")?.addEventListener(\"click\", () => {\n      if (!confirm(\"Delete all progress, notes, stack and preferences on this device?\")) return;\n      if (!confirm(\"Last check — this cannot be undone. Reset?\")) return;\n      store.reset();\n      applyAppearance();\n      window.dispatchEvent(new CustomEvent(\"nd:appearance\"));\n      toast(\"Everything reset\", \"info\");\n      location.hash = \"#/\";\n      rerender();\n    });\n\n    root.querySelectorAll(\"[data-unstack]\").forEach((b) =>\n      b.addEventListener(\"click\", () => {\n        const id = b.dataset.unstack;\n        store.update((s) => {\n          s.stack = (s.stack || []).filter((x) => x !== id);\n        });\n        const c = COMPOUND_BY_ID.get(id);\n        toast(`${c ? c.name : \"Item\"} removed from stack`, \"info\");\n        rerender();\n      })\n    );\n  },\n};","/app/main.js":"/* NeuroDifference — application shell, hash router, search, drawer.\n * Vanilla ES modules, no build step. Every view exports { render(ctx), mount(root, ctx) }.\n */\n\nimport { esc, icon, store, levelFor, debounce, toast, touchStreak } from \"__ND__/app/core.js\";\nimport { COMPOUNDS, COMPOUND_BY_ID } from \"__ND__/app/data/compounds.js\";\nimport { SYSTEMS, SYSTEM_BY_ID } from \"__ND__/app/data/neuro.js\";\nimport { COURSES, LESSONS_ALL, FLASHCARDS } from \"__ND__/app/data/learn.js\";\nimport { deckStats } from \"__ND__/app/srs.js\";\n\nimport * as homeView from \"__ND__/app/views/home.js\";\nimport * as compoundsView from \"__ND__/app/views/compounds.js\";\nimport * as neuroView from \"__ND__/app/views/neuro.js\";\nimport * as labView from \"__ND__/app/views/lab.js\";\nimport * as taperView from \"__ND__/app/views/taper.js\";\nimport * as compareView from \"__ND__/app/views/compare.js\";\nimport * as learnView from \"__ND__/app/views/learn.js\";\nimport * as evidenceView from \"__ND__/app/views/evidence.js\";\nimport * as askView from \"__ND__/app/views/ask.js\";\nimport * as notesView from \"__ND__/app/views/notes.js\";\nimport * as settingsView from \"__ND__/app/views/settings.js\";\n\n/* ------------------------------------------------------------------ */\n/* Navigation model                                                    */\n/* ------------------------------------------------------------------ */\n\nconst NAV = [\n  {\n    section: \"Study\",\n    items: [\n      { id: \"home\", label: \"Home\", href: \"#/\", icon: \"home\" },\n      { id: \"compounds\", label: \"Compounds\", href: \"#/compounds\", icon: \"pill\", count: () => COMPOUNDS.length },\n      { id: \"brain\", label: \"Brain map\", href: \"#/brain\", icon: \"brain\", count: () => SYSTEMS.length },\n      { id: \"learn\", label: \"Learn\", href: \"#/learn\", icon: \"book\" },\n      { id: \"cards\", label: \"Flashcards\", href: \"#/cards\", icon: \"layers\", count: () => deckStats(FLASHCARDS).due || \"\" },\n    ],\n  },\n  {\n    section: \"Tools\",\n    items: [\n      { id: \"lab\", label: \"Dose lab\", href: \"#/lab\", icon: \"flask\" },\n      { id: \"taper\", label: \"Taper planner\", href: \"#/lab/taper\", icon: \"scale\" },\n      { id: \"compare\", label: \"Compare\", href: \"#/compare\", icon: \"grid\" },\n      { id: \"interactions\", label: \"Interactions\", href: \"#/lab/interactions\", icon: \"shield\" },\n      { id: \"evidence\", label: \"Evidence\", href: \"#/evidence\", icon: \"file\" },\n      { id: \"ask\", label: \"Ask the index\", href: \"#/ask\", icon: \"sparkles\" },\n      { id: \"notes\", label: \"Notebook\", href: \"#/notes\", icon: \"edit\", count: () => (store.data.notes || []).length || \"\" },\n    ],\n  },\n  {\n    section: \"\",\n    items: [{ id: \"settings\", label: \"Settings\", href: \"#/settings\", icon: \"settings\" }],\n  },\n];\n\nconst MOBILE_NAV = [\n  { id: \"home\", label: \"Home\", href: \"#/\", icon: \"home\" },\n  { id: \"compounds\", label: \"Compounds\", href: \"#/compounds\", icon: \"pill\" },\n  { id: \"brain\", label: \"Brain\", href: \"#/brain\", icon: \"brain\" },\n  { id: \"learn\", label: \"Learn\", href: \"#/learn\", icon: \"book\" },\n  { id: \"more\", label: \"More\", icon: \"menu\", more: true },\n];\n\n/* ------------------------------------------------------------------ */\n/* Shell                                                               */\n/* ------------------------------------------------------------------ */\n\nconst BRAND = `\u003cspan class=\"brand-mark\">${icon(\"brain\", 17)}\u003c/span>\n  \u003cspan class=\"brand-text\">\u003cb>NeuroDifference\u003c/b>\u003cspan>evidence · compounds\u003c/span>\u003c/span>`;\n\nfunction sidebarHtml() {\n  const s = store.data;\n  const lvl = levelFor(s.profile.xp || 0);\n  return `\u003caside class=\"sidebar\" id=\"sidebar\">\n    \u003ca class=\"brand\" href=\"#/\">${BRAND}\u003c/a>\n    ${NAV.map(\n      (group) => `${group.section ? `\u003cdiv class=\"side-label\">${esc(group.section)}\u003c/div>` : `\u003cdiv class=\"side-label\">&nbsp;\u003c/div>`}\n        ${group.items\n          .map(\n            (it) => `\u003ca class=\"side-item\" href=\"${it.href}\" data-nav=\"${it.id}\">\n              ${icon(it.icon, 16)}\u003cspan>${esc(it.label)}\u003c/span>\n              ${it.count ? `\u003cspan class=\"pill-count\" data-count=\"${it.id}\">${it.count()}\u003c/span>` : \"\"}\n            \u003c/a>`\n          )\n          .join(\"\")}`\n    ).join(\"\")}\n    \u003cdiv class=\"side-foot\">\n      \u003ca class=\"side-xp\" href=\"#/settings\" style=\"text-decoration:none;color:inherit;display:block\">\n        \u003cdiv class=\"lv\">\u003cb>${lvl.level}\u003c/b>\u003cspan>level · ${s.profile.xp || 0} XP\u003c/span>\u003c/div>\n        \u003cdiv class=\"meter\">\u003ci style=\"width:${Math.round((lvl.into / (lvl.need || 1)) * 100)}%\">\u003c/i>\u003c/div>\n        \u003cdiv class=\"tiny dim\" style=\"margin-top:6px\">${s.profile.streak || 0}-day streak${s.profile.streak ? \" 🔥\" : \"\"}\u003c/div>\n      \u003c/a>\n    \u003c/div>\n  \u003c/aside>`;\n}\n\nfunction topbarHtml() {\n  return `\u003cheader class=\"topbar\">\n    \u003cbutton class=\"icon-btn menu-btn\" id=\"btn-menu\" aria-label=\"Open menu\">${icon(\"menu\", 20)}\u003c/button>\n    \u003ca class=\"brand\" href=\"#/\">${BRAND}\u003c/a>\n    \u003cdiv class=\"topbar-title\" id=\"topbar-title\">Home\u003c/div>\n    \u003cdiv class=\"topbar-actions\">\n      \u003cbutton class=\"icon-btn\" id=\"btn-search\" aria-label=\"Search\">\n        ${icon(\"search\", 18)}\n      \u003c/button>\n      \u003ca class=\"icon-btn only-desktop\" href=\"#/cards\" aria-label=\"Flashcards due\" style=\"position:relative\">\n        ${icon(\"layers\", 18)}\n        \u003cspan class=\"dot-badge\" id=\"nav-cards-dot\" data-due-dot>\u003c/span>\n      \u003c/a>\n      \u003ca class=\"icon-btn only-desktop\" href=\"#/settings\" aria-label=\"Settings\">${icon(\"settings\", 18)}\u003c/a>\n    \u003c/div>\n  \u003c/header>`;\n}\n\nfunction bottomNavHtml() {\n  return `\u003cnav class=\"bottom-nav\" id=\"bottom-nav\">\n    ${MOBILE_NAV.map((it) =>\n      it.more\n        ? `\u003cbutton class=\"nav-item\" id=\"btn-more\" style=\"background:none;border:0;font:inherit;cursor:pointer\">${icon(it.icon, 20)}\u003cspan>${esc(it.label)}\u003c/span>\u003c/button>`\n        : `\u003ca class=\"nav-item\" href=\"${it.href}\" data-nav=\"${it.id}\">${icon(it.icon, 20)}${it.id === \"learn\" ? `\u003cspan class=\"dot-badge\" data-due-dot aria-hidden=\"true\">\u003c/span>` : \"\"}\u003cspan>${esc(it.label)}\u003c/span>\u003c/a>`\n    ).join(\"\")}\n  \u003c/nav>`;\n}\n\nfunction mountShell(root) {\n  root.innerHTML = `\u003cdiv class=\"app\">\n      ${sidebarHtml()}\n      \u003cdiv class=\"main\">\n        ${topbarHtml()}\n        \u003cdiv class=\"view\" id=\"view\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    ${bottomNavHtml()}\n    \u003cdiv class=\"toast-host\" id=\"toast-host\">\u003c/div>`;\n\n  document.getElementById(\"btn-menu\")?.addEventListener(\"click\", openDrawer);\n  document.getElementById(\"btn-more\")?.addEventListener(\"click\", openDrawer);\n  document.getElementById(\"btn-search\")?.addEventListener(\"click\", openSearch);\n\n  const onScroll = debounce(() => {\n    document.documentElement.setAttribute(\"data-scrolled\", String(window.scrollY > 8));\n  }, 60);\n  window.addEventListener(\"scroll\", onScroll, { passive: true });\n}\n\n/* ------------------------------------------------------------------ */\n/* Drawer (mobile menu)                                                */\n/* ------------------------------------------------------------------ */\n\n/* ------------------------------------------------------------------ */\n/* Layers (drawer / search overlay) — one open at a time                */\n/* ------------------------------------------------------------------ */\n\nlet lastFocus = null;\n\nfunction lockScroll(on) {\n  document.documentElement.classList.toggle(\"layer-open\", !!on);\n}\n\n/**\n * Remove transient layers. Restores scroll + focus when nothing is left.\n * @param {boolean} restoreFocus\n */\nfunction closeLayers(restoreFocus = true) {\n  document.querySelectorAll(\".overlay, .drawer-host, .sheet-host\").forEach((el) => el.remove());\n  lockScroll(false);\n  if (restoreFocus && lastFocus && document.contains(lastFocus)) {\n    try {\n      lastFocus.focus({ preventScroll: true });\n    } catch (err) {\n      /* ignore */\n    }\n  }\n  lastFocus = null;\n}\n\nfunction openDrawer() {\n  if (document.querySelector(\".drawer-host\")) return;\n  closeLayers(false);\n  lastFocus = document.activeElement;\n  const host = document.createElement(\"div\");\n  host.className = \"drawer-host\";\n  host.innerHTML = `\u003cdiv class=\"drawer-scrim\" data-close>\u003c/div>\n    \u003cdiv class=\"drawer\">\n      \u003ca class=\"brand\" href=\"#/\" data-close>${BRAND}\u003c/a>\n      ${NAV.map(\n        (group) => `${group.section ? `\u003ch4>${esc(group.section)}\u003c/h4>` : `\u003ch4>App\u003c/h4>`}\n          ${group.items\n            .map(\n              (it) => `\u003ca class=\"d-item\" href=\"${it.href}\" data-nav=\"${it.id}\" data-close>\n                ${icon(it.icon, 16)}\u003cspan>${esc(it.label)}\u003c/span>\n                ${it.count ? `\u003cspan class=\"pill-count\" style=\"margin-left:auto\">${it.count()}\u003c/span>` : \"\"}\n              \u003c/a>`\n            )\n            .join(\"\")}`\n      ).join(\"\")}\n      \u003cdiv style=\"margin-top:auto;padding-top:14px\">\n        \u003cbutton class=\"btn ghost sm block\" data-search>${icon(\"search\", 14)} Search everything\u003c/button>\n      \u003c/div>\n    \u003c/div>`;\n  document.body.appendChild(host);\n  lockScroll(true);\n  const close = () => closeLayers();\n  host.addEventListener(\"click\", (ev) => {\n    if (ev.target.closest(\"[data-search]\")) {\n      close();\n      openSearch();\n      return;\n    }\n    if (ev.target.closest(\"[data-close]\") || ev.target.classList.contains(\"drawer-scrim\")) close();\n  });\n  const first = host.querySelector(\".d-item\");\n  if (first) setTimeout(() => first.focus({ preventScroll: true }), 30);\n}\n\n/* ------------------------------------------------------------------ */\n/* Search overlay                                                      */\n/* ------------------------------------------------------------------ */\n\nfunction buildIndex() {\n  const items = [];\n  for (const c of COMPOUNDS) {\n    items.push({\n      kind: \"Compound\",\n      title: c.name,\n      sub: `${c.cls} · ${c.evidence} evidence`,\n      href: `#/compounds/${c.id}`,\n      icon: \"pill\",\n      hay: `${c.name} ${(c.aliases || []).join(\" \")} ${c.cls} ${(c.tags || []).join(\" \")}`.toLowerCase(),\n    });\n  }\n  for (const s of SYSTEMS) {\n    items.push({\n      kind: \"System\",\n      title: s.name,\n      sub: s.tagline || \"transmitter system\",\n      href: `#/brain/${s.id}`,\n      icon: \"activity\",\n      hay: `${s.name} ${s.abbr} ${(s.matchFlags || []).join(\" \")}`.toLowerCase(),\n    });\n  }\n  for (const { course, lesson } of LESSONS_ALL) {\n    items.push({\n      kind: \"Lesson\",\n      title: lesson.title,\n      sub: course.title,\n      href: `#/learn/${course.id}/${lesson.id}`,\n      icon: \"book\",\n      hay: `${lesson.title} ${course.title}`.toLowerCase(),\n    });\n  }\n  for (const [label, href, ico, sub] of [\n    [\"Home\", \"#/\", \"home\", \"das
