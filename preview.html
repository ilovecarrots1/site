"use strict";
/* Compound database — merged index plus derived lookup helpers. */

const {  COMPOUNDS_A  } = require("./compounds-a.js");
const {  COMPOUNDS_B  } = require("./compounds-b.js");
const {  COMPOUNDS_C  } = require("./compounds-c.js");
const {  COMPOUNDS_D  } = require("./compounds-d.js");
const {  COMPOUNDS_E  } = require("./compounds-e.js");
const {  COMPOUNDS_F  } = require("./compounds-f.js");

const COMPOUNDS = Array.from(
  [...COMPOUNDS_A, ...COMPOUNDS_B, ...COMPOUNDS_C, ...COMPOUNDS_D, ...COMPOUNDS_E, ...COMPOUNDS_F].reduce((map, c) => {
    // Later entries win, so a newer, richer record replaces an older stub with the same id.
    if (c && c.id && c.name) map.set(String(c.id).toLowerCase(), c);
    return map;
  }, new Map()).values()
)
  .filter((c) => c && c.id && c.name)
  .map((c) => ({
    aliases: [],
    moa: [],
    targets: [],
    effects: { good: [], bad: [] },
    flags: [],
    warnings: [],
    tags: [],
    doses: [],
    ...c,
    pk: {
      halfLife: null,
      tmax: null,
      onset: null,
      duration: null,
      metabolism: "—",
      excretion: "—",
      ...(c.pk || {}),
    },
  }));

const COMPOUND_BY_ID = new Map(COMPOUNDS.map((c) => [c.id, c]));

const COMPOUND_COUNT = COMPOUNDS.length;

function getCompound(id) {
  return COMPOUND_BY_ID.get(String(id || "").toLowerCase()) || null;
}

/** All aliases + name + class + tags flattened for searching. */
function haystack(c) {
  return [c.name, c.aliases.join(" "), c.cls, c.subcls || "", c.summary, c.tags.join(" "), (c.targets || []).map((t) => t.name).join(" ")]
    .join(" ")
    .toLowerCase();
}

const CLASSES = Array.from(new Set(COMPOUNDS.map((c) => c.cls))).sort();

const EVIDENCE_ORDER = ["strong", "moderate", "limited", "preclinical", "anecdotal"];

const ALL_FLAGS = Array.from(new Set(COMPOUNDS.flatMap((c) => c.flags))).sort();

const ALL_TAGS = Array.from(new Set(COMPOUNDS.flatMap((c) => c.tags))).sort();

function compoundsByFlag(flag) {
  return COMPOUNDS.filter((c) => c.flags.includes(flag));
}

function compoundsByClass(cls) {
  return COMPOUNDS.filter((c) => c.cls === cls);
}

/** Free-text search scored by name/alias/class/tag relevance. */
function searchCompounds(query) {
  const q = String(query || "").trim().toLowerCase();
  if (!q) return COMPOUNDS;
  const scored = [];
  for (const c of COMPOUNDS) {
    let score = 0;
    const name = c.name.toLowerCase();
    if (name === q) score = 120;
    else if (name.startsWith(q)) score = 100;
    else if (name.includes(q)) score = 80;
    if (!score && c.aliases.some((a) => a.toLowerCase().includes(q))) score = 70;
    if (!score && c.cls.toLowerCase().includes(q)) score = 45;
    if (!score && c.subcls && c.subcls.toLowerCase().includes(q)) score = 40;
    if (!score && c.tags.some((t) => t.includes(q))) score = 35;
    if (!score && c.summary.toLowerCase().includes(q)) score = 20;
    if (!score && c.targets.some((t) => t.name.toLowerCase().includes(q))) score = 25;
    if (score) scored.push({ c, score });
  }
  return scored.sort((a, b) => b.score - a.score || a.c.name.localeCompare(b.c.name)).map((x) => x.c);
}

/** Resolve loose user input ("xanax", "vyvanse", "5htp") to a compound. */
function resolveCompound(input) {
  const q = String(input || "").trim().toLowerCase();
  if (!q) return null;
  if (COMPOUND_BY_ID.has(q)) return COMPOUND_BY_ID.get(q);
  const normalised = q.replace(/[^a-z0-9]/g, "");
  for (const c of COMPOUNDS) {
    const candidates = [c.id, c.name, ...c.aliases].map((x) => String(x).toLowerCase().replace(/[^a-z0-9]/g, ""));
    if (candidates.some((x) => x === normalised)) return c;
  }
  for (const c of COMPOUNDS) {
    const candidates = [c.id, c.name, ...c.aliases].map((x) => String(x).toLowerCase());
    if (candidates.some((x) => x.startsWith(q) || x.includes(q))) return c;
  }
  return null;
}

const COMPOUND_COUNT = COMPOUNDS.length;

function pubmedUrl(query) {
  return `https://pubmed.ncbi.nlm.nih.gov/?term=${encodeURIComponent(query || "")}`;
}
exports.getCompound = getCompound;
exports.haystack = haystack;
exports.compoundsByFlag = compoundsByFlag;
exports.compoundsByClass = compoundsByClass;
exports.searchCompounds = searchCompounds;
exports.resolveCompound = resolveCompound;
exports.pubmedUrl = pubmedUrl;
exports.COMPOUNDS = COMPOUNDS;
exports.COMPOUND_BY_ID = COMPOUND_BY_ID;
exports.COMPOUND_COUNT = COMPOUND_COUNT;
exports.CLASSES = CLASSES;
exports.EVIDENCE_ORDER = EVIDENCE_ORDER;
exports.ALL_FLAGS = ALL_FLAGS;
exports.ALL_TAGS = ALL_TAGS;
exports.COMPOUND_COUNT = COMPOUND_COUNT;

});

A chemical synapse has five working parts, and almost every psychoactive drug targets one of them:

1. **Synthesis** — enzymes build the transmitter
2. **Packaging** — VMAT or VAChT loads vesicles
3. **Release** — Ca²⁺ entry triggers vesicle fusion (SNARE proteins)
4. **Reception** — receptors convert chemistry into electrical or biochemical signal
5. **Clearance** — reuptake transporters and degrading enzymes end the signal

### Quantal release

Neurotransmitters are released in **quanta** (vesicles). A single vesicle contains roughly 1,000–10,000 molecules. Release probability varies by synapse and is tuned by neuromodulators — this is a major site of drug action (e.g. amphetamine increases vesicular release, adenosine A1 agonism decreases it).

### Receptors: two families

- **Ionotropic** — a channel opens in under a millisecond. Fast, brief, used for precise signalling (AMPA, NMDA, GABA-A, nAChR).
- **Metabotropic** — a G-protein cascade. Slower (100 ms to minutes), amplifies, and changes how the cell responds to future input (D2, 5-HT2A, GABA-B, mGluR).

> A drug's **affinity** (how tightly it binds, Kd) determines occupancy. Its **efficacy** (what happens after binding) determines effect. A full agonist, partial agonist, antagonist and inverse agonist can all occupy the same receptor with completely different outcomes — that is why "it hits the same receptor" tells you almost nothing on its own.

Serotonin is cleared by SERT and MAO-A. Dopamine by DAT and COMT/MAO-B. Acetylcholine by acetylcholinesterase in under a millisecond — the fastest clearance in the brain. Peptides have no reuptake at all; they diffuse and are degraded by peptidases, which is why peptide drugs have such short windows.`,

**Half-life (t½)** is the time for blood concentration to fall by half. For most drugs with first-order kinetics, five half-lives bring you to ~97% of steady state — and about five more take you back down.

| t½ | Time to steady state | Time to near-elimination |
| --- | --- | --- |
| 2 h (nicotine) | ~10 h | ~10 h |
| 5 h (caffeine) | ~25 h | ~25 h |
| 15 h (armodafinil) | ~3 days | ~3 days |
| 30 h (fluoxetine's parent) | ~6 days | ~6 days |
| 96 h (norfluoxetine) | ~20 days | ~20 days |

### Accumulation

If you dose more often than every ~4 half-lives, the drug accumulates. The **accumulation ratio** is roughly 1 / (1 − e^(−0.693 × τ / t½)), where τ is the dosing interval. Halve the interval and you roughly double accumulation.

This is why:
- Caffeine twice daily is fine; caffeine every 2 hours builds a permanent baseline
- Lithium (t½ ~24 h) needs days to reach steady state, and levels taken too early mislead
- Memantine (t½ ~70 h) creeps up on people — side effects appear in week two, not day one

### Bioavailability and first pass

Oral drugs pass the gut wall and liver before reaching systemic circulation. **First-pass metabolism** can destroy most of a dose: propranolol has ~25% bioavailability, morphine ~30%, and oral testosterone is almost completely inactivated. This is also why grapefruit juice matters — it inhibits intestinal CYP3A4 and can double exposure to some statins and calcium channel blockers.

> **Zero-order kinetics** is the exception that kills: alcohol, phenytoin and high-dose aspirin saturate their metabolising enzymes, so a fixed amount is cleared per hour regardless of concentration. Small dose increases then produce large, unpredictable level jumps.`,

        content: `## Occupancy is not effect

- **Kd**: the concentration where half the receptors are occupied. Lower Kd = higher affinity.
- **EC50**: the concentration producing half the maximal effect.
- **Emax**: the maximal effect achievable.

A drug can have very high affinity and zero efficacy — that is a competitive antagonist. It can have moderate affinity and *negative* efficacy — an inverse agonist, which reduces constitutive activity below baseline (many antipsychotics are inverse agonists at D2).

### Partial agonists

A partial agonist produces less than the full response even at 100% occupancy. **Buprenorphine** at µ-opioid receptors is the classic example: enough effect to stop withdrawal and cravings, not enough to cause profound respiratory depression. That ceiling is why it is safer than full agonists — and why it blocks other opioids from working.

### The therapeutic window

The gap between effective and toxic concentration. Narrow windows demand monitoring:

- **Lithium**: 0.6–0.8 mmol/L therapeutic; >1.5 mmol/L toxic; >2.5 mmol/L life-threatening
- **Digoxin**, **warfarin**, **phenytoin**, **clozapine** — all require levels or counts

### Receptor reserve and tolerance

If a tissue has spare receptors, a low-occupancy signal can still produce a full response. This is why some drugs keep working as receptor density falls — and why others lose effect quickly. Tolerance mechanisms differ:

- **Pharmacodynamic**: receptor downregulation (opioids, benzodiazepines)
- **Pharmacokinetic**: enzyme induction (carbamazepine induces its own metabolism)
- **Behavioural**: learned compensation (caffeine tolerance is largely this)

        content: `## Three words people confuse

- **Tolerance**: the same dose produces less effect (or more is needed for the same effect)
- **Physical dependence**: adaptation such that stopping produces withdrawal — happens to anyone on long-term benzodiazepines, opioids, SSRIs or steroids, with or without addiction
- **Addiction**: compulsive use despite harm, with craving and loss of control

You can be dependent without being addicted (SSRI discontinuation), and addicted without classic physical dependence (cocaine, gambling).

### Withdrawal patterns by system

| Drug class | Time to onset | Signature | Danger |
| --- | --- | --- | --- |
| Benzodiazepines (short) | 12–24 h | Anxiety, tremor, insomnia | **Seizures, delirium — can be fatal** |
| Alcohol | 6–24 h | Tremor, sweating, hallucinosis | **Seizures, DT — can be fatal** |
| Opioids | 8–24 h | Flu-like, cramps, diarrhoea | Very unpleasant, rarely fatal |
| SSRIs | 1–3 days | Dizziness, "brain zaps", irritability | Uncomfortable, not dangerous |
| Caffeine | 12–24 h | Headache, fatigue, irritability | Benign |
| Phenibut | 12–48 h | Anxiety, insomnia, psychosis | **Can be severe — taper** |

### Kindling and why repeated withdrawals matter

Each withdrawal episode lowers the seizure threshold and makes the next one worse. This is **kindling**, best documented with alcohol and benzodiazepines. It is the strongest argument against repeated stop-start cycles and for a single, slow, structured taper.

### Tapering principles

1. Stabilise on a long-acting equivalent first (e.g. diazepam for benzodiazepines)
2. Reduce by 5–10% of the current dose every 2–4 weeks

"use strict";
/* PubMed live research client.
 *
 * Everything here is fetched at request time from NCBI E-utilities.
 * Nothing is written to the local store or any database: results live in
 * memory for the duration of the session only, keyed by query, so that
 * navigating back and forth does not hammer the API.
 *
 * API key is a public read-only key for E-utilities (10 req/s instead of 3).
 */

const PUBMED_KEY = "5e323382245f1bc6f90af5cf42a73f803608";
const BASE = "https://eutils.ncbi.nlm.nih.gov/entrez/eutils";
const TOOL = "NeuroDifference";
const EMAIL = "neurodiff.app@gmail.com";

/* 30 minutes is plenty: a query string maps to a stable result set. */
const CACHE_TTL = 30 * 60 * 1000;
const CACHE_MAX = 24;

const cache = new Map();
let queue = Promise.resolve();
let lastCall = 0;

const LINK = {
  pmid: (id) => `https://pubmed.ncbi.nlm.nih.gov/${encodeURIComponent(id)}/`,
  search: (term) => `https://pubmed.ncbi.nlm.nih.gov/?term=${encodeURIComponent(term)}`,
  cite: (p) => `${p.authorsShort}${p.authorsShort ? ". " : ""}${p.title}. ${p.journal}${p.year ? ` ${p.year}` : ""}. PMID ${p.pmid}.`,
};

/* ------------------------------------------------------------------ */
/* Errors                                                              */
/* ------------------------------------------------------------------ */

class PubmedError extends Error {
  constructor(message, kind, detail) {
    super(message);
    this.name = "PubmedError";
    this.kind = kind; // "network" | "http" | "empty" | "parse" | "aborted"
    this.detail = detail;
  }
}

/* ------------------------------------------------------------------ */
/* Rate-limited fetch                                                  */
/* ------------------------------------------------------------------ */

function sleep(ms) {
  return new Promise((r) => setTimeout(r, ms));
}

/** Serialise requests with a small gap so we never trip NCBI's limiter. */
function schedule(fn) {
  const run = queue.then(async () => {
    const gap = Date.now() - lastCall;
    if (gap < 340) await sleep(340 - gap);
    lastCall = Date.now();
    return fn();
  });
  queue = run.catch(() => {});
  return run;
}

function qs(obj) {
  return Object.entries(obj)
    .filter(([, v]) => v !== undefined && v !== null && v !== "")
    .map(([k, v]) => `${k}=${encodeURIComponent(v)}`)
    .join("&");
}

async function get(path, params, { signal } = {}) {
  const url = `${BASE}/${path}?${qs({ ...params, tool: TOOL, email: EMAIL, api_key: PUBMED_KEY })}`;
  let res;
  try {
    res = await fetch(url, { signal, mode: "cors", credentials: "omit" });
  } catch (err) {
    if (err && err.name === "AbortError") throw new PubmedError("Request cancelled", "aborted");
    throw new PubmedError("Could not reach NCBI — the network blocked the request", "network", String(err && err.message));
  }
  if (!res.ok) throw new PubmedError(`NCBI replied ${res.status}`, "http", res.status);
  return res;
}

/* ------------------------------------------------------------------ */
/* Query building                                                      */
/* ------------------------------------------------------------------ */

/** Map our UI filters onto real PubMed field tags. */
function buildTerm(term, { scope = "all", years = 0, type = "any" } = {}) {
  const parts = [String(term || "").trim() || "neuropharmacology"];
  if (scope === "title") parts[0] = `${parts[0]}[Title]`;
  if (years > 0) parts.push(`("last ${years} years"[dp])`);
  if (type === "review") parts.push("(review[pt] OR systematic review[pt] OR meta-analysis[pt])");
  if (type === "rct") parts.push("(randomized controlled trial[pt] OR controlled clinical trial[pt])");
  if (type === "human") parts.push("humans[mh]");
  return parts.join(" AND ");
}

/* ------------------------------------------------------------------ */
/* XML → plain objects                                                 */
/* ------------------------------------------------------------------ */

function txt(node, tag) {
  const el = node ? node.querySelector(tag) : null;
  return el ? el.textContent.replace(/\s+/g, " ").trim() : "";
}

function parseArticles(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, "text/xml");
  const err = doc.querySelector("parsererror");
  if (err) throw new PubmedError("Could not parse the NCBI response", "parse");
  const nodes = Array.from(doc.querySelectorAll("PubmedArticle"));
  return nodes.map((art) => {
    const cit = art.querySelector("MedlineCitation");
    const article = art.querySelector("article") || art.querySelector("Article");
    const pmid = txt(cit, "PMID");
    const title = (txt(article, "ArticleTitle") || "Untitled record").replace(/\.$/, "");

    const abstractParts = Array.from(art.querySelectorAll("AbstractText")).map((node) => {
      const label = node.getAttribute("Label");
      const body = node.textContent.replace(/\s+/g, " ").trim();
      return label ? `${label}: ${body}` : body;
    });
    const abstract = abstractParts.join(" ").trim();

    const journal =
      txt(art, "Journal > Title") ||
      txt(art, "Journal > ISOAbbreviation") ||
      txt(art, "MedlineJournalInfo > MedlineTA") ||
      "PubMed";

    let year = txt(art, "JournalIssue > PubDate > Year") || txt(art, "ArticleDate > Year");
    if (!year) {
      const medlineDate = txt(art, "JournalIssue > PubDate > MedlineDate");
      const m = medlineDate.match(/\d{4}/);
      year = m ? m[0] : "";
    }

    const authors = Array.from(art.querySelectorAll("AuthorList > Author"))
      .map((a) => {
        const last = txt(a, "LastName");
        const initials = txt(a, "Initials");
        if (last) return initials ? `${last} ${initials}` : last;
        return txt(a, "CollectiveName");
      })
      .filter(Boolean);

    const types = Array.from(art.querySelectorAll("PublicationTypeList > PublicationType")).map((n) =>
      n.textContent.trim()
    );

    const doiEl = Array.from(art.querySelectorAll("ArticleIdList > ArticleId")).find(
      (n) => (n.getAttribute("IdType") || "").toLowerCase() === "doi"
    );

    const lower = types.join(" ").toLowerCase();
    const kind = /meta-analysis/.test(lower)
      ? "meta"
      : /randomized controlled trial|controlled clinical trial/.test(lower)
        ? "rct"
        : /review/.test(lower)
          ? "review"
          : "";

    return {
      pmid,
      title,
      abstract,
      journal,
      year,
      authors,
      authorsShort: authors.slice(0, 3).join(", ") + (authors.length > 3 ? " et al" : ""),
      types,
      kind,
      doi: doiEl ? doiEl.textContent.trim() : "",
      url: LINK.pmid(pmid),
    };
  });
}

/* ------------------------------------------------------------------ */
/* Public API                                                          */
/* ------------------------------------------------------------------ */

/**
 * Search PubMed live.
 * @returns {Promise<{papers: object[], total: number, term: string, query: string, ms: number, cached: boolean}>}
 */
async function searchPapers(term, { retmax = 12, sort = "relevance", scope, years, type, signal, force = false } = {}) {
  const query = buildTerm(term, { scope, years, type });
  const key = `${query}|${retmax}|${sort}`;
  const hit = cache.get(key);
  if (!force && hit && Date.now() - hit.at < CACHE_TTL) {
    return { ...hit.value, cached: true };
  }

  const started = Date.now();

  const searchRes = await schedule(() =>
    get(
      "esearch.fcgi",
      { db: "pubmed", term: query, retmax, retmode: "json", sort: sort === "date" ? "pub_date" : "relevance" },
      { signal }
    )
  );
  const searchJson = await searchRes.json().catch(() => null);
  const result = searchJson && searchJson.esearchresult ? searchJson.esearchresult : {};
  const ids = Array.isArray(result.idlist) ? result.idlist : [];
  const total = Number(result.count || ids.length) || 0;

  if (!ids.length) {
    const empty = { papers: [], total: 0, term: query, query: String(term || ""), ms: Date.now() - started, cached: false };
    cache.set(key, { at: Date.now(), value: empty });
    trimCache();
    return empty;
  }

  const fetchRes = await schedule(() =>
    get("efetch.fcgi", { db: "pubmed", id: ids.join(","), retmode: "xml", rettype: "abstract" }, { signal })
  );
  const xml = await fetchRes.text();
  const papers = parseArticles(xml);

  const value = { papers, total, term: query, query: String(term || ""), ms: Date.now() - started, cached: false };
  cache.set(key, { at: Date.now(), value });
  trimCache();
  return value;
}

function trimCache() {
  if (cache.size <= CACHE_MAX) return;
  const oldest = [...cache.entries()].sort((a, b) => a[1].at - b[1].at).slice(0, cache.size - CACHE_MAX);
  oldest.forEach(([k]) => cache.delete(k));
}

function clearCache() {
  cache.clear();
}

/** Cheap reachability probe used by the UI to decide what error copy to show. */
async function ping() {
  const res = await get("einfo.fcgi", { db: "pubmed", retmode: "json" });
  return res.ok;
}

/** A topic is just a query preset — no papers are stored anywhere. */
const TOPICS = [
  { id: "ssri", label: "SSRIs & serotonin", q: "selective serotonin reuptake inhibitor AND (depression OR anxiety)" },
  { id: "ketamine", label: "Ketamine & depression", q: "ketamine AND treatment-resistant depression AND randomized" },
  { id: "psychedelics", label: "Psychedelics", q: "psilocybin OR LSD AND (depression OR anxiety) AND clinical trial" },
  { id: "stimulants", label: "Stimulants & ADHD", q: "methylphenidate OR amphetamine AND ADHD AND randomized controlled trial" },
  { id: "caffeine", label: "Caffeine & adenosine", q: "caffeine AND adenosine receptor AND (sleep OR cognition)" },
  { id: "nicotine", label: "Nicotine & nAChR", q: "nicotine AND nicotinic acetylcholine receptor AND (cognition OR dependence)" },
  { id: "cannabinoids", label: "Cannabinoids", q: "cannabidiol OR THC AND (anxiety OR pain) AND randomized" },
  { id: "nootropics", label: "Nootropics", q: "nootropic AND (cognition OR memory) AND randomized controlled trial" },
  { id: "gaba", label: "GABA & benzodiazepines", q: "benzodiazepine OR GABA-A receptor AND (anxiety OR dependence)" },
  { id: "glutamate", label: "Glutamate & NMDA", q: "NMDA receptor AND memantine AND (cognition OR neuroprotection)" },
  { id: "monoamines", label: "Monoamine oxidase", q: "monoamine oxidase inhibitor AND (depression OR safety)" },
  { id: "adaptogens", label: "Adaptogens", q: "ashwagandha OR rhodiola AND (stress OR fatigue) AND randomized" },
  { id: "sleep", label: "Sleep pharmacology", q: "orexin receptor antagonist OR melatonin AND insomnia AND randomized" },
  { id: "tapering", label: "Deprescribing", q: "antidepressant discontinuation OR tapering AND withdrawal" },
];
exports.buildTerm = buildTerm;
exports.searchPapers = searchPapers;
exports.clearCache = clearCache;
exports.ping = ping;
exports.PUBMED_KEY = PUBMED_KEY;
exports.LINK = LINK;
exports.PubmedError = PubmedError;
exports.TOPICS = TOPICS;

let lastFocus = null;

function lockScroll(on) {
  document.documentElement.classList.toggle("layer-open", !!on);
}

/**
 * Remove transient layers. Restores scroll + focus when nothing is left.
 * @param {boolean} restoreFocus
 */
function closeLayers(restoreFocus = true) {
  document.querySelectorAll(".overlay, .drawer-host, .sheet-host").forEach((el) => el.remove());
  lockScroll(false);
  if (restoreFocus && lastFocus && document.contains(lastFocus)) {
    try {
      lastFocus.focus({ preventScroll: true });
    } catch (err) {
      /* ignore */
    }
  }
  lastFocus = null;
}

function openDrawer() {
  if (document.querySelector(".drawer-host")) return;
  closeLayers(false);
  lastFocus = document.activeElement;
  const host = document.createElement("div");
  host.className = "drawer-host";
  host.innerHTML = `<div class="drawer-scrim" data-close></div>
    <div class="drawer">
      <a class="brand" href="#/" data-close>${BRAND}</a>
      ${NAV.map(
        (group) => `${group.section ? `<h4>${esc(group.section)}</h4>` : `<h4>App</h4>`}
          ${group.items
            .map(
              (it) => `<a class="d-item" href="${it.href}" data-nav="${it.id}" data-close>
                ${icon(it.icon, 16)}<span>${esc(it.label)}</span>
                ${it.count ? `<span class="pill-count" style="margin-left:auto">${it.count()}</span>` : ""}
              </a>`
            )
            .join("")}`
      ).join("")}
      <div style="margin-top:auto;padding-top:14px;display:grid;gap:10px">
        ${subscribePlate({ compact: true })}
        <button class="btn ghost sm block" data-search>${icon("search", 14)} Search everything</button>
      </div>
    </div>`;
  document.body.appendChild(host);
  wireSubscribe(host);
  lockScroll(true);
  const close = () => closeLayers();
  host.addEventListener("click", (ev) => {
    if (ev.target.closest("[data-search]")) {
      close();
      openSearch();
      return;
    }
    if (ev.target.closest("[data-close]") || ev.target.classList.contains("drawer-scrim")) close();
  });
  const first = host.querySelector(".d-item");
  if (first) setTimeout(() => first.focus({ preventScroll: true }), 30);
}

function buildIndex() {
  const items = [];
  for (const c of COMPOUNDS) {
    items.push({
      kind: "Compound",
      title: c.name,
      sub: `${c.cls} · ${c.evidence} evidence`,
      href: `#/compounds/${c.id}`,
      icon: "pill",
      hay: `${c.name} ${(c.aliases || []).join(" ")} ${c.cls} ${(c.tags || []).join(" ")}`.toLowerCase(),
    });
  }
  for (const s of SYSTEMS) {
    items.push({
      kind: "System",
      title: s.name,
      sub: s.tagline || "transmitter system",
      href: `#/brain/${s.id}`,
      icon: "activity",
      hay: `${s.name} ${s.abbr} ${(s.matchFlags || []).join(" ")}`.toLowerCase(),
    });
  }
  for (const { course, lesson } of LESSONS_ALL) {
    items.push({
      kind: "Lesson",
      title: lesson.title,
      sub: course.title,
      href: `#/learn/${course.id}/${lesson.id}`,
      icon: "book",
      hay: `${lesson.title} ${course.title}`.toLowerCase(),
    });
  }
  for (const [label, href, ico, sub] of [
    ["Home", "#/", "home", "dashboard"],
    ["Flashcards", "#/cards", "layers", "spaced repetition"],
    ["Brain map", "#/brain", "brain", "regions and pathways"],
    ["Biochemical atlas", "#/atlas", "atom", "pathways, enzymes and targets"],
    ["Organ map", "#/organs", "body", "organs, hormones and diseases"],
    ["Convergence map", "#/map", "dna", "compound threads into regions"],
    ["Peptide calculator", "#/calc", "calculator", "reconstitution arithmetic"],
    ["Dose lab", "#/lab", "flask", "pharmacokinetics sandbox"],
    ["Interaction checker", "#/lab/interactions", "shield", "stack safety"],
    ["Evidence", "#/evidence", "file", "research topics"],
    ["Ask", "#/ask", "sparkles", "retrieval assistant"],
    ["Notebook", "#/notes", "edit", "your notes"],
    ["Settings", "#/settings", "settings", "appearance and data"],
  ]) {
    items.push({ kind: "Page", title: label, sub, href, icon: ico, hay: `${label} ${sub}`.toLowerCase() });
  }
  return items;
}

let searchIndex = null;

function searchAll(q) {
  if (!searchIndex) searchIndex = buildIndex();
  const query = q.trim().toLowerCase();
  if (!query) {
    return searchIndex.filter((i) => i.kind === "Page").slice(0, 6);
  }
  const words = query.split(/\s+/);
  return searchIndex
    .map((item) => {
      let score = 0;
      for (const w of words) {
        const inTitle = item.title.toLowerCase().includes(w);
        if (inTitle) score += item.title.toLowerCase().startsWith(w) ? 8 : 5;
        if (item.hay.includes(w)) score += 2;
      }
      if (item.title.toLowerCase() === query) score += 20;
      return { item, score };
    })
    .filter((x) => x.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 24)
    .map((x) => x.item);
}

function openSearch() {
  const existing = document.querySelector(".overlay");
  if (existing) {
    const box = existing.querySelector("#ov-input");
    if (box) box.focus();
    return;
  }
  closeLayers(false);
  lastFocus = document.activeElement;
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.setAttribute("role", "dialog");
  overlay.setAttribute("aria-modal", "true");
  overlay.setAttribute("aria-label", "Search everything");
  overlay.innerHTML = `<div class="overlay-panel">
    <div class="overlay-search">
      ${icon("search", 17)}
      <input id="ov-input" type="text" placeholder="Search compounds, systems, lessons…" autocomplete="off" spellcheck="false">
      <button class="icon-btn" data-close aria-label="Close">${icon("x", 16)}</button>
    </div>
    <div class="overlay-results" id="ov-results"></div>
  </div>`;
  document.body.appendChild(overlay);
  lockScroll(true);
  const close = () => closeLayers();

  const input = overlay.querySelector("#ov-input");
  const results = overlay.querySelector("#ov-results");
  let active = 0;
  let current = [];

  const paint = () => {
    current = searchAll(input.value);
    active = 0;
    if (!current.length) {
      results.innerHTML = `<div class="sr-empty">No match. Try a compound name, a transmitter, or “interactions”.</div>`;
      return;
    }
    let html = "";
    let lastKind = "";
    current.forEach((item, i) => {
      if (item.kind !== lastKind) {
        html += `<div class="sr-group">${esc(item.kind)}s</div>`;
        lastKind = item.kind;
      }
      html += `<a class="sr-item ${i === active ? "active" : ""}" href="${item.href}" data-i="${i}">
        ${icon(item.icon, 15)}
        <span class="grow"><span class="t">${esc(item.title)}</span><span class="s">${esc(item.sub)}</span></span>
        ${icon("chevronRight", 14)}
      </a>`;
    });
    results.innerHTML = html;
  };

  paint();
  setTimeout(() => input.focus(), 40);

  input.addEventListener("input", () => {
    active = 0;
    paint();
  });

  overlay.addEventListener("click", (ev) => {
    if (ev.target.closest("[data-close]") || ev.target.classList.contains("overlay")) close();
  });

  input.addEventListener("keydown", (ev) => {
    if (ev.key === "ArrowDown") {
      ev.preventDefault();
      active = Math.min(active + 1, Math.max(current.length - 1, 0));
      results.querySelectorAll(".sr-item").forEach((el, i) => el.classList.toggle("active", i === active));
      results.querySelectorAll(".sr-item")[active]?.scrollIntoView({ block: "nearest" });
    } else if (ev.key === "ArrowUp") {
      ev.preventDefault();
      active = Math.max(active - 1, 0);
      results.querySelectorAll(".sr-item").forEach((el, i) => el.classList.toggle("active", i === active));
      results.querySelectorAll(".sr-item")[active]?.scrollIntoView({ block: "nearest" });
    } else if (ev.key === "Enter") {
      const item = current[active];
      if (item) {
        closeLayers(false);
        location.hash = item.href.replace(/^#/, "");
      }
    } else if (ev.key === "Escape") {
      close();
    }
  });
}

/* ------------------------------------------------------------------ */
/* Routing                                                             */
/* ------------------------------------------------------------------ */

function notFound(segs) {
  return {
    nav: "",
    title: "Not found",
    view: {
      render: () =>
        `<div class="page-head"><div class="eyebrow">404</div><h1>Nothing at that address</h1>
         <p>“${esc(segs.join("/"))}” is not a route in this app.</p></div>
         <a class="btn primary" href="#/">${icon("home", 15)} Back home</a>`,
    },
  };
}

function matchRoute(segs) {
  const [a, b, c] = segs;

  if (!a) return { nav: "home", title: "Home", view: homeView };
  if (a === "compounds") {
    if (!b) return { nav: "compounds", title: "Compounds", view: compoundsView.list };
    const key = String(b).toLowerCase();
    const cmp = COMPOUND_BY_ID.get(key);
    return { nav: "compounds", title: cmp ? cmp.name : "Compound", view: compoundsView.detail, params: { id: key } };
  }
  if (a === "brain" || a === "systems") {
    if (!b) return { nav: "brain", title: "Brain map", view: neuroView.map };
    const key = String(b).toLowerCase();
    const sys = SYSTEM_BY_ID.get(key);
    return { nav: "brain", title: sys ? sys.name : "System", view: neuroView.system, params: { id: key } };
  }
  if (a === "compare") return { nav: "compare", title: "Compare", view: compareView.compare };

  if (a === "atlas") {
    if (!b) return { nav: "atlas", title: "Biochemical atlas", view: { render: atlasView.index, mount: atlasView.mount } };
    if (b === "target" && c)
      return {
        nav: "atlas",
        title: "Target",
        view: { render: atlasView.target, mount: atlasView.mount },
        params: { id: String(c).toLowerCase(), kind: "target" },
      };
    return {
      nav: "atlas",
      title: "Pathway",
      view: { render: atlasView.pathway, mount: atlasView.mount },
      params: { id: String(b).toLowerCase(), kind: "pathway" },
    };
  }
  if (a === "organs" || a === "organ") {
    return {
      nav: "organs",
      title: "Organ map",
      view: { render: organsView.organs, mount: organsView.mount },
      params: b ? { id: String(b).toLowerCase() } : {},
    };
  }
  if (a === "map" || a === "network") {
    return { nav: "map", title: "Convergence map", view: { render: mapView.map, mount: mapView.mount } };
  }
  if (a === "calc" || a === "calculator") {
    return { nav: "calc", title: "Peptide calculator", view: { render: calculatorView.calculator, mount: calculatorView.mount } };
  }

  if (a === "lab") {
    if (b === "interactions") return { nav: "interactions", title: "Interactions", view: labView.interactions };
    if (b === "taper") return { nav: "taper", title: "Taper planner", view: taperView.taper };
    return { nav: "lab", title: "Dose lab", view: labView.lab };
  }
  if (a === "learn") {
    if (!b) return { nav: "learn", title: "Learn", view: learnView.index };
    const course = COURSES.find((x) => x.id === b);
    if (!c) return { nav: "learn", title: course ? course.title : "Course", view: learnView.course, params: { courseId: b } };
    return { nav: "learn", title: course ? course.title : "Lesson", view: learnView.lesson, params: { courseId: b, lessonId: c } };
  }
  if (a === "cards" || a === "flashcards") return { nav: "cards", title: "Flashcards", view: learnView.cards };
  if (a === "evidence" || a === "studies") return { nav: "evidence", title: "Evidence", view: evidenceView.evidence };
  if (a === "research" || a === "pubmed") return { nav: "research", title: "Research", view: researchView.research };
  if (a === "ask") return { nav: "ask", title: "Ask", view: askView.ask };
  if (a === "notes") return { nav: "notes", title: "Notebook", view: notesView.notesView };
  if (a === "settings") return { nav: "settings", title: "Settings", view: settingsView.settings };
  return notFound(segs);
}

function parseHash() {
  const raw = location.hash.replace(/^#/, "");
  const qi = raw.indexOf("?");
  const pathPart = qi === -1 ? raw : raw.slice(0, qi);
  const queryPart = qi === -1 ? "" : raw.slice(qi + 1);
  const segs = pathPart
    .split("/")
    .filter(Boolean)
    .map((s) => {
      try {
        return decodeURIComponent(s);
      } catch (err) {
        return s;
      }
    });
  const query = {};
  new URLSearchParams(queryPart).forEach((v, k) => {
    query[k] = v;
  });
  return { segs, query };
}

let currentCtx = null;
let lastPath = null;

function paintNav(navId) {
  document.querySelectorAll("[data-nav]").forEach((el) => {
    el.classList.toggle("active", el.dataset.nav === navId);
  });
  // The bottom bar has no Flashcards cell — light up Learn while browsing cards.
  if (navId === "cards") {
    const learn = document.querySelector('#bottom-nav [data-nav="learn"]');
    if (learn) learn.classList.add("active");
  }
}

function paintCounts() {
  const due = deckStats(FLASHCARDS).due;
  document.querySelectorAll('[data-count="cards"]').forEach((el) => {
    el.textContent = due || "";
    el.style.display = due ? "" : "none";
  });
  const notes = (store.data.notes || []).length;
  document.querySelectorAll('[data-count="notes"]').forEach((el) => {
    el.textContent = notes || "";
    el.style.display = notes ? "" : "none";
  });
  document.querySelectorAll("[data-due-dot]").forEach((el) => {
    el.style.display = due ? "block" : "none";
  });
  const sidebar = document.getElementById("sidebar");
  if (sidebar) {
    const lvl = levelFor(store.data.profile.xp || 0);
    const lv = sidebar.querySelector(".side-xp .lv b");
    const xp = sidebar.querySelector(".side-xp .lv span");
    const bar = sidebar.querySelector(".side-xp .meter i");
    if (lv) lv.textContent = lvl.level;
    if (xp) xp.textContent = `level · ${store.data.profile.xp || 0} XP`;
    if (bar) bar.style.width = `${Math.round((lvl.into / (lvl.need || 1)) * 100)}%`;
  }
}

function renderRoute() {
  let parsed;
  try {
    parsed = parseHash();
  } catch (err) {
    parsed = { segs: [], query: {} };
  }
  const { segs, query } = parsed;
  const match = matchRoute(segs);
  const hashKey = location.hash || "#/";

  // clear transient layers from the previous view
  closeLayers(false);

  const oldHost = document.getElementById("view");
  if (!oldHost) return;
  // A brand new host each render: view listeners can never pile up on a
  // recycled container (duplicate grading, double-toggled switches, etc.).
  const host = document.createElement("div");
  host.id = "view";
  host.className = oldHost.className;
  oldHost.replaceWith(host);

  const ctx = {
    params: match.params || {},
    query,
    rerender: renderRoute,
    refreshCounts: paintCounts,
    navigate: (href) => {
      location.hash = href.replace(/^#/, "");
    },
  };
  currentCtx = ctx;

  try {
    host.innerHTML = match.view.render(ctx);
    match.view.mount?.(host, ctx);
  } catch (err) {
    console.error("[neurodiff] view failed", err);
    host.innerHTML = `<div class="card"><h3 style="margin-bottom:6px">This view failed to render</h3>
      <p class="small dim" style="line-height:1.6">${esc(err && err.message ? err.message : String(err))}</p>
      <div class="row" style="gap:8px;margin-top:10px"><button class="btn ghost sm" onclick="location.reload()">Reload</button>
      <a class="btn ghost sm" href="#/">Home</a></div></div>`;
  }

  // Any view can render a subscribe plate; dismissal is delegated once here.
  wireSubscribe(host);

  paintNav(match.nav);
  paintCounts();

  const titleEl = document.getElementById("topbar-title");
  if (titleEl) titleEl.textContent = match.title;
  document.title = match.title === "Home" ? "NeuroDifference — evidence · compounds · pathways" : `${match.title} · NeuroDifference`;

  if (lastPath !== hashKey) {
    lastPath = hashKey;
    window.scrollTo(0, 0);
  }
  document.documentElement.setAttribute("data-scrolled", String(window.scrollY > 8));
}

/* ------------------------------------------------------------------ */
/* Global keys                                                         */
/* ------------------------------------------------------------------ */

function wireKeys() {
  let gPressed = 0;
  document.addEventListener("keydown", (ev) => {
    const tag = (ev.target.tagName || "").toLowerCase();
    const typing = tag === "input" || tag === "textarea" || tag === "select" || ev.target.isContentEditable;

    if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k") {
      ev.preventDefault();
      openSearch();
      return;
    }
    if (ev.key === "Escape") {
      if (document.querySelector(".overlay, .drawer-host, .sheet-host")) {
        ev.preventDefault();
        closeLayers();
      }
      return;
    }
    // Every remaining shortcut is bare-key only.
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (typing) return;

    if (ev.key === "/") {
      ev.preventDefault();
      openSearch();
      return;
    }

    if (ev.key.toLowerCase() === "g") {
      gPressed = Date.now();
      return;
    }
    if (Date.now() - gPressed < 900) {
      const map = { h: "#/", c: "#/compounds", b: "#/brain", l: "#/lab", a: "#/ask", e: "#/evidence", n: "#/notes", s: "#/settings", k: "#/cards", r: "#/learn" };
      const target = map[ev.key.toLowerCase()];
      if (target) {
        ev.preventDefault();
        gPressed = 0;
        location.hash = target.replace(/^#/, "");
      }
    }
  });
}

/* ------------------------------------------------------------------ */
/* Boot                                                                */
/* ------------------------------------------------------------------ */

function boot() {
  try {
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  } catch (err) {
    /* ignore */
  }
  store.load();
  // Counts today as day 1 of the streak instead of leaving the profile
  // marked active with a streak of 0.
  touchStreak();

  window.addEventListener("nd:savefail", () =>
    toast("This browser refused to save your progress — export a backup before closing", "danger", 7000)
  );

  settingsView.applyAppearance();
  window.addEventListener("nd:appearance", () => settingsView.applyAppearance());

  const root = document.getElementById("root");
  mountShell(root);
  wireKeys();

  window.addEventListener("hashchange", renderRoute);
  if (!location.hash) history.replaceState(null, "", "#/");
  renderRoute();

  if ("serviceWorker" in navigator) {
    const isSecure =
      location.protocol === "https:" || ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname);
    if (isSecure) {
      try {
        // Resolve against the document base so a subfolder deployment
        // (/site/main/) still registers the right worker.
        const swUrl = new URL("sw.js", document.baseURI);
        navigator.serviceWorker.register(swUrl, { scope: "./" }).catch(() => {});

"use strict";
/* Spaced repetition scheduler (SM-2 style, simplified for single-session use). */

const {  store, dayKey, daysBetween, uid  } = require("./core.js");
const {  FLASHCARDS  } = require("./data/learn.js");

const GRADES = [
  { key: "again", label: "Again", hint: "Forgot", quality: 1, cls: "danger" },
  { key: "hard", label: "Hard", hint: "Struggled", quality: 3, cls: "ghost" },
  { key: "good", label: "Good", hint: "Recalled", quality: 4, cls: "soft" },
  { key: "easy", label: "Easy", hint: "Instant", quality: 5, cls: "primary" },
];

function blank() {
  return { ease: 2.5, interval: 0, reps: 0, lapses: 0, due: null, seen: null };
}

function cardState(cardId) {
  const s = store.data.srs || {};
  return { ...blank(), ...(s[cardId] || {}) };
}

/** Cards that are due (or never seen), ordered: unseen first, then earliest due. */
function dueCards(deck = FLASHCARDS) {
  const today = dayKey();
  return deck
    .map((card) => {
      const st = cardState(card.id);
      const due = st.due || null;
      const overdue = due ? daysBetween(due, today) : 0;
      const isDue = !due || overdue >= 0;
      return { card, st, isDue, overdue: due ? overdue : 0 };
    })
    .filter((x) => x.isDue)
    .sort(
      (a, b) =>
        Number(!!a.st.seen) - Number(!!b.st.seen) ||
        (b.overdue || 0) - (a.overdue || 0) ||
        a.card.id.localeCompare(b.card.id)
    );
}

function deckStats(deck = FLASHCARDS) {
  const today = dayKey();
  let due = 0;
  let learning = 0;
  let mature = 0;
  let seen = 0;
  for (const card of deck) {
    const st = cardState(card.id);
    if (st.seen) seen++;
    if (st.interval >= 21) mature++;
    else if (st.seen) learning++;
    if (!st.due || daysBetween(st.due, today) >= 0) due++;
  }
  return { due, learning, mature, seen, total: deck.length };
}

/**
 * Grade a card and reschedule it.
 * @returns {{interval:number, due:string, ease:number}}
 */
function gradeCard(cardId, grade) {
  const q = GRADES.find((g) => g.key === grade)?.quality ?? 4;
  return store.update((s) => {
    if (!s.srs) s.srs = {};
    const prev = { ...blank(), ...(s.srs[cardId] || {}) };
    let ease = prev.ease;
    let interval = prev.interval;
    let lapses = prev.lapses;
    let reps = prev.reps;

    if (q < 3) {
      lapses += 1;
      interval = 0;
      ease = Math.max(1.3, ease - 0.2);
      reps = 0;
    } else {
      reps += 1;
      interval = scheduleInterval(prev.interval, ease, q);
      ease = Math.min(3.0, Math.max(1.3, ease + (q === 5 ? 0.1 : q === 3 ? -0.15 : 0)));
    }

    const due = new Date();
    due.setDate(due.getDate() + (interval || 0));
    const next = {
      ease: Math.round(ease * 100) / 100,
      interval,
      reps,
      lapses,
      due: dayKey(due),
      seen: new Date().toISOString(),
    };
    s.srs[cardId] = next;
    if (!Array.isArray(s.history)) s.history = [];
    s.history.unshift({ id: uid("h"), kind: "card", label: `Reviewed card (${grade})`, at: new Date().toISOString() });
    s.history = s.history.slice(0, 60);
    return { interval, due: next.due, ease: next.ease };
  });
}

/** Interval (in days) the scheduler produces for this grade and previous interval. */
function scheduleInterval(prevInterval, ease, q) {
  if (q < 3) return 0;
  if (!prevInterval) return q === 5 ? 6 : q === 4 ? 3 : 1;
  const factor = q === 5 ? ease * 1.3 : q === 4 ? ease : 1.2;
  return Math.max(1, Math.round(prevInterval * factor));
}

function humanDays(days) {
  if (!days) return "now";
  if (days === 1) return "tomorrow";
  if (days < 30) return days + " days";
  if (days < 365) return Math.round(days / 30) + " mo";
  return (days / 365).toFixed(1) + " yr";
}

/** Preview matching exactly what gradeCard would schedule for this card. */
function nextIntervalPreview(grade, cardId) {
  const g = GRADES.find((x) => x.key === grade);
  const q = g ? g.quality : 4;
  const st = cardId ? cardState(cardId) : blank();
  // gradeCard schedules with the *current* ease and only then nudges it, so the
  // preview must use the same order or the shown interval drifts from reality.
  return humanDays(scheduleInterval(st.interval, st.ease, q));
}
exports.cardState = cardState;
exports.dueCards = dueCards;
exports.deckStats = deckStats;
exports.gradeCard = gradeCard;
exports.nextIntervalPreview = nextIntervalPreview;
exports.GRADES = GRADES;

});

"use strict";
/* Ask: local retrieval assistant over the whole database (no network) */

const {  esc, icon, fmt  } = require("../core.js");
const {  COMPOUNDS, COMPOUND_BY_ID, getCompound, resolveCompound, searchCompounds, pubmedUrl  } = require("../data/compounds.js");
const {  SYSTEMS, SYSTEM_BY_ID  } = require("../data/neuro.js");
const {  COURSES, LESSONS_ALL  } = require("../data/learn.js");
const {  checkInteractions  } = require("../data/interactions.js");
const {  pageHead, callout, classColor  } = require("./ui.js");

/* ------------------------------------------------------------------ */
/* Retrieval                                                           */
/* ------------------------------------------------------------------ */

const STOP = new Set(["the", "a", "an", "of", "and", "or", "is", "are", "does", "do", "what", "how", "why", "to", "in", "on", "for", "with", "it", "its", "can", "i", "my", "me", "you", "vs", "versus", "between", "difference", "long", "much", "should", "take"]);

function tokens(q) {
  return String(q || "")
    .toLowerCase()
    .replace(/[^a-z0-9\s+-]/g, " ")
    .split(/\s+/)
    .filter((t) => t.length > 2 && !STOP.has(t));
}

function findSystems(q) {
  const text = String(q).toLowerCase();
  return SYSTEMS.filter((s) => text.includes(s.name.toLowerCase().replace(" ", "")) || text.includes(s.name.toLowerCase()) || new RegExp(`\\b${s.abbr.toLowerCase()}\\b`, "i").test(text) || (s.matchFlags || []).some((f) => text.includes(f.replace(/-/g, " "))));
}

function findCompoundsIn(q) {
  const text = String(q || "").toLowerCase();
  const hits = new Set();
  for (const c of COMPOUNDS) {
    const names = [c.name, ...(c.aliases || [])].filter(Boolean).map((n) => n.toLowerCase());
    if (names.some((n) => n.length > 2 && text.includes(n))) hits.add(c.id);
  }
  if (!hits.size) {
    for (const c of searchCompounds(q).slice(0, 3)) hits.add(c.id);
  }
  return Array.from(hits).map((id) => COMPOUND_BY_ID.get(id)).filter(Boolean);
}

function findLessons(q) {
  const ts = tokens(q);
  if (!ts.length) return [];
  return LESSONS_ALL.map((entry) => {
    const hay = `${entry.lesson.title} ${entry.course.title} ${entry.lesson.content}`.toLowerCase();
    let score = 0;
    for (const t of ts) {
      if (entry.lesson.title.toLowerCase().includes(t)) score += 4;
      if (hay.includes(t)) score += 1;
    }
    return { ...entry, score };
  })
    .filter((x) => x.score >= 2)
    .sort((a, b) => b.score - a.score)
    .slice(0, 3);
}

/* ------------------------------------------------------------------ */
/* Answer composition                                                  */
/* ------------------------------------------------------------------ */

function compoundBlock(c) {
  return `<div class="stack" style="gap:7px">
    <div class="row wrap" style="gap:6px">
      <a class="chip chip-btn" href="#/compounds/${esc(c.id)}" style="--dot:${classColor(c.cls)}"><span class="dot" style="background:${classColor(c.cls)}"></span>${esc(c.name)}</a>
      <span class="chip">${esc(c.cls)}</span>
      <span class="chip">${esc(c.evidence)} evidence</span>
    </div>
    <p class="small" style="line-height:1.6;color:var(--text-2)">${esc(c.summary)}</p>
    ${(c.moa || []).length ? `<div class="tiny dim" style="line-height:1.6"><strong class="muted">Mechanism:</strong> ${(c.moa || []).map(esc).join(" · ")}</div>` : ""}
    <div class="row wrap tiny" style="gap:6px 14px">
      ${c.pk.halfLife ? `<span class="tiny dim">t½ <span class="mono" style="color:var(--text-2)">${fmt.duration(c.pk.halfLife)}</span></span>` : ""}
      ${c.pk.onset ? `<span class="tiny dim">onset <span class="mono" style="color:var(--text-2)">${fmt.duration(c.pk.onset)}</span></span>` : ""}
      ${(c.doses || [])[0] ? `<span class="tiny dim">usual ${esc(c.doses[0].low)}${c.doses[0].high !== c.doses[0].low ? `–${esc(c.doses[0].high)}` : ""} ${esc(c.doses[0].unit || "mg")}</span>` : ""}
    </div>
    ${(c.warnings || []).length ? `<div class="tiny" style="color:#ffb9a3;line-height:1.55"><strong>Watch:</strong> ${esc(c.warnings[0])}</div>` : ""}
    <a class="btn ghost xs" href="#/compounds/${esc(c.id)}" style="align-self:flex-start">Open entry ${icon("arrowRight", 12)}</a>
  </div>`;
}

function compareBlocks(list) {
  const [a, b] = list;
  const rows = [
    ["Class", esc(a.cls) + (a.subcls ? ` · ${esc(a.subcls)}` : ""), esc(b.cls) + (b.subcls ? ` · ${esc(b.subcls)}` : "")],
    ["Evidence", evidenceCell(a), evidenceCell(b)],
    ["Mechanism", (a.moa || []).slice(0, 2).map(esc).join("; ") || "—", (b.moa || []).slice(0, 2).map(esc).join("; ") || "—"],
    ["Half-life", a.pk.halfLife ? fmt.duration(a.pk.halfLife) : "—", b.pk.halfLife ? fmt.duration(b.pk.halfLife) : "—"],
    ["Onset", a.pk.onset ? fmt.duration(a.pk.onset) : "—", b.pk.onset ? fmt.duration(b.pk.onset) : "—"],
    ["Typical dose", doseText(a), doseText(b)],
    ["Main risk", esc((a.warnings || [])[0] || (a.effects.bad || [])[0] || "—"), esc((b.warnings || [])[0] || (b.effects.bad || [])[0] || "—")],
  ];
  return `<div class="card tight" style="overflow-x:auto;padding:0">
    <table style="width:100%;border-collapse:collapse;font-size:12.5px">
      <thead><tr>
        <th style="text-align:left;padding:9px 11px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);border-bottom:1px solid var(--line)"></th>
        <th style="text-align:left;padding:9px 11px;font-size:12.5px;border-bottom:1px solid var(--line)">${esc(a.name)}</th>
        <th style="text-align:left;padding:9px 11px;font-size:12.5px;border-bottom:1px solid var(--line)">${esc(b.name)}</th>
      </tr></thead>
      <tbody>
        ${rows
          .map(
            ([label, x, y]) => `<tr>
              <td style="padding:8px 11px;color:var(--text-3);font-size:11.5px;border-bottom:1px solid var(--line-soft);white-space:nowrap">${label}</td>
              <td style="padding:8px 11px;border-bottom:1px solid var(--line-soft);vertical-align:top">${x}</td>
              <td style="padding:8px 11px;border-bottom:1px solid var(--line-soft);vertical-align:top">${y}</td>
            </tr>`
          )
          .join("")}
      </tbody>
    </table>
  </div>
  <div class="row wrap" style="gap:6px;margin-top:9px">
    <a class="btn ghost xs" href="#/compounds/${esc(a.id)}">${esc(a.name)} entry</a>
    <a class="btn ghost xs" href="#/compounds/${esc(b.id)}">${esc(b.name)} entry</a>
    <a class="btn ghost xs" href="#/lab/interactions?add=${esc(a.id)}">Check ${esc(a.name)} interactions</a>
  </div>`;
}

function doseText(c) {
  const d = (c.doses || [])[0];
  if (!d) return "—";
  return `${esc(d.low)}${d.high && d.high !== d.low ? `–${esc(d.high)}` : ""} ${esc(d.unit || "mg")} ${d.route ? esc(d.route) : ""}`;
}

function evidenceCell(c) {
  return `<span class="chip chip-${c.evidence === "strong" ? "good" : c.evidence === "moderate" ? "ok" : c.evidence === "limited" ? "warn" : "bad"}">${esc(c.evidence)}</span>`;
}

function systemBlock(s) {
  return `<div class="stack" style="gap:7px">
    <div class="row" style="gap:7px"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:${s.color}"></span>
    <strong style="font-size:14px">${esc(s.name)}</strong><span class="tag">${esc(s.abbr)}</span></div>
    <p class="small" style="line-height:1.6;color:var(--text-2)">${esc(s.summary)}</p>
    <div class="tiny dim" style="line-height:1.6"><strong class="muted">Receptors:</strong> ${s.receptors.map((r) => esc(r.name)).join(", ")}</div>
    <div class="tiny dim" style="line-height:1.6"><strong class="muted">Drugs that act here:</strong> ${(s.interventions || [])
      .map((p) => `${esc(p.point)} → ${esc(p.target)}`)
      .slice(0, 4)
      .join(" · ")}</div>
    <a class="btn ghost xs" href="#/brain/${esc(s.id)}" style="align-self:flex-start">Open pathway ${icon("arrowRight", 12)}</a>
  </div>`;
}

function lessonsBlock(list) {
  if (!list.length) return "";
  return `<div class="stack" style="gap:5px">
    ${list
      .map(
        (x) => `<a class="row between" href="#/learn/${esc(x.course.id)}/${esc(x.lesson.id)}" style="padding:8px 10px;border-radius:9px;background:var(--bg-2);border:1px solid var(--line);color:inherit;text-decoration:none">
          <span style="font-size:12.5px;font-weight:550">${esc(x.lesson.title)}</span>
          <span class="tiny dim">${esc(x.course.title)}</span>
        </a>`
      )
      .join("")}

/** Does the question actually ask for a comparison? */

function answer(q) {
  const text = String(q || "").trim();
  if (!text) return `<p class="small muted">Ask about a compound, a transmitter system, an interaction, or a lesson topic.</p>`;

  const found = findCompoundsIn(text);
  const systems = findSystems(text);
  const lessons = findLessons(text);
  const parts = [];

  if (found.length >= 2 && !wantsComparison(text)) {
    // A broad query can match several summaries; lead with the best single entry.
    parts.push(compoundBlock(found[0]));
    parts.push(
      `<div class="tiny dim" style="margin-top:8px">Also matched: ${found
        .slice(1, 4)
        .map((c) => `<a href="#/compounds/${esc(c.id)}">${esc(c.name)}</a>`)
        .join(", ")} — <a href="#/compounds?q=${encodeURIComponent(found[0].name)}">browse</a></div>`
    );
  } else if (found.length >= 2) {
    parts.push(`<p class="small muted" style="margin-bottom:9px">Comparing <strong style="color:var(--text)">${esc(found[0].name)}</strong> with <strong style="color:var(--text)">${esc(found[1].name)}</strong>:</p>`);
    parts.push(compareBlocks(found));
    const inter = checkInteractions(found.slice(0, 2));

      parts.push(`<div class="tiny" style="color:#ffb9a3;line-height:1.55;margin-top:9px"><strong>Stacking them:</strong> ${esc(inter[0].title)} — ${esc(inter[0].mechanism)}</div>`);
    }
    const extra = found.slice(2);
    if (extra.length) parts.push(`<div class="tiny dim" style="margin-top:8px">Also matched: ${extra.map((c) => `<a href="#/compounds/${esc(c.id)}">${esc(c.name)}</a>`).join(", ")}</div>`);

            .slice(0, 3)

            .join("")}</div>`

      parts.push(`<p class="tiny dim" style="margin-top:9px">Check it against your whole stack: <a href="#/lab/interactions?add=${esc(c.id)}">open the interaction checker</a>.</p>`);

  if (systems.length) {
    parts.push(`${found.length ? `<div class="divider"></div>` : ""}${systemBlock(systems[0])}`);

  }

const SUGGESTIONS = [
  "modafinil vs armodafinil",
  "how long does caffeine last",
  "what does serotonin do",
  "SSRI and MAOI together",
  "ketamine mechanism",

  "dopamine vs noradrenaline",
];

const chat = { messages: [] };

function messagesHtml() {
  if (!chat.messages.length) {
    return `<div class="card" style="text-align:center;padding:26px 18px">
      <div class="empty-ic" style="margin:0 auto 10px">${icon("sparkles", 22)}</div>
      <h3 style="font-size:16px;margin-bottom:5px">Ask the index</h3>

    </div>`;
  }

    .map(

const ask = {
  render() {
    return `

    <div class="split">
      <div>
        <div class="stack" id="chat-log" style="gap:10px">${messagesHtml()}</div>

        <form id="ask-form" style="margin-top:14px;display:flex;gap:8px;align-items:flex-end">
          <div class="search-input" style="flex:1">
            ${icon("search", 16)}
            <input class="input" id="ask-q" placeholder="e.g. how long does modafinil last?" autocomplete="off" enterkeyhint="send">
          </div>
          <button class="btn primary" type="submit" aria-label="Ask" style="flex:none">${icon("send", 16)}</button>
        </form>

        <div class="row wrap" style="gap:5px;margin-top:10px" id="ask-suggest">
          ${SUGGESTIONS.map((s) => `<button class="chip chip-btn" data-suggest="${esc(s)}">${esc(s)}</button>`).join("")}
        </div>
      </div>

      <aside class="col sticky-side" style="gap:12px">
        <div class="card">
          <div class="eyebrow" style="margin-bottom:7px">What it can answer</div>
          <ul class="md-list" style="margin:0;padding-left:17px;font-size:12.5px;line-height:1.6;color:var(--text-2)">
            <li>Compound mechanisms, kinetics, doses and risks</li>
            <li>Head-to-head comparisons of two entries</li>
            <li>What a transmitter system does and how drugs touch it</li>
            <li>Which lesson covers a concept</li>
            <li>Whether two things are known to interact</li>
          </ul>
        </div>
        <div class="card tight">
          <div class="eyebrow" style="margin-bottom:6px">What it cannot do</div>
          <p class="tiny dim" style="line-height:1.6">It does not diagnose, dose for you, or invent pharmacology that is not in the database. No LLM sits behind this — it is a deterministic index, so a wrong answer is a data bug you can see.</p>
        </div>
        <div>${callout("warn", "Answers are summaries", "Every claim here compresses a literature you have not read. Follow the source links before acting on anything.")}</div>
      </aside>
    </div>`;
  },

  mount(root) {
    const log = root.querySelector("#chat-log");
    const form = root.querySelector("#ask-form");
    const input = root.querySelector("#ask-q");

    const paint = () => {
      log.innerHTML = messagesHtml();
      log.lastElementChild?.scrollIntoView({ block: "nearest", behavior: "smooth" });

    const send = (text) => {
      const q = String(text || "").trim();
      if (!q) return;
      chat.messages.push({ role: "user", text: q });
      chat.messages.push({ role: "bot", html: answer(q) });
      if (chat.messages.length > 24) chat.messages = chat.messages.slice(-24);
      input.value = "";
      paint();
    };

    form?.addEventListener("submit", (ev) => {
      ev.preventDefault();
      send(input.value);
    });

    root.querySelector("#ask-suggest")?.addEventListener("click", (ev) => {
      const b = ev.target.closest("[data-suggest]");
      if (b) send(b.dataset.suggest);
    });
  },
};
exports.answer = answer;
exports.ask = ask;

});

/* Biochemical atlas — pathways, enzymes and molecular targets.
 * Pathway cards → pathway detail (step by step cascade) → compound cross-links.
 */

const {  esc, icon, emptyState, copyText, toast  } = require("../core.js");
const {  PATHWAYS, PATHWAY_BY_ID, TARGETS, TARGET_BY_ID, ATLAS_GROUPS, TARGET_KINDS, pathwaysForSystem, pathwaysForCompound, targetsForCompound } = require("../data/atlas.js");

const {  ORGAN_BY_ID  } = require("../data/organs.js");
const {  pageHead, backLink, chipRow, callout, mechFlow, liveBadge  } = require("./ui.js");

const KIND_ICON = {
  GPCR: "target",
  "Ion channel": "zap",
  Enzyme: "atom",
  Transporter: "repeat",
  "Nuclear receptor": "dna",
  Kinase: "activity",
  Other: "circle",
};

function systemDots(ids) {
  return `<span class="row" style="gap:4px">${(ids || [])
    .map((id) => {
      const s = SYSTEM_BY_ID.get(id);
      if (!s) return "";
      return `<span class="dot" title="${esc(s.name)}" style="background:${s.color};box-shadow:0 0 8px ${s.color}66"></span>`;
    })
    .join("")}</span>`;
}

function systemChips(ids) {
  return (ids || [])
    .map((id) => {
      const s = SYSTEM_BY_ID.get(id);
      if (!s) return "";
      return `<a class="chip chip-btn" href="#/brain/${esc(id)}" style="border-color:${s.color}55"><span class="dot" style="background:${s.color}"></span>${esc(s.name)}</a>`;
    })
    .join("");
}

function organChips(ids) {
  return (ids || [])
    .map((id) => {
      const o = ORGAN_BY_ID.get(id);
      if (!o) return "";
      return `<a class="chip chip-btn" href="#/organs/${esc(id)}">${icon("activity", 12)} ${esc(o.name)}</a>`;
    })
    .join("");
}

function compoundChips(ids, { limit = 0 } = {}) {
  const list = (ids || []).filter((id) => COMPOUND_BY_ID.get(id));
  const shown = limit ? list.slice(0, limit) : list;
  const rest = list.length - shown.length;
  return (
    shown
      .map((id) => {
        const c = COMPOUND_BY_ID.get(id);
        return `<a class="chip chip-btn chip-accent" href="#/compounds/${esc(id)}">${esc(c.name)}</a>`;
      })
      .join("") + (rest > 0 ? `<span class="chip chip-xs dim">+${rest}</span>` : "")
  );
}

function pubmedLink(query, label = "Live literature") {
  return `<a class="btn ghost sm" href="#/research?q=${encodeURIComponent(query)}">${icon("microscope", 14)} ${esc(label)}</a>`;
}

/* ------------------------------------------------------------------ */
/* Index                                                               */
/* ------------------------------------------------------------------ */

function pathwayCard(p) {
  const stepCount = (p.steps || []).length;
  const drugCount = new Set((p.steps || []).flatMap((s) => s.drugs || [])).size;
  return `<a class="card hoverable path-card" href="#/atlas/${esc(p.id)}" data-group="${esc(p.group)}" style="display:block">
    <div class="row between" style="align-items:flex-start;gap:10px">
      <div style="min-width:0">
        <div class="eyebrow">${esc(p.group)}</div>
        <h3 class="pc-title">${esc(p.name)}</h3>
      </div>
      ${systemDots(p.systems)}
    </div>
    <p class="pc-sum">${esc(p.summary)}</p>
    <div class="pc-foot">
      <span class="chip chip-xs">${icon("activity", 11)} ${stepCount} steps</span>
      <span class="chip chip-xs">${icon("pill", 11)} ${drugCount} linked</span>
      ${p.rateLimiting && p.rateLimiting !== "—" ? `<span class="chip chip-xs pc-enzyme" title="Rate limiting">${esc(p.rateLimiting.split(" (")[0])}</span>` : ""}
    </div>
  </a>`;
}

function index(ctx) {

  const linked = new Set(PATHWAYS.flatMap((p) => (p.steps || []).flatMap((s) => s.drugs || [])));

  return `${pageHead(
    "Biochemical atlas",
    "Twenty real pathways, step by step — the enzymes, cofactors and rate-limiting reactions that every compound in this library ultimately touches.",
    `<a class="btn soft sm" href="#/organs">${icon("activity", 15)} Organ map</a>`,
    "Atlas"
  )}

    <div class="stack">

        <div class="card tight"><div class="stat-label">Pathways</div><div class="stat-value">${PATHWAYS.length}</div></div>

              <span class="tr-body"><span class="tr-name">${esc(t.name)}</span><span class="tr-meta">${esc(t.kind)}${t.gene ? ` · ${esc(t.gene)}` : ""}</span></span>
              ${icon("chevronRight", 14)}
            </a>`;

        </div>
      </section>
      <section class="card">
        <div class="card-head"><h3>Neurotransmitter systems</h3></div>
        <div class="row wrap" style="gap:6px">
          ${SYSTEMS.map((s) => `<a class="chip chip-btn" href="#/brain/${esc(s.id)}"><span class="dot" style="background:${s.color}"></span>${esc(s.name)}</a>`).join("")}
        </div>
      </section>
    </aside>
  </div>`;
}

    if (!chip || !chip.classList.contains("chip-btn")) return;
    const val = chip.dataset.group || "";
    root.querySelectorAll("[data-group].chip-btn").forEach((el) => el.classList.toggle("on", (el.dataset.group || "") === val));
    let shown = 0;
    root.querySelectorAll("#path-grid [data-group]").forEach((card) => {
      const ok = !val || card.dataset.group === val;
      card.classList.toggle("hide", !ok);
      if (ok) shown += 1;
    });
    const empty = root.querySelector("#path-empty");
    if (empty) empty.classList.toggle("hide", shown > 0);
  });
}

/* ------------------------------------------------------------------ */
/* Pathway detail                                                      */
/* ------------------------------------------------------------------ */

function stepCard(s, i) {
  return `<div class="card step-card">
    <div class="row between" style="align-items:flex-start;gap:10px">
      <div class="row" style="gap:9px;align-items:flex-start;min-width:0">
        <span class="step-num">${i + 1}</span>
        <div style="min-width:0">
          <div class="step-label">${esc(s.label)}</div>
          <div class="step-enzyme">${esc(s.enzyme || "—")}</div>
        </div>
      </div>
      ${s.cofactor && s.cofactor !== "—" ? `<span class="chip chip-xs step-cof" title="Cofactors">${esc(s.cofactor)}</span>` : ""}
    </div>
    <p class="step-detail">${esc(s.detail)}</p>
    ${(s.drugs || []).length ? `<div class="row wrap" style="gap:6px;margin-top:9px">${compoundChips(s.drugs)}</div>` : ""}
  </div>`;
}

function pathway(ctx) {
  const p = PATHWAY_BY_ID.get(String(ctx.params.id || "").toLowerCase());
  if (!p) {
    return `${pageHead("Pathway not found", "", backLink("#/atlas", "Atlas"))}
      ${emptyState("atom", "No such pathway", "That pathway is not in the atlas. Browse the full list instead.", '<a class="btn soft sm" href="#/atlas">Open atlas</a>')}`;

    <div class="stack">
      <div class="card">
        <div class="row wrap" style="gap:8px;margin-bottom:2px">
          ${p.rateLimiting && p.rateLimiting !== "—" ? `<span class="chip chip-accent">${icon("sliders", 12)} Rate limiting: ${esc(p.rateLimiting)}</span>` : ""}
          <span class="chip">${icon("globe", 12)} ${esc(p.location)}</span>
        </div>
        <div class="row wrap" style="gap:6px;margin-top:10px">
          ${systemChips(p.systems)}
          ${organChips(p.organs)}
        </div>
      </div>

      <section class="card">
        <div class="card-head"><h3>Flow</h3><span class="spacer"></span><span class="tiny dim">${(p.steps || []).length} steps</span></div>

            })
            .join("")}</div>
        </section>`;
      })()}
    </div>

    <aside class="stack sticky-side">
      <section class="card">
        <div class="card-head"><h3>Compounds on this pathway</h3><span class="spacer"></span><span class="live-dot"></span></div>
        ${drugIds.length ? `<div class="row wrap" style="gap:6px">${compoundChips(drugIds)}</div>` : `<p class="small dim">No compound in the library acts directly on this chain.</p>`}
      </section>
      ${related.length ? `<section class="card">
        <div class="card-head"><h3>Connected pathways</h3></div>
        <div class="stack" style="gap:8px">
          ${related
            .map(
              (r) => `<a class="ghost-link" href="#/atlas/${esc(r.id)}">
                <div class="gl-t">${esc(r.p.name)}</div>
                <div class="gl-s">${esc(r.note || "")}</div>
              </a>`
            )
            .join("")}
        </div>

        <p class="small dim" style="line-height:1.6">Reference point for study, not a dosing guide. Enzymatic detail here describes normal physiology — individual variation in enzyme activity can be several-fold.</p>

    </aside>
  </div>`;

  root.addEventListener("click", async (ev) => {
    const btn = ev.target.closest("[data-copy]");
    if (!btn) return;
    const ok = await copyText(btn.dataset.copy);
    toast(ok ? "Query copied" : "Copy failed", ok ? "ok" : "danger");
  });
}

/* ------------------------------------------------------------------ */
/* Target detail                                                       */
/* ------------------------------------------------------------------ */

function target(ctx) {
  const t = TARGET_BY_ID.get(String(ctx.params.id || "").toLowerCase());
  if (!t) {
    return `${pageHead("Target not found", "", backLink("#/atlas", "Atlas"))}
      ${emptyState("target", "No such target", "That receptor or enzyme is not in the atlas.", '<a class="btn soft sm" href="#/atlas">Open atlas</a>')}`;
  }

  const paths = comps.flatMap((id) => pathwaysForCompound(id)).filter((p, i, a) => a.indexOf(p) === i).slice(0, 6);

  return `${pageHead(t.name, esc(t.function), pubmedLink(t.pubmed || t.name, "Live papers"), t.kind)}
  <div class="split split-mobile-first">
    <div class="stack">
      <div class="card">

          <span class="chip chip-accent">${icon(KIND_ICON[t.kind] || "target", 12)} ${esc(t.kind)}</span>
          ${t.gene ? `<span class="chip mono">${esc(t.gene)}</span>` : ""}
          <span class="chip">${icon("globe", 12)} ${esc(t.location)}</span>
        </div>
        <div class="row wrap" style="gap:6px;margin-top:10px">${systemChips(t.systems)}</div>
      </div>

      <section class="card">
        <div class="card-head"><h3>Compounds acting here</h3></div>
        ${
          comps.length
            ? `<div class="row wrap" style="gap:6px">${compoundChips(comps)}</div>`
            : `<p class="small dim">No compound page in the library lists this target yet.</p>`

      </section>

      ${
        (t.drugClasses || []).length
          ? `<section class="card">
              <div class="card-head"><h3>Drug classes (clinical context)</h3></div>
              <ul class="clean">${t.drugClasses.map((d) => `<li>${esc(d)}</li>`).join("")}</ul>

                    <div class="gl-t">${esc(p.name)}</div>
                    <div class="gl-s">${esc(p.group)}</div>
                  </a>`
                )
                .join("")}</div>
            </section>`

      }
    </div>
    <aside class="stack sticky-side">

        <p class="small dim" style="line-height:1.6">Receptor names describe families, not single proteins. Subtype selectivity is usually partial, which is why side effects cross over between drug classes.</p>
      </section>
    </aside>
  </div>`;
}

/* ------------------------------------------------------------------ */
/* Exports used by the router                                          */
/* ------------------------------------------------------------------ */

function mount(root, ctx) {

          <li>Adding less water makes every unit stronger, not the vial bigger.</li>

function mount(root) {
  const $ = (id) => root.querySelector(`#${id}`);
  const vial = $("calc-vial");
  const diluent = $("calc-diluent");
  const dose = $("calc-dose");
  const syringe = $("calc-syringe");
  const freq = $("calc-freq");
  const preset = $("calc-preset");
  if (!vial || !diluent || !dose || !syringe || !freq) return;

  const num = (el, fallback = 0) => {
    const v = Number(String(el.value).replace(",", "."));

  const syringeMeta = () => SYRINGES.find((s) => s.id === syringe.value) || SYRINGES[0];

    const volumeMl = mcg / concMcgPerMl;

    const dosesPerVial = (mg * 1000) / mcg;
    const perDay = perWeek / 7;
    const days = dosesPerVial / (perDay || 1);
    const upm = s.unitsPerMl / concMcgPerMl;

    const set = (id, text) => {
      const el = $(id);
      if (el) el.textContent = text;
    };

    set("out-units", s.unitsPerMl === 1 ? fmt(volumeMl, 3) : fmt(units, 1));
    set("out-suffix", s.unitsPerMl === 1 ? "mL" : "units");
    set("out-ml", `${fmt(volumeMl, 3)} mL drawn`);
    set("out-conc", `${fmt(concMcgPerMl, concMcgPerMl >= 100 ? 0 : 1)} mcg/mL`);
    set("out-vol", `${fmt(volumeMl, 3)} mL`);
    set("out-doses", fmt(dosesPerVial, dosesPerVial >= 10 ? 0 : 1));
    set("out-days", Number.isFinite(days) && days > 0 ? `${fmt(days, days >= 20 ? 0 : 1)} days` : "—");
    set("out-upm", `${fmt(upm, 3)} ${s.unitsPerMl === 1 ? "mL" : "units"}/mcg`);

    const fill = $("cs-fill");
    if (fill) {
      const ratio = s.unitsPerMl === 1 ? volumeMl / s.capacity : units / s.capacity;
      fill.style.width = `${Math.max(1.5, Math.min(100, ratio * 100))}%`;
      fill.classList.toggle("over", ratio > 1);
    }

    let warn = "";
    if (units > s.capacity) warn = "That dose needs more than this syringe holds. Use a larger syringe or a stronger concentration.";
    else if (units < 1 && s.unitsPerMl > 1) warn = "Under one unit cannot be measured accurately on this syringe. Add less diluent or use a smaller syringe.";
    else if (concMcgPerMl > 20000) warn = "Concentration is very high; small measurement errors become large dose errors.";

    [vial, diluent, dose].forEach((el) => el && el.addEventListener(evt, compute));
    syringe.addEventListener(evt, compute);
    freq.addEventListener(evt, compute);

  if (preset) {
    preset.addEventListener("change", () => {
      const opt = preset.selectedOptions[0];
      if (!opt) return;
      if (opt.dataset.vial) vial.value = opt.dataset.vial;
      if (opt.dataset.diluent) diluent.value = opt.dataset.diluent;
      if (opt.dataset.dose) dose.value = opt.dataset.dose;
      compute();
    });
  }

  root.addEventListener("click", async (ev) => {
    const d = ev.target.closest("[data-diluent]");
    if (d) {
      diluent.value = d.dataset.diluent;
      compute();
      return;
    }
    if (ev.target.closest("#calc-copy")) {
      const s = syringeMeta();
      const text = [
        `Vial: ${num(vial, 1)} mg in ${num(diluent, 1)} mL`,
        `Concentration: ${(($("out-conc") || {}).textContent || "").trim()}`,
        `Dose: ${num(dose, 0)} mcg → ${(($("out-units") || {}).textContent || "").trim()} ${s.unitsPerMl === 1 ? "mL" : "units"} on ${s.label}`,
        `Doses per vial: ${(($("out-doses") || {}).textContent || "").trim()}`,
        "Reference arithmetic only — not a dosing recommendation.",
      ].join("\n");
      const ok = await copyText(text);
      toast(ok ? "Calculation copied" : "Copy failed", ok ? "ok" : "danger");
    }
  });

  compute();
}

exports.default = { render: calculator, mount };
exports.calculator = calculator;
exports.mount = mount;

});

"use strict";
/* Compare — put two or three compounds next to each other on the facts that matter.
 *
 * One DOM, two layouts: a matrix on desktop (label column + one column per
 * compound) and stacked attribute blocks on a phone, where every value is
 * prefixed with the compound it belongs to.

  ["sertraline", "fluoxetine"],

function clean(list) {

    const c = getCompound(id);
    if (!c || seen.has(c.id)) continue;
    seen.add(c.id);
    out.push(c.id);
    if (out.length >= MAX) break;

}

/* Rows                                                               */
/* ------------------------------------------------------------------ */

const val = (n) => (Number(n) > 0 ? fmt.duration(Number(n)) : "—");

const ROWS = [
  {

  },
  { label: "Duration", mono: true, get: (c) => val(c.pk?.duration) },
  { label: "Metabolism", get: (c) => `<span class="small muted">${esc(c.pk?.metabolism || "—")}</span>` },
  {
    label: "Clearance route",
    get: (c) => `<span class="small muted">${esc(c.pk?.excretion || "—")}</span>`,
  },
  {
    label: "Typical dose",
    get: (c) => {
      const doses = (c.doses || []).filter((d) => d && d.low);
      if (!doses.length) return "—";

        .slice(0, 2)

  render(ctx) {

      appliedQuery = fromQuery;
      const next = clean(fromQuery.split(","));

    }

    const list = pickers(state.ids);

    return `${pageHead(
      "Compare",
      "The same set of facts, side by side — kinetics, mechanism, dose and the parts that bite.",
      `<button class="btn ghost sm" data-act="link">${icon("link", 14)} Copy link</button>`
    )}

    ${backLink("#/compounds", "Compounds")}

    <div class="card" style="margin-bottom:14px">
      <div class="stack" style="gap:10px">
        ${list
          .map(
            (c, i) => `<div class="row" style="gap:8px">
              <select class="select" data-slot="${i}" style="flex:1;min-width:0">
                ${COMPOUNDS.map((x) => `<option value="${esc(x.id)}" ${x.id === c.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}

                list.length > 2

                  : ""
              }
            </div>`
          )
          .join("")}
        ${
          list.length < MAX
            ? `<button class="btn ghost sm block" data-act="add">${icon("plus", 14)} Add a third compound</button>`
            : ""
        }
        <div class="row wrap" style="gap:6px;padding-top:2px">
          ${PRESETS.filter((p) => p.every((id) => getCompound(id)))
            .map((p) => {
              const a = getCompound(p[0]);

              return `<button class="chip chip-btn" data-preset="${esc(p.join(","))}">${esc(a.name)} × ${esc(b.name)}</button>`;

      </div>
    </div>

    ${
      list.length < 2
        ? callout("info", "Pick two compounds", "Choose a second compound above — the table fills in as soon as there are two.")

      )}
    </div>`;
  },

      const base = `#/compare?ids=${state.ids.join(",")}`;

        history.replaceState(null, "", `${location.pathname}${location.search}${base}`);

        copyText(compareUrl(state.ids), "Comparison link copied");
        return;
      }
    });
  },
};

exports.default = compare;
exports.compare = compare;

/* Compound browser + detail */

const {  esc, icon, store, fmt, toast, copyText, evidenceChip, EVIDENCE, emptyState, disclaimer, awardXP  } = require("../core.js");

/* ------------------------------------------------------------------ */
/* List                                                                */
/* ------------------------------------------------------------------ */

const listState = { q: "", cls: "", ev: "", sort: "name", tag: "" };

function applyFilters() {
  let items = listState.q ? searchCompounds(listState.q) : COMPOUNDS.slice();
  if (listState.cls) items = items.filter((c) => c.cls === listState.cls);
  if (listState.ev) items = items.filter((c) => c.evidence === listState.ev);
  if (listState.tag) items = items.filter((c) => (c.tags || []).includes(listState.tag));

  if (listState.sort === "name") items.sort((a, b) => a.name.localeCompare(b.name));
  else if (listState.sort === "evidence") items.sort((a, b) => EV_ORDER.indexOf(a.evidence) - EV_ORDER.indexOf(b.evidence) || a.name.localeCompare(b.name));

  else if (listState.sort === "class") items.sort((a, b) => a.cls.localeCompare(b.cls) || a.name.localeCompare(b.name));

}

function resultsHtml() {

  }

      if (ev.target.closest('[data-act="clear-tag"]')) {
        listState.tag = "";
        if (ctx.navigate) ctx.navigate("#/compounds");
        else location.hash = "#/compounds";
        return;
      }
      const reset = ev.target.closest('[data-act="reset"]');
      if (reset) {
        listState.q = "";
        listState.cls = "";
        listState.ev = "";
        listState.tag = "";
        ctx.rerender();
      }
      if (ev.target.closest('[data-act="random"]')) {
        const pick = COMPOUNDS[Math.floor(Math.random() * COMPOUNDS.length)];
        location.hash = `#/compounds/${pick.id}`;
      }
    });
  },
};
