const detailState = { tab: "overview" };

function inStack(id) {
  return (store.data.stack || []).includes(id);
}
function isSaved(id) {
  return (store.data.saved || []).includes(id);
}

const SYSTEMS_BY_FLAG = (() => {
  const map = new Map();
  for (const s of SYSTEMS) {
    for (const f of s.matchFlags || []) {
      if (!map.has(f)) map.set(f, []);
      map.get(f).push(s);
    }
  }
  return map;
})();

function systemsForCompound(c) {
  const out = new Map();
  for (const flag of c.flags || []) {
    for (const s of SYSTEMS_BY_FLAG.get(flag) || []) out.set(s.id, s);
  }
  return Array.from(out.values());
}

function tabBar(active) {
  const tabs = [
    ["overview", "Overview"],
    ["mechanism", "Mechanism"],
    ["pk", "Kinetics"],
    ["doses", "Doses"],
    ["safety", "Safety"],
    ["research", "Research"],
  ];
  return `<div class="tabs" id="cd-tabs" role="tablist">
    ${tabs.map(([key, label]) => `<button role="tab" aria-selected="${active === key}" class="${active === key ? "on" : ""}" data-tab="${key}">${esc(label)}</button>`).join("")}
  </div>`;
}

function panelOverview(c) {
  const stack = (store.data.stack || []).map((id) => COMPOUND_BY_ID.get(id)).filter((x) => x && x.id !== c.id);

            <div class="eyebrow" style="margin-bottom:7px">Systems involved</div>
            <div class="row wrap" style="gap:6px">
              ${sys.map((s) => `<a class="chip chip-btn" href="#/brain/${esc(s.id)}" style="--dot:${s.color}"><span class="dot" style="background:${s.color}"></span>${esc(s.name)}</a>`).join("")}

        <div><div class="stat-label">T-max</div><div class="mono" style="font-size:13px">${c.pk.tmax ? fmt.duration(c.pk.tmax) : "—"}</div></div>

function panelPK(c) {
  const half = Number(c.pk.halfLife) || 0;
  const data = [];
  if (half > 0) {
    for (let t = 0; t <= Math.min(half * 6, 240); t += Math.max(0.25, half / 12)) {
      const peak = Math.max(1, half / 2.2);
      const v = t < peak ? Math.sin((t / peak) * Math.PI * 0.5) : Math.exp(-0.693 * (t - peak) / half);
      data.push({ x: t, y: Math.max(0.001, v) });
    }
  }
  const series = half > 0 ? [{ color: "var(--accent)", points: data }] : [];
  const ticks = half > 0 ? [0, half, half * 2, half * 3, half * 4].filter((t) => t <= Math.min(half * 6, 240)).map((t) => ({ x: t, label: `${Math.round(t * 10) / 10}h` })) : [];

  return `
  <div class="stack" style="gap:14px">
    <div class="card flush">
      <div class="list">
        ${kvRow("Onset", c.pk.onset ? fmt.duration(c.pk.onset) : "—")}
        ${kvRow("T-max", c.pk.tmax ? fmt.duration(c.pk.tmax) : "—")}
        ${kvRow("Half-life", c.pk.halfLife ? fmt.duration(c.pk.halfLife) : "—")}
        ${kvRow("Duration", c.pk.duration ? fmt.duration(c.pk.duration) : "—")}
        ${kvRow("Metabolism", c.pk.metabolism || "—")}
        ${kvRow("Excretion", c.pk.excretion || "—")}
      </div>
    </div>

    ${
      half > 0
        ? `<div class="card">
            <div class="card-head"><h3 style="font-size:14px">Single-dose decay</h3><span class="spacer"></span><span class="tiny dim mono">t½ ${fmt.duration(half)}</span></div>
            ${lineChart(series, { height: 150, yLabel: "relative plasma level", xTicks: ticks, yMax: 1 })}
            <p class="tiny dim" style="margin-top:8px;line-height:1.5">Schematic first-order decay — absorption simplified. Real curves depend on formulation, food and hepatic blood flow.</p>
            <a class="btn soft sm" style="margin-top:10px" href="#/lab?compound=${esc(c.id)}">${icon("flask", 14)} Simulate doses in the lab</a>
          </div>`
        : ""
    }

    ${
      half >= 2
        ? `<div class="card tight">
            <div class="eyebrow" style="margin-bottom:7px">Timing implications</div>
            <ul class="md-list" style="margin:0;padding-left:18px;font-size:13px;line-height:1.65">
              <li>Steady state after about <strong>${fmt.duration(half * 5)}</strong> of regular dosing.</li>
              <li>Almost eliminated (≈97%) in about <strong>${fmt.duration(half * 5)}</strong> after the last dose.</li>
              <li>${half >= 24 ? "Long half-life: effects accumulate quietly — side effects may appear days into a course." : "Short half-life: levels swing widely between doses; timing matters more than total dose."}</li>
            </ul>
          </div>`
        : ""
    }
  </div>`;
}

function kvRow(k, v) {
  return `<div class="list-row" style="padding:10px 14px">
    <div class="grow"><div class="sub" style="margin:0;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em">${esc(k)}</div>
    <div style="font-size:13px;margin-top:1px">${esc(v)}</div></div>
  </div>`;
}

function panelDoses(c) {
  const doses = c.doses || [];
  return `
  <div class="stack" style="gap:14px">
    ${callout(
      "warn",
      "Reference ranges, not recommendations",
      "These are values reported in the clinical literature for context. Individual dosing depends on weight, age, liver and kidney function, genetics and other drugs."
    )}

    ${
      doses.length
        ? `<div class="card flush">
            <div class="list">
              ${doses
                .map(
                  (d) => `<div class="list-row" style="align-items:flex-start">

                  </div>`

            </div>

        : `<div class="card">${emptyState("pill", "No dose data recorded", "This compound is documented here for mechanism and risk, not for dosing.")}</div>`
    }

    <div class="card tight">
      <div class="eyebrow" style="margin-bottom:6px">Dose-response caution</div>
      <p class="small muted" style="line-height:1.6">
        Most of these compounds have a wider margin than the clinical drugs beside them — but “natural” is a marketing category, not a safety property.
        Contaminants, mislabelling and unmeasured potency cause most supplement-related harm.
      </p>

  </div>`;
}

function fmtNum(n) {
  if (n === undefined || n === null) return "—";

}

function panelSafety(c) {

    ${
      (c.flags || []).length

            <div class="eyebrow" style="margin-bottom:7px">Pharmacological flags</div>

          </div>`

    <div class="row wrap" style="gap:8px">

function panelResearch(c) {

        <a class="btn ghost sm" href="${PM_LINK.search(`"${c.name}" AND (review[pt] OR meta-analysis[pt])`)}" target="_blank" rel="noopener noreferrer">${icon("book", 14)} Reviews for ${esc(c.name)}</a>
        <a class="btn ghost sm" href="#/research?compound=${encodeURIComponent(q)}">${icon("microscope", 14)} Open the Research tab</a>

      <p class="small muted" style="line-height:1.6">${esc(EVIDENCE[c.evidence]?.label || "Unrated")} — assigned from the quality and consistency of human data, weighting controlled trials over mechanistic plausibility.</p>
    </div>

/** Fetch the live PubMed block inside the research panel. */
async function hydrateLive(host, c) {
  const box = host && host.querySelector ? host.querySelector("[data-live]") : null;
  if (!box) return;
  const q = c.pubmed || c.name;
  const token = String(Math.random()).slice(2);
  box.dataset.token = token;
  box.innerHTML = `<div class="stack" style="gap:9px">
      <div class="skeleton" style="height:14px;width:78%"></div>
      <div class="skeleton" style="height:11px;width:46%"></div>
      <div class="skeleton" style="height:11px;width:92%"></div>
      <div class="skeleton" style="height:11px;width:64%"></div>
    </div>`;

  try {
    const res = await searchPapers(q, { retmax: 4 });
    if (box.dataset.token !== token) return;
    if (!res.papers.length) {
      box.innerHTML = `<p class="small dim" style="line-height:1.6">PubMed returned no records for “${esc(q)}”. That usually means the stored query is too specific — try the plain compound name.</p>
        <a class="btn ghost xs" href="#/research?compound=${encodeURIComponent(c.name)}" style="margin-top:8px">${icon("search", 13)} Search “${esc(c.name)}”</a>`;
      return;
    }
    box.innerHTML = `<div class="stack" style="gap:10px">${res.papers.map((p, i) => paperCard(p, i)).join("")}</div>
      <div class="row between wrap" style="gap:8px;margin-top:11px">
        <span class="tiny dim">${res.total.toLocaleString()} records · ${res.ms} ms · live, not stored</span>
        <a class="btn ghost xs" href="#/research?compound=${encodeURIComponent(q)}">Open in Research ${icon("arrowRight", 13)}</a>
      </div>`;
  } catch (err) {
    if (box.dataset.token !== token) return;
    box.innerHTML = `<p class="small" style="color:var(--warn);line-height:1.6">${icon("wifiOff", 14)} Could not reach NCBI${err && err.message ? ` — ${esc(err.message)}` : ""}.</p>
      <div class="row wrap" style="gap:8px;margin-top:9px">
        <button class="btn soft xs" data-live-retry>${icon("refresh", 13)} Retry</button>
        <a class="btn ghost xs" href="${PM_LINK.search(q)}" target="_blank" rel="noopener noreferrer">${icon("external", 13)} PubMed</a>
      </div>`;
  }
}

function findingRow(f) {
  const cls = f.severity === "critical" ? "crit" : f.severity === "major" ? "bad" : "warn";
  return `<div class="card tight" style="border-color:var(--line-soft);padding:11px">
    <div class="row between" style="align-items:flex-start;gap:8px;margin-bottom:5px">
      <strong style="font-size:13px;line-height:1.35">${esc(f.title)}</strong>
      <span class="chip chip-${cls}" style="flex:none">${esc(SEVERITY[f.severity]?.label || "")}</span>
    </div>
    <p class="tiny dim" style="line-height:1.5;margin-bottom:4px">${esc(f.a)} × ${esc(f.b)}</p>
    <p class="tiny muted" style="line-height:1.5">${esc(f.mechanism)}</p>
  </div>`;
}

function panel(c, tab) {
  switch (tab) {
    case "mechanism":
      return panelMechanism(c);
    case "pk":
      return panelPK(c);
    case "doses":
      return panelDoses(c);
    case "safety":
      return panelSafety(c);
    case "research":
      return panelResearch(c);
    default:
      return panelOverview(c);
  }
}

const detail = {
  render(ctx) {
    const c = getCompound(ctx.params.id);
    if (!c) {
      return `<div class="card">${emptyState("search", "Compound not found", `No entry for “${ctx.params.id}”.`, `<a class="btn ghost sm" href="#/compounds">${icon("arrowLeft", 14)} Back to compounds</a>`)}</div>`;
    }
    if (detailState.id !== c.id) {
      detailState.id = c.id;
      detailState.tab = "overview";
    }
    const saved = isSaved(c.id);
    const partner = COMPOUNDS.find((x) => x.id !== c.id && x.cls === c.cls) || COMPOUNDS.find((x) => x.id !== c.id);

    return `
    <div class="row" style="margin-bottom:14px">
      ${backLink("#/compounds", "Compounds")}
      <span class="spacer"></span>
      <button class="icon-btn ${saved ? "accent" : ""}" data-act="save" aria-label="Save entry" title="Save entry">${icon("star", 18)}</button>
      <button class="icon-btn" data-act="copy" aria-label="Copy summary" title="Copy summary">${icon("copy", 17)}</button>
    </div>

    <header class="detail-head">
      <div class="row wrap" style="gap:7px">
        <span class="chip" style="--dot:${classColor(c.cls)}"><span class="dot" style="background:${classColor(c.cls)}"></span>${esc(c.cls)}</span>
        ${c.subcls ? `<span class="chip">${esc(c.subcls)}</span>` : ""}
        ${c.status ? `<span class="chip">${esc(c.status)}</span>` : ""}
        ${evidenceChip(c.evidence)}
      </div>
      <h1 class="detail-title">${esc(c.name)}</h1>
      ${(c.aliases || []).length ? `<p class="detail-alias">also: ${c.aliases.map(esc).join(" · ")}</p>` : ""}
      <div class="row wrap" style="gap:8px;margin-top:4px">
        <button class="btn ${inStack(c.id) ? "soft" : "primary"} sm" data-act="stack">${icon(inStack(c.id) ? "check" : "plus", 14)} ${inStack(c.id) ? "In stack" : "Add to stack"}</button>
        <a class="btn ghost sm" href="#/lab?compound=${esc(c.id)}">${icon("flask", 14)} Lab</a>
        <a class="btn ghost sm" href="#/lab/interactions?add=${esc(c.id)}">${icon("shield", 14)} Interactions</a>
        ${partner ? `<a class="btn ghost sm" href="#/compare?ids=${esc(c.id)},${esc(partner.id)}">${icon("grid", 14)} Compare</a>` : ""}
      </div>
    </header>

    ${tabBar(detailState.tab)}
    <div id="cd-panel">${panel(c, detailState.tab)}</div>
    <div style="margin-top:24px">${disclaimer()}</div>`;
  },

  mount(root, ctx) {
    const c = getCompound(ctx.params.id);
    if (!c) return;
    const panelEl = root.querySelector("#cd-panel");

    root.querySelector("#cd-tabs")?.addEventListener("click", (ev) => {
      const btn = ev.target.closest("[data-tab]");
      if (!btn) return;
      detailState.tab = btn.dataset.tab;
      root.querySelectorAll("#cd-tabs [data-tab]").forEach((b) => {
        const on = b === btn;
        b.classList.toggle("on", on);
        b.setAttribute("aria-selected", String(on));
      });
      panelEl.innerHTML = panel(c, detailState.tab);
      if (detailState.tab === "research") hydrateLive(panelEl, c);

"use strict";
/* Notebook: private notes attached to compounds, tags and questions */

const {  esc, icon, store, toast, uid, fmt, emptyState  } = require("../core.js");
const {  COMPOUND_BY_ID, getCompound, resolveCompound, searchCompounds  } = require("../data/compounds.js");
const {  pageHead, callout, classColor  } = require("./ui.js");

const state = { q: "", tag: "" };

function notes() {
  return (store.data.notes || []).slice().sort((a, b) => String(b.updatedAt || b.at || "").localeCompare(String(a.updatedAt || a.at || "")));
}

function allTags() {
  return Array.from(new Set(notes().flatMap((n) => n.tags || []))).sort();
}

function filtered() {
  let list = notes();
  if (state.tag) list = list.filter((n) => (n.tags || []).includes(state.tag));
  const q = state.q.trim().toLowerCase();
  if (q) list = list.filter((n) => `${n.title} ${n.body} ${(n.tags || []).join(" ")}`.toLowerCase().includes(q));
  return list;
}

function noteCard(n) {
  const c = n.compoundId ? COMPOUND_BY_ID.get(n.compoundId) : null;
  const when = n.updatedAt || n.at;
  return `<article class="card" data-note="${esc(n.id)}">
    <div class="row between" style="align-items:flex-start;gap:8px;margin-bottom:5px">
      <h3 style="font-size:14.5px;line-height:1.3">${esc(n.title || "Untitled")}</h3>
      <div class="row" style="gap:2px;flex:none">
        <button class="icon-btn" data-edit="${esc(n.id)}" aria-label="Edit note" style="width:32px;height:32px">${icon("edit", 15)}</button>
        <button class="icon-btn" data-del="${esc(n.id)}" aria-label="Delete note" style="width:32px;height:32px">${icon("trash", 15)}</button>
      </div>
    </div>
    ${n.body ? `<p class="small muted" style="line-height:1.55;white-space:pre-wrap;max-height:9.5em;overflow:hidden">${esc(n.body)}</p>` : ""}
    <div class="row wrap" style="gap:5px;margin-top:9px">
      ${c ? `<a class="chip chip-btn" href="#/compounds/${esc(c.id)}"><span class="dot" style="background:${classColor(c.cls)}"></span>${esc(c.name)}</a>` : ""}
      ${(n.tags || []).map((t) => `<button class="chip chip-btn" data-tagjump="${esc(t)}">#${esc(t)}</button>`).join("")}
      ${when ? `<span class="tag" style="margin-left:auto">${esc(fmt.relTime(when))}</span>` : ""}
    </div>
  </article>`;
}

function listHtml() {
  const list = filtered();
  if (!list.length) {
    const empty = notes().length
      ? emptyState("search", "No notes match", "Try a different search or clear the tag filter.", `<button class="btn ghost sm" data-act="clear-filter">${icon("refresh", 14)} Clear filters</button>`)
      : emptyState("edit", "No notes yet", "Write down the mechanism you keep forgetting, a question for your doctor, or a paper you want to re-read.", `<button class="btn soft sm" data-act="new">${icon("plus", 14)} New note</button>`);
    return `<div class="card">${empty}</div>`;
  }
  return `<div class="grid grid-2" style="gap:10px">${list.map(noteCard).join("")}</div>`;
}

function sheetHtml(note) {
  const n = note || { id: "", title: "", body: "", tags: [], compoundId: "" };
  return `<div class="sheet-host" id="note-sheet">
    <div class="sheet-scrim" data-close="1"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Note editor">
      <div class="sheet-head">
        <h3>${n.id ? "Edit note" : "New note"}</h3>
        <span class="spacer"></span>
        <button class="icon-btn" data-close="1" aria-label="Close">${icon("x", 18)}</button>
      </div>
      <form id="note-form" class="stack" style="gap:12px">
        <input type="hidden" name="id" value="${esc(n.id)}">
        <label class="field">Title
          <input class="input" name="title" value="${esc(n.title)}" placeholder="e.g. Why SSRIs take weeks" required maxlength="120">
        </label>
        <label class="field">Note
          <textarea class="textarea" name="body" placeholder="Write it in your own words — that is the part that sticks.">${esc(n.body)}</textarea>
        </label>
        <label class="field">Attach to compound (optional)
          <input class="input" name="compound" list="note-compounds" value="${esc(n.compoundId ? COMPOUND_BY_ID.get(n.compoundId)?.name || "" : "")}" placeholder="Start typing a name…">
        </label>
        <datalist id="note-compounds">
          ${searchCompounds("").slice(0, 80).map((c) => `<option value="${esc(c.name)}"></option>`).join("")}
        </datalist>
        <label class="field">Tags (comma separated)
          <input class="input" name="tags" value="${esc((n.tags || []).join(", "))}" placeholder="mechanism, question, taper">
        </label>
        <div class="row" style="gap:8px;margin-top:2px">
          <button class="btn ghost" type="button" data-close="1">Cancel</button>
          <button class="btn primary" type="submit" style="flex:1">${icon("check", 15)} Save note</button>
        </div>
      </form>
    </div>
  </div>`;
}

function openSheet(note, rerender) {
  document.querySelectorAll("#note-sheet").forEach((el) => el.remove());
  document.body.insertAdjacentHTML("beforeend", sheetHtml(note));
  const host = document.querySelector("#note-sheet");
  const form = host.querySelector("#note-form");
  const opener = document.activeElement;
  document.documentElement.classList.add("layer-open");
  const close = () => {
    host.remove();
    document.documentElement.classList.remove("layer-open");
    if (opener && document.contains(opener)) {
      try {
        opener.focus({ preventScroll: true });
      } catch (err) {
        /* ignore */
      }
    }
  };
  host.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", (ev) => {
    ev.preventDefault();
    if (ev.target.closest("button[type=\"submit\"]")) return;
    close();
  }));
  form.querySelector('[name="title"]').focus();

  form.addEventListener("submit", (ev) => {
    ev.preventDefault();
    const fd = new FormData(form);
    const title = String(fd.get("title") || "").trim();
    if (!title) return;
    const body = String(fd.get("body") || "").trim();
    const tags = String(fd.get("tags") || "")
      .split(",")
      .map((t) => t.trim().toLowerCase().replace(/^#/, ""))
      .filter(Boolean);
    const comp = resolveCompound(String(fd.get("compound") || "").trim());
    const id = String(fd.get("id") || "");

    store.update((s) => {
      if (!s.notes) s.notes = [];
      if (id) {
        const ex = s.notes.find((x) => x.id === id);
        if (ex) {
          ex.title = title;
          ex.body = body;
          ex.tags = tags;
          ex.compoundId = comp ? comp.id : "";
          ex.updatedAt = new Date().toISOString();
        }
      } else {
        s.notes.unshift({
          id: uid("n"),
          title,
          body,
          tags,
          compoundId: comp ? comp.id : "",
          at: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
        });
      }
    });
    host.remove();
    document.documentElement.classList.remove("layer-open");
    toast(id ? "Note updated" : "Note saved", "success");
    rerender();
  });
}

const notesView = {
  render() {
    const total = notes().length;
    const tags = allTags();
    // A filter can outlive the note that carried the tag.
    if (state.tag && !tags.includes(state.tag)) state.tag = "";
    return `
    ${pageHead(
      "Notebook",
      "Private notes tied to compounds. Stored on this device only — nothing leaves your browser.",
      `<button class="btn primary sm" data-act="new">${icon("plus", 15)} New note</button>`
    )}

    <div class="row wrap" style="gap:8px;margin-bottom:12px">
      <div class="search-input" style="flex:1;min-width:200px">
        ${icon("search", 16)}
        <input class="input" id="note-q" type="search" placeholder="Search notes…" value="${esc(state.q)}">
      </div>
      <span class="tiny dim">${total} note${total === 1 ? "" : "s"}</span>
    </div>

    ${
      tags.length
        ? `<div class="row wrap" style="gap:5px;margin-bottom:14px" id="note-tags">
            <button class="chip chip-btn ${!state.tag ? "on" : ""}" data-tag="">All</button>
            ${tags.map((t) => `<button class="chip chip-btn ${state.tag === t ? "on" : ""}" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")}
          </div>`
        : ""
    }

    <div id="note-list">${listHtml()}</div>

    ${total ? `<div style="margin-top:22px">${callout("info", "Export your notes", "Settings → Data → Export writes the whole state, notes included, to a JSON file you can keep.")}</div>` : ""}`;
  },

  mount(root, ctx) {
    const list = root.querySelector("#note-list");
    const q = root.querySelector("#note-q");

    const repaint = () => {
      list.innerHTML = listHtml();
      const tagBar = root.querySelector("#note-tags");
      if (tagBar) {
        tagBar.innerHTML = `<button class="chip chip-btn ${!state.tag ? "on" : ""}" data-tag="">All</button>${allTags()
          .map((t) => `<button class="chip chip-btn ${state.tag === t ? "on" : ""}" data-tag="${esc(t)}">#${esc(t)}</button>`)
          .join("")}`;
      }
    };

    q?.addEventListener("input", () => {
      state.q = q.value;
      repaint();
    });

    root.addEventListener("click", (ev) => {
      if (ev.target.closest('[data-act="new"]')) {
        openSheet(null, repaint);

      }
      if (ev.target.closest('[data-act="clear-filter"]')) {

        return;

        return;

          s.notes = s.notes.filter((x) => x.id !== n.id);
        });
        toast("Note deleted", "info");
        repaint();
        ctx.refreshCounts?.();
      }
    });
  },
};
exports.notesView = notesView;

});

function bodySvg(selected, sex) {
  return `<svg class="body-svg" viewBox="0 0 300 640" role="img" aria-label="Human organ map">
    <defs>
      <radialGradient id="organGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="var(--accent)" stop-opacity=".55"/>
        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="bodyFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgba(255,255,255,.055)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,.015)"/>
      </linearGradient>
    </defs>

    <g class="body-shape">
      <ellipse cx="150" cy="52" rx="30" ry="34"/>
      <rect x="140" y="80" width="20" height="28" rx="8"/>
      <path d="M104 118 Q150 100 196 118 L190 250 Q190 268 176 276 L124 276 Q110 268 110 250 Z"/>
      <ellipse cx="150" cy="286" rx="32" ry="20"/>
    </g>
    <g class="body-limb">
      <path d="M108 126 L94 214 L98 300"/>
      <path d="M192 126 L206 214 L202 300"/>
      <path d="M134 298 L128 430 L130 566"/>
      <path d="M166 298 L172 430 L170 566"/>
    </g>

    <g class="organ-nodes">
      ${ORGANS.map((o) => {
        const sexOf = SEX_OF[o.id];
        const dim = sexOf && sex !== "all" && sexOf !== sex;
        const sel = o.id === selected;
        const rx = Math.max(3.5, o.rx);
        const ry = Math.max(3.5, o.ry);
        const hit = Math.max(rx, ry) + 9;
        return `<g class="organ-node${sel ? " sel" : ""}${dim ? " dim" : ""}"

            aria-label="${esc(o.name)}" style="--g:${groupHue(o.group)}">

        }
      }
    });
  },
};

  if (pts.length < 3) return pts.map((p, i) => `${i ? "L" : "M"}${p[0]} ${p[1]}`).join(" ");
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) * tension;
    const c1y = p1[1] + (p2[1] - p0[1]) * tension;
    const c2x = p2[0] - (p3[0] - p1[0]) * tension;
    const c2y = p2[1] - (p3[1] - p1[1]) * tension;
    d += ` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;

/** Simple line chart from numeric series; pure SVG, responsive. */
function lineChart(series, { width = 340, height = 140, yLabel = "", xTicks = [], yMax = null } = {}) {
  const uid = `ch${++chartSeq}`;
  const padL = 30;
  const padR = 8;
  const padT = 10;
  const padB = 20;
  const w = width - padL - padR;
  const h = height - padT - padB;
  const maxY = yMax || Math.max(...series.map((s) => Math.max(...s.points.map((p) => p.y))), 0.0001);
  const maxX = Math.max(...series.map((s) => Math.max(...s.points.map((p) => p.x))), 1);

  const sx = (x) => padL + (x / maxX) * w;
  const sy = (y) => padT + h - (y / maxY) * h;

  const gridLines = [0, 0.25, 0.5, 0.75, 1]
    .map((f) => {
      const y = padT + h - f * h;

      <text class="chart-axis" x="${padL - 5}" y="${(y + 2.5).toFixed(1)}" text-anchor="end">${(maxY * f).toFixed(f === 0 ? 0 : 1)}</text>`;
    })
    .join("");

    .map((s, si) => {

      const gid = `${uid}-${si}`;

    })
    .join("");

  const xLabels = xTicks
    .map((t) => `<text class="chart-axis" x="${sx(t.x).toFixed(1)}" y="${height - 5}" text-anchor="middle">${esc(t.label)}</text>`)
    .join("");

  return `<div class="chart-box"><svg class="chart-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(yLabel || "chart")}">
    ${gridLines}${paths}${xLabels}
    <line class="chart-grid" x1="${padL}" y1="${padT + h}" x2="${width - padR}" y2="${padT + h}"/>
    ${yLabel ? `<text class="chart-axis" x="${padL}" y="7" text-anchor="start">${esc(yLabel)}</text>` : ""}
  </svg></div>`;
}
