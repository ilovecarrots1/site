/* ==========================================================================
   NeuroDifference — design system
   Mobile first. Desktop upgrades at 900px (sidebar) and 1200px (two columns).
   ========================================================================== */

:root {
  color-scheme: dark;

  --bg: #0b0d10;
  --bg-1: #0f1216;
  --bg-2: #14181e;
  --bg-3: #1a1f27;
  --line: #232a34;
  --line-soft: #1b212a;

  --text: #e6e8eb;
  --text-2: #a9b2bf;
  --text-3: #78828f;

  --accent: #8b7bff;
  --accent-2: #6f5cff;
  --accent-ink: #ffffff;
  --accent-soft: rgba(139, 123, 255, 0.14);
  --accent-line: rgba(139, 123, 255, 0.35);

  --good: #3fb950;
  --ok: #6fb3ff;
  --warn: #d29922;
  --bad: #f0883e;
  --critical: #f85149;

  --radius-s: 8px;
  --radius: 14px;
  --radius-l: 20px;
  --radius-xl: 26px;

  --pad: 16px;
  --gap: 12px;
  --tap: 44px;

  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-2: 0 12px 32px -12px rgba(0, 0, 0, 0.75);
  --shadow-3: 0 24px 64px -20px rgba(0, 0, 0, 0.85);

  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

  --nav-h: 62px;
  --top-h: 56px;
  --sidebar-w: 258px;
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
}

[data-accent="amber"] { --accent: #f2b23e; --accent-2: #e09b1c; --accent-ink: #1a1206; --accent-soft: rgba(242, 178, 62, 0.14); --accent-line: rgba(242, 178, 62, 0.35); }
[data-accent="teal"] { --accent: #2fd6c4; --accent-2: #17bda9; --accent-ink: #04231f; --accent-soft: rgba(47, 214, 196, 0.14); --accent-line: rgba(47, 214, 196, 0.35); }
[data-accent="rose"] { --accent: #ff6b8a; --accent-2: #f04a6e; --accent-ink: #2a0710; --accent-soft: rgba(255, 107, 138, 0.14); --accent-line: rgba(255, 107, 138, 0.35); }
[data-accent="green"] { --accent: #4ade80; --accent-2: #2fbf66; --accent-ink: #04220f; --accent-soft: rgba(74, 222, 128, 0.14); --accent-line: rgba(74, 222, 128, 0.35); }
[data-accent="blue"] { --accent: #60a5fa; --accent-2: #3b82f6; --accent-ink: #05142c; --accent-soft: rgba(96, 165, 250, 0.14); --accent-line: rgba(96, 165, 250, 0.35); }

[data-density="compact"] { --pad: 12px; --gap: 9px; --radius: 11px; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { margin: 0; padding: 0; }

html {
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  color: var(--text);
  background:
    radial-gradient(1000px 520px at 82% -8%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 68%),
    radial-gradient(760px 420px at 8% 4%, rgba(63, 185, 80, 0.06), transparent 70%),
    var(--bg);
  min-height: 100dvh;
  overflow-x: hidden;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

img, svg { max-width: 100%; }
svg.ic { flex: none; display: inline-block; vertical-align: -0.15em; }

/* Scroll lock while a drawer, sheet or search overlay is open. */
html.layer-open, html.layer-open body { overflow: hidden; }
html.layer-open { overscroll-behavior: none; }

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}

::selection { background: var(--accent-soft); }

h1, h2, h3, h4 { margin: 0; font-weight: 650; letter-spacing: -0.015em; line-height: 1.25; }
p { margin: 0; }

hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }

/* ------------------------------------------------------------------ */
/* Scrollbars                                                          */
/* ------------------------------------------------------------------ */

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #262e39; border-radius: 99px; border: 3px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: #333d4a; }

/* ------------------------------------------------------------------ */
/* Shell                                                               */
/* ------------------------------------------------------------------ */

#root { min-height: 100dvh; }

.app {
  display: grid;
  grid-template-columns: 1fr;
  min-height: 100dvh;
}

.sidebar { display: none; }

.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 100dvh;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  height: calc(var(--top-h) + env(safe-area-inset-top, 0px));
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 var(--pad);
  padding-top: env(safe-area-inset-top, 0px);
  background: rgba(11, 13, 16, 0.86);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px) saturate(1.3);
  -webkit-backdrop-filter: blur(14px) saturate(1.3);
  border-bottom: 1px solid var(--line-soft);
}

[data-scrolled="true"] .topbar { border-bottom-color: var(--line); }

.topbar .brand {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text);
  text-decoration: none;
}

.brand-mark {
  width: 28px;
  height: 28px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  background: linear-gradient(150deg, var(--accent), var(--accent-2));
  color: var(--accent-ink);
  box-shadow: 0 6px 18px -8px var(--accent);
  flex: none;
}

.brand-text { display: flex; flex-direction: column; line-height: 1.05; min-width: 0; }
.brand-text b { font-size: 14px; font-weight: 700; }
.brand-text span { font-size: 10px; color: var(--text-3); letter-spacing: 0.04em; text-transform: uppercase; }

.topbar-title {
  display: none;
  font-size: 15px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}

.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  color: var(--text-2);
  border: 1px solid transparent;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.icon-btn:hover { background: var(--bg-2); color: var(--text); border-color: var(--line); }
.icon-btn:active { transform: scale(0.95); }
.icon-btn.accent { color: var(--accent); }

.view {
  flex: 1;
  width: 100%;
  max-width: 1180px;
  margin: 0 auto;
  padding: 18px var(--pad) calc(var(--nav-h) + 26px + env(safe-area-inset-bottom, 0px));
  animation: viewIn 0.26s var(--ease);
}

@keyframes viewIn {
  from { opacity: 0; transform: translateY(7px); }
  to { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  .view { animation: none; }
  * { scroll-behavior: auto !important; }
}

/* ------------------------------------------------------------------ */
/* Bottom nav (mobile)                                                 */
/* ------------------------------------------------------------------ */

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 50;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: var(--bg-1);
  background: color-mix(in srgb, var(--bg-1) 92%, transparent);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-top: 1px solid var(--line);
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--text-3);
  font-size: 10.5px;
  font-weight: 550;
  text-decoration: none;
  position: relative;
  transition: color 0.16s;
  padding-top: 4px;
}
.nav-item svg { transition: transform 0.18s var(--ease); }
.nav-item:hover { color: var(--text-2); text-decoration: none; }
.nav-item.active { color: var(--accent); }
.nav-item.active svg { transform: translateY(-1px) scale(1.06); }
.nav-item.active::before {
  content: "";
  position: absolute;
  top: 0;
  width: 26px;
  height: 2.5px;
  border-radius: 0 0 3px 3px;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
}

/* ------------------------------------------------------------------ */
/* Typography bits                                                     */
/* ------------------------------------------------------------------ */

.page-head { margin: 2px 0 18px; }
.page-head h1 { font-size: 24px; letter-spacing: -0.03em; }
.page-head p { color: var(--text-2); font-size: 13.5px; margin-top: 5px; max-width: 62ch; }

.eyebrow {
  font-size: 10.5px;
  font-weight: 650;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
}

.muted { color: var(--text-2); }
.dim { color: var(--text-3); }
.mono { font-family: var(--mono); font-size: 0.92em; letter-spacing: -0.02em; }
.nowrap { white-space: nowrap; }
.center { text-align: center; }
.tiny { font-size: 11.5px; }
.small { font-size: 13px; }
.lead { font-size: 15.5px; color: var(--text-2); line-height: 1.6; }

.good { color: var(--good); }
.warn { color: var(--warn); }
.bad { color: var(--bad); }
.crit { color: var(--critical); }
.accent { color: var(--accent); }

/* ------------------------------------------------------------------ */
/* Cards & panels                                                      */
/* ------------------------------------------------------------------ */

.card {
  background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: var(--pad);
  position: relative;
}

.card.tight { padding: 12px; }
.card.flush { padding: 0; overflow: hidden; }
.card.hoverable { transition: border-color 0.16s, transform 0.16s var(--ease), background 0.16s; }
.card.hoverable:hover { border-color: #2f3947; transform: translateY(-2px); }
.card.hoverable:active { transform: translateY(0); }
.card.glow { border-color: var(--accent-line); box-shadow: 0 0 0 1px var(--accent-soft), 0 18px 40px -24px var(--accent); }

.card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.card-head h3 { font-size: 15px; }
.card-head .spacer { margin-left: auto; }

.block { margin: 0 0 26px; }
.block-head { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 12px; }
.block-head h2 { font-size: 16.5px; letter-spacing: -0.02em; }
.block-sub { font-size: 12.5px; color: var(--text-3); margin-top: 3px; }
.block-head > :last-child:not(:first-child) { margin-left: auto; }

.grid { display: grid; gap: var(--gap); }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: 1fr; }
.grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-auto { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.row.top { align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 10px; }
.spacer { margin-left: auto; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.stack-3 { display: flex; flex-direction: column; gap: 3px; }

@media (min-width: 560px) {
  .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

/* ------------------------------------------------------------------ */
/* Buttons                                                             */
/* ------------------------------------------------------------------ */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 40px;
  padding: 0 15px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: var(--bg-3);
  color: var(--text);
  font-size: 13.5px;
  font-weight: 600;
  transition: background 0.15s, border-color 0.15s, transform 0.1s, color 0.15s;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
}
.btn:hover { background: #222a34; border-color: #333d4a; text-decoration: none; }
.btn:active { transform: scale(0.975); }
.btn.primary {
  background: linear-gradient(160deg, var(--accent), var(--accent-2));
  border-color: transparent;
  color: var(--accent-ink);
  box-shadow: 0 8px 22px -12px var(--accent);
}
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--text-2); }
.btn.ghost:hover { color: var(--text); background: var(--bg-2); }
.btn.soft { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
</style>

    <script type="module">
/* Self-contained build: every module is inlined and stitched into blob URLs
   in dependency order, so relative imports resolve without a web server. */
const SRC = {"/app/core.js":"/* NeuroDifference core runtime\n * Zero dependencies. Small utilities, state store, markdown, icons, toasts.\n */\n\nexport const VERSION = \"2.1.5\";\n\n/* ------------------------------------------------------------------ */\n/* DOM + string helpers                                                */\n/* ------------------------------------------------------------------ */\n\nconst ESC_MAP = { \"&\": \"&amp;\", \"\u003c\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" };\n\n/** Escape a value for safe interpolation into HTML. */\nexport function esc(value) {\n  if (value === null || value === undefined) return \"\";\n  return String(value).replace(/[&\u003c>\"']/g, (c) => ESC_MAP[c]);\n}\n\nexport const qs = (sel, root = document) => root.querySelector(sel);\nexport const qsa = (sel, root = document) => Array.from(root.querySelectorAll(sel));\n\n/** Create an element from an HTML string. */\nexport function frag(html) {\n  const t = document.createElement(\"template\");\n  t.innerHTML = html.trim();\n  return t.content.firstElementChild;\n}\n\nexport function on(root, eventName, selector, handler) {\n  root.addEventListener(eventName, (ev) => {\n    const target = ev.target instanceof Element ? ev.target.closest(selector) : null;\n    if (target && root.contains(target)) handler(ev, target);\n  });\n}\n\nexport function debounce(fn, wait = 180) {\n  let t;\n  return (...args) => {\n    clearTimeout(t);\n    t = setTimeout(() => fn(...args), wait);\n  };\n}\n\nexport function throttle(fn, wait = 120) {\n  let last = 0;\n  let timer = null;\n  return (...args) => {\n    const now = Date.now();\n    const remaining = wait - (now - last);\n    if (remaining \u003c= 0) {\n      last = now;\n      fn(...args);\n    } else if (!timer) {\n      timer = setTimeout(() => {\n        timer = null;\n        last = Date.now();\n        fn(...args);\n      }, remaining);\n    }\n  };\n}\n\nexport const clamp = (v, min, max) => Math.min --------------------------------------------------- */\n/* Dates                                                               */\n/* ------------------------------------------------------------------ */\n\nexport function dayKey(d = new Date()) {\n  const dt = new Date(d.getTime() - d.getTimezoneOffset() * 60000);\n  return dt.toISOString().slice(0, 10);\n}\n\nexport function daysBetween(aKey, bKey) {\n  if (!aKey || !bKey) return Infinity;\n  const a = new Date(`${aKey}T00:00:00`);\n  const b = new Date(`${bKey}T00:00:00`);\n  return Math.round((b - a) / 86400000);\n}\n\n/* ------------------------------------------------------------------ */\n/* Markdown-lite renderer (safe: escapes first, then formats)           */\n/* ------------------------------------------------------------------ */\n\nfunction inlineMd(text) {\n  let out = esc(text);\n  out = out.replace(/`([^`]+)`/g, (_, code) => `\u003ccode>${code}\u003c/code>`);\n  out = out.replace(/\\*\\*([^*]+)\\*\\*/g, \"\u003cstrong>$1\u003c/strong>\");\n  out = out.replace(/(^|[\\s(])\\*([^*\\n]+)\\*/g, \"$1\u003cem>$2\u003c/em>\");\n  out = out.replace(/(^|[\\s(])_([^_\\n]+)_/g, \"$1\u003cem>$2\u003c/em>\");\n  out = out.replace(/\\[([^\\]]+)\\]\\(([^)\\s]+)\\)/g, (_, label, href) => {\n    const safe = /^(https?:\\/\\/|#|\\/|mailto:)/i.test(href) ? href : \"#\";\n    const ext = /^https?:/i.test(safe);\n    return `\u003ca href=\"${safe}\"${ext ? ' target=\"_blank\" rel=\"noopener noreferrer\"' : \"\"}>${label}\u003c/a>`;\n  });\n  return out;\n}\n\n/** Render a small markdown subset. HTML inside the source is escaped. */\nexport function md(source) {\n  if (!source) return \"\";\n  const lines = String(source).replace(/\\r\\n/g, \"\\n\").split(\"\\n\");\n  const out = [];\n  let listType = null;\n  let inCode = false;\n  let para = [];\n\n  const flushPara = () => {\n    if (para.length) {\n      out.push(`\u003cp>${para.map(inlineMd).join(\"\u003cbr>\")}\u003c/p>`);\n      para = [];\n    }\n  };\n  const clos ;\n}\n\nexport const CLASSES = Array.from(new Set(COMPOUNDS.map((c) => c.cls))).sort();\n\nexport const EVIDENCE_ORDER = [\"strong\", \"moderate\", \"limited\", \"preclinical\", \"anecdotal\"];\n\nexport const ALL_FLAGS = Array.from(new Set(COMPOUNDS.flatMap((c) => c.flags))).sort();\n\nexport const ALL_TAGS = Array.from(new Set(COMPOUNDS.flatMap((c) => c.tags))).sort();\n\nexport function compoundsByFlag(flag) {\n  return COMPOUNDS.filter((c) => c.flags.includes(flag));\n}\n\nexport function compoundsByClass(cls) {\n  return COMPOUNDS.filter((c) => c.cls === cls);\n}\n\n/** Free-text search scored by name/alias/class/tag relevance. */\nexport function searchCompounds(query) {\n  const q = String(query || \"\").trim().toLowerCase();\n  if (!q) return COMPOUNDS;\n  const scored = [];\n  for (const c of COMPOUNDS) {\n    let score = 0;\n    const name = c.name.toLowerCase();\n    if (name === q) score = 120;\n    else if (name.startsWith(q)) score = 100;\n    else if (name.includes(q)) score = 80;\n    if (!score && c.aliases.some((a) => a.toLowerCase().includes(q))) score = 70;\n    if (!score && c.cls.toLowerCase().includes(q)) score = 45;\n    if (!score && c.subcls && c.subcls.toLowerCase().includes(q)) score = 40;\n    if (!score && c.tags.some((t) => t.includes(q))) score = 35;\n    if (!score && c.summary.toLowerCase().includes(q)) score = 20;\n    if (!score && c.targets.some((t) => t.name.toLowerCase().includes(q))) score = 25;\n    if (score) scored.push({ c, score });\n  }\n  return scored.sort((a, b) => b.score - a.score || a.c.name.localeCompare(b.c.name)).map((x) => x.c);\n}\n\n/** Resolve loose user input (\"xanax\", \"vyvanse\", \"5htp\") to a compound. */\nexport function resolveCompound(input) {\n  const q = String(input || \"\").trim().toLowerCase();\n  if (!q) return null;\n  if (COMPOUND_BY_ID.has(q)) return COMPOUND_BY_ID.get(q);\n  const normalised = q.replace(/[^a-z0-9]/g, \"\");\n  for (const c of COMPOUNDS) {\n    const candidates = [c.id, c.  clearance: [\n      { mechanism: \"SERT reuptake\", note: \"Target of SSRIs, MDMA, cocaine\" },\n      { mechanism: \"MAO-A degradation → 5-HIAA\", note: \"Primary metabolic route\" },\n      { mechanism: \"Melatonin synthesis\", note: \"Minor route in pineal: 5-HT → NAS → melatonin\" },\n    ],\n    receptors: [\n      { name: \"5-HT1A\", type: \"Gi\", effect: \"Inhibitory\", note: \"Somatodendritic autoreceptor; buspirone agonist\" },\n      { name: \"5-HT2A\", type: \"Gq\", effect: \"Excitatory\", note: \"Psychedelic target; cortical layer V\" },\n      { name: \"5-HT2C\", type: \"Gq\", effect: \"Excitatory\", note: \"Appetite; lorcaserin was an agonist\" },\n      { name: \"5-HT3\", type: \"Ligand-gated\", effect: \"Excitatory\", note: \"Nausea; ondansetron blocks\" },\n      { name: \"5-HT4/6/7\", type: \"Gs\", effect: \"Excitatory\", note: \"Gut motility, cognition, circadian\" },\n    ],\n    interventions: [\n      { point: \"Reuptake\", target: \"SERT\", drugs: [\"sertraline\", \"fluoxetine\", \"escitalopram\", \"vortioxetine\", \"mdma\"], note: \"The most prescribed mechanism in psychiatry\" },\n      { point: \"Precursor\", target: \"5-HTP\", drugs: [\"5-htp\", \"l-tryptophan\"], note: \"Bypasses tryptophan hydroxylase\" },\n      { point: \"Degradation\", target: \"MAO-A\", drugs: [\"phenelzine\", \"moclobemide\"], note: \"Non-selective MAOIs raise 5-HT dramatically\" },\n      { point: \"Receptors\", target: \"5-HT2A\", drugs: [\"psilocybin\", \"lsd\"], note: \"Agonism alters cortical network integration\" },\n      { point: \"Receptors\", target: \"5-HT3 / 5-HT2C\", drugs: [\"mirtazapine\"], note: \"Antagonism gives sedation, appetite, less nausea\" },\n      { point: \"Pineal\", target: \"Melatonin synthesis\", drugs: [\"melatonin\"], note: \"Downstream product used as a chronobiotic\" },\n    ],\n    regions: [\"raphe\", \"prefrontal-cortex\", \"amygdala\", \"hippocampus\", \"pineal\"],\n    matchFlags: [\"serotonergic\", \"maoi\", \"psychedelic\", \"5ht2a-agonist\"],\n    pubmed: \"serotonin receptor subtypes mood behaviour\",\n  },\n  {\n    id: \"acetylcholine\",\n    name: \"Acetylcholine\",\n    abbr: \"ACh\",\n    color: \"#8B7BFF\",\n    tagline: \"Attention, memory, muscle\",\n    summary:\n      \"Two subsystems: basal forebrain cholinergic neurons project to cortex and hippocampus for attention and memory, while brainstem and autonomic neurons handle arousal and muscle control.\",\n    functions: [\"Attention and vigilance\", \"Memory encoding\", \"REM sleep\", \"Muscle contraction (NMJ)\", \"Parasympathetic tone\"],\n    synthesis: [\n      { step: \"Choline uptake\", detail: \"Choline transporter (CHT) is rate-limiting — choline availability caps ACh output\" },\n      { step: \"Acetylcholine\", enzyme: \"Choline acetyltransferase (ChAT)\", cofactor: \"Acetyl-CoA\", note: \"Simple, fast synthesis\" },\n      { step: \"Vesicle loading\", enzyme: \"VAChT\", note: \"Vesamicol blocks it\" },\n    ],\n    clearance: [\n      { mechanism: \"AChE hydrolysis\", note: \"Extremely fast; the target of donepezil, galantamine, huperzine A\" },\n      { mechanism: \"Choline reuptake\", note: \"Recycled for resynthesis\" },\n      { mechanism: \"BChE hydrolysis\", note: \"Secondary, glial\" },\n    ],\n    receptors: [\n      { name: \"M1\", type: \"Gq\", effect: \"Excitatory\", note: \"Cortex, hippocampus; cognition\" },\n      { name: \"M2\", type: \"Gi\", effect: \"Inhibitory\", note: \"Cardiac; autoreceptor\" },\n      { name: \"M3\", type: \"Gq\", effect: \"Excitatory\", note: \"Smooth muscle, secretions\" },\n      { name: \"α4β2 nAChR\", type: \"Ion channel\", effect: \"Excitatory\", note: \"Nicotine's main target in brain\" },\n      { name: \"α7 nAChR\", type: \"Ion channel\", effect: \"Excitatory\", note: \"Calcium influx, attention; galantamine PAM\" },\n    ],\n    interventions: [\n      { point: \"Precursor\", target: \"Choline supply\", drugs: [\"citicoline\", \"alpha-gpc\"], note: \"More substrate is\" },\n      { name: \"GABA-B\", type: \"Gi / K+\", effect: \"Inhibitory\", note: \"Baclofen, phenibut, GHB\" },\n      { name: \"GABA-C (ρ)\", type: \"Cl⁻ channel\", effect: \"Inhibitory\", note: \"Retinal, minor\" },\n    ],\n    interventions: [\n      { point: \"Receptors\", target: \"GABA-A BZD site\", drugs: [\"diazepam\", \"alprazolam\", \"zolpidem\"], note: \"Allosteric potentiation, not direct agonism\" },\n      { point: \"Receptors\", target: \"GABA-B\", drugs: [\"baclofen\", \"phenibut\"], note: \"Direct agonism; phenibut crosses the BBB via its phenyl ring\" },\n      { point: \"Synthesis cofactor\", target: \"GAD / B6\", drugs: [\"glycine\", \"taurine\"], note: \"Indirect modulation, weak evidence\" },\n      { point: \"Metabolism\", target: \"GABA-T\", drugs: [\"valproate\"], note: \"Increases GABA availability\" },\n    ],\n    regions: [\"prefrontal-cortex\", \"amygdala\", \"cerebellum\", \"thalamus\", \"striatum\"],\n    matchFlags: [\"gabaergic\", \"gaba-modulator\", \"sedative\"],\n    pubmed: \"GABA-A receptor benzodiazepine site subtypes\",\n  },\n  {\n    id: \"glutamate\",\n    name: \"Glutamate\",\n    abbr: \"Glu\",\n    color: \"#FF9F45\",\n    tagline: \"Excitation, plasticity, memory\",\n    summary:\n      \"The main excitatory transmitter and the substrate of learning. Too much kills neurons (excitotoxicity), too little produces dissociation — most glutamatergic drugs aim at partial modulation, not full blockade.\",\n    functions: [\"Fast excitatory transmission\", \"Long-term potentiation (memory)\", \"Synaptic plasticity\", \"Pain signalling\", \"Circuit development\"],\n    synthesis: [\n      { step: \"Glutamine\", detail: \"From astrocytes via the glutamate-glutamine cycle\" },\n      { step: \"Glutamate\", enzyme: \"Glutaminase\", note: \"Mitochondrial; also from α-ketoglutarate via transamination\" },\n      { step: \"Vesicle loading\", enzyme: \"VGLUT1/2\", note: \"Concentrates glutamate ~1000×\" },\n    ],\n    clearance: [\n      { mechanism: \"EAAT1/EAAT2 astrocytic uptake\", note: \"The dominant clearance route; EAAT2 handles ~90%\" },\n      { mechanism: \"Glutamine synthetase\", note: \"Astrocytic recycling back to glutamine\" },\n      { mechanism: \"Neuronal EAAT3\", note: \"Minor\" },\n    ],\n    receptors: [\n      { name: \"NMDA\", type: \"Ion channel (Ca2+)\", effect: \"Excitatory\", note: \"Co-agonist glycine required; memantine/ketamine block\" },\n      { name: \"AMPA\", type: \"Ion channel (Na+)\", effect: \"Excitatory\", note: \"Fast transmission; racetams modulate\" },\n      { name: \"Kainate\", type: \"Ion channel\", effect: \"Excitatory\", note: \"Presynaptic modulation\" },\n      { name: \"mGluR2/3\", type: \"Gi\", effect: \"Inhibitory\", note: \"Presynaptic autoreceptor\" },\n      { name: \"mGluR5\", type: \"Gq\", effect: \"Excitatory\", note: \"Plasticity, anxiety\" },\n    ],\n    interventions: [\n      { point: \"Receptors\", target: \"NMDA\", drugs: [\"memantine\", \"ketamine\", \"amantadine\", \"agmatine\"], note: \"Uncompetitive block preserves normal transmission\" },\n      { point: \"Receptors\", target: \"AMPA\", drugs: [\"piracetam\", \"aniracetam\", \"oxiracetam\"], note: \"Positive modulation; weak human evidence\" },\n      { point: \"Co-agonist site\", target: \"GlyT1\", drugs: [\"sarcosine\", \"glycine\"], note: \"Raising glycine increases NMDA co-activation\" },\n      { point: \"Downstream plasticity\", target: \"mTORC1 / BDNF\", drugs: [\"ketamine\", \"psilocybin\", \"semax\"], note: \"The shared final pathway of rapid antidepressants\" },\n    ],\n    regions: [\"hippocampus\", \"prefrontal-cortex\", \"cerebellum\", \"striatum\"],\n    matchFlags: [\"glutamatergic\", \"nmda-antagonist\", \"nmda-modulator\"],\n    pubmed: \"NMDA receptor glutamate plasticity\",\n  },\n  {\n    id: \"adenosine\",\n    name: \"Adenosine\",\n    abbr: \"ADO\",\n    color: \"#9AA6B2\",\n    tagline: \"Sleep pressure, energy balance\",\n    summary:\n      \"Ade "striatum\", \"thalamus\", \"hypothalamus\"],\n    matchFlags: [\"adenosine-antagonist\", \"xanthine\", \"orexin-antagonist\"],\n    pubmed: \"adenosine A2A receptor sleep homeostasis\",\n  },\n  {\n    id: \"endocannabinoid\",\n    name: \"Endocannabinoids\",\n    abbr: \"eCB\",\n    color: \"#77D26B\",\n    tagline: \"Retrograde tuning, appetite, stress\",\n    summary:\n      \"Unlike every other transmitter, endocannabinoids are made on demand and travel backwards: from postsynaptic neuron to presynaptic terminal, where they suppress release. They tune circuits rather than switch them.\",\n    functions: [\"Synaptic tuning (retrograde suppression)\", \"Appetite and food reward\", \"Stress buffering\", \"Pain modulation\", \"Memory extinction\"],\n    synthesis: [\n      { step: \"2-AG\", enzyme: \"DAGL\", note: \"On-demand from diacylglycerol in the postsynaptic membrane\" },\n      { step: \"Anandamide\", enzyme: \"NAPE-PLD\", note: \"From N-arachidonoyl-phosphatidylethanolamine\" },\n      { step: \"Retrograde travel\", note: \"Diffuses to presynaptic CB1 receptors\" },\n    ],\n    clearance: [\n      { mechanism: \"FAAH\", note: \"Degrades anandamide; FAAH inhibitors are investigational\" },\n      { mechanism: \"MAGL\", note: \"Degrades 2-AG — the dominant route\" },\n      { mechanism: \"Reuptake transporters\", note: \"EMT; less defined than monoamine transporters\" },\n    ],\n    receptors: [\n      { name: \"CB1\", type: \"Gi\", effect: \"Inhibitory\", note: \"CNS; THC is a partial agonist\" },\n      { name: \"CB2\", type: \"Gi\", effect: \"Inhibitory\", note: \"Immune; anti-inflammatory\" },\n      { name: \"TRPV1\", type: \"Ion channel\", effect: \"Excitatory\", note: \"Capsaicin/anandamide; pain\" },\n      { name: \"GPR55\", type: \"G12/13\", effect: \"Modulatory\", note: \"Orphan; disputed\" },\n    ],\n    interventions: [\n      { point: \"Receptors\", target: \"CB1\", drugs: [\"cbd\"], note: \"CBD is a negative allosteric modulator, not a direct agonist\" },\n      { point: \"Degradation\", target: \"FAAH / MAGL\", note: \"Investigational; raises endogenous tone rather than flooding receptors\" },\n      { point: \"Receptors\", target: \"TRPV1\", drugs: [\"cbd\"], note: \"Desensitisation contributes to pain relief\" },\n    ],\n    regions: [\"hippocampus\", \"amygdala\", \"striatum\", \"prefrontal-cortex\", \"cerebellum\"],\n    matchFlags: [\"cannabinoid\"],\n    pubmed: \"endocannabinoid retrograde signaling CB1\",\n  },\n  {\n    id: \"orexin\",\n    name: \"Orexin / Hypocretin\",\n    abbr: \"OX\",\n    color: \"#FFD166\",\n    tagline: \"Wake drive, appetite, reward\",\n    summary:\n      \"A small cluster of lateral hypothalamic neurons that keeps you awake and motivated. Their loss causes narcolepsy — and blocking them is now a first-line insomnia strategy.\",\n    functions: [\"Wakefulness stability\", \"Appetite and feeding\", \"Reward seeking\", \"Stress response\", \"Energy balance\"],\n    synthesis: [\n      { step: \"Prepro-orexin\", detail: \"Single gene, cleaved into orexin-A (33 aa) and orexin-B (28 aa)\" },\n      { step: \"Lateral hypothalamus\", note: \"Only ~70,000 neurons in humans — tiny but decisive\" },\n      { step: \"Projections\", note: \"To locus coeruleus, raphe, VTA, basal forebrain, cortex\" },\n    ],\n    clearance: [\n      { mechanism: \"Peptidase degradation\", note: \"No reuptake transporter\" },\n      { mechanism: \"Diurnal regulation\", note: \"Highest during active period, lowest during sleep\" },\n    ],\n    receptors: [\n      { name: \"OX1R\", type: \"Gq\", effect: \"Excitatory\", note: \"Reward and arousal\" },\n      { name: \"OX2R\", type: \"Gq\", effect: \"Excitatory\", note: \"Sleep stability; loss causes narcolepsy\" },\n    ],\n    interventions: [\n      { point: \"Receptors\", target: \"OX1R/OX2R\", drugs: [\"suvorexant\"], note: \"Dual antagonism reduces wake drive without GABA sedation\" },\n      { point: \"Upstream\", target: \"Hypothalamic signalling\", drugs: [\"modafinil\"], note: \"Indirectly increases orexin tone\" },\n    ],\n    regions: [\"hypothalamus\", \"locus-coeruleus\", \"vta\", \"basal-forebrain\"],\n    matchFlags: [\"orexin-antagonist\"],\n    pubmed: \"orexin hypocretin arousal narcolepsy\",\n  },\n  {\n    id: \"histamine\",\n    name: \"Histamine\",\n    abbr: \"His\",\n    color: \"#C084FC\",\n    tagline: \"Wakefulness, itch, gastric acid\",\n    summary:\n      \"Tuberomammillary nucleus histamine neurons fire only during waking and are a major wake-promoting force. This is why first-generation antihistamines make you sleepy and why H3 antagonists are studied as wake agents.\",\n    functions: [\"Wakefulness\", \"Attention\", \"Gastric acid secretion\", \"Itch and allergy\", \"Thermoregulation\"],\n    synthesis: [\n      { step: \"L-histidine\", detail: \"Taken up by histaminergic neurons\" },\n      { step: \"Histamine\", enzyme: \"Histidine decarboxylase (HDC)\", cofactor: \"B6\", note: \"Rate-limiting\" },\n      { step: \"Vesicle loading\", enzyme: \"VMAT2\", note: \"Shared with monoamines\" },\n    ],\n    clearance: [\n      { mechanism: \"HNMT methylation\", note: \"Intracellular, CNS\" },\n      { mechanism: \"DAO oxidation\", note: \"Peripheral, gut\" },\n    ],\n    receptors: [\n      { name: \"H1\", type: \"Gq\", effect: \"Excitatory\", note: \"Wakefulness, itch; diphenhydramine blocks\" },\n      { name: \"H2\", type: \"Gs\", effect: \"Excitatory\", note: \"Gastric acid; famotidine blocks\" },\n      { name: \"H3\", type: \"Gi\", effect: \"Inhibitory\", note: \"Presynaptic autoreceptor; pitolisant blocks\" },\n      { name: \"H4\", type: \"Gi\", effect: \"Inhibitory\", note: \"Immune, itch\" },\n    ],\n    interventions: [\n      { point: \"Receptors\", target: \"H1\", note: \"Antagonism causes sedation — the oldest sleep aid mechanism\" },\n      { point: \"Receptors\", target: \"H3\", drugs: [\"modafinil\"], note: \"Indirect increase in histamine tone\" },\n    ],\n    regions: [\"hypothalamus\", \"basal-forebrain\", \"thalamus\"],\n    matchFlags: [\"sedative\", \"orexin-antagonist\"],\n    pubmed: \"histamine H1 receptor wakefulness\",\n  },\n];\n\nexport const SYSTEM_BY_ID = new Map(SYSTEMS.map((s) => [s.id, s]));\n\n/* ------------------------------------------------------------------ */\n/* Brain regions for the interactive map                              */\n/* Coordinates live in a 420 × 320 viewBox (sagittal, frontal at left) */\n/* ------------------------------------------------------------------ */\n\nexport const BRAIN_REGIONS = [\n  {\n    id: \"prefrontal-cortex\",\n    name: \"Prefrontal cortex\",\n    short: \"PFC\",\n    x: 92,\n    y: 112,\n    rx: 44,\n    ry: 34,\n    systems: [\"dopamine\", \"noradrenaline\", \"serotonin\", \"glutamate\"],\n    functions: [\"Executive control\", \"Working memory\", \"Impulse inhibition\", \"Planning\", \"Emotion regulation\"],\n    note: \"The last region to myelinate and the most sensitive to stress, sleep loss and catecholamine depletion.\",\n    drugs: [\"methylphenidate\", \"atomoxetine\", \"bupropion\", \"modafinil\", \"guanfacine\"],\n  },\n  {\n    id: \"orbitofrontal\",\n    name: \"Orbitofrontal cortex\",\n    short: \"OFC\",\n    x: 104,\n    y: 168,\n    rx: 34,\n    ry: 22,\n    systems: [\"serotonin\", \"dopamine\", \"glutamate\"],\n    functions: [\"Value-based choice\", \"Reward expectation\", \"Impulse control\", \"Olfaction integration\"],\n    note: \"Encodes expected value; dysfunction is linked to impulsive choice and obsessive-compulsive patterns.\",\n    drugs: [\"sertraline\", \"fluoxetine\", \"vortioxetine\"],\n  },\n  {\n    id: \"anterior-cingulate\",\n    name: \"Anterior cingulate\",\n    short: \"ACC\",\n    x: 186,\n    y: 86,\n    rx: 30,\n    ry: 20,\n    systems: [\"glutamate\", \"dopamine\", \"serotonin\"],\n    functions: [\"Conflict monitoring\", \"Error detection\", \"Pain affect\", \"Effort valuation\"],","/app/data/learn.js":"/* Courses, lessons, quizzes and the flashcard deck. */\n\nexport const COURSES = [\n  {\n    id: \"m1\",\n    title: \"Neuron foundations\",\n    level: \"Foundation\",\n    minutes: 28,\n    accent: \"violet\",\n    blurb: \"How a single cell maintains a voltage, fires, and talks to its neighbours. Every drug in this app acts somewhere in this story.\",\n    lessons: [\n      {\n        id: \"m1l1\",\n        title: \"The resting neuron\",\n        minutes: 8,\n        xp: 40,\n        content: `## A cell that runs on batteries\n\nA neuron is a lipid membrane studded with proteins, and the membrane is a capacitor: charge outside, charge inside, separated by an insulator.\n\n- **Inside** the cell: high K⁺ (~140 mM), low Na⁺ (~12 mM), negative charge (~−70 mV)\n- **Outside**: high Na⁺ (~145 mM), low K⁺ (~4 mM), high Cl⁻, positive charge\n\nThat gradient is not free. The **Na⁺/K⁺-ATPase** burns one ATP to push 3 Na⁺ out and 2 K⁺ in — roughly 20–40% of the brain's energy budget goes to restoring gradients.\n\n### Why the inside is negative\n\nTwo forces fight at the membrane:\n\n1. **Chemical gradient** — K⁺ wants to leave (it is concentrated inside)\n2. **Electrical gradient** — negative charge inside pulls K⁺ back\n\nEquilibrium is reached at the **Nernst potential** for K⁺ (about −90 mV). The resting membrane sits near −70 mV because a small Na⁺ leak pulls it up. Leaky K⁺ channels (K2P) set the baseline; the Na⁺/K⁺ pump maintains the gradient that makes any of this possible.\n\n> Hypoxia destroys the pump first. Without ATP the gradient collapses, neurons depolarise, glutamate floods out, and excitotoxicity follows. This is why stroke damage spreads beyond the initial clot.\n\n### Clinical hook\n\nAnything that changes ion channel behaviour changes excitability. Local anaesthetics block Na⁺ channels. Ethanol and benzodiazepines enhance Cl⁻ flow. Magnesium blocks NMDA channels. The same physics, different levers.`,\n        quiz: [\n          {\n            question: \"Which transporter maintains the resting ion gradients?\",\n            options: [\"Na⁺/K⁺-ATPase\", \"VMAT2\", \"SERT\", \"Adenylyl cyclase\"],\n            correctIndex: 0,\n            explanation: \"The Na⁺/K⁺-ATPase moves 3 Na⁺ out and 2 K⁺ in per ATP, preserving the gradients that all signalling depends on.\",\n          },\n          {\n            question: \"The resting membrane potential of a typical neuron is around:\",\n            options: [\"+40 mV\", \"0 mV\", \"−70 mV\", \"−150 mV\"],\n            correctIndex: 2,\n            explanation: \"−70 mV reflects a dominant K⁺ permeability with a small Na⁺ leak pulling the value above the K⁺ equilibrium potential of −90 mV.\",\n          },\n          {\n            question: \"Why does stroke damage spread beyond the original clot?\",\n            options: [\"Because blood pressure rises\", \"Because ATP loss collapses ion gradients and glutamate floods out\", \"Because myelin dissolves\", \"Because dopamine is depleted\"],\n            correctIndex: 1,\n            explanation: \"Without ATP the pump fails, membranes depolarise, and massive glutamate release drives excitotoxic calcium entry in surrounding tissue.\",\n          },\n        ],\n      },\n      {\n        id: \"m1l2\",\n        title: \"The action potential\",\n        minutes: 10,\n        xp: 45,\n        content: `## All-or-nothing\n\nAn action potential is a brief, self-regenerating reversal of membrane voltage. It is **all-or-nothing**: a stronger stimulus produces more spikes, not bigger ones.\n\n### The sequence\n\n1. **Threshold** (~−55 mV): voltage-gated Na⁺ channels open\n2. **Depolarisation**: Na⁺ rushes in, voltage climbs toward +40 mV\n3. **Inactivation**: Na⁺ channels close their inactivation gate (ball-and-chain)\n4. **Repolarisation**: K⁺ channels open, K⁺ leaves\n5. **Hyperpolarisation**: K⁺ channels close slowly, overshooting below rest\n6. **Refractory period**: Na⁺ channels unavailable — this enforces directionality\n\n### Encoding intensity\n\nThe nervous system encodes strength in **frequency** and **recruitment**, not amplitude. More intense stimuli recruit more neurons and fire them faster. Frequency is capped by the refractory period (~1 ms absolute, so ~1000 Hz theoretical maximum, ~200–300 Hz realistic for brief bursts).\n\n### Myelin and speed\n\nMyelin wraps axons and forces conduction to jump between nodes of Ranvier — **saltatory conduction**. A myelinated axon conducts at up to 120 m/s; unmyelinated at 0.5–2 m/s. Multiple sclerosis destroys myelin and slows or blocks conduction, producing the classic symptoms.\n\n> **Local anaesthetics** work from the inside. They are weak bases that cross the membrane in uncharged form, then block the Na⁺ channel pore from within. Inflamed tissue is acidic — more drug stays charged, cannot cross, and anaesthesia fails. That is why an abscess is hard to numb.`,\n        quiz: [\n          {\n            question: \"How does a neuron signal a stronger stimulus?\",\n            options: [\"Bigger action potentials\", \"Higher firing frequency and more recruited neurons\", \"Longer refractory periods\", \"Reversing the ion gradient\"],\n            correctIndex: 1,\n            explanation: \"Action potentials are all-or-nothing, so intensity is encoded in frequency and population recruitment.\",\n          },\n          {\n            question: \"What does myelin do?\",\n            options: [\"Increases membrane capacitance\", \"Allows saltatory conduction between nodes of Ranvier\", \"Blocks K⁺ channels\", \"Stores neurotransmitters\"],\n            correctIndex: 1,\n            explanation: \"Myelin insulates the axon so the spike regenerates only at nodes of Ranvier, raising conduction velocity up to ~100×.\",\n          },\n          {\n            question: \"Why is inflamed tissue harder to numb with local anaesthetics?\",\n            options: [\"More blood flow removes the drug\", \"Acidic pH keeps more drug in the charged form that cannot cross the membrane\", \"Sodium channels disappear\", \"Nerves stop firing\"],\n            correctIndex: 1,\n            explanation: \"Local anaesthetics must cross the membrane uncharged. In acidosis, a larger fraction stays protonated and cannot reach the intracellular binding site.\",\n          },\n        ],\n      },\n      {\n        id: \"m1l3\",\n        title: \"The synapse\",\n        minutes: 10,\n        xp: 45,\n        content: `## Where pharmacology happens\n\nA chemical synapse has five working parts, and almost every psychoactive drug targets one of them:\n\n1. **Synthesis** — enzymes build the transmitter\n2. **Packaging** — VMAT or VAChT loads vesicles\n3. **Release** — Ca²⁺ entry triggers vesicle fusion (SNARE proteins)\n4. **Reception** — receptors convert chemistry into electrical or biochemical signal\n5. **Clearance** — reuptake transporters and degrading enzymes end the signal\n\n### Quantal release\n\nNeurotransmitters are released in **quanta** (vesicles). A single vesicle contains roughly 1,000–10,000 molecules. Release probability varies by synapse and is tuned by neuromodulators — this is a major site of drug action (e.g. amphetamine increases vesicular release, adenosine A1 agonism decreases it).\n\n### Receptors: two families\n\n- **Ionotropic** — a channel opens in under a millisecond. Fast, brief, used for precise signalling (AMPA, NMDA, GABA-A, nAChR).\n- **Metabotropic** — a G-protein cascade. Slower (100 ms to minutes), amplifies, and changes how the cell responds to future input (D2, 5-HT2A, GABA-B, mGluR).\n\n> A drug's **affinity** (how tightly it binds, Kd) determines occupancy. Its **efficacy** (what happens after binding) determines effect. A full agonist, partial agonist, antagonist and inverse agonist can all occupy the same receptor with completely different outcomes — that is why \"it hits the same receptor\" tells you almost nothing on its own.\n\n### Termination\n\nSerotonin is cleared by SERT and MAO-A. Dopamine by DAT and COMT/MAO-B. Acetylcholine by acetylcholinesterase in under a millisecond — the fastest clearance in the brain. Peptides have no reuptake at all; they diffuse and are degraded by peptidases, which is why peptide drugs have such short windows.`,\n        quiz: [\n          {\n            question: \"Which process does amphetamine primarily amplify?\",\n            options: [\"Receptor degradation\", \"Vesicular release and transporter reversal\", \"Enzymatic synthesis of serotonin\", \"Myelination\"],\n            correctIndex: 1,\n            explanation: \"Amphetamine enters terminals, displaces vesicular monoamines and reverses DAT/NET, pushing transmitters into the synapse.\",\n          },\n          {\n            question: \"Affinity describes:\",\n            options: [\"How tightly a drug binds its target\", \"How strong the resulting effect is\", \"How fast the drug is cleared\", \"How many receptors exist\"],\n            correctIndex: 0,\n            explanation: \"Affinity = binding strength (Kd). Efficacy = the response produced after binding. They are independent properties.\",\n          },\n          {\n            question: \"Which transmitter is cleared fastest?\",\n            options: [\"Serotonin\", \"Dopamine\", \"Acetylcholine\", \"Peptides\"],\n            correctIndex: 2,\n            explanation: \"Acetylcholinesterase hydrolyses acetylcholine within about a millisecond — the fastest clearance mechanism in the nervous system.\",\n          },\n        ],\n      },\n    ],\n  },\n  {\n    id: \"m2\",\n    title: \"Monoamines in practice\",\n    level: \"Intermediate\",\n    minutes: 34,\n    accent: \"amber\",\n    blurb: \"Dopamine, noradrenaline and serotonin: what each pathway actually does, and why 'raising' one does not produce a predictable mood.\",\n    lessons: [\n      {\n        id: \"m2l1\",\n        title: \"Dopamine: wanting, not liking\",\n        minutes: 12,\n        xp: 55,\n        content: `## Three pathways, three jobs\n\n| Pathway | From → to | Function |\n| --- | --- | --- |\n| Nigrostriatal | Substantia nigra → striatum | Movement |\n| Mesolimbic | VTA → nucleus accumbens | Motivation, reward learning |\n| Mesocortical | VTA → prefrontal cortex | Working memory, executive control |\n\nA fourth, **tuberoinfundibular**, runs from hypothalamus to pituitary and inhibits prolactin. This is why dopamine-blocking antipsychotics raise prolactin.\n\n### Prediction error, not pleasure\n\nThe classic finding: dopamine neurons fire when a reward is **better than expected**, not when it arrives as expected. Once a cue reliably predicts food, the spike moves to the **cue**. The signal is a learning term — a teaching signal that updates expectations.\n\nThis is why \"dopamine = pleasure\" is wrong in a way that matters clinically. Dopamine drives **wanting** (incentive salience). The **liking** is mediated by opioids and endocannabinoids in small hedonic hotspots. Addiction is a pathology of wanting, not of enjoying.\n\n### The rate-limiting step\n\nTyrosine → L-DOPA is catalysed by **tyrosine hydroxylase**, which is inhibited by end-product dopamine and requires BH4 and iron. This is the main control valve. L-DOPA bypasses it entirely, which is why levodopa works so powerfully in Parkinson's, and why it eventually produces dyskinesia: it floods a system that has lost its ability to buffer.\n\n> **Caffeine** is not dopaminergic directly. It blocks adenosine A2A receptors, which normally dampen D2 signalling in the striatum. The dopamine effect is indirect — and it is why A2A antagonists feel stimulating without releasing dopamine.`,\n        quiz: [\n          {\n            question: \"Dopamine neurons primarily encode:\",\n            options: [\"Absolute pleasure intensity\", \"Reward prediction error\", \"Muscle length\", \"Serotonin levels\"],\n            correctIndex: 1,\n            explanation: \"Dopamine firing shifts to the earliest predictor of reward and scales with the difference between expected and received value.\",\n          },\n          {\n            question: \"Which pathway is damaged in Parkinson's disease?\",\n            options: [\"Mesolimbic\", \"Mesocortical\", \"Nigrostriatal\", \"Tuberoinfundibular\"],\n            correctIndex: 2,\n            explanation: \"Degeneration of substantia nigra pars compacta neurons removes the nigrostriatal dopamine supply to the striatum.\",\n          },\n          {\n            question: \"Caffeine increases dopamine signalling indirectly by:\",\n            options: [\"Blocking DAT\", \"Antagonising adenosine A2A receptors\", \"Inhibiting MAO-B\", \"Releasing vesicular dopamine\"],\n            correctIndex: 1,\n            explanation: \"A2A receptors normally suppress D2 signalling; blocking them disinhibits the striatal dopamine system.\",\n          },\n        ],\n      },\n      {\n        id: \"m2l2\",\n        title: \"Noradrenaline: the arousal dial\",\n        minutes: 10,\n        xp: 50,\n        content: `## One nucleus, whole-brain reach\n\nThe **locus coeruleus** contains only a few tens of thousands of neurons in humans, yet it supplies almost all forebrain noradrenaline. Its firing pattern maps onto arousal:\n\n- **Tonic firing** (low, steady): drowsy or relaxed attention\n- **Phasic bursts**: novel or salient stimuli — a sharp increase in signal-to-noise\n- **High tonic** (stress): poor discrimination, anxiety, distractibility\n\nThis inverted-U explains a lot: too little noradrenaline means poor vigilance; too much means the prefrontal cortex goes offline and the amygdala takes over. Optimal performance sits in the middle, and the middle moves with sleep, stress and genetics.\n\n### Receptors and their jobs\n\n- **α1** (Gq, excitatory): vasoconstriction, arousal; the reason noradrenaline raises blood pressure\n- **α2** (Gi, inhibitory): presynaptic autoreceptor. Agonists like clonidine quiet the system; antagonists like yohimbine wake it up\n- **β1/β2** (Gs): cardiac output, tremor, bronchodilation. Propranolol blocks these peripherally\n\n### Why stimulants feel different from each other\n\nMethylphenidate blocks DAT and NET with similar affinity. Amphetamine reverses the transporters. Atomoxetine blocks NET only, which in prefrontal cortex also raises dopamine (because NET clears dopamine there) but leaves the nucleus accumbens almost untouched — hence no euphoria and no abuse potential.\n\n> **Rebound** is not a side effect, it is the pharmacology: when the reuptake block wears off, presynaptic depletion and receptor adaptation leave you below baseline for a few hours. That is the crash.`,\n        quiz: [\n          {\n            question: \"The inverted-U relationship for noradrenaline means:\",\n            options: [\"More is always better\", \"Both too little and too much impair prefrontal function\", \"Noradrenaline only affects the heart\", \"Receptor number never changes\"],\n            correctIndex: 1,\n            explanation: \"Optimal arousal sits in the middle. High tonic noradrenaline under stress degrades prefrontal control and shifts control to subcortical circuits.\",\n          },\n          {\n            question: \"α2 receptors are usually:\",\n            options: [\"Excitatory postsynaptic\", \"Presynaptic inhibitory autoreceptors\", \"Ion channels for chloride\", \"Dopamine transporters\"],\n            correctIndex: 1,\n            explanation: \"α2 receptors sit on the presynaptic terminal and inhibit further noradrenaline release — the basis of clonidine's action.\",\n          },\n          {\n            question: \"Atomoxetine has low abuse potential because:\",\n            options: [\"It is not absorbed orally\", \"It blocks NET but leaves striatal DAT largely untouched\", \"It destroys dopamine\", \"It cannot cross the blood-brain barrier\"],\n            correctIndex: 1,\n            explanation: \"Without direct DAT blockade in the nucleus accumbens, the reinforcing dopamine surge of stimulants does not occur.\",\n          },\n        ],\n      },\n      {\n        id: \"m2l3\",\n        title: \"Serotonin: patience and inhibition\",\n        minutes: 12,\n        xp: 55,\n        content: `## Fourteen receptors, one transmitter\n\nSerotonin (5-HT) has the most diverse receptor family in the brain: 13–14 subtypes across ionotropic (5-HT3) and metabotropic (5-HT1, 2, 4, 5, 6, 7) families. This is why serotonergic drugs can be anxiolytic, psychedelic, antiemetic or appetite-suppressing depending on which subtype they touch.\n\n### The synthesis chain\n\nTryptophan → (TPH, BH4) → 5-HTP → (AADC, B6) → serotonin → (in pineal) → melatonin\n\n**Tryptophan hydroxylase** is rate-limiting and is not saturated at normal dietary intakes — so tryptophan availability can shift serotonin output. **5-HTP bypasses TPH entirely**, which is why it is pharmacologically much stronger than tryptophan and much easier to overdo.\n\n### What SSRIs actually do\n\nAcutely, an SSRI blocks SERT and serotonin rises — but clinical benefit takes 2–4 weeks. During that lag, **5-HT1A autoreceptors** desensitise, so raphe firing recovers and serotonin release increases in projection areas. The therapeutic effect tracks the downstream adaptation, not the transporter occupancy.\n\nThis explains several clinical facts: early side effects (nausea, anxiety) appear immediately, onset of benefit is delayed, and the first two weeks carry the highest risk of activation or suicidal ideation in vulnerable patients.\n\n### The dark side\n\nSerotonin syndrome is a **triad**: mental status change, autonomic instability, neuromuscular hyperactivity (clonus, hyperreflexia). Clonus is the most specific sign. It is caused by too much serotonergic activity — usually two drugs, sometimes one at a high dose.\n\n> Serotonin also depletes platelet stores, which is why SSRIs increase bleeding risk with NSAIDs. Platelets cannot synthesise serotonin; they depend entirely on SERT uptake.`,\n        quiz: [\n          {\n            question: \"Why do SSRIs take weeks to work?\",\n            options: [\"They accumulate slowly\", \"Autoreceptor desensitisation is required before serotonin release rises\", \"The drug only reaches the brain after 3 weeks\", \"Serotonin is stored in fat\"],\n            correctIndex: 1,\n            explanation: \"Acute SERT blockade raises serotonin but also activates 5-HT1A autoreceptors. Clinical benefit follows their desensitisation and increased terminal release.\",\n          },\n          {\n            question: \"The most specific sign of serotonin syndrome is:\",\n            options: [\"Dry mouth\", \"Clonus\", \"Bradycardia\", \"Pupil constriction\"],\n            correctIndex: 1,\n            explanation: \"Clonus (especially inducible ankle clonus) and hyperreflexia are the neuromuscular hallmarks of serotonin toxicity.\",\n          },\n          {\n            question: \"5-HTP is stronger than tryptophan because:\",\n            options: [\"It is lipid soluble\", \"It bypasses the rate-limiting enzyme TPH\", \"It blocks SERT\", \"It is a receptor agonist\"],\n            correctIndex: 1,\n            explanation: \"5-HTP is one step past the rate-limiting enzyme, so conversion to serotonin depends only on AADC, which is not rate-limiting.\",\n          },\n        ],\n      },\n    ],\n  },\n  {\n    id: \"m3\",\n    title: \"Inhibition & excitation\",\n    level: \"Intermediate\",\n    minutes: 26,\n    accent: \"green\",\n    blurb: \"GABA keeps the system stable, glutamate makes it plastic, acetylcholine decides what gets attention. The three systems most drugs borrow.\",\n    lessons: [\n      {\n        id: \"m3l1\",\n        title: \"GABA: the brakes\",\n        minutes: 9,\n        xp: 45,\n        content: `## One decarboxylation flips the signal\n\nGlutamate → (GAD65/67, vitamin B6) → GABA. The same molecule that excites most of the brain becomes the main inhibitory transmitter after a single decarboxylation.\n\n**GABA-A** is a pentameric chloride channel. When GABA (or a benzodiazepine, barbiturate, neurosteroid or alcohol) binds, Cl⁻ enters and the membrane hyperpolarises. Subunit composition determines the effect:\n\n- **α1** → sedation, amnesia (Z-drugs are selective here)\n- **α2/α3** → anxiolysis, muscle relaxation (classic benzodiazepines)\n- **α4/α6** → insensitive to benzodiazepines, sensitive to alcohol and neurosteroids\n\n**GABA-B** is a G-protein receptor that opens K⁺ channels and closes Ca²⁺ channels. Baclofen, phenibut and GHB act here — a completely different pharmacology with a completely different withdrawal profile.\n\n### Tolerance and withdrawal, mechanistically\n\nChronic benzodiazepine use causes GABA-A receptors to internalise and uncouple from their chloride channel. The inhibitory system becomes weaker at baseline, which is **why** anxiety, insomnia and hyperalgesia appear during withdrawal — the excitatory systems were never inhibited differently, they were simply unmasked.\n\nThis is also why withdrawal from benzodiazepines, alcohol and phenibut can cause seizures and delirium: the excitatory/inhibitory balance rebounds past normal.\n\n> **Flumazenil** is a benzodiazepine antagonist. In an overdose it reverses sedation, but it can precipitate seizures in dependent patients — because their brain has adapted to constant inhibition.`,\n        quiz: [\n          {\n            question: \"Which GABA-A subunits mediate sedation and amnesia?\",\n            options: [\"α1\", \"α4\", \"β2\", \"γ3\"],\n            correctIndex: 0,\n            explanation: \"α1-containing receptors mediate sedation, anterograde amnesia and anticonvulsant effects; Z-drugs preferentially target them.\",\n          },\n          {\n            question: \"GABA-B receptors act mainly by:\",\n            options: [\"Opening chloride channels\", \"Opening K⁺ channels and closing Ca²⁺ channels via G proteins\", \"Blocking sodium channels\", \"Releasing glutamate\"],\n            correctIndex: 1,\n            explanation: \"GABA-B is metabotropic: Gβγ opens GIRK potassium channels and inhibits voltage-gated calcium channels, reducing transmitter release.\",\n          },\n          {\n            question: \"Why is benzodiazepine withdrawal excitatory?\",\n            options: [\"The drug becomes a stimulant\", \"GABA-A receptors internalise, unmasking baseline excitation\", \"Dopamine rises\", \"Serotonin is depleted\"],\n            correctIndex: 1,\n            explanation: \"Chronic potentiation leads to receptor downregulation; removing the drug leaves inhibitory tone below baseline, so excitatory systems dominate.\",\n          },\n        ],\n      },\n      {\n        id: \"m3l2\",\n        title: \"Glutamate & plasticity\",\n        minutes: 9,\n        xp: 45,\n        content: `## The coincidence detector\n\nThe **NMDA receptor** is the most important coincidence detector in the brain. It opens only when two things happen together:\n\n1. Glutamate binds (presynaptic activity)\n2. The membrane is already depolarised enough to expel the Mg²⁺ block (postsynaptic activity)\n\nThat AND-gate is the molecular basis of **Hebbian learning**: cells that fire together wire together. Ca²⁺ entry through NMDA triggers CaMKII, then AMPA receptors are inserted into the membrane — **long-term potentiation (LTP)**. Weak or unpaired stimulation produces the reverse, **LTD**.\n\n### Why NMDA antagonists dissociate\n\nKetamine and memantine block the channel, reducing the coincidence signal. Normal perception continues, but the binding of experience into coherent self-models frays — hence dissociation, depersonalisation and altered time sense.\n\n**Memantine's trick** is its fast off-rate: it leaves the channel quickly when normal physiological activity resumes, so it dampens pathological excess while leaving learning intact. Ketamine's slower off-rate produces full dissociation.\n\n### The rapid antidepressant paradox\n\nKetamine works in hours, not weeks — and the mechanism is not \"more glutamate\". Blocking NMDA on GABAergic interneurons disinhibits glutamate release onto AMPA receptors, which triggers **BDNF release and mTORC1-dependent synaptogenesis** in prefrontal cortex. New spines appear within 24 hours in animal models.\n\n> This is the emerging common pathway: psilocybin, ketamine, sleep deprivation and electroconvulsive therapy all increase BDNF signalling and dendritic spine density within days. The interesting question is why the effect fades — and that is where maintenance and integration matter.`,\n        quiz: [\n          {\n            question: \"The NMDA receptor requires which two events to open?\",\n            options: [\"Glutamate binding and membrane depolarisation to relieve Mg²⁺ block\", \"GABA binding and hyperpolarisation\", \"Two glutamate molecules and no calcium\", \"Serotonin and dopamine together\"],\n            correctIndex: 0,\n            explanation: \"The voltage-dependent Mg²⁺ block is expelled by depolarisation, so the channel opens only with coincident pre- and postsynaptic activity.\",\n          },\n          {\n            question: \"Ketamine's rapid antidepressant effect is linked to:\",\n            options: [\"Direct dopamine release\", \"AMPA-driven BDNF release and synaptogenesis\", \"GABA-A blockade\", \"Serotonin reuptake inhibition\"],\n            correctIndex: 1,","/app/srs.js":"/* Spaced repetition scheduler (SM-2 style, simplified for single-session use). */\n\nimport { store, dayKey, daysBetween, uid } from \"__ND__/app/core.js\";\nimport { FLASHCARDS } from \"__ND__/app/data/learn.js\";\n\nexport const GRADES = [\n  { key: \"again\", label: \"Again\", hint: \"Forgot\", quality: 1, cls: \"danger\" },\n  { key: \"hard\", label: \"Hard\", hint: \"Struggled\", quality: 3, cls: \"ghost\" },\n  { key: \"good\", label: \"Good\", hint: \"Recalled\", quality: 4, cls: \"soft\" },\n  { key: \"easy\", label: \"Easy\", hint: \"Instant\", quality: 5, cls: \"primary\" },\n];\n\nfunction blank() {\n  return { ease: 2.5, interval: 0, reps: 0, lapses: 0, due: null, seen: null };\n}\n\nexport function cardState(cardId) {\n  const s = store.data.srs || {};\n  return { ...blank(), ...(s[cardId] || {}) };\n}\n\n/** Cards that are due (or never seen), ordered: unseen first, then earliest due. */\nexport function dueCards(deck = FLASHCARDS) {\n  const today = dayKey();\n  return deck\n    .map((card) => {\n      const st = cardState(card.id);\n      const due = st.due || null;\n      const overdue = due ? daysBetween(due, today) : 0;\n      const isDue = !due || overdue >= 0;\n      return { card, st, isDue, overdue: due ? overdue : 0 };\n    })\n    .filter((x) => x.isDue)\n    .sort(\n      (a, b) =>\n        Number(!!a.st.seen) - Number(!!b.st.seen) ||\n        (b.overdue || 0) - (a.overdue || 0) ||\n        a.card.id.localeCompare(b.card.id)\n    );\n}\n\nexport function deckStats(deck = FLASHCARDS) {\n  const today = dayKey();\n  let due = 0;\n  let learning = 0;\n  let mature = 0;\n  let seen = 0;\n  for (const card of deck) {\n    const st = cardState(card.id);\n    if (st.seen) seen++;\n    if (st.interval >= 21) mature++;\n    else if (st.seen) learning++;\n    if (!st.due || daysBetween(st.due, today) >= 0) due++;\n  }\n  return { due, learning, mature, seen, total: deck.length };\n}\n\n/**\n * Grade a card and reschedule it.\n * @returns {{interval:number, due:string, ease:number}}\n */\nexport function gradeCard(cardId, grade) {\n  const q = GRADES.find((g) => g.key === grade)?.quality ?? 4;\n  return store.update((s) => {\n    if (!s.srs) s.srs = {};\n    const prev = { ...blank(), ...(s.srs[cardId] || {}) };\n    let ease = prev.ease;\n    let interval = prev.interval;\n    let lapses = prev.lapses;\n    let reps = prev.reps;\n\n    if (q \u003c 3) {\n      lapses += 1;\n      interval = 0;\n      ease = Math.max(1.3, ease - 0.2);\n      reps = 0;\n    } else {\n      reps += 1;\n      interval = scheduleInterval(prev.interval, ease, q);\n      ease = Math.min(3.0, Math.max(1.3, ease + (q === 5 ? 0.1 : q === 3 ? -0.15 : 0)));\n    }\n\n    const due = new Date();\n    due.setDate(due.getDate() + (interval || 0));\n    const next = {\n      ease: Math.round(ease * 100) / 100,\n      interval,\n      reps,\n      lapses,\n      due: dayKey(due),\n      seen: new Date().toISOString(),\n    };\n    s.srs[cardId] = next;\n    if (!Array.isArray(s.history)) s.history = [];\n    s.history.unshift({ id: uid(\"h\"), kind: \"card\", label: `Reviewed card (${grade})`, at: new Date().toISOString() });\n    s.history = s.history.slice(0, 60);\n    return { interval, due: next.due, ease: next.ease };\n  });\n}\n\n/** Interval (in days) the scheduler produces for this grade and previous interval. */\nfunction scheduleInterval(prevInterval, ease, q) {\n  if (q \u003c 3) return 0;\n  if (!prevInterval) return q === 5 ? 6 : q === 4 ? 3 : 1;\n  const factor = q === 5 ? ease * 1.3 : q === 4 ? ease : 1.2;\n  return Math.max(1, Math.round(prevInterval * factor));\n}\n\nfunction humanDays(days) {\n  if (!days) return \"now\";\n  if (days === 1) return \"tomorrow\";\n  if (days \u003c 30) return days + \" days\";\n  if (days \u003c 365) return Math.round(days / 30) + \" mo\";\n  return (days / 365).toFixed(1) + \" yr\";\n}\n\n/** Preview matching exactly what gradeCard would schedule for this card. */\nexport function nextIntervalPreview(grade, cardId) {\n  const g = GRADES.find((x) => x.key === grade);\n  const q = g ? g.quality : 4;\n  const st = cardId ? cardState(cardId) : blank();\n  // gradeCard schedules with the *current* ease and only then nudges it, so the\n  // preview must use the same order or the shown interval drifts from reality.\n  return humanDays(scheduleInterval(st.interval, st.ease, q));\n}","/app/data/interactions.js":"/* Interaction rule engine.\n * Two layers: explicit pair rules (specific pharmacology) and flag-based rules\n * (class effects). Findings are deduplicated and sorted by severity.\n */\n\nexport const SEVERITY = {\n  critical: { label: \"Avoid\", rank: 4, tone: \"critical\" },\n  major: { label: \"High risk\", rank: 3, tone: \"major\" },\n  moderate: { label: \"Moderate\", rank: 2, tone: \"moderate\" },\n  minor: { label: \"Minor\", rank: 1, tone: \"minor\" },\n};\n\n/** Substances commonly stacked that are not in the compound encyclopedia. */\nexport const EXTRA_SUBSTANCES = [\n  {\n    id: \"alcohol\",\n    name: \"Alcohol (ethanol)\",\n    cls: \"Depressant\",\n    evidence: \"strong\",\n    flags: [\"sedative\", \"gabaergic\", \"respiratory-depressant\", \"hepatotoxic\", \"hypoglycemic-weak\"],\n    summary: \"GABA-A positive modulator and NMDA antagonist; the most common interaction partner in emergency departments.\",\n    pk: { halfLife: 0.2 },\n  },\n  {\n    id: \"cannabis-thc\",\n    name: \"Cannabis (THC)\",\n    cls: \"Cannabinoid\",\n    evidence: \"moderate\",\n    flags: [\"cannabinoid\", \"sedative-weak\", \"anxiogenic\", \"tachycardia\"],\n    summary: \"CB1 partial agonist; adds sedation, tachycardia and anxiety risk when stacked.\",\n    pk: { halfLife: 30 },\n  },\n  {\n    id: \"tramadol\",\n    name: \"Tramadol\",\n    cls: \"Opioid\",\n    evidence: \"strong\",\n    flags: [\"opioid\", \"serotonergic\", \"noradrenergic\", \"seizure-risk\", \"respiratory-depressant\"],\n    summary: \"Atypical opioid with serotonin and noradrenaline reuptake inhibition — the classic serotonin-syndrome trap.\",\n    pk: { halfLife: 6 },\n  },\n  {\n    id: \"pseudoephedrine\",\n    name: \"Pseudoephedrine\",\n    cls: \"Stimulant\",\n    evidence: \"strong\",\n    flags: [\"sympathomimetic\", \"stimulant\", \"hypertensive\"],\n    summary: \"Direct and indirect sympathomimetic found in cold medicines.\",\n    pk: { halfLife: 5 },\n  },\n  {\n    id: \"valerian\",\n    name: \"Valerian root\",\n    cls: \"Herb\",\n    evidence: \"limited\",\n    flags: [\"sedative\", \"gabaergic\"],\n    summary: \"Valerian extracts weakly modulate GABA-A tone and GABA transaminase; sleep benefit is small, product standardisation is poor.\",\n    pk: { halfLife: 1.5 },\n  },\n];\n\n/* Pair-specific rules: keyed by sorted id pair. */\nconst pair = (a, b, severity, title, mechanism, advice) => ({\n  a,\n  b,\n  severity,\n  title,\n  mechanism,\n  advice,\n});\n\nexport const PAIR_RULES = [\n  pair(\n    \"phenelzine\",\n    \"sertraline\",\n    \"critical\",\n    \"MAOI + SSRI: serotonin syndrome\",\n    \"Irreversible MAO-A inhibition prevents serotonin breakdown while the SSRI blocks reuptake — synaptic serotonin can rise many-fold.\",\n    \"Absolutely contraindicated. Requires a 2-week washout from the MAOI (5 weeks after fluoxetine) before any serotonergic drug.\"\n  ),\n  pair(\n    \"phenelzine\",\n    \"fluoxetine\",\n    \"critical\",\n    \"MAOI + SSRI: serotonin syndrome\",\n    \"MAO-A inhibition plus SERT blockade produces dangerous serotonin accumulation; fluoxetine's long half-life extends the risk window for weeks.\",\n    \"Contraindicated. Fluoxetine needs a 5-week washout before an MAOI can be started.\"\n  ),\n  pair(\n    \"phenelzine\",\n    \"mdma\",\n    \"critical\",\n    \"MAOI + MDMA: hypertensive crisis and serotonin syndrome\",\n    \"MDMA floods the synapse with serotonin and noradrenaline while MAO-A is blocked — both pressure and serotonin surge.\",\n    \"Never combine. Reported deaths are associated with exactly this pairing.\"\n  ),\n  pair(\n    \"phenelzine\",\n    \"5-htp\",\n    \"critical\",\n    \"MAOI + 5-HTP: serotonin syndrome\",\n    \"5-HTP bypasses the rate-limiting synthesis step, dumping serotonin precursor into a system that cannot break serotonin down.\",\n    \"Contraindicated.\"\n  ),\n  pair(\n    \"phenelzine\",\n    \"dextroamphetamine\",\n    \"critical\",\n    \"MAOI + amphetamine: hypertensive crisis\",\n    \"Amphetamine releases noradrenaline that MAO would normally clear — blood pressure can spike within hours.\",\n    \"Contraindicated. Wait 2 weeks after stopping the MAOI.\"\n  ),\n  pair(\n    \"phenelzine\",\n    \"methylphenidate\",\n    \"critical\",\n    \"MAOI + methylphenidate: hypertensive crisis\",\n    \"Catecholamine release without MAO clearance produces a sympathomimetic surge.\",\n    \"Contraindicated.\"\n  ),\n  pair(\n    \"phenelzine\",\n    \"modafinil\",\n    \"major\",\n    \"MAOI + modafinil: additive catecholamine load\",\n    \"Modafinil raises dopamine and noradrenaline tone; MAOI slows their breakdown.\",\n    \"Avoid. If unavoidable, only under specialist supervision with BP monitoring.\"\n  ),\n  pair(\n    \"moclobemide\",\n    \"sertraline\",\n    \"critical\",\n    \"RIMA + SSRI: serotonin syndrome\",\n    \"Even reversible MAO-A inhibition plus SERT blockade can push serotonin into a toxic range.\",\n    \"Contraindicated; 2-week washout either direction.\"\n  ),\n  pair(\n    \"moclobemide\",\n    \"mdma\",\n    \"critical\",\n    \"RIMA + MDMA: serotonin syndrome\",\n    \"Both mechanisms converge on synaptic serotonin and noradrenaline.\",\n    \"Never combine.\"\n  ),\n  pair(\n    \"selegiline\",\n    \"sertraline\",\n    \"major\",\n    \"MAO-B inhibitor + SSRI: serotonergic risk\",\n    \"Selegiline loses MAO-B selectivity at higher doses or with transdermal use above ~9 mg, adding MAO-A inhibition.\",\n    \"Only with specialist oversight. Low-dose oral selegiline (≤10 mg) is lower risk but not risk-free.\"\n  ),\n  pair(\n    \"sertraline\",\n    \"mdma\",\n    \"major\",\n    \"SSRI + MDMA: unpredictable and dangerous\",\n    \"SERT blockade reduces MDMA's entry into neurons (blunting the effect) while raising extracellular serotonin; people then take more, increasing hyperthermia and cardiovascular risk.\",\n    \"Do not combine. SSRIs also increase the risk of hyponatraemia and hyperthermia.\"\n  ),\n  pair(\n    \"fluoxetine\",\n    \"mdma\",\n    \"major\",\n    \"SSRI + MDMA: blunted effect plus serotonin load\",\n    \"Same mechanism as sertraline, with a much longer interaction window thanks to norfluoxetine.\",\n    \"Do not combine.\"\n  ),\n  pair(\n    \"sertraline\",\n    \"5-htp\",\n    \"major\",\n    \"SSRI + 5-HTP: additive serotonin\",\n    \"Two independent ways to raise synaptic serotonin — SERT blockade plus unlimited precursor supply.\",\n    \"Avoid unless a prescriber is explicitly managing it.\"\n  ),\n  pair(\n    \"fluoxetine\",\n    \"5-htp\",\n    \"major\",\n    \"SSRI + 5-HTP: additive serotonin\",\n    \"SERT blockade plus direct precursor loading.\",\n    \"Avoid.\"\n  ),\n  pair(\n    \"escitalopram\",\n    \"mdma\",\n    \"major\",\n    \"SSRI + MDMA: unpredictable serotonin load\",\n    \"Reuptake blockade and releaser mechanisms collide.\",\n    \"Do not combine.\"\n  ),\n  pair(\n    \"sertraline\",\n    \"tramadol\",\n    \"major\",\n    \"SSRI + tramadol: serotonin syndrome and seizure risk\",\n    \"Tramadol inhibits serotonin and noradrenaline reuptake on top of µ-opioid agonism; SSRIs add further serotonergic tone and lower the seizure threshold.\",\n    \"Avoid where possible; if unavoidable, use the lowest dose and monitor for agitation, clonus and fever.\"\n  ),\n  pair(\n    \"fluoxetine\",\n    \"tramadol\",\n    \"major\",\n    \"SSRI + tramadol: serotonin syndrome and seizure risk\",\n    \"Fluoxetine also blocks CYP2D6, reducing tramadol's analgesic activation while raising serotonergic risk.\",\n    \"Avoid this combination.\"\n  ),\n  pair(\n    \"st-johns-wort\",\n    \"sertraline\",\n    \"critical\",\n    \"St John's Wort + SSRI: serotonin syndrome\",\n    \"Hyperforin inhibits serotonin reuptake on top of the SSRI — two reuptake blockers at once.\",\n    \"Contraindicated.\"\n  ),\n  pair(\n    \"st-johns-wort\",\n    \"mdma\",\n    \"critical\",\n    \"St John's Wort + MDMA: serotonin syndrome\",\n    \"Reuptake inhibition plus monoamine release with weak MAOI activity.\",\n    \"Never combine.\"\n  ),\n  pair(\n    \"st-johns-wort\",\n    \"escitalopram\",\n    \"critical\",\n    \"St John's Wort + SSRI: serotonin syndrome\",\n    \"Additive serotonin reuptake inhibition.\",\n    \"Contraindicated.\"\n  ),\n  pair(\n    \"st-johns-wort\",\n    \"venlafaxine\",\n    \"critical\",\n    \"St John's Wort + SNRI: serotonin syndrome\",\n    \"Additive serotonergic and noradrenergic activity.\",\n    \"Contraindicated.\"\n  ),\n  pair(\n    \"lithium\",\n    \"psilocybin\",\n    \"critical\",\n    \"Lithium + psilocybin: seizure risk\",\n    \"Multiple case reports describe seizures and prolonged psychosis when lithium is combined with classical psychedelics.\",\n    \"Avoid. If psychedelic therapy is being considered, lithium is normally tapered first under supervision.\"\n  ),\n  pair(\n    \"lithium\",\n    \"lsd\",\n    \"critical\",\n    \"Lithium + LSD: seizure risk\",\n    \"Same case-report signal as psilocybin: seizures and confusional states.\",\n    \"Avoid.\"\n  ),\n  pair(\n    \"lithium\",\n    \"sertraline\",\n    \"major\",\n    \"Lithium + SSRI: serotonin syndrome risk\",\n    \"Lithium enhances serotonergic transmission; case reports of serotonin syndrome exist.\",\n    \"Commonly prescribed together for bipolar depression, but requires monitoring for tremor, clonus and fever.\"\n  ),\n  pair(\n    \"lithium\",\n    \"caffeine\",\n    \"minor\",\n    \"Lithium + caffeine: fluctuating levels\",\n    \"Caffeine increases renal lithium clearance; stopping caffeine abruptly can raise levels into the toxic range.\",\n    \"Keep caffeine intake stable rather than eliminating or bingeing it.\"\n  ),\n  pair(\n    \"alprazolam\",\n    \"zolpidem\",\n    \"major\",\n    \"Benzodiazepine + Z-drug: additive sedation\",\n    \"Both act at GABA-A (different subunit preferences) — additive respiratory depression, especially in sleep apnoea.\",\n    \"Avoid stacking. If both are prescribed, use the lowest doses and never with alcohol.\"\n  ),\n  pair(\n    \"diazepam\",\n    \"alprazolam\",\n    \"major\",\n    \"Two benzodiazepines: additive sedation\",\n    \"Same receptor family, additive effect, and tolerance develops to both together.\",\n    \"No clinical reason to combine; switching requires a supervised cross-taper.\"\n  ),\n  pair(\n    \"phenibut\",\n    \"diazepam\",\n    \"critical\",\n    \"Phenibut + benzodiazepine: respiratory depression\",\n    \"GABA-B agonism plus GABA-A potentiation produces deep CNS depression with a wide dose-response curve because phenibut is unregulated and inconsistently dosed.\",\n    \"Avoid entirely. This combination appears repeatedly in overdose case reports.\"\n  ),\n  pair(\n    \"phenibut\",\n    \"alprazolam\",\n    \"critical\",\n    \"Phenibut + benzodiazepine: respiratory depression\",\n    \"Additive GABAergic depression across two receptor systems.\",\n    \"Avoid entirely.\"\n  ),\n  pair(\n    \"phenibut\",\n    \"zolpidem\",\n    \"major\",\n    \"Phenibut + Z-drug: heavy sedation\",\n    \"GABA-B plus GABA-A α1 activity — sedation, amnesia and complex sleep behaviours.\",\n    \"Avoid.\"\n  ),\n  pair(\n    \"phenibut\",\n    \"pregabalin\",\n    \"major\",\n    \"Phenibut + pregabalin: additive CNS depression\",\n    \"Calcium-channel α2δ ligation plus GABA-B agonism; both cause dizziness and sedation and both are dependence-forming.\",\n    \"Avoid; if already dependent on one, do not add the other.\"\n  ),\n  pair(\n    \"phenibut\",\n    \"gabapentin\",\n    \"moderate\",\n    \"Phenibut + gabapentin: additive sedation\",\n    \"Overlapping inhibitory mechanisms and dependence potential.\",\n    \"Avoid stacking; both need tapering if used regularly.\"\n  ),\n  pair(\n    \"huperzine-a\",\n    \"donepezil\",\n    \"critical\",\n    \"Two cholinesterase inhibitors: cholinergic crisis\",\n    \"Additive AChE inhibition can produce bradycardia, bronchospasm, vomiting and fasciculations.\",\n    \"Contraindicated. Never stack natural AChE inhibitors with prescribed ones.\"\n  ),\n  pair(\n    \"huperzine-a\",\n    \"galantamine\",\n    \"critical\",\n    \"Two cholinesterase inhibitors: cholinergic crisis\",\n    \"Additive acetylcholinesterase inhibition.\",\n    \"Contraindicated.\"\n  ),\n  pair(\n    \"memantine\",\n    \"ketamine\",\n    \"major\",\n    \"Memantine + ketamine: excessive NMDA blockade\",\n    \"Two NMDA channel blockers with a very long memantine half-life — dissociation, confusion and hypertension.\",\n    \"Avoid. Memantine persists ~3 days after the last dose.\"\n  ),\n  pair(\n    \"ketamine\",\n    \"dextroamphetamine\",\n    \"moderate\",\n    \"Ketamine + stimulant: cardiovascular strain\",\n    \"Both raise heart rate and blood pressure; ketamine also increases sympathetic outflow.\",\n    \"Monitor BP; avoid high doses of either.\"\n  ),\n  pair(\n    \"ketamine\",\n    \"methylphenidate\",\n    \"moderate\",\n    \"Ketamine + stimulant: cardiovascular strain\",\n    \"Additive sympathomimetic load.\",\n    \"Monitor blood pressure.\"\n  ),\n  pair(\n    \"mdma\",\n    \"dextroamphetamine\",\n    \"major\",\n    \"MDMA + amphetamine: hyperthermia and cardiac strain\",\n    \"Both are monoamine releasers; stacking them multiplies hyperthermia, vasoconstriction and serotonin depletion.\",\n    \"Avoid. Hyperthermia is the leading cause of MDMA-related death.\"\n  ),\n  pair(\n    \"mdma\",\n    \"methylphenidate\",\n    \"major\",\n    \"MDMA + stimulant: cardiovascular and temperature risk\",\n    \"Additive catecholamine release with different transporter profiles.\",\n    \"Avoid.\"\n  ),\n  pair(\n    \"mdma\",\n    \"modafinil\",\n    \"major\",\n    \"MDMA + modafinil: cardiac and temperature risk\",\n    \"Both raise catecholamines; modafinil also masks fatigue, encouraging more dosing.\",\n    \"Avoid.\"\n  ),\n  pair(\n    \"psilocybin\",\n    \"sertraline\",\n    \"moderate\",\n    \"Psilocybin + SSRI: blunted or unpredictable effects\",\n    \"Chronic SSRI use downregulates 5-HT2A receptors, typically reducing intensity; some people instea
