d report unusually strong reactions.\",\n    \"Not physically dangerous at usual doses, but dose-response becomes unpredictable. Tapering under supervision is the safer path.\"\n  ),","/app/views/ui.js":"/* Shared view helpers: page headers, cards, tiles, chips. */\n\nimport { esc, icon, evidenceChip } from \"__ND__/app/core.js\";\nimport { SEVERITY } from \"__ND__/app/data/interactions.js\";\n\nexport function pageHead(title, sub, action = \"\", eyebrow = \"\") {\n  return `\u003cheader class=\"page-head\">\n    ${eyebrow ? `\u003cdiv class=\"eyebrow\" style=\"margin-bottom:6px\">${esc(eyebrow)}\u003c/div>` : \"\"}\n    \u003cdiv class=\"row between top\" style=\"gap:14px\">\n      \u003cdiv style=\"min-width:0\">\n        \u003ch1>${esc(title)}\u003c/h1>\n        ${sub ? `\u003cp>${sub}\u003c/p>` : \"\"}\n      \u003c/div>\n      ${action ? `\u003cdiv class=\"row\" style=\"flex:none\">${action}\u003c/div>` : \"\"}\n    \u003c/div>\n  \u003c/header>`;\n}\n\nexport function backLink(href, label = \"Back\") {\n  return `\u003ca class=\"btn ghost sm\" href=\"${esc(href)}\" data-back=\"1\">${icon(\"arrowLeft\", 15)} ${esc(label)}\u003c/a>`;\n}\n\nexport function statTile({ label, value, sub = \"\", iconName = \"\", tone = \"\" }) {\n  return `\u003cdiv class=\"card tight\">\n    \u003cdiv class=\"row between\" style=\"align-items:flex-start\">\n      \u003cdiv class=\"stack-3\" style=\"min-width:0\">\n        \u003cdiv class=\"stat-label\">${esc(label)}\u003c/div>\n        \u003cdiv class=\"stat-value ${tone}\">${value}\u003c/div>\n        ${sub ? `\u003cdiv class=\"tiny dim\" style=\"margin-top:2px\">${sub}\u003c/div>` : \"\"}\n      \u003c/div>\n      ${iconName ? `\u003cspan class=\"dim\" style=\"opacity:.7\">${icon(iconName, 17)}\u003c/span>` : \"\"}\n    \u003c/div>\n  \u003c/div>`;\n}\n\nconst CLASS_HUES = {\n  Stimulant: \"#f2b23e\",\n  Nootropic: \"#8b7bff\",\n  Racetam: \"#a78bfa\",\n  Peptide: \"#6fb3ff\",\n  Adaptogen: \"#4ade80\",\n  Herb: \"#5ec98a\",\n  Antidepressant: \"#3edbd3\",\n  Anxiolytic: \"#77d26b\",\n  Sedative: \"#6ee7b7\",\n  Psychedelic: \"#c084fc\",\n  Dissociative: \"#b388ff\",\n  Opioid: \"#ff9f45\",\n  Cannabinoid: \"#84cc16\",\n  \"Mood stabiliser\": \"#f0abfc\",\n  Supplement: \"#9aa6b2\",\n  Vitamin: \"#a3e635\",\n  Amino: \"#60a5fa\",\n  Hormone: \"#fb923c\",\n  Depressant: \"#94a3b8\",\n  Antipsychotic: \"#f472b6\",\n  \"Wakefulness agent\": \"#fbbf24\",\n};\n\nexport function classColor(cls) {\n  if (CLASS_HUES[cls]) return CLASS_HUES[cls];\n  let h = 0;\n  for (const ch of String(cls || \"\")) h = (h * 31 + ch.charCodeAt(0)) % 360;\n  return `hsl(${h} 62% 62%)`;\n}\n\nexport function compoundCard(c) {\n  return `\u003ca class=\"compound-card\" href=\"#/compounds/${esc(c.id)}\" style=\"--dot:${classColor(c.cls)}\">\n    \u003cdiv class=\"row between\" style=\"align-items:flex-start;gap:8px\">\n      \u003cdiv style=\"min-width:0\">\n        \u003cdiv class=\"cc-name\">${esc(c.name)}\u003c/div>\n        \u003cdiv class=\"cc-cls\">${esc(c.cls)}${c.subcls ? ` · ${esc(c.subcls)}` : \"\"}\u003c/div>\n      \u003c/div>\n      ${evidenceChip(c.evidence)}\n    \u003c/div>\n    \u003cp class=\"cc-sum\">${esc(c.summary)}\u003c/p>\n    \u003cdiv class=\"cc-foot\">\n      ${(c.tags || []).slice(0, 2).map((t) => `\u003cspan class=\"chip\">${esc(t)}\u003c/span>`).join(\"\")}\n      ${c.pk && c.pk.halfLife ? `\u003cspan class=\"tag\">t½ ${esc(fmtHalf(c.pk.halfLife))}\u003c/span>` : \"\"}\n    \u003c/div>\n  \u003c/a>`;\n}\n\nfunction fmtHalf(h) {\n  const n = Number(h);\n  if (!Number.isFinite(n)) return \"—\";\n  if (n \u003c 1) return `${Math.round(n * 60)} min`;\n  if (n \u003c 48) return `${Math.round(n * 10) / 10} h`;\n  return `${Math.round((n / 24) * 10) / 10} d`;\n}\n\nexport function severityChip(sev) {\n  const meta = SEVERITY[sev] || SEVERITY.minor;\n  const cls = sev === \"critical\" ? \"crit\" : sev === \"major\" ? \"bad\" : sev === \"moderate\" ? \"warn\" : \"\";\n  return `\u003cspan class=\"chip chip-${cls}\">${icon(sev === \"critical\" ? \"alert\" : \"info\", 12)} ${esc(meta.label)}\u003c/span>`;\n}\n\nexport function sectionCard(title, body, action = \"\", sub = \"\") {\n  return `\u003csection class=\"card\">\n    \u003cdiv class=\"card-head\">\u003ch3>${esc(title)}\u003c/h3>\u003cspan class=\"spacer\">\u003c/span>${action}\u003c/div>\n    ${sub ? `\u003cp class=\"small dim\" style=\"margin:-6px 0 10px\">${esc(sub)}\u003c/p>` : \"\"}\n    ${body}\n  \u003c/section>`;\n}\n\nexport function chipRow(items, activeValue, dataAttr, { allLabel = \"All\" } = {}) {\n  return `\u003cdiv class=\"row wrap\" style=\"gap:6px\">\n    \u003cbutton class=\"chip chip-btn ${!activeValue ? \"on\" : \"\"}\" data-${dataAttr}=\"\">${esc(allLabel)}\u003c/button>\n    ${items\n      .map((it) => {\n        const value = typeof it === \"string\" ? it : it.value;\n        const label = typeof it === \"string\" ? it : it.label;\n        return `\u003cbutton class=\"chip chip-btn ${activeValue === value ? \"on\" : \"\"}\" data-${dataAttr}=\"${esc(value)}\">${esc(label)}\u003c/button>`;\n      })\n      .join(\"\")}\n  \u003c/div>`;\n}\n\n/** Horizontal \"meter\" with a label and value text. */\nexport function metric(label, valueText, ratio, tone = \"\") {\n  return `\u003cdiv class=\"stack-3\">\n    \u003cdiv class=\"row between tiny\">\u003cspan class=\"muted\">${esc(label)}\u003c/span>\u003cspan class=\"mono dim\">${esc(valueText)}\u003c/span>\u003c/div>\n    \u003cdiv class=\"meter ${tone}\">\u003ci style=\"width:${Math.round(clamp01(ratio) * 100)}%\">\u003c/i>\u003c/div>\n  \u003c/div>`;\n}\n\nconst clamp01 = (n) => Math.max(0, Math.min(1, Number(n) || 0));\n\nexport function callout(kind, title, body) {\n  const map = {\n    danger: { ic: \"alert\", color: \"var(--critical)\", bg: \"rgba(248,81,73,.08)\", line: \"rgba(248,81,73,.28)\" },\n    warn: { ic: \"alert\", color: \"var(--warn)\", bg: \"rgba(210,153,34,.08)\", line: \"rgba(210,153,34,.26)\" },\n    ok: { ic: \"check\", color: \"var(--good)\", bg: \"rgba(63,185,80,.08)\", line: \"rgba(63,185,80,.26)\" },\n    info: { ic: \"info\", color: \"var(--ok)\", bg: \"rgba(111,179,255,.08)\", line: \"rgba(111,179,255,.26)\" },\n  };\n  const m = map[kind] || map.info;\n  return `\u003cdiv class=\"callout callout-${esc(kind)}\" style=\"display:flex;gap:10px;padding:11px 13px;border-radius:12px;background:${m.bg};border:1px solid ${m.line};font-size:12.5px;line-height:1.55\">\n    \u003cspan style=\"color:${m.color};flex:none;margin-top:1px\">${icon(m.ic, 16)}\u003c/span>\n    \u003cdiv style=\"min-width:0\">\u003cstrong style=\"color:${m.color};display:block;font-size:12.5px;margin-bottom:2px\">${esc(title)}\u003c/strong>\n    \u003cspan class=\"muted\">${esc(body)}\u003c/span>\u003c/div>\n  \u003c/div>`;\n}\n\n/** Simple line chart from numeric series; pure SVG, responsive. */\nexport function lineChart(series, { width = 340, height = 140, yLabel = \"\", xTicks = [], yMax = null } = {}) {\n  const padL = 30;\n  const padR = 8;\n  const padT = 10;\n  const padB = 20;\n  const w = width - padL - padR;\n  const h = height - padT - padB;\n  const maxY = yMax || Math.max(...series.map((s) => Math.max(...s.points.map((p) => p.y))), 0.0001);\n  const maxX = Math.max(...series.map((s) => Math.max(...s.points.map((p) => p.x))), 1);\n\n  const sx = (x) => padL + (x / maxX) * w;\n  const sy = (y) => padT + h - (y / maxY) * h;\n\n  const gridLines = [0, 0.25, 0.5, 0.75, 1]\n    .map((f) => {\n      const y = padT + h - f * h;\n      return `\u003cline class=\"chart-grid\" x1=\"${padL}\" y1=\"${y.toFixed(1)}\" x2=\"${width - padR}\" y2=\"${y.toFixed(1)}\"/>\n      \u003ctext class=\"chart-axis\" x=\"${padL - 5}\" y=\"${(y + 2.5).toFixed(1)}\" text-anchor=\"end\">${(maxY * f).toFixed(f === 0 ? 0 : 1)}\u003c/text>`;\n    })\n    .join(\"\");\n\n  const paths = series\n    .map((s) => {\n      if (!s.points.length) return \"\";\n      const d = s.points.map((p, i) => `${i ? \"L\" : \"M\"}${sx(p.x).toFixed(1)} ${sy(p.y).toFixed(1)}`).join(\" \");\n      const area = `${d} L${sx(s.points[s.points.length - 1].x).toFixed(1)} ${padT + h} L${sx(s.points[0].x).toFixed(1)} ${padT + h} Z`;\n      return `\u003cpath class=\"chart-area\" d=\"${area}\" fill=\"${s.color}\"/>\n        \u003cpath class=\"chart-line\" d=\"${d}\" stroke=\"${s.color}\" ${s.dash ? 'stroke-dasharray=\"3 3\"' : \"\"}/>\n        ${s.marker ? `\u003ccircle class=\"chart-dot\" cx=\"${sx(s.marker.x).toFixed(1)}\" cy=\"${sy(s.marker.y).toFixed(1)}\" r=\"3\" fill=\"${s.color}\"/>` : \"\"}`;\n    })\n    .join(\"\");\n\n  const xLabels = xTicks\n    .map((t) => `\u003ctext class=\"chart-axis\" x=\"${sx(t.x).toFixed(1)}\" y=\"${height - 5}\" text-anchor=\"middle\">${esc(t.label)}\u003c/text>`)\n    .join(\"\");\n\n  return `\u003cdiv class=\"chart-box\">\u003csvg class=\"chart-svg\" viewBox=\"0 0 ${width} ${height}\" role=\"img\" aria-label=\"${esc(yLabel || \"chart\")}\">\n    ${gridLines}${paths}${xLabels}\n    \u003cline class=\"chart-grid\" x1=\"${padL}\" y1=\"${padT + h}\" x2=\"${width - padR}\" y2=\"${padT + h}\"/>\n    ${yLabel ? `\u003ctext class=\"chart-axis\" x=\"${padL}\" y=\"7\" text-anchor=\"start\">${esc(yLabel)}\u003c/text>` : \"\"}\n  \u003c/svg>\u003c/div>`;\n}","/app/views/home.js":"/* Home / dashboard */\n\nimport { esc, icon, store, levelFor, fmt, EVIDENCE, evidenceChip, emptyState } from \"__ND__/app/core.js\";\nimport { COMPOUNDS, COMPOUND_BY_ID } from \"__ND__/app/data/compounds.js\";\nimport { SYSTEMS, SYSTEM_BY_ID } from \"__ND__/app/data/neuro.js\";\nimport { COURSES, TOTAL_LESSONS, LESSON_INDEX, FLASHCARDS } from \"__ND__/app/data/learn.js\";\nimport { checkInteractions, worstSeverity } from \"__ND__/app/data/interactions.js\";\nimport { deckStats } from \"__ND__/app/srs.js\";\nimport { pageHead, statTile, compoundCard, classColor, metric, callout } from \"__ND__/app/views/ui.js\";\n\nfunction greeting() {\n  const h = new Date().getHours();\n  if (h \u003c 5) return \"Still up\";\n  if (h \u003c 12) return \"Good morning\";\n  if (h \u003c 18) return \"Good afternoon\";\n  return \"Good evening\";\n}\n\nfunction nextLesson() {\n  const done = store.data.lessons || {};\n  for (const course of COURSES) {\n    for (const lesson of course.lessons) {\n      if (!done[lesson.id]?.completed) return { course, lesson };\n    }\n  }\n  return null;\n}\n\nfunction dailyPick() {\n  const seed = Math.floor(Date.now() / 86400000);\n  return COMPOUNDS[seed % COMPOUNDS.length];\n}\n\nfunction dailySystem() {\n  const seed = Math.floor(Date.now() / 86400000);\n  return SYSTEMS[(seed + 3) % SYSTEMS.length];\n}\n\nexport function render() {\n  const s = store.data;\n  const lvl = levelFor(s.profile.xp || 0);\n  const lessonsDone = Object.values(s.lessons || {}).filter((l) => l && l.completed).length;\n  const cards = deckStats(FLASHCARDS);\n  const stack = (s.stack || []).map((id) => COMPOUND_BY_ID.get(id)).filter(Boolean);\n  const findings = stack.length > 1 ? checkInteractions(stack) : [];\n  const worst = findings.length ? worstSeverity(findings) : null;\n  const next = nextLesson();\n  const pick = dailyPick();\n  const sys = dailySystem();\n  const accuracy = s.profile.quizzes ? Math.round((s.profile.correct / s.profile.quizzes) * 100) : 0;\n\n  return `\n  ${pageHead(\n    `${greeting()}.`,\n    \"An evidence-graded map of neuropharmacology: compounds, receptor systems, interactions and the maths behind them.\",\n    `\u003ca class=\"btn primary sm\" href=\"#/compounds\">${icon(\"search\", 15)} Browse compounds\u003c/a>`,\n    \"NeuroDifference\"\n  )}\n\n  \u003cdiv class=\"grid\" style=\"gap:14px;margin-bottom:26px\">\n    \u003csection class=\"card glow\" style=\"padding:18px\">\n      \u003cdiv class=\"row between wrap\" style=\"gap:14px;align-items:flex-start\">\n        \u003cdiv class=\"stack\" style=\"gap:8px;min-width:0;flex:1\">\n          \u003cdiv class=\"row\" style=\"gap:8px\">\n            \u003cspan class=\"chip chip-accent\">${icon(\"sparkles\", 12)} Level ${lvl.level}\u003c/span>\n            ${s.profile.streak ? `\u003cspan class=\"chip\">${icon(\"zap\", 12)} ${s.profile.streak}-day streak\u003c/span>` : \"\"}\n            \u003cspan class=\"chip\">${(s.profile.xp || 0).toLocaleString()} XP\u003c/span>\n          \u003c/div>\n          \u003ch2 style=\"font-size:19px;letter-spacing:-.025em\">${next ? `${next.lesson.title}` : \"You finished every lesson\"}\u003c/h2>\n          \u003cp class=\"small muted\" style=\"max-width:56ch\">\n            ${\n              next\n                ? `${esc(next.course.title)} · ${next.lesson.minutes} min · +${next.lesson.xp} XP`\n                : \"Nice. Review your flashcards to keep the mechanisms sharp.\"\n            }\n          \u003c/p>\n          \u003cdiv style=\"max-width:340px\">${metric(\"Level progress\", `${lvl.into} / ${lvl.need} XP`, lvl.progress)}\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"row wrap\" style=\"gap:8px;flex:none\">\n          \u003ca class=\"btn primary\" href=\"${next ? `#/learn/${next.course.id}/${next.lesson.id}` : \"#/cards\"}\">\n            ${icon(next ? \"play\" : \"layers\", 15)} ${next ? \"Continue\" : \"Review cards\"}\n          \u003c/a>\n          \u003ca class=\"btn ghost\" href=\"#/brain\">${icon(\"brain\", 15)} Brain map\u003c/a>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003cdiv class=\"grid grid-4\" style=\"gap:10px\">\n      ${statTile({ label: \"Compounds\", value: COMPOUNDS.length, sub: `${new Set(COMPOUNDS.map((c) => c.cls)).size} classes`, iconName: \"pill\" })}\n      ${statTile({ label: \"Systems\", value: SYSTEMS.length, sub: \"transmitter pathways\", iconName: \"activity\" })}\n      ${statTile({ label: \"Lessons\", value: `${lessonsDone}/${TOTAL_LESSONS}`, sub: accuracy ? `${accuracy}% quiz accuracy` : \"no quizzes yet\", iconName: \"book\" })}\n      ${statTile({ label: \"Cards due\", value: cards.due, sub: `${cards.mature} mature · ${cards.total} total`, iconName: \"layers\" })}\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"split-wide\">\n    \u003cdiv>\n\n      \u003csection class=\"block\">\n        \u003cdiv class=\"block-head\">\n          \u003cdiv>\u003ch2>Quick actions\u003c/h2>\u003cp class=\"block-sub\">Jump straight to the tool you need\u003c/p>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"grid grid-3\" style=\"gap:10px\">\n          ${actionCard(\"flask\", \"PK simulator\", \"Plot plasma curves, half-lives and accumulation\", \"#/lab\", \"violet\")}\n          ${actionCard(\"shield\", \"Interaction check\", \"Stack combinations against a rule engine\", \"#/lab/interactions\", \"green\")}\n          ${actionCard(\"brain\", \"Pathway explorer\", \"Trace synthesis, receptors and drug targets\", \"#/brain\", \"amber\")}\n          ${actionCard(\"scale\", \"Taper planner\", \"Turn a half-life into a step-down schedule\", \"#/lab/taper\", \"blue\")}\n          ${actionCard(\"grid\", \"Compare compounds\", \"Two or three monographs, fact by fact\", \"#/compare\", \"violet\")}\n          ${actionCard(\"message\", \"Ask the library\", \"Plain-language answers from the local data\", \"#/ask\", \"blue\")}\n        \u003c/div>\n      \u003c/section>\n\n      ${\n        stack.length\n          ? `\u003csection class=\"block\">\n              \u003cdiv class=\"block-head\">\n                \u003cdiv>\u003ch2>Your stack\u003c/h2>\u003cp class=\"block-sub\">${stack.length} compound${stack.length === 1 ? \"\" : \"s\"} · ${findings.length} interaction signal${findings.length === 1 ? \"\" : \"s\"}\u003c/p>\u003c/div>\n                \u003ca class=\"btn ghost sm\" href=\"#/lab/interactions\">Open checker ${icon(\"chevronRight\", 14)}\u003c/a>\n              \u003c/div>\n              ${worst ? `\u003cdiv style=\"margin-bottom:10px\">${callout(\n                worst === \"critical\" ? \"danger\" : worst === \"major\" ? \"warn\" : \"info\",\n                worst === \"critical\" ? \"This combination contains a serious interaction\" : worst === \"major\" ? \"High-risk interaction detected\" : \"Some interactions worth knowing\",\n                `${findings.length} signal${findings.length === 1 ? \"\" : \"s\"} detected. Review the details before trusting this stack.`\n              )}\u003c/div>` : \"\"}\n              \u003cdiv class=\"card flush\">\n                \u003cdiv class=\"list\">\n                  ${stack\n                    .map(\n                      (c) => `\u003ca class=\"list-row\" href=\"#/compounds/${esc(c.id)}\">\n                        \u003cspan style=\"width:8px;height:8px;border-radius:50%;background:${classColor(c.cls)};flex:none\">\u003c/span>\n                        \u003cdiv class=\"grow\">\u003cdiv class=\"title\">${esc(c.name)}\u003c/div>\u003cdiv class=\"sub\">${esc(c.cls)}${c.pk?.halfLife ? ` · t½ ${fmt.duration(c.pk.halfLife)}` : \"\"}\u003c/div>\u003c/div>\n                        ${evidenceChip(c.evidence)}\n                      \u003c/a>`\n                    )\n                    .join(\"\")}\n                \u003c/div>\n              \u003c/div>\n            \u003c/section>`\n          : `\u003csection class=\"block\">\n              \u003cdiv class=\"block-head\">\u003cdiv>\u003ch2>Your stack\u003c/h2>\u003cp class=\"block-sub\">Add compounds to check them together\u003c/p>\u003c/div>\u003c/div>\n              \u003cdiv class=\"card\">\n                ${emptyState(\"pill\", \"Nothing in your stack yet\", \"Open any compound and tap “Add to stack” — the interaction engine will keep watching.\", `\u003ca class=\"btn soft sm\" href=\"#/compounds\">${icon(\"plus\", 14)} Add a compound\u003c/a>`)}\n              \u003c/div>\n            \u003c/section>`\n      }\n\n      \u003csection class=\"block\">\n        \u003cdiv class=\"block-head\">\n          \u003cdiv>\u003ch2>Courses\u003c/h2>\u003cp class=\"block-sub\">Structured, from membrane potentials to evidence literacy\u003c/p>\u003c/div>\n          \u003ca class=\"btn ghost sm\" href=\"#/learn\">All lessons ${icon(\"chevronRight\", 14)}\u003c/a>\n        \u003c/div>\n        \u003cdiv class=\"grid\" style=\"gap:10px\">\n          ${COURSES.map((course) => {\n            const done = course.lessons.filter((l) => store.data.lessons[l.id]?.completed).length;\n            const pct = done / course.lessons.length;\n            return `\u003ca class=\"card hoverable\" href=\"#/learn/${esc(course.id)}\" style=\"text-decoration:none;color:inherit\">\n              \u003cdiv class=\"row between\" style=\"align-items:flex-start;margin-bottom:8px\">\n                \u003cdiv style=\"min-width:0\">\n                  \u003cdiv class=\"row\" style=\"gap:6px;margin-bottom:3px\">\n                    \u003cspan class=\"chip\">${esc(course.level)}\u003c/span>\n                    ${done === course.lessons.length ? `\u003cspan class=\"chip chip-good\">${icon(\"check\", 11)} done\u003c/span>` : \"\"}\n                  \u003c/div>\n                  \u003ch3 style=\"font-size:14.5px\">${esc(course.title)}\u003c/h3>\n                \u003c/div>\n                \u003cspan class=\"mono tiny dim nowrap\">${done}/${course.lessons.length}\u003c/span>\n              \u003c/div>\n              \u003cp class=\"small dim\" style=\"margin-bottom:9px;line-height:1.5\">${esc(course.blurb)}\u003c/p>\n              \u003cdiv class=\"meter\">\u003ci style=\"width:${Math.round(pct * 100)}%\">\u003c/i>\u003c/div>\n            \u003c/a>`;\n          }).join(\"\")}\n        \u003c/div>\n      \u003c/section>\n    \u003c/div>\n\n    \u003caside class=\"col sticky-side\" style=\"gap:14px\">\n\n      \u003cdiv class=\"card\" style=\"padding:0;overflow:hidden\">\n        \u003cdiv style=\"padding:14px 14px 10px;border-bottom:1px solid var(--line-soft)\">\n          \u003cdiv class=\"eyebrow\" style=\"margin-bottom:6px\">Today's compound\u003c/div>\n          \u003ca href=\"#/compounds/${esc(pick.id)}\" style=\"color:inherit;text-decoration:none\">\n            \u003cdiv class=\"row between\" style=\"align-items:flex-start;gap:8px\">\n              \u003ch3 style=\"font-size:16px\">${esc(pick.name)}\u003c/h3>\n              ${evidenceChip(pick.evidence)}\n            \u003c/div>\n          \u003c/a>\n        \u003c/div>\n        \u003cdiv style=\"padding:12px 14px 14px\" class=\"stack\">\n          \u003cp class=\"small muted\" style=\"line-height:1.55\">${esc(pick.summary)}\u003c/p>\n          \u003cdiv class=\"row wrap\" style=\"gap:6px\">\n            ${(pick.moa || []).slice(0, 2).map((m) => `\u003cspan class=\"chip chip-accent\">${esc(m)}\u003c/span>`).join(\"\")}\n          \u003c/div>\n          \u003ca class=\"btn ghost sm block\" href=\"#/compounds/${esc(pick.id)}\">Read the entry ${icon(\"chevronRight\", 14)}\u003c/a>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"card\" style=\"--dot:${sys.color}\">\n        \u003cdiv class=\"eyebrow\" style=\"margin-bottom:6px\">Today's system\u003c/div>\n        \u003ch3 style=\"font-size:16px;margin-bottom:4px\">${esc(sys.name)} \u003cspan class=\"mono tiny\" style=\"color:${sys.color}\">${esc(sys.abbr)}\u003c/span>\u003c/h3>\n        \u003cp class=\"small muted\" style=\"line-height:1.55;margin-bottom:10px\">${esc(sys.summary)}\u003c/p>\n        \u003cdiv class=\"row wrap\" style=\"gap:5px;margin-bottom:10px\">\n          ${sys.functions.slice(0, 3).map((f) => `\u003cspan class=\"chip\">${esc(f)}\u003c/span>`).join(\"\")}\n        \u003c/div>\n        \u003ca class=\"btn ghost sm block\" href=\"#/brain/${esc(sys.id)}\">Open pathway ${icon(\"chevronRight\", 14)}\u003c/a>\n      \u003c/div>\n\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-head\">\u003ch3 style=\"font-size:14px\">Evidence key\u003c/h3>\u003c/div>\n        \u003cdiv class=\"stack\" style=\"gap:7px\">\n          ${Object.entries(EVIDENCE)\n            .map(\n              ([key, meta]) => `\u003cdiv class=\"row\" style=\"gap:8px\">\n                ${evidenceChip(key)}\n                \u003cspan class=\"tiny dim\" style=\"line-height:1.35\">${esc(meta.label)}\u003c/span>\n              \u003c/div>`\n            )\n            .join(\"\")}\n        \u003c/div>\n      \u003c/div>\n\n      \u003cp class=\"disclaimer-mini\">${icon(\"info\", 13)} Educational reference — not medical advice.\u003c/p>\n    \u003c/aside>\n  \u003c/div>`;\n}\n\nfunction actionCard(iconName, title, sub, href, accent) {\n  const tones = {\n    violet: [\"#8b7bff\", \"#5b8cff\"],\n    green: [\"#3fb950\", \"#2f9e6b\"],\n    amber: [\"#e3b341\", \"#f0883e\"],\n    blue: [\"#6fb3ff\", \"#8b7bff\"],\n  };\n  const tone = tones[accent] || tones.violet;\n  return `\u003ca class=\"card hoverable\" href=\"${href}\" style=\"text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:7px\">\n    \u003cspan class=\"brand-mark\" style=\"background:linear-gradient(150deg, ${tone[0]}, ${tone[1]});box-shadow:none\">${icon(iconName, 16)}\u003c/span>\n    \u003cdiv>\u003cdiv style=\"font-size:14px;font-weight:640\">${esc(title)}\u003c/div>\n    \u003cdiv class=\"tiny dim\" style=\"margin-top:2px;line-height:1.4\">${esc(sub)}\u003c/div>\u003c/div>\n  \u003c/a>`;\n}","/app/views/compounds.js":"/* Compound browser + detail */\n\nimport { esc, icon, store, fmt, toast, copyText, evidenceChip, EVIDENCE, emptyState, disclaimer, awardXP } from \"__ND__/app/core.js\";\nimport { COMPOUNDS, COMPOUND_BY_ID, CLASSES, searchCompounds, getCompound, pubmedUrl, ALL_TAGS } from \"__ND__/app/data/compounds.js\";\nimport { SYSTEMS } from \"__ND__/app/data/neuro.js\";\nimport { checkInteractions, worstSeverity, SEVERITY } from \"__ND__/app/data/interactions.js\";\nimport { pageHead, compoundCard, classColor, backLink, callout, lineChart } from \"__ND__/app/views/ui.js\";\n\nconst EV_ORDER = [\"strong\", \"moderate\", \"limited\", \"preclinical\", \"anecdotal\"];\n\n/* ------------------------------------------------------------------ */\n/* List                                                                */\n/* ------------------------------------------------------------------ */\n\nconst listState = { q: \"\", cls: \"\", ev: \"\", sort: \"name\", tag: \"\" };\n\nfunction applyFilters() {\n  let items = listState.q ? searchCompounds(listState.q) : COMPOUNDS.slice();\n  if (listState.cls) items = items.filter((c) => c.cls === listState.cls);\n  if (listState.ev) items = items.filter((c) => c.evidence === listState.ev);\n  if (listState.tag) items = items.filter((c) => (c.tags || []).includes(listState.tag));\n\n  if (listState.sort === \"name\") items.sort((a, b) => a.name.localeCompare(b.name));\n  else if (listState.sort === \"evidence\") items.sort((a, b) => EV_ORDER.indexOf(a.evidence) - EV_ORDER.indexOf(b.evidence) || a.name.localeCompare(b.name));\n  else if (listState.sort === \"halflife\") items.sort((a, b) => (a.pk.halfLife ?? 999) - (b.pk.halfLife ?? 999));\n  else if (listState.sort === \"class\") items.sort((a, b) => a.cls.localeCompare(b.cls) || a.name.localeCompare(b.name));\n  return items;\n}\n\nfunction resultsHtml() {\n  const items = applyFilters();\n  if (!items.length) {\n    return `\u003cdiv class=\"card\">${emptyState(\"search\", \"No compounds match\", \"Try a shorter query, or clear the filters.\", `\u003cbutton class=\"btn ghost sm\" data-act=\"reset\">${icon(\"refresh\", 14)} Reset filters\u003c/button>`)}\u003c/div>`;\n  }\n  return `\u003cdiv class=\"grid grid-auto\" style=\"gap:10px\">${items.map(compoundCard).join(\"\")}\u003c/div>`;\n}\n\nfunction countLabel() {\n  const n = applyFilters().length;\n  return `${n} of ${COMPOUNDS.length} compounds`;\n}\n\nexport const list = {\n  render(ctx) {\n    const cls = CLASSES;\n    // Deep links from tag chips: #/compounds?tag=stimulant\n    const tagParam = ctx && ctx.query && ctx.query.tag ? String(ctx.query.tag) : \"\";\n    if (tagParam) listState.tag = tagParam;\n    if (ctx && ctx.query && ctx.query.q) listState.q = String(ctx.query.q);\n    return `\n    ${pageHead(\n      \"Compounds\",\n      \"Every entry is graded by the strength of human evidence, not by popularity. Doses are literature reference points.\",\n      `\u003cbutton class=\"btn ghost sm\" data-act=\"random\">${icon(\"sparkles\", 14)} Random\u003c/button>`\n    )}\n\n    \u003cdiv class=\"card\" style=\"padding:12px;margin-bottom:14px\">\n      \u003cdiv class=\"stack\" style=\"gap:10px\">\n        \u003cdiv class=\"search-input\">\n          ${icon(\"search\", 16)}\n          \u003cinput class=\"input\" id=\"cmp-q\" type=\"search\" placeholder=\"Search name, alias, mechanism, target…\" value=\"${esc(listState.q)}\" autocomplete=\"off\" enterkeyhint=\"search\">\n          \u003cbutton class=\"clear ${listState.q ? \"show\" : \"\"}\" data-act=\"clear-q\" aria-label=\"Clear search\">${icon(\"x\", 15)}\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"scroll-x\">\n          \u003cdiv class=\"row wrap\" style=\"gap:5px\" id=\"cmp-class\">\n            \u003cbutton class=\"chip chip-btn ${!listState.cls ? \"on\" : \"\"}\" data-cls=\"\">All classes\u003c/button>\n            ${cls.map((c) => `\u003cbutton class=\"chip chip-btn ${listState.cls === c ? \"on\" : \"\"}\" data-cls=\"${esc(c)}\">\u003cspan class=\"dot\" style=\"background:${classColor(c)}\">\u003c/span>${esc(c)}\u003c/button>`).join(\"\")}\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"row wrap\" style=\"gap:8px\">\n          ${listState.tag ? `\u003cbutton class=\"chip chip-btn on\" data-act=\"clear-tag\">${icon(\"x\", 12)} tag: ${esc(listState.tag)}\u003c/button>` : \"\"}\n          \u003cdiv class=\"btn-group\" id=\"cmp-ev\">\n            \u003cbutton class=\"${!listState.ev ? \"on\" : \"\"}\" data-ev=\"\">Any evidence\u003c/button>\n            ${EV_ORDER.map((e) => `\u003cbutton class=\"${listState.ev === e ? \"on\" : \"\"}\" data-ev=\"${e}\">${esc(EVIDENCE[e].short)}\u003c/button>`).join(\"\")}\n          \u003c/div>\n          \u003cselect class=\"select\" id=\"cmp-sort\" style=\"width:auto;min-width:140px\" aria-label=\"Sort\">\n            \u003coption value=\"name\" ${listState.sort === \"name\" ? \"selected\" : \"\"}>Name A–Z\u003c/option>\n            \u003coption value=\"evidence\" ${listState.sort === \"evidence\" ? \"selected\" : \"\"}>Strongest evidence\u003c/option>\n            \u003coption value=\"class\" ${listState.sort === \"class\" ? \"selected\" : \"\"}>Class\u003c/option>\n            \u003coption value=\"halflife\" ${listState.sort === \"halflife\" ? \"selected\" : \"\"}>Shortest half-life\u003c/option>\n          \u003c/select>\n          \u003cspan class=\"tiny dim\" id=\"cmp-count\" style=\"margin-left:auto;align-self:center\">${countLabel()}\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv id=\"cmp-results\">${resultsHtml()}\u003c/div>\n    \u003cdiv style=\"margin-top:22px\">${disclaimer(true)}\u003c/div>`;\n  },\n\n  mount(root, ctx) {\n    const q = root.querySelector(\"#cmp-q\");\n    const results = root.querySelector(\"#cmp-results\");\n    const count = root.querySelector(\"#cmp-count\");\n\n    const paint = () => {\n      results.innerHTML = resultsHtml();\n      count.textContent = countLabel();\n    };\n\n    q?.addEventListener(\"input\", () => {\n      listState.q = q.value;\n      root.querySelector('[data-act=\"clear-q\"]')?.classList.toggle(\"show\", !!q.value);\n      paint();\n    });\n\n    root.querySelector('[data-act=\"clear-q\"]')?.addEventListener(\"click\", () => {\n      listState.q = \"\";\n      if (q) q.value = \"\";\n      root.querySelector('[data-act=\"clear-q\"]')?.classList.remove(\"show\");\n      paint();\n      q?.focus();\n    });\n\n    root.querySelector(\"#cmp-class\")?.addEventListener(\"click\", (ev) => {\n      const btn = ev.target.closest(\"[data-cls]\");\n      if (!btn) return;\n      listState.cls = btn.dataset.cls;\n      root.querySelectorAll(\"#cmp-class [data-cls]\").forEach((b) => b.classList.toggle(\"on\", b === btn));\n      paint();\n    });\n\n    root.querySelector(\"#cmp-ev\")?.addEventListener(\"click\", (ev) => {\n      const btn = ev.target.closest(\"[data-ev]\");\n      if (!btn) return;\n      listState.ev = btn.dataset.ev;\n      root.querySelectorAll(\"#cmp-ev [data-ev]\").forEach((b) => b.classList.toggle(\"on\", b === btn));\n      paint();\n    });\n\n    root.querySelector(\"#cmp-sort\")?.addEventListener(\"change\", (ev) => {\n      listState.sort = ev.target.value;\n      paint();\n    });\n\n    root.addEventListener(\"click\", (ev) => {\n      if (ev.target.closest('[data-act=\"clear-tag\"]')) {\n        listState.tag = \"\";\n        if (ctx.navigate) ctx.navigate(\"#/compounds\");\n        else location.hash = \"#/compounds\";\n        return;\n      }\n      const reset = ev.target.closest('[data-act=\"reset\"]');\n      if (reset) {\n        listState.q = \"\";\n        listState.cls = \"\";\n        listState.ev = \"\";\n        listState.tag = \"\";\n        ctx.rerender();\n      }\n      if (ev.target.closest('[data-act=\"random\"]')) {\n        const pick = COMPOUNDS[Math.floor(Math.random() * COMPOUNDS.length)];\n        location.hash = `#/compounds/${pick.id}`;\n      }\n    });\n  },\n};\n\n/* ------------------------------------------------------------------ */\n/* Detail                                                              */\n/* ------------------------------------------------------------------ */\n\nconst detailState = { tab: \"overview\" };\n\nfunction inStack(id) {\n  return (store.data.stack || []).includes(id);\n}\nfunction isSaved(id) {\n  return (store.data.saved || []).includes(id);\n}\n\nconst SYSTEMS_BY_FLAG = (() => {\n  const map = new Map();\n  for (const s of SYSTEMS) {\n    for (const f of s.matchFlags || []) {\n      if (!map.has(f)) map.set(f, []);\n      map.get(f).push(s);\n    }\n  }\n  return map;\n})();\n\nfunction systemsForCompound(c) {\n  const out = new Map();\n  for (const flag of c.flags || []) {\n    for (const s of SYSTEMS_BY_FLAG.get(flag) || []) out.set(s.id, s);\n  }\n  return Array.from(out.values());\n}\n\nfunction tabBar(active) {\n  const tabs = [\n    [\"overview\", \"Overview\"],\n    [\"mechanism\", \"Mechanism\"],\n    [\"pk\", \"Kinetics\"],\n    [\"doses\", \"Doses\"],\n    [\"safety\", \"Safety\"],\n    [\"research\", \"Research\"],\n  ];\n  return `\u003cdiv class=\"tabs\" id=\"cd-tabs\" role=\"tablist\">\n    ${tabs.map(([key, label]) => `\u003cbutton role=\"tab\" aria-selected=\"${active === key}\" class=\"${active === key ? \"on\" : \"\"}\" data-tab=\"${key}\">${esc(label)}\u003c/button>`).join(\"\")}\n  \u003c/div>`;\n}\n\nfunction panelOverview(c) {\n  const stack = (store.data.stack || []).map((id) => COMPOUND_BY_ID.get(id)).filter((x) => x && x.id !== c.id);\n  const findings = stack.length ? checkInteractions([c, ...stack]) : [];\n  const sys = systemsForCompound(c);\n\n  return `\n  \u003cdiv class=\"stack\" style=\"gap:16px\">\n    ${c.summary ? `\u003cp class=\"lead\">${esc(c.summary)}\u003c/p>` : \"\"}\n\n    ${\n      (c.moa || []).length\n        ? `\u003csection>\n            \u003cdiv class=\"eyebrow\" style=\"margin-bottom:7px\">Mechanism of action\u003c/div>\n            \u003cdiv class=\"row wrap\" style=\"gap:6px\">${c.moa.map((m) => `\u003cspan class=\"chip chip-accent\">${esc(m)}\u003c/span>`).join(\"\")}\u003c/div>\n          \u003c/section>`\n        : \"\"\n    }\n\n    ${\n      (c.effects?.good?.length || c.effects?.bad?.length)\n        ? `\u003cdiv class=\"effect-cols\">\n            \u003cdiv class=\"effect-box good\">\u003ch4>${icon(\"check\", 12)} Sought effects\u003c/h4>\n              \u003cul>${(c.effects.good || []).map((x) => `\u003cli>${esc(x)}\u003c/li>`).join(\"\") || \"\u003cli class='dim'>—\u003c/li>\"}\u003c/ul>\u003c/div>\n            \u003cdiv class=\"effect-box bad\">\u003ch4>${icon(\"alert\", 12)} Undesired effects\u003c/h4>\n              \u003cul>${(c.effects.bad || []).map((x) => `\u003cli>${esc(x)}\u003c/li>`).join(\"\") || \"\u003cli class='dim'>—\u003c/li>\"}\u003c/ul>\u003c/div>\n          \u003c/div>`\n        : \"\"\n    }\n\n    ${\n      findings.length\n        ? `\u003csection>\n            \u003cdiv class=\"eyebrow\" style=\"margin-bottom:7px\">Against your stack\u003c/div>\n            \u003cdiv class=\"stack\" style=\"gap:8px\">${findings.slice(0, 4).map(findingRow).join(\"\")}\u003c/div>\n            \u003ca class=\"btn ghost sm\" style=\"margin-top:9px\" href=\"#/lab/interactions\">Open full checker ${icon(\"chevronRight\", 13)}\u003c/a>\n          \u003c/section>`\n        : stack.length\n          ? `\u003cdiv>${callout(\"ok\", \"No known interaction with your current stack\", \"That is not proof of safety — absence of data is not data. Unlisted combinations are simply unstudied.\")}\u003c/div>`\n          : \"\"\n    }\n\n    ${\n      sys.length\n        ? `\u003csection>\n            \u003cdiv class=\"eyebrow\" style=\"margin-bottom:7px\">Systems involved\u003c/div>\n            \u003cdiv class=\"row wrap\" style=\"gap:6px\">\n              ${sys.map((s) => `\u003ca class=\"chip chip-btn\" href=\"#/brain/${esc(s.id)}\" style=\"--dot:${s.color}\">\u003cspan class=\"dot\" style=\"background:${s.color}\">\u003c/span>${esc(s.name)}\u003c/a>`).join(\"\")}\n            \u003c/div>\n          \u003c/section>`\n        : \"\"\n    }\n\n    ${\n      (c.tags || []).length\n        ? `\u003csection>\n            \u003cdiv class=\"eyebrow\" style=\"margin-bottom:7px\">Tags\u003c/div>\n            \u003cdiv class=\"row wrap\" style=\"gap:5px\">${c.tags.map((t) => `\u003ca class=\"chip\" href=\"#/compounds?tag=${encodeURIComponent(t)}\">${esc(t)}\u003c/a>`).join(\"\")}\u003c/div>\n          \u003c/section>`\n        : \"\"\n    }\n\n    \u003cdiv class=\"card tight\" style=\"background:var(--bg-1)\">\n      \u003cdiv class=\"row wrap\" style=\"gap:10px 18px\">\n        \u003cdiv>\u003cdiv class=\"stat-label\">Half-life\u003c/div>\u003cdiv class=\"mono\" style=\"font-size:13px\">${c.pk.halfLife ? fmt.duration(c.pk.halfLife) : \"—\"}\u003c/div>\u003c/div>\n        \u003cdiv>\u003cdiv class=\"stat-label\">T-max\u003c/div>\u003cdiv class=\"mono\" style=\"font-size:13px\">${c.pk.tmax ? fmt.duration(c.pk.tmax) : \"—\"}\u003c/div>\u003c/div>\n        \u003cdiv>\u003cdiv class=\"stat-label\">Duration\u003c/div>\u003cdiv class=\"mono\" style=\"font-size:13px\">${c.pk.duration ? fmt.duration(c.pk.duration) : \"—\"}\u003c/div>\u003c/div>\n        \u003cdiv>\u003cdiv class=\"stat-label\">Class\u003c/div>\u003cdiv class=\"mono\" style=\"font-size:13px\">${esc(c.cls)}\u003c/div>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>`;\n}\n\nfunction panelMechanism(c) {\n  const targets = c.targets || [];\n  return `\n  \u003cdiv class=\"stack\" style=\"gap:16px\">\n    ${\n      (c.moa || []).length\n        ? `\u003cdiv class=\"card tight\">\n            \u003cdiv class=\"eyebrow\" style=\"margin-bottom:6px\">Primary actions\u003c/div>\n            \u003cul class=\"md-list\" style=\"margin:0;padding-left:18px;font-size:13.5px;line-height:1.6\">\n              ${c.moa.map((m) => `\u003cli>${esc(m)}\u003c/li>`).join(\"\")}\n            \u003c/ul>\n          \u003c/div>`\n        : \"\"\n    }\n\n    ${\n      targets.length\n        ? `\u003cdiv class=\"card flush\">\n            \u003cdiv style=\"padding:12px 14px;border-bottom:1px solid var(--line-soft)\">\u003cdiv class=\"eyebrow\">Molecular targets\u003c/div>\u003c/div>\n            \u003cdiv class=\"list\">\n              ${targets\n                .map(\n                  (t) => `\u003cdiv class=\"list-row\" style=\"align-items:flex-start\">\n                    \u003cdiv class=\"grow\">\n                      \u003cdiv class=\"title\">${esc(t.name)} ${t.action ? `\u003cspan class=\"chip chip-${/antagonist|block|inhibit/i.test(t.action) ? \"warn\" : \"good\"}\">${esc(t.action)}\u003c/span>` : \"\"}\u003c/div>\n                      ${t.note ? `\u003cdiv class=\"sub\" style=\"margin-top:3px;line-height:1.5\">${esc(t.note)}\u003c/div>` : \"\"}\n                    \u003c/div>\n                  \u003c/div>`\n                )\n                .join(\"\")}\n            \u003c/div>\n          \u003c/div>`\n        : `\u003cdiv class=\"card\">${emptyState(\"target\", \"No molecular targets recorded\", \"This entry describes mechanism at the systems level only.\")}\u003c/div>`\n    }\n\n    ${(() => {\n      const sys = systemsForCompound(c);\n      if (!sys.length) return \"\";\n      return `\u003cdiv class=\"card\">\n        \u003cdiv class=\"eyebrow\" style=\"margin-bottom:8px\">Where this sits in the pathway\u003c/div>\n        \u003cdiv class=\"stack\" style=\"gap:8px\">\n          ${sys\n            .map((s) => {\n              const pts = (s.interventions || []).filter((p) => (p.drugs || []).includes(c.id));\n              return `\u003ca class=\"card tight hoverable\" href=\"#/brain/${esc(s.id)}\" style=\"text-decoration:none;color:inherit;background:var(--bg-1)\">\n                \u003cdiv class=\"row between\">\u003cdiv class=\"row\" style=\"gap:6px\">\u003cspan class=\"dot\" style=\"width:7px;height:7px;border-radius:50%;background:${s.color}\">\u003c/span>\n                \u003cstrong style=\"font-size:13px\">${esc(s.name)}\u003c/strong>\u003c/div>${icon(\"chevronRight\", 14)}\u003c/div>\n                ${pts.length ? `\u003cdiv class=\"tiny dim\" style=\"margin-top:5px;line-height:1.5\">${pts.map((p) => `${esc(p.point)}: ${esc(p.target)}`).join(\" · \")}\u003c/div>` : `\u003cdiv class=\"tiny dim\" style=\"margin-top:5px\">Acts on this system through a downstream mechanism.\u003c/div>`}\n              \u003c/a>`;\n            })\n            .join(\"\")}\n        \u003c/div>\n      \u003c/div>`;\n    })()}\n  \u003c/div>`;\n}\n\nfunction panelPK(c) {\n  const half = Number(c.pk.halfLife) || 0;\n  const data = [];\n  if (half > 0) {\n    for (let t = 0; t \u003c= Math.min(half * 6, 240); t += Math.max(0.25, half / 12)) {\n      const peak = Math.max(1, half / 2.2);\n      const v = t \u003c peak ? Math.sin((t / peak) * Math.PI * 0.5) : Math.exp(-0.693 * (t - peak) / half);\n      data.push({ x: t, y: Math.max(0.001, v) });\n    }\n  }\n  const series = half > 0 ? [{ color: \"var(--accent)\", points: data }] : [];\n  const ticks = half > 0 ? [0, half, half * 2, half * 3, half * 4].filter((t) => t \u003c= Math.min(half * 6, 240)).map((t) => ({ x: t, label: `${Math.round(t * 10) / 10}h` })) : [];\n\n  return `\n  \u003cdiv class=\"stack\" style=\"gap:14px\">\n    \u003cdiv class=\"card flush\">\n      \u003cdiv class=\"list\">\n        ${kvRow(\"Onset\", c.pk.onset ? fmt.duration(c.pk.onset) : \"—\")}\n        ${kvRow(\"T-max\", c.pk.tmax ? fmt.duration(c.pk.tmax) : \"—\")}\n        ${kvRow(\"Half-life\", c.pk.halfLife ? fmt.duration(c.pk.halfLife) : \"—\")}\n        ${kvRow(\"Duration\", c.pk.duration ? fmt.duration(c.pk.duration) : \"—\")}\n        ${kvRow(\"Metabolism\", c.pk.metabolism || \"—\")}\n        ${kvRow(\"Excretion\", c.pk.excretion || \"—\")}\n      \u003c/div>\n    \u003c/div>\n\n    ${\n      half > 0\n        ? `\u003cdiv class=\"card\">\n            \u003cdiv class=\"card-head\">\u003ch3 style=\"font-size:14px\">Single-dose decay\u003c/h3>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"tiny dim mono\">t½ ${fmt.duration(half)}\u003c/span>\u003c/div>\n            ${lineChart(series, { height: 150, yLabel: \"relative plasma level\", xTicks: ticks, yMax: 1 })}\n            \u003cp class=\"tiny dim\" style=\"margin-top:8px;line-height:1.5\">Schematic first-order decay — absorption simplified. Real curves depend on formulation, food and hepatic blood flow.\u003c/p>\n            \u003ca class=\"btn soft sm\" style=\"margin-top:10px\" href=\"#/lab?compound=${esc(c.id)}\">${icon(\"flask\", 14)} Simulate doses in the lab\u003c/a>\n          \u003c/div>`\n        : \"\"\n    }\n\n    ${\n      half >= 2\n        ? `\u003cdiv class=\"card tight\">\n            \u003cdiv class=\"eyebrow\" style=\"margin-bottom:7px\">Timing implications\u003c/div>\n            \u003cul class=\"md-list\" style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.65\">\n              \u003cli>Steady state after about \u003cstrong>${fmt.duration(half * 5)}\u003c/strong> of regular dosing.\u003c/li>\n              \u003cli>Almost eliminated (≈97%) in about \u003cstrong>${fmt.duration(half * 5)}\u003c/strong> after the last dose.\u003c/li>\n              \u003cli>${half >= 24 ? \"Long half-life: effects accumulate quietly — side effects may appear days into a course.\" : \"Short half-life: levels swing widely between doses; timing matters more than total dose.\"}\u003c/li>\n            \u003c/ul>\n          \u003c/div>`\n        : \"\"\n    }\n  \u003c/div>`;\n}\n\nfunction kvRow(k, v) {\n  return `\u003cdiv class=\"list-row\" style=\"padding:10px 14px\">\n    \u003cdiv class=\"grow\">\u003cdiv class=\"sub\" style=\"margin:0;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em\">${esc(k)}\u003c/div>\n    \u003cdiv style=\"font-size:13px;margin-top:1px\">${esc(v)}\u003c/div>\u003c/div>\n  \u003c/div>`;\n}\n\nfunction panelDoses(c) {\n  const doses = c.doses || [];\n  return `\n  \u003cdiv class=\"stack\" style=\"gap:14px\">\n    ${callout(\n      \"warn\",\n      \"Reference ranges, not recommendations\",\n      \"These are values reported in the clinical literature for context. Individual dosing depends on weight, age, liver and kidney function, genetics and other drugs.\"","/app/views/neuro.js":"/* Brain map + neurotransmitter systems */\n\nimport { esc, icon, fmt, emptyState, evidenceChip } from \"__ND__/app/core.js\";\nimport { SYSTEMS, SYSTEM_BY_ID, BRAIN_REGIONS, REGION_BY_ID } from \"__ND__/app/data/neuro.js\";\nimport { COMPOUNDS, COMPOUND_BY_ID, getCompound, pubmedUrl } from \"__ND__/app/data/compounds.js\";\nimport { pageHead, backLink, classColor, callout } from \"__ND__/app/views/ui.js\";\n\nconst state = { region: \"prefrontal-cortex\", highlight: \"\" };\n\nfunction regionRadius(r) {\n  return Math.max(4, Math.min(9.5, Math.sqrt(r.rx * r.ry) / 3.4));\n}\n\nfunction mapHtml() {\n  const hot = BRAIN_REGIONS.map((r) => {\n    const rad = regionRadius(r);\n    const sys = r.systems.map((id) => SYSTEM_BY_ID.get(id)).filter(Boolean);\n    const main = sys[0];\n    const dim = state.highlight && !r.systems.includes(state.highlight);\n    return `\u003cg class=\"hot ${state.region === r.id ? \"sel\" : \"\"}\" data-region=\"${esc(r.id)}\" tabindex=\"0\" role=\"button\" aria-label=\"${esc(r.name)}\" style=\"--dot:${main ? main.color : \"var(--accent)\"};opacity:${dim ? 0.32 : 1}\">\n      \u003ccircle class=\"hit\" cx=\"${r.x}\" cy=\"${r.y}\" r=\"${rad + 9}\"/>\n      \u003ccircle class=\"core\" cx=\"${r.x}\" cy=\"${r.y}\" r=\"${rad}\"/>\n      ${sys.length > 1 ? `\u003ccircle cx=\"${r.x}\" cy=\"${r.y}\" r=\"${rad - 2.6}\" fill=\"none\" stroke=\"var(--dot)\" stroke-width=\"0.7\" stroke-opacity=\"0.55\"/>` : \"\"}\n      \u003ctext x=\"${r.x}\" y=\"${r.y - rad - 3.5}\" text-anchor=\"middle\">${esc(r.short)}\u003c/text>\n    \u003c/g>`;\n  }).join(\"\");\n\n  return `\u003csvg class=\"brain-svg\" viewBox=\"0 0 420 320\" role=\"img\" aria-label=\"Interactive sagittal brain map\">\n    \u003cdefs>\n      \u003clinearGradient id=\"brainFill\" x1=\"0\" y1=\"0\" x2=\"0.4\" y2=\"1\">\n        \u003cstop offset=\"0%\" stop-color=\"#ffffff\" stop-opacity=\"0.045\"/>\n        \u003cstop offset=\"100%\" stop-color=\"#ffffff\" stop-opacity=\"0.012\"/>\n      \u003c/linearGradient>\n    \u003c/defs>\n\n    \u003c!-- cerebrum -->\n    \u003cpath class=\"outline\" fill=\"url(#brainFill)\" d=\"M46 150 C46 94 92 54 150 49 C206 44 258 58 296 77 C330 94 356 113 366 139 C374 159 371 177 357 191 C343 205 322 205 306 215 C291 225 267 233 243 232 C207 231 176 219 150 199 C122 177 74 187 56 169 C48 161 46 156 46 150 Z\"/>\n\n    \u003c!-- sulci -->\n    \u003cpath class=\"sulcus\" d=\"M96 88 C120 104 140 118 150 136 C160 154 158 172 150 190\"/>\n    \u003cpath class=\"sulcus\" d=\"M168 62 C176 84 186 100 200 112\"/>\n    \u003cpath class=\"sulcus\" d=\"M232 66 C238 88 246 104 258 118\"/>\n    \u003cpath class=\"sulcus\" d=\"M290 84 C292 106 296 124 306 140\"/>\n    \u003cpath class=\"sulcus\" d=\"M110 130 C132 136 152 140 172 140\"/>\n    \u003cpath class=\"sulcus\" d=\"M196 148 C216 152 238 150 256 142\"/>\n    \u003cpath class=\"sulcus\" d=\"M120 118 C140 120 158 116 172 108\"/>\n\n    \u003c!-- temporal lobe line -->\n    \u003cpath class=\"sulcus\" d=\"M150 199 C176 210 206 214 236 208 C258 204 274 210 286 218\"/>\n\n    \u003c!-- cerebellum -->\n    \u003cpath class=\"outline\" d=\"M300 214 C324 202 352 210 358 232 C364 254 344 270 322 266 C302 262 288 238 300 214 Z\"/>\n    \u003cpath class=\"sulcus\" d=\"M304 226 C316 220 332 220 344 228\"/>\n    \u003cpath class=\"sulcus\" d=\"M302 240 C316 234 334 234 348 242\"/>\n    \u003cpath class=\"sulcus\" d=\"M306 252 C318 246 336 246 348 252\"/>\n\n    \u003c!-- brainstem -->\n    \u003cpath class=\"outline\" d=\"M288 226 C296 246 298 268 296 292 C295 300 306 302 308 294 C312 268 314 246 312 228 Z\"/>\n\n    \u003c!-- pineal stalk hint -->\n    \u003cpath class=\"sulcus\" d=\"M268 158 C276 156 284 158 288 164\"/>\n\n    ${hot}\n  \u003c/svg>`;\n}\n\nfunction regionPanel() {\n  const r = REGION_BY_ID.get(state.region) || BRAIN_REGIONS[0];\n  const systems = r.systems.map((id) => SYSTEM_BY_ID.get(id)).filter(Boolean);\n  const drugs = (r.drugs || []).map((id) => COMPOUND_BY_ID.get(id)).filter(Boolean);\n\n  return `\u003cdiv class=\"card region-panel\" style=\"padding:14px\">\n    \u003cdiv class=\"row between\" style=\"align-items:flex-start;gap:8px;margin-bottom:7px\">\n      \u003cdiv>\u003ch3 style=\"font-size:16px\">${esc(r.name)}\u003c/h3>\n      \u003cdiv class=\"tiny dim mono\" style=\"margin-top:2px\">${esc(r.short)} · ${r.functions.length} functions\u003c/div>\u003c/div>\n      \u003ca class=\"btn ghost sm\" href=\"#/brain/${esc(systems[0]?.id || \"\")}\">${icon(\"activity\", 13)} Pathways\u003c/a>\n    \u003c/div>\n\n    \u003cp class=\"small muted\" style=\"line-height:1.6;margin-bottom:10px\">${esc(r.note)}\u003c/p>\n\n    \u003cdiv class=\"row wrap\" style=\"gap:5px;margin-bottom:10px\">\n      ${systems.map((s) => `\u003ca class=\"chip chip-btn\" href=\"#/brain/${esc(s.id)}\" style=\"--dot:${s.color}\">\u003cspan class=\"dot\" style=\"background:${s.color}\">\u003c/span>${esc(s.abbr)}\u003c/a>`).join(\"\")}\n    \u003c/div>\n\n    \u003cdiv class=\"effect-box\" style=\"margin-bottom:10px\">\n      \u003ch4 style=\"color:var(--text-2)\">${icon(\"target\", 12)} Functions\u003c/h4>\n      \u003cul>${r.functions.map((f) => `\u003cli>${esc(f)}\u003c/li>`).join(\"\")}\u003c/ul>\n    \u003c/div>\n\n    ${drugs.length ? `\u003cdiv class=\"row wrap\" style=\"gap:5px\">\n      \u003cspan class=\"tiny dim\" style=\"width:100%;margin-bottom:2px\">Compounds that act here\u003c/span>\n      ${drugs.map((d) => `\u003ca class=\"chip chip-btn\" href=\"#/compounds/${esc(d.id)}\">\u003cspan class=\"dot\" style=\"background:${classColor(d.cls)}\">\u003c/span>${esc(d.name)}\u003c/a>`).join(\"\")}\n    \u003c/div>` : \"\"}\n  \u003c/div>`;\n}\n\nexport const map = {\n  render() {\n    return `\n    ${pageHead(\n      \"Brain map\",\n      \"Tap a region to see its functions, the transmitter systems it depends on, and the compounds that act there.\",\n      `\u003cbutton class=\"btn ghost sm\" data-act=\"shuffle\">${icon(\"refresh\", 14)} Random region\u003c/button>`\n    )}\n\n    \u003cdiv class=\"row wrap\" style=\"gap:5px;margin-bottom:10px\" id=\"sys-filter\">\n      \u003cbutton class=\"chip chip-btn ${!state.highlight ? \"on\" : \"\"}\" data-sys=\"\">All systems\u003c/button>\n      ${SYSTEMS.map((s) => `\u003cbutton class=\"chip chip-btn ${state.highlight === s.id ? \"on\" : \"\"}\" data-sys=\"${esc(s.id)}\" style=\"--dot:${s.color}\">\u003cspan class=\"dot\" style=\"background:${s.color}\">\u003c/span>${esc(s.abbr)}\u003c/button>`).join(\"\")}\n    \u003c/div>\n\n    \u003cdiv class=\"split\" style=\"margin-bottom:24px\">\n      \u003cdiv>\n        \u003cdiv class=\"brain-wrap\" id=\"brain-wrap\">${mapHtml()}\u003c/div>\n        \u003cp class=\"tiny dim\" style=\"margin-top:8px;line-height:1.5\">Sagittal schematic — frontal pole left, cerebellum and brainstem lower right. Not to anatomical scale; the ring marks regions with multiple systems.\u003c/p>\n      \u003c/div>\n      \u003cdiv id=\"region-panel\">${regionPanel()}\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"block-head\">\n      \u003cdiv>\u003ch2>Transmitter systems\u003c/h2>\u003cp class=\"block-sub\">Synthesis, receptors, clearance and the points where drugs intervene\u003c/p>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"grid grid-auto\" style=\"gap:10px\">\n      ${SYSTEMS.map(systemCard).join(\"\")}\n    \u003c/div>`;\n  },\n\n  mount(root, ctx) {\n    const wrap = root.querySelector(\"#brain-wrap\");\n    const panelEl = root.querySelector(\"#region-panel\");\n\n    const select = (id) => {\n      state.region = id;\n      wrap.innerHTML = mapHtml();\n      panelEl.innerHTML = regionPanel();\n      wrap.querySelector(`[data-region=\"${id}\"]`)?.classList.add(\"sel\");\n    };\n\n    wrap.addEventListener(\"click\", (ev) => {\n      const g = ev.target.closest(\"[data-region]\");\n      if (g) select(g.dataset.region);\n    });\n    wrap.addEventListener(\"keydown\", (ev) => {\n      if (ev.key !== \"Enter\" && ev.key !== \" \") return;\n      const g = ev.target.closest(\"[data-region]\");\n      if (g) {\n        ev.preventDefault();\n        select(g.dataset.region);\n      }\n    });\n\n    root.querySelector(\"#sys-filter\")?.addEventListener(\"click\", (ev) => {\n      const btn = ev.target.closest(\"[data-sys]\");\n      if (!btn) return;\n      state.highlight = btn.dataset.sys;\n      root.querySelectorAll(\"#sys-filter [data-sys]\").forEach((b) => b.classList.toggle(\"on\", b === btn));\n      wrap.innerHTML = mapHtml();\n    });\n\n    root.querySelector('[data-act=\"shuffle\"]')?.addEventListener(\"click\", () => {\n      const pick = BRAIN_REGIONS[Math.floor(Math.random() * BRAIN_REGIONS.length)];\n      select(pick.id);\n    });\n  },\n};\n\nfunction systemCard(s) {\n  const count = COMPOUNDS.filter((c) => (c.flags || []).some((f) => (s.matchFlags || []).includes(f))).length;\n  return `\u003ca class=\"card hoverable\" href=\"#/brain/${esc(s.id)}\" style=\"--dot:${s.color};text-decoration:none;color:inherit\">\n    \u003cdiv class=\"row between\" style=\"align-items:flex-start;margin-bottom:6px\">\n      \u003cdiv class=\"row\" style=\"gap:8px;min-width:0\">\n        \u003cspan style=\"width:9px;height:9px;border-radius:50%;background:${s.color};flex:none;box-shadow:0 0 10px ${s.color}\">\u003c/span>\n        \u003cdiv style=\"min-width:0\">\n          \u003cdiv style=\"font-size:14.5px;font-weight:650\">${esc(s.name)}\u003c/div>\n          \u003cdiv class=\"tiny dim\">${esc(s.tagline)}\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cspan class=\"mono tiny\" style=\"color:${s.color}\">${esc(s.abbr)}\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"row wrap\" style=\"gap:5px\">\n      \u003cspan class=\"chip\">${icon(\"target\", 11)} ${s.receptors.length} receptors\u003c/span>\n      \u003cspan class=\"chip\">${icon(\"pill\", 11)} ${count} compounds\u003c/span>\n      \u003cspan class=\"chip\">${icon(\"brain\", 11)} ${s.regions.length} regions\u003c/span>\n    \u003c/div>\n  \u003c/a>`;\n}\n\n/* ------------------------------------------------------------------ */\n/* System detail                                                       */\n/* ------------------------------------------------------------------ */\n\nfunction compoundChips(s) {\n  const list = COMPOUNDS.filter((c) => (c.flags || []).some((f) => (s.matchFlags || []).includes(f)));\n  if (!list.length) return \"\";\n  return `\u003cdiv class=\"row wrap\" style=\"gap:5px\">\n    ${list.slice(0, 24).map((c) => `\u003ca class=\"chip chip-btn\" href=\"#/compounds/${esc(c.id)}\" style=\"--dot:${classColor(c.cls)}\">\u003cspan class=\"dot\" style=\"background:${classColor(c.cls)}\">\u003c/span>${esc(c.name)}\u003c/a>`).join(\"\")}\n    ${list.length > 24 ? `\u003cspan class=\"chip\">+${list.length - 24} more\u003c/span>` : \"\"}\n  \u003c/div>`;\n}\n\nexport const system = {\n  render(ctx) {\n    const s = SYSTEM_BY_ID.get(String(ctx.params.id || \"\").toLowerCase());\n    if (!s) {\n      return `\u003cdiv class=\"card\">${emptyState(\"activity\", \"System not found\", \"That pathway is not in the database.\", `\u003ca class=\"btn ghost sm\" href=\"#/brain\">${icon(\"arrowLeft\", 14)} Brain map\u003c/a>`)}\u003c/div>`;\n    }\n    const regions = (s.regions || []).map((id) => REGION_BY_ID.get(id)).filter(Boolean);\n\n    return `\n    \u003cdiv class=\"row\" style=\"margin-bottom:12px\">\n      ${backLink(\"#/brain\", \"Brain map\")}\n      \u003cspan class=\"spacer\">\u003c/span>\n      \u003ca class=\"btn ghost sm\" href=\"${pubmedUrl(s.pubmed || s.name)}\" target=\"_blank\" rel=\"noopener noreferrer\">${icon(\"external\", 13)} PubMed\u003c/a>\n    \u003c/div>\n\n    \u003cheader class=\"detail-head\">\n      \u003cdiv class=\"row wrap\" style=\"gap:7px\">\n        \u003cspan class=\"chip\" style=\"color:${s.color};border-color:${s.color}55;background:${s.color}1a\">\u003cspan class=\"dot\" style=\"background:${s.color}\">\u003c/span>${esc(s.abbr)}\u003c/span>\n        \u003cspan class=\"chip\">${s.receptors.length} receptor types\u003c/span>\n        \u003cspan class=\"chip\">${(s.synthesis || []).length} synthesis steps\u003c/span>\n      \u003c/div>\n      \u003ch1 class=\"detail-title\" style=\"color:${s.color}\">${esc(s.name)}\u003c/h1>\n      \u003cp class=\"lead\">${esc(s.tagline)}\u003c/p>\n    \u003c/header>\n\n    \u003cdiv class=\"split\" style=\"margin-bottom:22px\">\n      \u003cdiv class=\"stack\" style=\"gap:16px\">\n\n        \u003csection class=\"card\">\n          \u003cdiv class=\"card-head\">\u003ch3 style=\"font-size:14px\">${icon(\"info\", 14)} Overview\u003c/h3>\u003c/div>\n          \u003cp class=\"small\" style=\"line-height:1.65;color:var(--text-2)\">${esc(s.summary)}\u003c/p>\n          \u003cdiv class=\"row wrap\" style=\"gap:5px;margin-top:11px\">\n            ${s.functions.map((f) => `\u003cspan class=\"chip\">${esc(f)}\u003c/span>`).join(\"\")}\n          \u003c/div>\n        \u003c/section>\n\n        \u003csection class=\"card\">\n          \u003cdiv class=\"card-head\">\u003ch3 style=\"font-size:14px\">${icon(\"activity\", 14)} Synthesis & release\u003c/h3>\u003c/div>\n          \u003cdiv class=\"stack\" style=\"gap:0\">\n            ${s.synthesis\n              .map(\n                (st, i) => `\u003cdiv class=\"row top\" style=\"gap:11px;padding:10px 0;${i ? \"border-top:1px solid var(--line-soft)\" : \"\"}\">\n                  \u003cspan style=\"width:22px;height:22px;border-radius:50%;border:1.5px solid ${s.color}66;display:grid;place-items:center;font-size:10.5px;font-family:var(--mono);color:${s.color};flex:none\">${i + 1}\u003c/span>\n                  \u003cdiv style=\"min-width:0\">\n                    \u003cdiv style=\"font-size:13.5px;font-weight:600\">${esc(st.step)}\u003c/div>\n                    ${st.enzyme ? `\u003cdiv class=\"tiny\" style=\"color:${s.color};margin-top:1px\">${esc(st.enzyme)}${st.cofactor ? ` \u003cspan class=\"dim\">· needs ${esc(st.cofactor)}\u003c/span>` : \"\"}\u003c/div>` : \"\"}\n                    ${st.detail ? `\u003cdiv class=\"tiny dim\" style=\"margin-top:2px;line-height:1.5\">${esc(st.detail)}\u003c/div>` : \"\"}\n                    ${st.note ? `\u003cdiv class=\"tiny dim\" style=\"margin-top:2px;line-height:1.5\">${esc(st.note)}\u003c/div>` : \"\"}\n                  \u003c/div>\n                \u003c/div>`\n              )\n              .join(\"\")}\n          \u003c/div>\n        \u003c/section>\n\n        \u003csection class=\"card\">\n          \u003cdiv class=\"card-head\">\u003ch3 style=\"font-size:14px\">${icon(\"trash\", 14)} Clearance\u003c/h3>\u003c/div>\n          \u003cdiv class=\"list\" style=\"margin:0 -14px\">\n            ${s.clearance\n              .map(\n                (c) => `\u003cdiv class=\"list-row\" style=\"padding:9px 14px\">\n                  \u003cdiv class=\"grow\">\u003cdiv class=\"title\" style=\"font-size:13px\">${esc(c.mechanism)}\u003c/div>\n                  \u003cdiv class=\"sub\" style=\"line-height:1.5\">${esc(c.note)}\u003c/div>\u003c/div>\n                \u003c/div>`\n              )\n              .join(\"\")}\n          \u003c/div>\n        \u003c/section>\n\n        \u003csection class=\"card\">\n          \u003cdiv class=\"card-head\">\u003ch3 style=\"font-size:14px\">${icon(\"target\", 14)} Receptors\u003c/h3>\u003c/div>\n          \u003cdiv class=\"grid grid-2\" style=\"gap:8px\">\n            ${s.receptors\n              .map(\n                (r) => `\u003cdiv class=\"card tight\" style=\"background:var(--bg-1);padding:10px\">\n                  \u003cdiv class=\"row between\" style=\"margin-bottom:3px\">\n                    \u003cstrong style=\"font-size:13px\">${esc(r.name)}\u003c/strong>\n                    \u003cspan class=\"tag\">${esc(r.type)}\u003c/span>\n                  \u003c/div>\n                  \u003cdiv class=\"tiny\" style=\"color:${/inhib/i.test(r.effect) ? \"var(--warn)\" : \"var(--good)\"};margin-bottom:3px\">${esc(r.effect)}\u003c/div>\n                  \u003cdiv class=\"tiny dim\" style=\"line-height:1.45\">${esc(r.note)}\u003c/div>\n                \u003c/div>`\n              )\n              .join(\"\")}\n          \u003c/div>\n        \u003c/section>\n\n        \u003csection class=\"card flush\">\n          \u003cdiv style=\"padding:13px 14px;border-bottom:1px solid var(--line-soft)\">\n            \u003ch3 style=\"font-size:14px\">Intervention points\u003c/h3>\n            \u003cp class=\"tiny dim\" style=\"margin-top:2px\">Where pharmacology grips this pathway\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"list\">\n            ${(s.interventions || [])\n              .map(\n                (p) => `\u003cdiv class=\"list-row\" style=\"align-items:flex-start;flex-wrap:wrap\">\n                  \u003cdiv class=\"grow\" style=\"min-width:180px\">\n                    \u003cdiv class=\"title\" style=\"font-size:13px\">\u003cspan class=\"chip\" style=\"height:19px;font-size:10px\">${esc(p.point)}\u003c/span> ${esc(p.target)}\u003c/div>\n                    ${p.note ? `\u003cdiv class=\"sub\" style=\"margin-top:4px;line-height:1.5\">${esc(p.note)}\u003c/div>` : \"\"}\n                    ${(p.drugs || []).length ? `\u003cdiv class=\"row wrap\" style=\"gap:4px;margin-top:6px\">\n                      ${p.drugs\n                        .map((id) => {\n                          const c = getCompound(id);\n                          return c ? `\u003ca class=\"chip chip-btn\" href=\"#/compounds/${esc(c.id)}\">${esc(c.name)}\u003c/a>` : `\u003cspan class=\"chip dim\">${esc(id)}\u003c/span>`;\n                        })\n                        .join(\"\")}\n                    \u003c/div>` : \"\"}\n                  \u003c/div>\n                \u003c/div>`\n              )\n              .join(\"\")}\n          \u003c/div>\n        \u003c/section>\n      \u003c/div>\n\n      \u003caside class=\"col sticky-side\" style=\"gap:14px\">\n        \u003cdiv class=\"card\">\n          \u003cdiv class=\"eyebrow\" style=\"margin-bottom:8px\">Regions involved\u003c/div>\n          \u003cdiv class=\"stack\" style=\"gap:5px\">\n            ${regions\n              .map(\n                (r) => `\u003ca class=\"row between\" href=\"#/brain\" data-region-jump=\"${esc(r.id)}\" style=\"padding:7px 9px;border-radius:9px;background:var(--bg-2);border:1px solid var(--line);color:inherit;text-decoration:none\">\n                  \u003cspan style=\"font-size:12.5px;font-weight:550\">${esc(r.name)}\u003c/span>\n                  ${icon(\"chevronRight\", 13)}\n                \u003c/a>`\n              )\n              .join(\"\")}\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"card\">\n          \u003cdiv class=\"eyebrow\" style=\"margin-bottom:8px\">Compounds acting here\u003c/div>\n          ${compoundChips(s) || `\u003cp class=\"tiny dim\">No compounds in this database are flagged for ${esc(s.name)}.\u003c/p>`}\n        \u003c/div>\n\n        \u003cdiv>${callout(\"info\", \"Why pathways beat lists\", \"A compound name tells you little. Knowing which step of which pathway it touches tells you what it will do, what it will interact with, and what tolerance will look like.\")}\u003c/div>\n      \u003c/aside>\n    \u003c/div>`;\n  },\n\n  mount(root) {\n    root.querySelectorAll(\"[data-region-jump]\").forEach((el) => {\n      el.addEventListener(\"click\", () => {\n        state.region = el.dataset.regionJump;\n      });\n    });\n  },\n};","/app/views/lab.js":"/* Lab: pharmacokinetic simulator + interaction checker */\n\nimport { esc, icon, store, fmt, toast, emptyState, evidenceChip, clamp } from \"__ND__/app/core.js\";\nimport { COMPOUNDS, COMPOUND_BY_ID, getCompound, resolveCompound, searchCompounds, CLASSES } from \"__ND__/app/data/compounds.js\";\nimport { EXTRA_SUBSTANCES, SEVERITY, checkInteractions, worstSeverity } from \"__ND__/app/data/interactions.js\";\nimport { pageHead, callout, backLink, lineChart, classColor, statTile } from \"__ND__/app/views/ui.js\";\n\n/* ------------------------------------------------------------------ */\n/* PK simulator                                                        */\n/* ------------------------------------------------------------------ */\n\nconst DOSE_COMPOUNDS = COMPOUNDS.filter((c) => Number(c.pk?.halfLife) > 0).sort((a, b) => a.name.localeCompare(b.name));\n\nconst sim = {\n  id: \"\",\n  dose: 100,\n  unit: \"mg\",\n  interval: 24,\n  doses: 7,\n  halfLife: 0,\n  vd: 100,\n  compare: \"\",\n};\n\nfunction defaultDoseFor(c) {\n  const d = (c.doses || [])[0];\n  if (!d) return 100;\n  const high = Number(d.high) || Number(d.low) || 100;\n  const low = Number(d.low) || high;\n  return Math.round((low + high) / 2);\n}\n\nfunction loadCompound(id, { keepDose = false } = {}) {\n  const c = getCompound(id);\n  if (!c || !(Number(c.pk?.halfLife) > 0)) return false;\n  sim.id = c.id;\n  sim.halfLife = Number(c.pk.halfLife);\n  const first = (c.doses || [])[0];\n  sim.unit = (first && first.unit) || \"mg\";\n  if (!keepDose) sim.dose = defaultDoseFor(c);\n  const hl = Number(c.pk.halfLife);\n  sim.interval = hl \u003c= 8 ? 8 : hl \u003c= 18 ? 12 : hl \u003c= 40 ? 24 : Math.round(hl / 24) * 24 || 24;\n  return true;\n}\n\n/** Bateman-style single compartment, first-order absorption, repeated doses. */\nfunction simulateCurve({ dose, interval, count, halfLife, vd, steps = 180 }) {\n  const ke = Math.LN2 / halfLife;\n  const ka = ke * 4;\n  const total = interval * count + halfLife * 5;\n  const scale = dose / vd;\n  const pts = [];\n  const n = Math.max(60, steps);\n  for (let i = 0; i \u003c= n; i++) {\n    const t = (i / n) * total;\n    let c = 0;\n    for (let d = 0; d \u003c count; d++) {\n      const td = t - d * interval;\n      if (td \u003c= 0) continue;\n      c += scale * (ka / (ka - ke)) * (Math.exp(-ke * td) - Math.exp(-ka * td));\n    }\n    pts.push({ x: t, y: Math.max(0, c) });\n  }\n  let cmax = 0;\n  let tmax = 0;\n  for (const p of pts) {\n    if (p.y > cmax) {\n      cmax = p.y;\n      tmax = p.x;\n    }\n  }\n  const acc = 1 / (1 - Math.exp(-ke * interval));\n  const last = pts[pts.length - 1]?.y || 0;\n  // Trough right before the final dose. Sampling must land exactly on\n  // (count-1)*interval and skip the final dose itself (td \u003c= 0), otherwise the\n  // in-progress absorption of the last tablet inflates the trough.\n  const trough = (() => {\n    const t = (count - 1) * interval;\n    let c = 0;\n    for (let d = 0; d \u003c count; d++) {\n      const td = t - d * interval;\n      if (td \u003c= 0) continue;\n      c += scale * (ka / (ka - ke)) * (Math.exp(-ke * td) - Math.exp(-ka * td));\n    }\n    return Math.max(0, c);\n  })();\n  return { pts, cmax, tmax, acc, trough, total, ke, halfLife };\n}\n\nfunction curveSeries(c, overrides) {\n  if (!c || !(Number(c.pk?.halfLife) > 0)) return null;\n  const halfLife = overrides.halfLife || Number(c.pk.halfLife);\n  const result = simulateCurve({\n    dose: overrides.dose,\n    interval: overrides.interval,\n    count: overrides.doses,\n    halfLife,\n    vd: overrides.vd,\n  });\n  return { c, result, halfLife };\n}\n\nfunction fmtH(h) {\n  if (!Number.isFinite(h)) return \"—\";\n  if (h \u003c 1) return `${Math.round(h * 60)} min`;\n  if (h \u003c 48) return `${Math.round(h * 10) / 10} h`;\n  return `${Math.round((h / 24) * 10) / 10} d`;\n}\n\nfunction simChartHtml() {\n  const a = curveSeries(getCompound(sim.id), sim);\n  if (!a) {\n    return `\u003cdiv class=\"card\">${emptyState(\"flask\", \"Pick a compound\", \"Choose something with a known half-life to see its plasma curve.\", \"\")}\u003c/div>`;\n  }\n  const series = [{ color: \"var(--accent)\", points: a.result.pts }];\n  let b = null;\n  if (sim.compare && sim.compare !== sim.id) {\n    const cb = getCompound(sim.compare);\n    if (cb && Number(cb.pk?.halfLife) > 0) {\n      b = curveSeries(cb, { ...sim, halfLife: Number(cb.pk.halfLife) });\n      if (b) series.push({ color: \"var(--good)\", points: b.result.pts, dash: true });\n    }\n  }\n\n  const maxT = Math.max(a.result.total, b?.result.total || 0);\n  const step = maxT / 4;\n  const ticks = [0, step, step * 2, step * 3, step * 4].map((t) => ({ x: t, label: `${Math.round(t)}h` }));\n\n  const legend = `\n    \u003cdiv class=\"legend\">\n      \u003cspan>\u003ci style=\"background:var(--accent)\">\u003c/i>${esc(a.c.name)}\u003c/span>\n      ${b ? `\u003cspan>\u003ci style=\"background:var(--good)\">\u003c/i>${esc(b.c.name)}\u003c/span>` : \"\"}\n      \u003cspan class=\"dim\">schematic units · Vd ${Math.round(sim.vd)} L\u003c/span>\n    \u003c/div>`;\n\n  return `\u003cdiv class=\"card\">\n    \u003cdiv class=\"card-head\">\n      \u003ch3 style=\"font-size:14px\">Plasma concentration\u003c/h3>\n      \u003cspan class=\"spacer\">\u003c/span>\n      \u003cspan class=\"tiny mono dim\">${sim.doses} × ${esc(sim.dose)} ${esc(sim.unit)} q${Math.round(sim.interval)}h\u003c/span>\n    \u003c/div>\n    ${lineChart(series, { height: 190, xTicks: ticks, yLabel: `${sim.unit}/L` })}\n    ${legend}\n  \u003c/div>`;\n}\n\nfunction simMetricsHtml() {\n  const a = curveSeries(getCompound(sim.id), sim);\n  if (!a) return \"\";\n  const r = a.result;\n  return `\n  \u003cdiv class=\"grid grid-4\" style=\"gap:10px\">\n    ${statTile({ label: \"C-max\", value: `${r.cmax.toFixed(2)}`, sub: `${sim.unit}/L` })}\n    ${statTile({ label: \"T-max\", value: fmtH(r.tmax), sub: \"model, not reference\" })}\n    ${statTile({ label: \"Accumulation\", value: `${r.acc.toFixed(2)}×`, sub: `q${Math.round(sim.interval)}h` })}\n    ${statTile({ label: \"Steady state\", value: fmtH(a.halfLife * 5), sub: \"≈5 half-lives\" })}\n  \u003c/div>`;\n}\n\nfunction simBody() {\n  return `${simChartHtml()}\n  \u003cdiv style=\"margin-top:12px\">${simMetricsHtml()}\u003c/div>`;\n}\n\nexport const lab = {\n  render(ctx) {\n    if (ctx.query.compound && ctx.query.compound !== sim.id) loadCompound(ctx.query.compound);\n    if (!sim.id) loadCompound(sim.id || store.data.stack?.[0] || \"caffeine\");\n\n    const c = getCompound(sim.id);\n    const compareOptions = DOSE_COMPOUNDS.filter((x) => x.id !== sim.id);\n\n    return `\n    ${pageHead(\n      \"Lab\",\n      \"Model plasma levels before you touch anything. Numbers are a schematic, not a prescription.\",\n      `\u003cspan class=\"row\" style=\"gap:6px\">\n        \u003ca class=\"btn ghost sm\" href=\"#/lab/interactions\">${icon(\"shield\", 14)} Interactions\u003c/a>\n        \u003ca class=\"btn ghost sm\" href=\"#/lab/taper\">${icon(\"scale\", 14)} Taper\u003c/a>\n      \u003c/span>`\n    )}\n\n    \u003cdiv class=\"split\">\n      \u003cdiv class=\"stack\" style=\"gap:14px\">\n        \u003cdiv class=\"card\">\n          \u003cdiv class=\"stack\" style=\"gap:12px\">\n            \u003clabel class=\"field\">Compound\n              \u003cselect class=\"select\" id=\"sim-c\">\n                ${DOSE_COMPOUNDS.map((x) => `\u003coption value=\"${esc(x.id)}\" ${x.id === sim.id ? \"selected\" : \"\"}>${esc(x.name)} — t½ ${fmtH(Number(x.pk.halfLife))}\u003c/option>`).join(\"\")}\n              \u003c/select>\n            \u003c/label>\n\n            \u003cdiv class=\"grid grid-2\" style=\"gap:10px\">\n              \u003clabel class=\"field\">Dose (${esc(sim.unit)})\n                \u003cinput class=\"input\" id=\"sim-dose\" type=\"number\" inputmode=\"decimal\" min=\"1\" max=\"20000\" step=\"any\" value=\"${sim.dose}\">\n              \u003c/label>\n              \u003clabel class=\"field\">Interval (h)\n                \u003cinput class=\"input\" id=\"sim-int\" type=\"number\" inputmode=\"numeric\" min=\"0.5\" max=\"168\" step=\"0.5\" value=\"${sim.interval}\">\n              \u003c/label>\n              \u003clabel class=\"field\">Number of doses\n                \u003cinput class=\"input\" id=\"sim-n\" type=\"number\" inputmode=\"numeric\" min=\"1\" max=\"60\" step=\"1\" value=\"${sim.doses}\">\n              \u003c/label>\n              \u003clabel class=\"field\">Half-life (h)\n                \u003cinput class=\"input\" id=\"sim-hl\" type=\"number\" inputmode=\"decimal\" min=\"0.1\" max=\"400\" step=\"0.1\" value=\"${Math.round((sim.halfLife || Number(c?.pk?.halfLife) || 5) * 10) / 10}\">\n              \u003c/label>\n            \u003c/div>\n\n            \u003clabel class=\"field\">Compare with (optional)\n              \u003cselect class=\"select\" id=\"sim-cmp\">\n                \u003coption value=\"\">No comparison\u003c/option>\n                ${compareOptions.map((x) => `\u003coption value=\"${esc(x.id)}\" ${sim.compare === x.id ? \"selected\" : \"\"}>${esc(x.name)} — t½ ${fmtH(Number(x.pk.halfLife))}\u003c/option>`).join(\"\")}\n              \u003c/select>\n            \u003c/label>\n\n            \u003cdiv class=\"row wrap\" style=\"gap:6px\">\n              ${[\n                [\"q8h\", 8],\n                [\"q12h\", 12],\n                [\"q24h\", 24],\n                [\"Weekly\", 168],\n              ]\n                .map(([label, h]) => `\u003cbutton class=\"chip chip-btn ${sim.interval === h ? \"on\" : \"\"}\" data-int=\"${h}\">${label}\u003c/button>`)\n                .join(\"\")}\n              \u003cbutton class=\"btn ghost sm\" data-act=\"reset\" style=\"margin-left:auto\">${icon(\"refresh\", 13)} Reset\u003c/button>\n            \u003c/div>\n\n            ${c ? `\u003cdiv class=\"divider\">\u003c/div>\n            \u003cdiv class=\"row wrap\" style=\"gap:6px\">\n              \u003ca class=\"chip chip-btn\" href=\"#/compounds/${esc(c.id)}\">\u003cspan class=\"dot\" style=\"background:${classColor(c.cls)}\">\u003c/span>${esc(c.name)}\u003c/a>\n              ${evidenceChip(c.evidence)}\n              \u003cspan class=\"chip\">${esc(c.cls)}\u003c/span>\n            \u003c/div>` : \"\"}\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv id=\"sim-out\">${simBody()}\u003c/div>\n\n        \u003cdiv class=\"card tight\">\n          \u003cdiv class=\"eyebrow\" style=\"margin-bottom:6px\">Model honesty\u003c/div>\n          \u003cp class=\"small muted\" style=\"line-height:1.6\">\n            One compartment, first-order absorption and elimination, no protein binding, no active metabolites, no saturation.\n            Real kinetics can differ several-fold between people — CYP polymorphisms alone move plasma levels by an order of magnitude.\n          \u003c/p>\n        \u003c/div>\n      \u003c/div>\n\n      \u003caside class=\"col sticky-side\" style=\"gap:14px\">\n        ${c ? `\u003cdiv class=\"card\">\n          \u003cdiv class=\"eyebrow\" style=\"margin-bottom:7px\">Reference kinetics\u003c/div>\n          \u003cdl class=\"kv\">\n            \u003cdt>Half-life\u003c/dt>\u003cdd>${c.pk.halfLife ? fmtH(Number(c.pk.halfLife)) : \"—\"}\u003c/dd>\n            \u003cdt>T-max\u003c/dt>\u003cdd>${c.pk.tmax ? fmtH(Number(c.pk.tmax)) : \"—\"}\u003c/dd>\n            \u003cdt>Duration\u003c/dt>\u003cdd>${c.pk.duration ? fmtH(Number(c.pk.duration)) : \"—\"}\u003c/dd>\n            \u003cdt>Metabolism\u003c/dt>\u003cdd>${esc(c.pk.metabolism || \"—\")}\u003c/dd>\n            \u003cdt>Excretion\u003c/dt>\u003cdd>${esc(c.pk.excretion || \"—\")}\u003c/dd>\n          \u003c/dl>\n          ${(c.doses || []).length ? `\u003cdiv class=\"divider\">\u003c/div>\u003cdiv class=\"eyebrow\" style=\"margin-bottom:6px\">Literature doses\u003c/div>\n          \u003cdiv class=\"stack\" style=\"gap:5px\">${c.doses\n            .map((d) => `\u003cdiv class=\"row between tiny\">\u003cspan class=\"muted\">${esc(d.route || \"oral\")}\u003c/span>\u003cspan class=\"mono\">${esc(d.low)}${d.high && d.high !== d.low ? `–${esc(d.high)}` : \"\"} ${esc(d.unit || \"mg\")}\u003c/span>\u003c/div>`)\n            .join(\"\")}\u003c/div>` : \"\"}\n        \u003c/div>` : \"\"}\n\n        ${c ? `\u003cdiv>${callout(\"warn\", \"Half-life is not duration\", \"A compound can feel active long after plasma levels fall — or feel inactive while levels are high. Effects and kinetics are different questions.\")}\u003c/div>` : \"\"}\n      \u003c/aside>\n    \u003c/div>`;\n  },\n\n  mount(root) {\n    const out = root.querySelector(\"#sim-out\");\n    const setVal = (sel, v) => {\n      const el = root.querySelector(sel);\n      if (el) el.value = String(v);\n    };\n    const repaint = () => {\n      if (out) out.innerHTML = simBody();\n      root.querySelectorAll(\"[data-int]\").forEach((b) => b.classList.toggle(\"on\", Number(b.dataset.int) === sim.interval));\n    };\n\n    root.querySelector(\"#sim-c\")?.addEventListener(\"change\", (ev) => {\n      loadCompound(ev.target.value);\n      const hl = root.querySelector(\"#sim-hl\");\n      if (hl) hl.value = String(Math.round(sim.halfLife * 10) / 10);\n      const dose = root.querySelector(\"#sim-dose\");\n      if (dose) dose.value = String(sim.dose);\n      const int = root.querySelector(\"#sim-int\");\n      if (int) int.value = String(sim.interval);\n      repaint();\n    });\n\n    root.querySelector(\"#sim-dose\")?.addEventListener(\"input\", (ev) => {\n      sim.dose = clamp(Number(ev.target.value) || 1, 1, 5000);\n      repaint();\n    });\n    root.querySelector(\"#sim-int\")?.addEventListener(\"input\", (ev) => {\n      sim.interval = clamp(Number(ev.target.value) || 1, 0.5, 336);\n      repaint();\n    });\n    root.querySelector(\"#sim-n\")?.addEventListener(\"input\", (ev) => {\n      sim.doses = Math.round(clamp(Number(ev.target.value) || 1, 1, 60));\n      repaint();\n    });\n    root.querySelector(\"#sim-hl\")?.addEventListener(\"input\", (ev) => {\n      sim.halfLife = clamp(Number(ev.target.value) || 1, 0.1, 400);\n      repaint();\n    });\n    root.querySelector(\"#sim-cmp\")?.addEventListener(\"change\", (ev) => {\n      sim.compare = ev.target.value;\n      repaint();\n    });\n\n    root.addEventListener(\"click\", (ev) => {\n      const intBtn = ev.target.closest(\"[data-int]\");\n      if (intBtn) {\n        sim.interval = Number(intBtn.dataset.int);\n        const input = root.querySelector(\"#sim-int\");\n        if (input) input.value = String(sim.interval);\n        repaint();\n      }\n      if (ev.target.closest('[data-act=\"reset\"]')) {\n        sim.compare = \"\";\n        loadCompound(sim.id || \"caffeine\");\n        setVal(\"#sim-cmp\", \"\");\n        setVal(\"#sim-dose\", sim.dose);\n        setVal(\"#sim-int\", sim.interval);\n        setVal(\"#sim-n\", sim.doses);\n        setVal(\"#sim-hl\", Math.round(sim.halfLife * 10) / 10);\n        repaint();\n        toast(\"Simulator reset\", \"info\");\n      }\n    });\n  },\n};\n\n/* ------------------------------------------------------------------ */\n/* Interaction checker                                                 */\n/* ------------------------------------------------------------------ */\n\nconst PICKABLE = [...COMPOUNDS, ...EXTRA_SUBSTANCES].sort((a, b) => a.name.localeCompare(b.name));\nconst PICK_INDEX = new Map(PICKABLE.map((x) => [x.id, x]));\nconst check = { ids: [] };\n\nfunction substanceOf(id) {\n  return PICK_INDEX.get(id) || COMPOUND_BY_ID.get(id) || null;\n}\n\nfunction addSubstance(id) {\n  const s = substanceOf(id);\n  if (!s || check.ids.includes(s.id)) return false;\n  check.ids.push(s.id);\n  return true;\n}\n\nfunction findingsHtml() {\n  const subs = check.ids.map(substanceOf).filter(Boolean);\n  if (subs.length \u003c 2) {\n    return `\u003cdiv class=\"card\">${emptyState(\n      \"shield\",\n      \"Add at least two substances\",\n      \"The engine combines ~100 explicit pair rules with class-level flag rules, so unstudied combinations still surface risk.\",\n      `\u003ca class=\"btn soft sm\" href=\"#/compounds\">${icon(\"search\", 14)} Browse compounds\u003c/a>`\n    )}\u003c/div>`;\n  }\n  const findings = checkInteractions(subs);\n  if (!findings.length) {\n    return `\u003cdiv class=\"card\">\n      ${emptyState(\"check\", \"No known interaction\", \"Nothing in the rule base links these substances. That means “not documented”, not “safe” — unstudied combinations are the norm, not the exception.\")}\n    \u003c/div>`;\n  }\n  const groups = [\"critical\", \"major\", \"moderate\", \"minor\"];\n  return groups\n    .map((sev) => {\n      const list = findings.filter((f) => f.severity === sev);\n      if (!list.length) return \"\";\n      const tone = sev === \"critical\" ? \"crit\" : sev === \"major\" ? \"bad\" : sev === \"moderate\" ? \"warn\" : \"\";\n      return `\u003csectio
