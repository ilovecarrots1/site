<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NeuroDifference — Product Demo (9:16)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0a0a0f; --card:#14141c; --card2:#1c1c28; --line:#23233a;
    --vio:#8b5cf6; --cyan:#06b6d4; --grn:#10b981; --red:#ef4444; --org:#f59e0b;
    --t1:#ffffff; --t2:#a0a0b0; --t3:#6b6b80;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden}
  body{font-family:"Inter",system-ui,sans-serif;color:var(--t1);-webkit-font-smoothing:antialiased;
    display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  #wrap{position:fixed;inset:0;display:grid;place-items:center;background:#000}
  #stage{position:relative;width:1080px;height:1920px;transform-origin:center;background:var(--bg);overflow:hidden}
  /* background gradient only for intro/outro */
  #bggrad{position:absolute;inset:0;opacity:0;transition:opacity .5s;
    background:radial-gradient(90% 70% at 12% 8%, #1a0a2e 0%, transparent 55%),
               radial-gradient(90% 70% at 88% 92%, #0a1520 0%, transparent 55%), var(--bg)}
  #stage.grad #bggrad{opacity:1}
  /* letterbox */
  .bar{position:absolute;left:0;right:0;background:#050508;z-index:3}
  .bar.top{top:0;height:28%}
  .bar.bot{bottom:0;height:18%}
  /* persistent header */
  #hdr{position:absolute;top:9%;left:0;right:0;text-align:center;z-index:4}
  #hdr .b{font-weight:800;font-size:92px;letter-spacing:-.02em}
  #hdr .s{font-weight:600;font-size:30px;color:var(--t2);margin-top:10px;letter-spacing:.06em}
  #hdr .s em{font-style:normal;color:var(--vio)}
  /* slogan bottom-left */
  #slog{position:absolute;left:15%;top:82%;z-index:4;font-weight:600;font-size:56px;line-height:1.15;
    max-width:70%;opacity:0;transform:translateY(10px);transition:opacity .4s ease-out,transform .4s ease-out}
  #slog.on{opacity:1;transform:none}
  /* UI region */
  #ui{position:absolute;left:5%;top:28%;width:90%;height:54%;z-index:2}
  .screen{position:absolute;inset:0;opacity:0;pointer-events:none;display:flex;flex-direction:column;justify-content:center}
  .screen.on{opacity:1}
  .screen.diss{transition:opacity .4s ease}
  .screen.live.push{animation:push 2s ease-out forwards}
  @keyframes push{from{transform:scale(1) translateY(0)}to{transform:scale(1.05) translateY(2%)}}
  /* cascade reveal */
  .rv{opacity:0;transform:translateY(16px)}
  .screen.live .rv{animation:rv .3s ease-out forwards;animation-delay:calc(var(--i)*.1s)}
  @keyframes rv{to{opacity:1;transform:none}}
  /* cards / grids */
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px;
    backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:12px;min-width:0}
  .card .t{font-weight:700;font-size:30px;line-height:1.2}
  .card .d{font-weight:400;font-size:23px;color:var(--t2);line-height:1.35}
  .g{display:grid;gap:16px;align-content:center}
  .g32{grid-template-columns:repeat(3,1fr)}
  .g43{grid-template-columns:repeat(4,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  .tags{display:flex;gap:8px;flex-wrap:wrap}
  .tag{font-size:20px;font-weight:600;padding:4px 12px;border-radius:6px}
  .tag.v{background:rgba(139,92,246,.16);color:var(--vio)}
  .tag.c{background:rgba(6,182,212,.16);color:var(--cyan)}
  .tag.g{background:rgba(16,185,129,.16);color:var(--grn)}
  .tag.r{background:rgba(239,68,68,.16);color:var(--red)}
  .tag.o{background:rgba(245,158,11,.16);color:var(--org)}
  .stars{color:var(--org);font-size:24px;letter-spacing:2px}
  .h{font-weight:700;font-size:34px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
  .h .dot{width:12px;height:12px;border-radius:50%;background:var(--vio)}
  /* two-column layouts */
  .cols{display:grid;grid-template-columns:1fr 1.4fr;gap:20px;align-content:center;height:100%}
  .col{display:flex;flex-direction:column;gap:12px;min-height:0}
  .list{overflow:hidden;display:flex;flex-direction:column;gap:10px}
  .li{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 20px;
    display:flex;justify-content:space-between;align-items:center;font-size:26px}
  .li .n{font-weight:600}
  .li .v{color:var(--t2);font-size:23px}
  .screen.live .scroll{animation:scr 3s linear forwards}
  @keyframes scr{from{transform:translateY(0)}to{transform:translateY(-20%)}}
  /* dosage table */
  .tbl{display:flex;flex-direction:column;gap:8px}
  .row{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;padding:18px 22px;border-radius:8px;
    background:var(--card2);font-size:26px;align-items:center}
  .row .n{font-weight:600}
  .row .a{color:var(--t2)}
  .screen.live .row.hl{animation:hl .3s ease-out forwards;animation-delay:calc(var(--i)*.5s)}
  @keyframes hl{to{background:#2a1a3e}}
  .row.v{border-left:5px solid var(--vio)} .row.c{border-left:5px solid var(--cyan)} .row.g{border-left:5px solid var(--grn)}
  /* map graph */
  .mapwrap{display:grid;grid-template-columns:.7fr 1.6fr .7fr;gap:16px;height:100%;align-content:center}
  .mapside{display:flex;flex-direction:column;gap:10px}
  .graph{width:100%;height:100%}
  .graph line{stroke:var(--grn);stroke-width:2.5;stroke-dasharray:400;stroke-dashoffset:400}
  .screen.live .graph line{animation:draw 1.5s ease-in-out forwards;animation-delay:calc(var(--i)*.08s)}
  @keyframes draw{to{stroke-dashoffset:0}}
  .graph circle{fill:var(--cyan)}
  .graph circle.hub{fill:var(--vio)}
  .graph text{fill:var(--t2);font-size:20px;font-family:Inter}
  /* shop white cards */
  .card.white{background:#f5f5f7;border-color:#e2e2e8;color:#14141c}
  .card.white .d{color:#55556a}
  .struct{width:100%;height:120px}
  .struct path,.struct line,.struct circle{stroke:#33334a;stroke-width:2.5;fill:none}
  /* log body */
  .body3d{display:grid;place-items:center}
  .body3d svg{width:70%;height:auto;animation:turn 3s ease-in-out infinite;transform-origin:center}
  @keyframes turn{0%{transform:perspective(900px) rotateY(0deg)}50%{transform:perspective(900px) rotateY(15deg)}100%{transform:perspective(900px) rotateY(0deg)}}
  .form{display:flex;flex-direction:column;gap:12px}
  .field{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px 20px;color:var(--t3);font-size:25px}
  .btn{background:var(--vio);color:#fff;border-radius:8px;font-weight:600;font-size:26px;padding:16px;text-align:center}
  .btn.ghost{background:var(--card2);color:var(--t1);border:1px solid var(--line)}
  /* intro / outro */
  .center{align-items:center;text-align:center;justify-content:center;gap:20px}
  .logo{font-weight:800;font-size:110px;letter-spacing:-.03em}
  .logo span{color:var(--vio)}
  .tag1{font-weight:400;font-size:44px}
  .tag2{font-weight:300;font-size:30px;color:var(--t2)}
  .feat{font-weight:400;font-size:28px;color:var(--t2)}
  .cta{background:var(--vio);color:#fff;border-radius:8px;font-weight:600;font-size:34px;padding:22px 44px;
    animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  /* post */
  .vig{position:absolute;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.15) 100%)}
  .grain{position:absolute;inset:-50%;width:200%;height:200%;pointer-events:none;z-index:6;opacity:.025;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}
  /* controls */
  #ui2{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);
    font-size:12px;color:#9fd8e6}
  #ui2 button{font:inherit;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#dff6ff;
    background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.4);padding:7px 10px;border-radius:2px;cursor:pointer}
  #ui2 .t{font-variant-numeric:tabular-nums;color:#fff;min-width:110px;text-align:center}
  #ui2 .hint{opacity:.6;width:100%;text-align:center;font-size:11px}
  body.rec #ui2{display:none}
  #tap{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(5,5,8,.7);color:#fff;
    font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;text-align:center;padding:24px}
  body.fs #tap{display:grid}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="bggrad"></div>
    <div id="ui"></div>
    <div class="bar top"></div>
    <div class="bar bot"></div>
    <div id="hdr"><div class="b">Neuro<span style="color:var(--vio)">Difference</span></div>
      <div class="s">BETA RELEASE · <em>neurodifference.ru</em></div></div>
    <div id="slog"></div>
    <div class="vig"></div>
    <div class="grain"></div>
  </div>
</div>
<div id="ui2">
  <button id="play">Pause</button>
  <button id="restart">Restart</button>
  <span class="t" id="time">0.0 / 42.0</span>
  <span class="hint">42 с · 12 сцен · Space пауза · R рестарт · ←/→ сцены · ?fs=1&rec=1&once=1 для записи</span>
</div>
<div id="tap">Тапни для fullscreen<br><span style="opacity:.6;font-weight:400">запись экрана · музыку наложишь сам</span></div>
<script>
"use strict";
const P=new URLSearchParams(location.search);
const param=(k,d)=>P.has(k)?P.get(k):d;
const ONCE=param("once","0")==="1", REC=param("rec","0")==="1", FS=param("fs","0")==="1";
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const T_END=42.0;
/* ---- real-ish data from the NeuroDifference reference ---- */
const STUDIES=[
 {t:"Semax и экспрессия BDNF",tag:"RCT",tc:"g",s:4},
 {t:"Селанк: тревожность, ГАМК",tag:"RCT",tc:"g",s:4},
 {t:"Тирзепатид vs семаглутид",tag:"Meta",tc:"c",s:5},
 {t:"Ретатрутид: фаза II",tag:"Ph2",tc:"c",s:3},
 {t:"MK-677 и IGF-1",tag:"RCT",tc:"g",s:3},
 {t:"Кетамин: NMDA-пластичность",tag:"Rev",tc:"v",s:5},
];
const TOPIC=[
 {t:"Рецептор NMDA",d:"Как кетамин запускает синаптогенез за часы, а не недели."},
 {t:"Ось GH/IGF-1",d:"Секретагоги против экзогенного соматропина: что говорят данные."},
 {t:"GLP-1/GIP/GCG",d:"Тройные агонисты и почему редундантность incretin — это риск."},
];
const COMPOUNDS=[
 ["Semax","Пептид","v"],["Selank","Пептид","v"],["Tirzepatide","GLP-1","c"],["Retatrutide","GLP-1","c"],
 ["Somatropin","GH","g"],["MK-677","Секретагог","g"],["Anastrozole","AI","o"],["Letrozole","AI","o"],
 ["IGF-1 LR3","GH-ось","g"],["Caffeine","Стимулятор","c"],["Melatonin","Сон","v"],["Creatine","Эргоген","g"],
];
const PRESETS=["Focus / работа","Сон / восстановление","GLP-1 / состав тела","GH-ось / рекомпозиция"];
const STACKLIST=[["Semax","200 мкг/д"],["Selank","250 мкг/д"],["Caffeine","100 мг"],["L-Theanine","200 мг"],["Creatine","5 г"],["Melatonin","0.5 мг"],["Omega-3","2 г"],["Magnesium","400 мг"]];
const DOSES=[
 ["Semax","200 мкг","утро","v"],["Selank","250 мкг","вечер","v"],["Caffeine","100 мг","утро","c"],
 ["Creatine","5 г","ежедн.","g"],["Melatonin","0.5 мг","за 1 ч до сна","c"],
];
const MECH=[["BDNF/TrkB","Семакс ↑ нейротрофику"],["ГАМК-ергический","Селанк ↓ тревожность"],["Аденозин A1/A2A","Кофеин ↑ бодрость"],["mTOR/креатинфосфат","Креатин ↑ энергия"]];
const RISKS=[["Кофеин + сон","Пересечение с мелатонином","r"],["GH + AI","Метаболич. + костная нагрузка","o"],["Incretin + incretin","ЖКТ → дегидратация","r"],["Суммация седации","Селанк + мелатонин","o"]];
const SHOP=[["Semax"],["Selank"],["Tirzepatide"],["Retatrutide"],["Somatropin"],["MK-677"]];
const COACH=[["Bloodwork","Загрузи анализы — диапазоны универсальные, без sex-branching."],["X-ray / МРТ","Контекст снимков к дневнику и стеку."]];
/* ---- screen builders ---- */
const stars=s=>"★".repeat(s)+"☆".repeat(5-s);
const rv=i=>`class="rv" style="--i:${i}"`;
const thumb=i=>`<div class="rv" style="--i:${i};height:120px;border-radius:6px;background:linear-gradient(135deg,rgba(139,92,246,.35),rgba(6,182,212,.25))"></div>`;
function scrIntro(){return `<div class="screen diss center" id="sc0">
  <div class="logo rv" style="--i:0">Neuro<span>Difference</span></div>
  <div class="tag1 rv" style="--i:2">Доказательная нейрофармакология.</div>
  <div class="tag2 rv" style="--i:3">Для тех, кому нужна вся картина.</div></div>`;}
function scrStudies(){return `<div class="screen push" id="sc1"><div class="h rv" style="--i:0"><span class="dot"></span>Исследования</div>
  <div class="g g32">${STUDIES.map((s,i)=>`<div class="card rv" style="--i:${i+1}"><div class="t">${s.t}</div><div class="tags"><span class="tag ${s.tc}">${s.tag}</span></div><div class="stars">${stars(s.s)}</div></div>`).join("")}</div></div>`;}
function scrTopic(){return `<div class="screen" id="sc2"><div class="h rv" style="--i:0"><span class="dot" style="background:var(--cyan)"></span>Тема дня</div>
  <div class="g" style="grid-template-columns:repeat(3,1fr)">${TOPIC.map((s,i)=>`<div class="card rv" style="--i:${i+1}">${thumb(i+1)}<div class="t">${s.t}</div><div class="d">${s.d}</div></div>`).join("")}</div></div>`;}
const GN=[[200,250,1,"NMDA"],[80,120,0,"Кетамин"],[320,120,0,"BDNF"],[80,380,0,"Синаптогенез"],[320,380,0,"Пластичность"],[200,60,0,"Глутамат"],[200,440,0,"mTOR"]];
const GE=[[0,1],[0,2],[0,3],[0,4],[5,0],[0,6],[2,4]];
function scrMap(){return `<div class="screen" id="sc3"><div class="mapwrap">
  <div class="mapside">${["Рецепторы","Нейротрофика","Синапс","Метаболизм"].map((c,i)=>`<div class="li rv" style="--i:${i}"><span class="n">${c}</span></div>`).join("")}</div>
  <svg class="graph" viewBox="0 0 400 500">${GE.map((e,i)=>`<line x1="${GN[e[0]][0]}" y1="${GN[e[0]][1]}" x2="${GN[e[1]][0]}" y2="${GN[e[1]][1]}" style="--i:${i}"/>`).join("")}${GN.map(n=>`<circle cx="${n[0]}" cy="${n[1]}" r="${n[2]?16:10}" class="${n[2]?"hub":""}"/><text x="${n[0]+18}" y="${n[1]+6}">${n[3]}</text>`).join("")}</svg>
  <div class="mapside">${["Кетамин→NMDA","NMDA→BDNF","BDNF→TrkB","mTOR→рост"].map((c,i)=>`<div class="li rv" style="--i:${i+4}"><span class="n" style="color:var(--grn)">${c}</span></div>`).join("")}</div></div></div>`;}
function scrCompounds(){return `<div class="screen push" id="sc4"><div class="h rv" style="--i:0"><span class="dot" style="background:var(--cyan)"></span>Соединения</div>
  <div class="g g43">${COMPOUNDS.map((c,i)=>`<div class="card rv" style="--i:${i+1}"><div class="t" style="font-size:26px">${c[0]}</div><div class="tags"><span class="tag ${c[2]}">${c[1]}</span></div></div>`).join("")}</div></div>`;}
function scrStack(){return `<div class="screen" id="sc5"><div class="cols">
  <div class="col"><div class="h rv" style="--i:0;font-size:28px">Пресеты</div>${PRESETS.map((p,i)=>`<div class="li rv" style="--i:${i+1}"><span class="n">${p}</span></div>`).join("")}</div>
  <div class="col"><div class="h rv" style="--i:0">Стек</div><div class="list scroll">${STACKLIST.map((s,i)=>`<div class="li rv" style="--i:${i+1}"><span class="n">${s[0]}</span><span class="v">${s[1]}</span></div>`).join("")}</div></div></div></div>`;}
function scrDoses(){return `<div class="screen" id="sc6"><div class="h rv" style="--i:0"><span class="dot" style="background:var(--grn)"></span>Дозировки цикла</div>
  <div class="tbl">${DOSES.map((d,i)=>`<div class="row ${d[3]} hl rv" style="--i:${i}"><span class="n">${d[0]}</span><span class="a">${d[1]}</span><span class="a">${d[2]}</span></div>`).join("")}</div></div>`;}
function scrAnalysis(){return `<div class="screen" id="sc7"><div class="cols">
  <div class="col"><div class="h rv" style="--i:0">Механизмы</div>${MECH.map((m,i)=>`<div class="card rv" style="--i:${i+1}"><div class="t" style="font-size:26px">${m[0]}</div><div class="d">${m[1]}</div></div>`).join("")}</div>
  <div class="col"><div class="h rv" style="--i:0" ><span class="dot" style="background:var(--red)"></span>Риски</div>${RISKS.map((r,i)=>`<div class="card rv" style="--i:${i+1}"><div class="t" style="font-size:26px">${r[0]}</div><div class="tags"><span class="tag ${r[2]}">${r[2]==="r"?"major":"moderate"}</span></div><div class="d">${r[1]}</div></div>`).join("")}</div></div></div>`;}
const STRUCT=`<svg class="struct" viewBox="0 0 200 120"><path d="M60 60 L80 30 L120 30 L140 60 L120 90 L80 90 Z"/><line x1="140" y1="60" x2="175" y2="45"/><line x1="60" y1="60" x2="25" y2="75"/><circle cx="175" cy="45" r="6"/></svg>`;
function scrShop(){return `<div class="screen" id="sc8"><div class="h rv" style="--i:0"><span class="dot" style="background:var(--org)"></span>Каталог</div>
  <div class="g g32">${SHOP.map((s,i)=>`<div class="card white rv" style="--i:${i+1}">${STRUCT}<div class="t" style="font-size:26px">${s[0]}</div><div class="d">справочник · структуры</div></div>`).join("")}</div></div>`;}
const BODY=`<svg viewBox="0 0 200 400" fill="none" stroke="#06b6d4" stroke-width="8" stroke-linecap="round"><circle cx="100" cy="40" r="26"/><path d="M100 66 L100 200 M100 90 L40 150 M100 90 L160 150 M100 200 L60 330 M100 200 L140 330"/></svg>`;
function scrLog(){return `<div class="screen push" id="sc9"><div class="cols">
  <div class="col body3d rv" style="--i:0">${BODY}</div>
  <div class="col form"><div class="h rv" style="--i:0">Дневник</div>
    <div class="field rv" style="--i:1">Соединение…</div><div class="field rv" style="--i:2">Доза…</div><div class="field rv" style="--i:3">Время…</div>
    <div class="btn rv" style="--i:4">Записать</div></div></div></div>`;}
function scrCoach(){return `<div class="screen diss" id="sc10"><div class="g g2">${COACH.map((c,i)=>`<div class="card rv" style="--i:${i+1}"><div class="t">${c[0]}</div><div class="d">${c[1]}</div><div class="btn ghost">Upload</div></div>`).join("")}</div></div>`;}
function scrFinal(){return `<div class="screen diss center" id="sc11">
  <div class="logo rv" style="--i:0;font-size:88px">Neuro<span>Difference</span></div>
  <div class="tag1 rv" style="--i:1">Одно пространство. Вся картина.</div>
  <div class="feat rv" style="--i:2">исследования · механизмы · соединения · стеки · дневник</div>
  <div class="cta rv" style="--i:3">Открыть бесплатно · neurodifference.ru</div></div>`;}
const BUILD=[scrIntro,scrStudies,scrTopic,scrMap,scrCompounds,scrStack,scrDoses,scrAnalysis,scrShop,scrLog,scrCoach,scrFinal];
document.getElementById("ui").innerHTML=BUILD.map(f=>f()).join("");
/* ---- timeline / playback ---- */
const SCENES=[
 {a:0,b:3.5,slog:"",grad:1},
 {a:3.5,b:7.5,slog:"Исследования без кроличьих нор."},
 {a:7.5,b:11,slog:"Каждый день — новый разбор доказательств."},
 {a:11,b:14.5,slog:"Видно, как связаны механизмы."},
 {a:14.5,b:18,slog:"Сравнивай соединения, которые важны."},
 {a:18,b:22,slog:"Начни с реального пресета."},
 {a:22,b:26,slog:"Задай дозы. Посчитай весь цикл."},
 {a:26,b:30.5,slog:"Пересечения, риски и контр-меры."},
 {a:30.5,b:34,slog:"Каталог, который остаётся организованным."},
 {a:34,b:37,slog:"Отслеживай то, что реально делал."},
 {a:37,b:40,slog:"Исследования лучше с контекстом."},
 {a:40,b:42,slog:"",grad:1},
];
const stage=document.getElementById("stage");
const slogEl=document.getElementById("slog");
const timeEl=document.getElementById("time");
const playBtn=document.getElementById("play");
let cur=-1,playing=true,t=0,last=performance.now();
function sceneAt(x){for(let i=SCENES.length-1;i>=0;i--)if(x>=SCENES[i].a)return i;return 0;}
function activate(i){const el=document.getElementById("sc"+i);el.classList.remove("live");void el.offsetWidth;el.classList.add("live");el.classList.add("on");}
function clearCur(){if(cur>=0)document.getElementById("sc"+cur).classList.remove("on");cur=-1;}
function setScene(i){
  if(cur===i)return;
  if(cur>=0)document.getElementById("sc"+cur).classList.remove("on");
  activate(i);
  stage.classList.toggle("grad",!!SCENES[i].grad);
  const txt=SCENES[i].slog;
  if(!txt){slogEl.classList.remove("on");}
  else{slogEl.classList.remove("on");slogEl.textContent=txt;void slogEl.offsetWidth;slogEl.classList.add("on");}
  cur=i;
}
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);stage.style.transform="scale("+s+")";}
function syncPlay(){playBtn.textContent=playing?"Pause":"Play";}
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-last)/1000;last=now;if(dt>0.1)dt=0.1;
  if(playing){t+=dt;if(t>=T_END){if(ONCE){t=T_END;playing=false;syncPlay();}else{clearCur();t=0;}}}
  setScene(sceneAt(t));
  timeEl.textContent=t.toFixed(1)+" / 42.0";
}
function goto(i){i=clamp(i,0,SCENES.length-1);clearCur();t=SCENES[i].a;playing=true;syncPlay();setScene(i);}
playBtn.addEventListener("click",()=>{playing=!playing;syncPlay();});
document.getElementById("restart").addEventListener("click",()=>{clearCur();t=0;playing=true;syncPlay();});
addEventListener("keydown",e=>{
  if(e.code==="Space"){e.preventDefault();playing=!playing;syncPlay();}
  else if(e.key==="r"||e.key==="R"){clearCur();t=0;playing=true;syncPlay();}
  else if(e.key==="ArrowRight")goto(sceneAt(t)+1);
  else if(e.key==="ArrowLeft")goto(sceneAt(t)-1);
});
addEventListener("resize",fit);
document.addEventListener("fullscreenchange",fit);
if(REC)document.body.classList.add("rec");
const tap=document.getElementById("tap");
if(FS)document.body.classList.add("fs");
tap.addEventListener("click",async()=>{
  try{await document.documentElement.requestFullscreen();}catch(e){}
  document.body.classList.remove("fs");clearCur();t=0;playing=true;syncPlay();fit();
});
const s0=parseInt(param("scene","-1"),10);
fit();syncPlay();
if(s0>=0&&s0<SCENES.length)t=SCENES[s0].a;
setScene(sceneAt(t));
last=performance.now();requestAnimationFrame(loop);

</script>
</body>
